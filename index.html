<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat-Core - Translator</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<style>
:root {
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.15);
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  --glass-blur: blur(12px);
  --text-main: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: radial-gradient(circle at 50% 0%, #2a1b54 0%, #0d082b 50%, #050312 100%);
  color: var(--text-main);
  display: flex; flex-direction: column; padding: 10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  height: 100dvh; transition: opacity 0.3s;
}

/* ============ GLASS MIXINS ============ */
.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow), inset 0 0 20px rgba(255,255,255,0.05);
  border-radius: 20px;
}

/* ============ AUTH OVERLAY ============ */
#authOverlay {
  position: fixed; inset: 0; background: transparent; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 9999999; padding: 20px; overflow-y: auto;
}
.auth-lang-switch {
  position: absolute; top: 20px; right: 20px; display: flex; gap: 8px;
  background: var(--glass-bg); padding: 5px; border-radius: 12px;
  backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border);
}
.lang-btn {
  background: transparent; border: none; color: rgba(255,255,255,0.6);
  padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold;
  transition: 0.3s;
}
.lang-btn.active {
  background: rgba(0, 240, 255, 0.2); color: #00f0ff;
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
}
.auth-box {
  background: var(--glass-bg); backdrop-filter: var(--glass-blur);
  padding: 30px 20px; border-radius: 24px; width: 100%; max-width: 350px;
  box-shadow: var(--glass-shadow); border: 1px solid var(--glass-border);
  text-align: center; margin: auto;
}
.auth-box h1 { color: #00f0ff; margin-bottom: 5px; font-size: 26px; text-shadow: 0 0 10px rgba(0,240,255,0.5); }
.auth-box h2 { color: #fff; margin-bottom: 20px; font-size: 18px; font-weight: normal; }
.auth-input {
  width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);
  color: #fff; outline: none; font-size: 14px; transition: 0.3s;
}
.auth-input:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.2); }
.auth-btn {
  width: 100%; padding: 14px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff;
  font-weight: bold; cursor: pointer; margin-bottom: 10px;
  transition: 0.3s; font-size: 15px; box-shadow: 0 4px 15px rgba(0,176,155,0.4);
}
.auth-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,176,155,0.6); }
.auth-btn.outline {
  background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff;
  box-shadow: none;
}
.auth-btn.outline:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
.social-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05); color: #fff; font-weight: bold;
  cursor: pointer; margin-bottom: 10px; transition: 0.3s; font-size: 14px;
}
.social-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
#authError { color: #ff6b6b; font-size: 13px; margin-bottom: 10px; min-height: 18px; word-wrap: break-word; }
.divider { display: flex; align-items: center; margin: 20px 0; color: rgba(255,255,255,0.5); font-size: 12px; }
.divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); margin: 0 10px; }

/* ============ LANDING & MODE OVERLAYS ============ */
.overlay {
  position: fixed; inset: 0; background: transparent; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 15px; color: #fff; padding: 20px; z-index: 99999; overflow-y: auto;
}
.overlay h1 { font-size: 32px; color: #00f0ff; margin-bottom: 5px; text-shadow: 0 0 15px rgba(0,240,255,0.4); }
.overlay h2 { font-size: 20px; color: #fff; margin-bottom: 15px; font-weight: normal; }
.mode-btn {
  padding: 16px 20px; font-size: 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
  color: #fff; cursor: pointer; width: 100%; max-width: 280px; font-weight: bold;
  display: flex; align-items: center; justify-content: space-between;
  backdrop-filter: blur(10px); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  box-shadow: inset 0 0 10px rgba(255,255,255,0.05), 0 4px 15px rgba(0,0,0,0.2);
  background: rgba(255,255,255,0.03);
}
.mode-btn:active { transform: scale(0.96); }
#btnLocal { border-color: rgba(138, 43, 226, 0.4); background: linear-gradient(90deg, rgba(138,43,226,0.1), rgba(0,0,0,0)); }
#btnRemote { border-color: rgba(46, 139, 87, 0.4); background: linear-gradient(90deg, rgba(46,139,87,0.1), rgba(0,0,0,0)); }
#btnMeeting { border-color: rgba(30, 144, 255, 0.4); background: linear-gradient(90deg, rgba(30,144,255,0.1), rgba(0,0,0,0)); }
#btnFriends { border-color: rgba(255, 165, 0, 0.4); background: linear-gradient(90deg, rgba(255,165,0,0.1), rgba(0,0,0,0)); }
#btnLogout { border-color: rgba(255, 69, 0, 0.4); background: linear-gradient(90deg, rgba(255,69,0,0.1), rgba(0,0,0,0)); margin-top: 20px; }

.join-form {
  display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px;
  background: var(--glass-bg); padding: 25px 20px; border-radius: 24px;
  backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow); align-items: stretch;
}
.join-form input[type="text"], .join-form select, .join-form input[type="email"], .join-form input[type="password"] {
  padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.3); color: #fff; font-size: 14px; outline: none; transition: 0.3s;
}
.join-form input:focus, .join-form select:focus { border-color: #00f0ff; }
.join-form button {
  padding: 14px; border-radius: 12px; border: none; color: #fff;
  cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.3s;
}
#createRoomBtn, #createMeetingBtn { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 4px 15px rgba(56,239,125,0.3); }
#joinRoomBtn, #joinMeetingBtn { background: linear-gradient(135deg, #4568dc, #b06ab3); box-shadow: 0 4px 15px rgba(69,104,220,0.3); }
#backToLandingBtn, #backToLandingFromMeetBtn { background: transparent; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.1); margin-top: 5px; }
#backToLandingBtn:hover, #backToLandingFromMeetBtn:hover { background: rgba(255,255,255,0.1); color: #fff; }

/* ============ APP UI ELEMENTS ============ */
.top-header { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 10px; flex-shrink: 0; position: relative; z-index: 10001; }
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--glass-bg); padding: 8px 15px; border-radius: 16px;
  width: 95%; max-width: 400px; backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
}
.user-section { display: flex; align-items: center; gap: 6px; }
.lang-select {
  padding: 0 5px; border-radius: 8px; background: rgba(0,0,0,0.3); color: #fff;
  border: 1px solid rgba(255,255,255,0.1); font-size: 10px; outline: none;
  width: 85px !important; height: 28px; text-align: center;
}
.mic-btn {
  width: 32px; height: 32px; border-radius: 50%; border: none; color: #fff;
  font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.mic-btn.blue { background: #6366f1; } .mic-btn.green { background: #10b981; }
.mic-btn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; box-shadow: 0 0 15px rgba(239,68,68,0.6); }
.mic-btn:disabled { background: #475569 !important; opacity: 0.5; }
@keyframes pulse { 50% { transform: scale(1.1); } }

#avatar-wrap { width: 100px; height: 100px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all 0.3s; }
#avatar-container { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; background: #1e293b; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,240,255,0.2); z-index: 1; transition: all 0.3s; border: 2px solid rgba(255,255,255,0.2); }
#avatar-logo, #avatar-video { width: 100%; height: 100%; object-fit: cover; display: block; }
#avatar-video { display: none; }
#avatar-wrap.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: #000; }
#avatar-wrap.fullscreen #avatar-container { width: 100vw; height: 100vh; border-radius: 0 !important; background: transparent; box-shadow: none; border: none; }
#avatar-wrap.fullscreen #avatar-logo, #avatar-wrap.fullscreen #avatar-video { object-fit: contain; width: 100vw; height: 100vh; }
#avatar-wrap.fullscreen #closeFullscreen { display: flex; }

/* النقطة السوداء */
#removeAvatarBtn { display: none; position: absolute; top: 50%; right: -5px; transform: translateY(-50%); width: 14px; height: 14px; border-radius: 50%; background: #000; border: 2px solid #fff; cursor: pointer; z-index: 999; color: transparent; align-items: center; justify-content: center; padding: 0; }
body.remote-mode #avatar-wrap, body.meeting-mode #avatar-wrap { display: none !important; }

#closeFullscreen, #closeVideoFullscreen { display: none; position: fixed; background: #e57373; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 10000; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.inner-white-dot { width: 14px; height: 14px; background: #fff; border-radius: 50%; }
#closeFullscreen { top: 80px; right: 20px; } #closeVideoFullscreen { top: 20px; right: 20px; }

#videoContainer { display: none; position: relative; width: 100%; max-width: 400px; height: 200px; margin: 0 auto 10px; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.5); cursor: pointer; transition: all 0.3s; z-index: 500; border: 1px solid rgba(255,255,255,0.1); }
#remoteVideo { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
#localVideo { position: absolute; bottom: 10px; right: 10px; width: 80px; height: 100px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,0.5); background: #1e293b; z-index: 2; pointer-events: auto; }
#videoStatus { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 6px; font-size: 10px; color: #10b981; z-index: 2; pointer-events: none; }
#tapToPlayOverlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.7); color: #fff; z-index: 10; align-items: center; justify-content: center; flex-direction: column; font-weight: bold; font-size: 16px; cursor: pointer; }
body.video-maximized #videoContainer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; max-width: 100vw; z-index: 99999; margin: 0; border-radius: 0; }
body.video-maximized #remoteVideo { object-fit: cover; }
body.video-maximized #localVideo { width: 90px; height: 130px; bottom: 20px; right: 20px; border-radius: 12px; }
body.video-maximized #closeVideoFullscreen { display: flex; }
body.video-maximized #topHeader, body.video-maximized #extraControls, body.video-maximized #chatContainer, body.video-maximized #inputRow, body.video-maximized #status, body.video-maximized #remoteBar { display: none !important; }

#meetingGridContainer { display: none; position: relative; width: 100%; flex: 1; background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 16px; padding: 10px; overflow-y: auto; margin-bottom: 10px; box-shadow: var(--glass-shadow); }
#videoGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-content: start; }
.participant-box { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
.participant-box video { width: 100%; height: 100%; object-fit: cover; }
.participant-name { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; font-size: 10px; color: #fff; z-index: 2; }
body.meeting-mode .chat-container { max-height: 35vh; }

#floatingMicBtn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #11998e, #38ef7d); color: white; display: none; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(56,239,125,0.4); z-index: 100000; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: all 0.3s; }
#floatingMicBtn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; box-shadow: 0 0 20px rgba(239,68,68,0.8); }
body.video-maximized #floatingMicBtn { display: flex; }

.chat-container { position: relative; flex: 1; display: flex; flex-direction: column; margin-bottom: 10px; min-height: 100px; }
#chat { flex: 1; background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: 20px; padding: 15px; overflow-y: auto; }
.msg { padding: 12px 16px; border-radius: 16px; margin-bottom: 8px; max-width: 85%; line-height: 1.6; word-wrap: break-word; font-size: 15px; transition: opacity 0.2s; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
.msg:active { opacity: 0.7; }
.user-a { background: linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(79, 70, 229, 0.9)); margin-right: auto; border-bottom-right-radius: 4px; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
.user-b { background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(5, 150, 105, 0.9)); margin-left: auto; border-bottom-left-radius: 4px; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
.bot { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); margin: 0 auto 8px auto; text-align: center; font-style: italic; font-size: 13px; cursor: default; backdrop-filter: blur(5px); }
.lang-tag { display: inline-block; font-size: 10px; padding: 2px 6px; background: rgba(255,255,255,0.15); border-radius: 6px; margin-right: 6px; opacity: 0.8; font-weight: bold; }
#clearBtn { position: absolute; bottom: 2px; left: 10px; width: 32px; height: 32px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
#clearBtn svg { fill: #2d3748; width: 16px; height: 16px; }

#imagePreviewContainer { display: none; position: absolute; bottom: 60px; right: 10px; background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 12px; padding: 5px; align-items: center; gap: 8px; z-index: 1000; box-shadow: var(--glass-shadow); }
#imagePreview { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
#cancelImageBtn { background: #dc2626; color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

.row { display: flex; gap: 8px; align-items: center; flex-shrink: 0; position: relative; }
input[type=text] { flex: 1; padding: 12px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; font-size: 14px; order: 3; outline: none; backdrop-filter: blur(5px); }
input[type=text]:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.1); }
button.btn { padding: 0; border: none; border-radius: 50%; font-weight: bold; width: 42px; height: 42px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
#musicBtn { background: rgba(255,255,255,0.1); color: #fff; order: 1; font-size: 18px; border: 1px solid rgba(255,255,255,0.2); }
#mediaBtn { background: linear-gradient(135deg, #4568dc, #b06ab3); color: #ffffff; order: 2; font-size: 24px; width: 38px; height: 38px; padding-bottom: 2px; font-weight: normal; }
#remoteMicBtn { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; order: 2; width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 4px 15px rgba(56,239,125,0.4); display: none; transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.2); }
#remoteMicBtn.recording { background: #ef4444 !important; box-shadow: 0 0 20px rgba(239,68,68,0.8); animation: pulse 1s infinite; }
#toggleCamBtn { background: rgba(255,255,255,0.1); color: #fff; order: 2; width: 46px; height: 46px; border-radius: 50%; display: none; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: all 0.3s ease; }
#toggleCamBtn.off { background: #ef4444; }
#sendBtn { background: linear-gradient(135deg, #4568dc, #b06ab3); order: 4; color: #fff; }
#sendBtn svg { width: 20px; height: 20px; fill: white; transform: translateX(-2px) translateY(2px); }
#stopAudioBtn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; outline: none; }
#stopAudioBtn svg { fill: #2d3748; width: 14px; height: 14px; }
#status { text-align: center; font-size: 13px; color: #00f0ff; margin-top: 6px; min-height: 18px; font-weight: bold; text-shadow: 0 0 5px rgba(0,240,255,0.3); }

.extra-controls { display: flex; gap: 8px; margin-bottom: 10px; justify-content: center; flex-wrap: wrap; width: 100%; padding: 0 5px; align-items: center; }
.extra-controls button, .extra-controls select { padding: 8px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 11px; cursor: pointer; outline: none; white-space: nowrap; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); transition: 0.3s; }
.extra-controls button:active { transform: scale(0.95); }
.toggle-btn { background: rgba(255,255,255,0.1) !important; color: white !important; transition: 0.3s; border: 1px solid rgba(255,255,255,0.2) !important; }
.toggle-btn.active { background: rgba(16, 185, 129, 0.3) !important; border-color: #10b981 !important; color: #10b981 !important; box-shadow: 0 0 10px rgba(16,185,129,0.2); }
.btn-back { background: rgba(239, 68, 68, 0.3) !important; border-color: #ef4444 !important; color: #fff !important; }
body.remote-mode #extraControls, body.meeting-mode #extraControls { justify-content: space-between; padding: 0 10px; }
body.remote-mode #extraControls > *, body.meeting-mode #extraControls > * { flex: 1 1 30%; }

#actionMenu { display: none; position: fixed; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 12px; z-index: 2000; flex-direction: column; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.action-btn { padding: 10px 15px; border-radius: 10px; border: none; background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
.action-btn:hover { background: rgba(255,255,255,0.15); }

#musicMenu { display: none; position: fixed; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 12px; z-index: 2000; width: 220px; max-height: 300px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
#musicMenu h4 { font-size: 13px; margin-bottom: 10px; text-align: center; color: #00f0ff; }
.music-item { padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 5px; background: rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
.music-item:hover { background: rgba(255,255,255,0.15); } .music-item.active { background: rgba(0, 240, 255, 0.2); color: #00f0ff; font-weight: bold; border: 1px solid rgba(0,240,255,0.3); }
.music-item.add-more, .music-item.stop-btn, .music-item.pause-btn { text-align: center; font-weight: bold; justify-content: center; }
.music-item.add-more { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); } 
.music-item.stop-btn { background: rgba(153, 27, 27, 0.3); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); margin-bottom: 8px; } 
.music-item.pause-btn { background: rgba(71, 85, 105, 0.5); margin-bottom: 8px; }
.song-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; direction: ltr; }

  try {
    setStatus("جاري تجهيز الفيديو...");
    await loadLiveKit();
    setStatus("⏳ جاري الاتصال بالسيرفر...");
    const controller = new AbortController(); const timeout = setTimeout(() => controller.abort(), 70000);
    const res = await fetch(TOKEN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ room_name: roomCode, participant_name: participantName }), signal: controller.signal });
    clearTimeout(timeout);
    if (!res.ok) { let errMsg = "فشل الاتصال بالسيرفر"; try { const errData = await res.json(); if (errData.detail) errMsg = errData.detail; } catch(e){} throw new Error(errMsg); }
    const { token, url } = await res.json();
    setStatus("جاري الاتصال بالاجتماع...");
    if (livekitRoom) { await livekitRoom.disconnect(); livekitRoom = null; }
    videoGrid.innerHTML = '';
    livekitRoom = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
    livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed, handleTrackSubscribed);
    livekitRoom.on(LivekitClient.RoomEvent.TrackUnsubscribed, handleTrackUnsubscribed);
    livekitRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, handleParticipantDisconnected);
    livekitRoom.on(LivekitClient.RoomEvent.Connected, async () => {
      setStatus("✅ متصل بالاجتماع");
      try { await livekitRoom.localParticipant.setCameraEnabled(true); isCameraOn = true; toggleCamBtn.classList.remove('off'); } catch (err) { console.warn("Camera error", err); }
      try { await livekitRoom.localParticipant.setMicrophoneEnabled(!isTranslatorMode); isWebRtcMicOn = !isTranslatorMode; } catch (err) { console.warn("Mic error", err); }
      try { await livekitRoom.startAudio(); } catch(e) {}
      if (!livekitRoom.canPlaybackAudio) {
        addMsg("⚠️ اضغط على الشاشة لتفعيل الصوت.", "bot");
        document.body.addEventListener('click', () => { if(livekitRoom) livekitRoom.startAudio(); }, { once: true });
      }
      resetStatus();
    });
    livekitRoom.on(LivekitClient.RoomEvent.Disconnected, () => { setStatus("انقطع الاتصال"); addMsg("⚠️ تم قطع الاتصال بالاجتماع.", "bot"); });
    livekitRoom.on(LivekitClient.RoomEvent.Reconnecting, () => setStatus("جاري إعادة الاتصال..."));
    livekitRoom.on(LivekitClient.RoomEvent.MediaDevicesError, (e) => { console.error(e); addMsg("⚠️ خطأ في أجهزة الوسائط.", "bot"); });
    livekitRoom.on(LivekitClient.RoomEvent.LocalTrackPublished, (publication, participant) => {
      if (publication.track.kind === 'video') {
        let boxId = 'participant-' + participant.identity; let box = document.getElementById(boxId);
        if (!box) {
          box = document.createElement('div'); box.id = boxId; box.className = 'participant-box';
          let nameLabel = document.createElement('div'); nameLabel.className = 'participant-name'; nameLabel.textContent = (participant.name || participant.identity) + " (You)";
          box.appendChild(nameLabel); videoGrid.appendChild(box);
        }
        const oldVideo = box.querySelector('video'); if (oldVideo) oldVideo.remove();
        const videoEl = publication.track.attach(); videoEl.autoplay = true; videoEl.playsInline = true; videoEl.muted = true;
        videoEl.style.width = '100%'; videoEl.style.height = '100%'; videoEl.style.objectFit = 'cover';
        box.insertBefore(videoEl, box.firstChild);
      }
    });
    await livekitRoom.connect(url, token);
  } catch (e) {
    console.error(e);
    if (e.name === 'AbortError') { addMsg("⚠️ الخادم يستغرق وقتاً طويلاً.", 'bot'); setStatus("فشل الاتصال"); }
    else { addMsg("⚠️ فشل الانضمام للاجتماع: " + e.message, 'bot'); setStatus("خطأ في الاجتماع"); }
  }
}

async function toggleLocalMic(speaker) {
  if (isLocalProcessing) return;
  unlockAudio();
  
  if (localRecorder && localRecorder.state === 'recording') {
    localRecorder.stop();
    micA.classList.remove('recording'); 
    micB.classList.remove('recording');
    setStatus('⏳ Processing...');
    return;
  }
  
  if (localRecorder) { try { localRecorder.stop(); } catch(e){} }
  
  currentSpeaker = speaker;
  const lang = speaker === 'A' ? langA.value : langB.value;
  const targetLang = speaker === 'A' ? langB.value : langA.value;
  const btn = speaker === 'A' ? micA : micB;
  
  try {
    localStreamMic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(localStreamMic);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    const rmsBuffer = new Float32Array(analyser.fftSize);
    let rmsMax = 0;
    const rmsInterval = setInterval(() => {
      analyser.getFloatTimeDomainData(rmsBuffer);
      let sum = 0; for (let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i]*rmsBuffer[i];
      const rms = Math.sqrt(sum / rmsBuffer.length);
      if (rms > rmsMax) rmsMax = rms;
    }, 100);

    let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    localRecorder = new MediaRecorder(localStreamMic, { mimeType });
    localChunks = [];
    
    localRecorder.ondataavailable = e => { if (e.data.size > 0) localChunks.push(e.data); };
    
    localRecorder.onstop = async () => {
      clearInterval(rmsInterval);
      localStreamMic.getTracks().forEach(t => t.stop());
      try { if (audioCtx.state !== 'closed') await audioCtx.close(); } catch(e){}
      
      const durationMs = Date.now() - localStartTime;
      
      if (durationMs < 800 || rmsMax < 0.005) { 
        isLocalProcessing = false; unlockMics(); 
        if (durationMs >= 800) addMsg('⚠️ لم يُسمع صوت واضح.', 'bot');
        return; 
      }
      
      const blob = new Blob(localChunks, { type: localRecorder.mimeType });
      setStatus('⏳ جاري استخراج النص والترجمة...');
      
      const formData = new FormData();
      formData.append('file', blob, 'audio.webm');
      formData.append('target_lang', targetLang); 
      formData.append('language', lang); 
      formData.append('duration_ms', String(durationMs));
      
      try {
        const res = await fetch(TRANSCRIBE_URL, { method: 'POST', body: formData });
        if (res.ok) {
          const data = await res.json();
          if (data.original && data.original.length > 1) {
            addMsg(`You: ${data.original}`, speaker === 'A' ? 'user-a' : 'user-b', lang);
            if (isTranslatorMode) {
              if (data.translated) {
                addMsg(`↳ ${data.translated}`, 'bot', targetLang);
                speak(data.translated, targetLang);
              }
            } else {
              ask(data.original, lang, targetLang, speaker);
            }
          } else {
            addMsg(`⚠️ لم يتم التعرف على كلام.`, 'bot');
          }
        }
      } catch(e) { console.warn('Audio upload failed', e); }
      
      isLocalProcessing = false;
      unlockMics();
    };
    
    localRecorder.start();
    localStartTime = Date.now();
    btn.classList.add('recording');
    micA.disabled = speaker !== 'A';
    micB.disabled = speaker !== 'B';
    setStatus(`🎤 Listening (${speaker === 'A' ? 'You' : 'Friend'})...`);
  } catch (e) {
    addMsg("⚠️ تعذر الوصول للمايك.", "bot");
    isLocalProcessing = false;
    unlockMics();
  }
}
function unlockMics() {
  micA.disabled = false; micB.disabled = false;
  micA.classList.remove('recording'); micB.classList.remove('recording');
  resetStatus();
}
micA.addEventListener('click', () => toggleLocalMic('A'));
micB.addEventListener('click', () => toggleLocalMic('B'));

async function startManualTranslation() {
  if (isManualTranslating) return;
  try {
    const transStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1, sampleRate: 48000 }
    });
    const rawTrack = transStream.getAudioTracks()[0];

    translationAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = translationAudioCtx.createMediaStreamSource(new MediaStream([rawTrack]));
    const hp = translationAudioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 80;
    const analyser = translationAudioCtx.createAnalyser();
    analyser.fftSize = 512;
    const destination = translationAudioCtx.createMediaStreamDestination();
    source.connect(hp); hp.connect(analyser); analyser.connect(destination);

    const filteredTrack = destination.stream.getAudioTracks()[0];
    const rmsBuffer = new Float32Array(analyser.fftSize);
    let rmsMax = 0;
    let silenceStart = Date.now();
    let chunkStartTime = Date.now();

    let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    
    const startNewChunk = () => {
      audioRecorder = new MediaRecorder(new MediaStream([filteredTrack]), { mimeType });
      let chunks = [];
      audioRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      
      audioRecorder.onstop = async () => {
        const durationMs = Date.now() - chunkStartTime;
        if (chunks.length === 0 || durationMs < 800 || rmsMax < 0.005) return;
        
        const blob = new Blob(chunks, { type: mimeType });
        const formData = new FormData();
        formData.append('file', blob, 'audio.webm');
        formData.append('target_lang', myLang);
        formData.append('language', myLang);
        formData.append('duration_ms', String(durationMs));
        
        try {
          const res = await fetch(TRANSCRIBE_URL, { method: 'POST', body: formData });
          if (res.ok) {
            const data = await res.json();
            if (data.original && data.original.length > 1) {
              addMsg(`You: ${data.original}`, 'user-a', myLang);
              sendRemoteMessage(data.original);
            }
          }
        } catch(e) { console.warn('Audio chunk upload failed', e); }
      };
      
      audioRecorder.start();
      chunkStartTime = Date.now();
      rmsMax = 0;
      silenceStart = Date.now();
    };

    startNewChunk();

    const vadInterval = setInterval(() => {
      if (!isManualTranslating) return;
      try {
        analyser.getFloatTimeDomainData(rmsBuffer);
        let sum = 0; for (let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i]*rmsBuffer[i];
        const rms = Math.sqrt(sum / rmsBuffer.length);
        
        if (rms > 0.01) {
          if (rms > rmsMax) rmsMax = rms;
          silenceStart = Date.now();
        } else {
          if (Date.now() - silenceStart > 1500 && audioRecorder.state === 'recording') {
             audioRecorder.stop();
             startNewChunk();
          }
        }
      } catch(e){}
    }, 200);

    translationStartTime = Date.now();
    isManualTranslating = true;
    updateTranslatorUI();
    setStatus('🎤 Recording... Press mic to stop & translate');
    
    window._vadInterval = vadInterval;
    window._rawTrack = rawTrack;

  } catch (e) {
    console.error("Mic access failed", e);
    addMsg("⚠️ تعذر الوصول للمايك.", 'bot');
  }
}
function stopManualTranslation() {
  if (!isManualTranslating) return;
  isManualTranslating = false;
  
  if (window._vadInterval) { clearInterval(window._vadInterval); window._vadInterval = null; }
  if (window._rawTrack) { try { window._rawTrack.stop(); } catch(e){} window._rawTrack = null; }
  
  if (audioRecorder && audioRecorder.state === 'recording') {
    audioRecorder.stop();
  }
  
  try { if (translationAudioCtx && translationAudioCtx.state !== 'closed') translationAudioCtx.close(); } catch(e){}
  translationAudioCtx = null;
  
  updateTranslatorUI();
}

function buildSystemPrompt(targetLang, sourceLang) {
  if (isTranslatorMode) {
    return `You are a highly accurate translation engine. Translate the following text from ${langNameFor(sourceLang)} to ${langNameFor(targetLang)}. You must output ONLY the translated text in ${langNameFor(targetLang)}. Do NOT repeat the original text. Do NOT explain.`;
  }
  return `You are Chat-Core, a helpful assistant. You must reply ONLY in ${langNameFor(targetLang)}. Never use any other language.`;
}

async function ask(text, sourceLang, targetLang, speaker) {
  if (isSending) return;
  setBusy(true); setStatus('Processing...');
  const messages = [{ role: 'system', content: buildSystemPrompt(targetLang, sourceLang) }];
  
  let finalText = text || '';
  if (attachedFileText) finalText += "\n\nFile Content:\n" + attachedFileText;
  
  // إصلاح: إرسال النص كـ String إذا لم توجد صورة
  let userContent = finalText;
  if (attachedImageBase64) {
    userContent = [
      { type: "text", text: finalText || "Analyze this image." }, 
      { type: "image_url", image_url: { url: attachedImageBase64 } }
    ];
  }
  
  messages.push({ role: 'user', content: userContent });
  
  try {
    const res = await fetchWithTimeout(SERVER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages, is_vision: attachedImageBase64 != null, is_translation: isTranslatorMode, session_id: SESSION_ID }) }, REQUEST_TIMEOUT_MS);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    
    let replyText = data.reply.trim();
    if (isTranslatorMode && replyText === text) {
       replyText = "⚠️ Translation failed. Please try again.";
    }

    addMsg(replyText, isTranslatorMode ? (speaker === 'A' ? 'user-b' : 'user-a') : 'user-b', targetLang || 'AUTO');
    resetStatus(); speak(replyText, targetLang || langA.value);
    attachedImageBase64 = null; attachedFileText = null; imagePreviewContainer.style.display = 'none';
  } catch (e) { addMsg('Error: ' + e.message, 'bot'); } finally { setBusy(false); }
}

function renderPlaylist() {

  const stopBtn = document.createElement('div'); stopBtn.className = 'music-item stop-btn'; stopBtn.textContent = '🛑 Stop'; stopBtn.onclick = stopMusic; musicList.appendChild(stopBtn);
  const pauseBtn = document.createElement('div'); pauseBtn.className = 'music-item pause-btn'; pauseBtn.textContent = bgAudio.paused ? '▶️ Play' : '⏸️ Pause';
  pauseBtn.onclick = (e) => { e.stopPropagation(); if (bgAudio.src) { if (bgAudio.paused) bgAudio.play(); else bgAudio.pause(); renderPlaylist(); } }; musicList.appendChild(pauseBtn);
  const addBtn = document.createElement('div'); addBtn.className = 'music-item add-more'; addBtn.textContent = '➕ Add'; addBtn.onclick = () => { audioUpload.value = ''; audioUpload.click(); }; musicList.appendChild(addBtn);
  playlist.forEach((song, index) => {
    const div = document.createElement('div'); div.className = 'music-item';
    const name = document.createElement('span'); name.className = 'song-name'; name.textContent = song.name;
    const del = document.createElement('span'); del.className = 'delete-song'; del.textContent = '✕';
    del.onclick = (e) => { e.stopPropagation(); if (currentSongIndex === index) stopMusic(); playlist.splice(index, 1); if(currentSongIndex > index) currentSongIndex--; renderPlaylist(); };
    div.appendChild(name); div.appendChild(del);
    if (index === currentSongIndex && !bgAudio.paused) div.classList.add('active');
    div.onclick = () => { if (currentSongIndex === index && !bgAudio.paused) { bgAudio.pause(); renderPlaylist(); } else { currentSongIndex = index; bgAudio.src = playlist[index].url; bgAudio.play(); renderPlaylist(); } };
    musicList.appendChild(div);
  });

async function speak(text, lang) {
  if (!text) return;
  stopAudio();
  const cleaned = cleanTextForTTS(text);
  if (!cleaned) return;
  const myId = ++currentSpeechId;
  isBotTalking = true; setAvatarState(true);
  try {
    const voice = voiceSelect ? voiceSelect.value : 'woman';
    const res = await fetch(TTS_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: cleaned.slice(0, 4000), lang: lang || 'ar', voice, session_id: SESSION_ID })
    });
    if (!res.ok) throw new Error('tts ' + res.status);
    if (myId !== currentSpeechId) return;
    const blob = await res.blob(); const url = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    currentAudio.onended = () => { URL.revokeObjectURL(url); isBotTalking = false; setAvatarState(false); };
    currentAudio.onerror = () => { URL.revokeObjectURL(url); isBotTalking = false; setAvatarState(false); };
    await currentAudio.play().catch(() => {});
    return;
  } catch (e) {}
  if (myId !== currentSpeechId) return;
  if ('speechSynthesis' in window) {
    try {
      const utt = new SpeechSynthesisUtterance(cleaned);
      utt.lang = localeFor(lang || 'ar');
      utt.onend = () => { isBotTalking = false; setAvatarState(false); };
      utt.onerror = () => { isBotTalking = false; setAvatarState(false); };
      speechSynthesis.speak(utt);
    } catch (e) { isBotTalking = false; setAvatarState(false); }
  } else { isBotTalking = false; setAvatarState(false); }
}
function stopAudio() {
  currentSpeechId++;
  if (currentAudio) { try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {} currentAudio = null; }
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
  isBotTalking = false; setAvatarState(false);
}
function setAvatarState(talking) {

}

async function handleWSMessage(msg) {
  if (!msg || !msg.type) return;
  const type = msg.type;
  if (type === 'pong') return;
  if (type === 'error') { addMsg('⚠️ ' + (msg.message || 'خطأ'), 'bot'); return; }
  if (type === 'joined') {
    hasJoinedOnce = true;
    const n = (msg.users || []).length;
    if (onlineCount) onlineCount.textContent = n + '/50';
    setStatus('✅ متصل');
    if (msg.history && msg.history.length) {
      addMsg('📜 سجل سابق:', 'bot');
      msg.history.forEach(h => {
        addMsg((h.from || '?') + ': ' + (h.original || ''), 'user-b', h.from_lang || 'en');
        if (h.translated && h.translated !== h.original) addMsg('↳ ' + h.translated, 'bot', myLang);
      });
    }
    if (appMode === 'remote' && myIsCaller && !_rtcInitiated && n > 1) {
      _rtcInitiated = true; setTimeout(() => startVideoCall(true), 300);
    }
    return;
  }
  if (type === 'user_joined') {
    addMsg('👋 ' + (msg.name || 'مستخدم') + ' انضم', 'bot');
    if (appMode === 'remote' && myIsCaller && !_rtcInitiated) {
      _rtcInitiated = true; setTimeout(() => startVideoCall(true), 300);
    }
    return;
  }
  if (type === 'user_left') { addMsg('👋 ' + (msg.name || 'مستخدم') + ' غادر', 'bot'); return; }
  if (type === 'translated') {
    if (msg.is_mine) return;
    addMsg((msg.from_name || 'صديق') + ': ' + (msg.original || ''), 'user-b', msg.from_lang || 'en');
    if (msg.translated && msg.translated !== msg.original) {
      addMsg('↳ ' + msg.translated, 'bot', msg.target_lang || myLang);
      if (!msg.no_tts && isTranslatorMode) speak(msg.translated, msg.target_lang || myLang);
    }
    return;
  }
  if (type === 'chat_media') { addMsg((msg.from_name || 'صديق') + ' 📷:', 'user-b', msg.from_lang || 'en', msg.data); return; }
  if (type === 'rtc-offer') { await handleRtcOffer(msg.offer); return; }
  if (type === 'rtc-answer') { await handleRtcAnswer(msg.answer); return; }
  if (type === 'rtc-ice') { await handleRtcIce(msg.candidate); return; }
}
async function handleRtcOffer(offer) {

    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'rtc-answer', answer }));

});

// Friends Chat
const CHAT_LANGS = [['ar','🇹🇳 العربية'],['fr','🇫🇷 Français'],['en','🇬🇧 English'],['de','🇩🇪 Deutsch'],['tr','🇹🇷 Türkçe'],['it','🇮🇹 Italiano'],['zh','🇨🇳 中文'],['ru','🇷🇺 Русский'],['es','🇪🇸 Español'],['pt','🇵🇹 Português'],['nl','🇳🇱 Nederlands'],['no','🇳🇴 Norsk']];
function populateChLang() {
  const el = $('chLang'); if (!el || _chLangPopulated) return;
  el.innerHTML = '';
  CHAT_LANGS.forEach(([v, label]) => { const o = document.createElement('option'); o.value = v; o.textContent = label; el.appendChild(o); });
  _chLangPopulated = true;
}
async function openChat(friend) {
  if (!db || !currentUser || !friend) return;
  chatOpenWith = friend; chatMsgsCache = []; populateChLang();
  $('chName').textContent = friend.name || '?';
  $('chLang').value = myLang || 'ar';
  $('chMsgs').innerHTML = ''; $('chStatus').textContent = 'جارٍ التحميل...';
  $('chatOverlay').style.display = 'flex';
  const chatId = [currentUser.uid, friend.uid].sort().join('_');
  if (chatUnsub) { try { chatUnsub(); } catch (e) {} }
  chatUnsub = db.collection('chats').doc(chatId).collection('messages').orderBy('createdAt', 'asc').limit(100)
    .onSnapshot(snap => {
      chatMsgsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderChatMsgs(); $('chStatus').textContent = '';
      try { db.collection('chats').doc(chatId).set({ ['unread_' + currentUser.uid]: 0 }, { merge: true }); } catch (e) {}
    }, err => { $('chStatus').textContent = '⚠️ ' + (err.message || ''); });
}
function renderChatMsgs() {
  const box = $('chMsgs'); box.innerHTML = '';
  chatMsgsCache.forEach(m => {
    const mine = m.from === currentUser.uid;
    const div = document.createElement('div');
    div.style.cssText = 'max-width:85%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.5; word-wrap:break-word; border:1px solid rgba(255,255,255,0.1); ' +
      (mine ? 'align-self:flex-end; background:linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(79, 70, 229, 0.9)); color:#fff; border-bottom-right-radius:4px;' : 'align-self:flex-start; background:rgba(255,255,255,0.1); color:#fff; border-bottom-left-radius:4px;');
    let html = escapeHtml(m.text || '');
    if (m.translated && m.translated !== m.text) html += '<br><span style="font-size:12px; opacity:0.75; font-style:italic; margin-top:4px; display:block;">↳ ' + escapeHtml(m.translated) + '</span>';
    div.innerHTML = html; box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}
async function sendChatMessage() {
  const text = ($('chInput').value || '').trim();
  if (!text || !chatOpenWith || !db || !currentUser) return;
  const targetLang = $('chLang').value || 'en';
  $('chInput').value = ''; $('chStatus').textContent = '⏳ جاري الترجمة...';
  let translated = '';
  try {
    const res = await fetch(SERVER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [
        { role: 'system', content: 'Translate from ' + langNameFor(myLang) + ' to ' + langNameFor(targetLang) + '. Output ONLY the translation.' },
        { role: 'user', content: text }
      ], is_translation: true })
    });
    const data = await res.json(); translated = (data.reply || '').trim();
  } catch (e) { translated = ''; }
  try {
    const chatId = [currentUser.uid, chatOpenWith.uid].sort().join('_');
    const now = Date.now();
    await db.collection('chats').doc(chatId).collection('messages').add({
      from: currentUser.uid, fromName: myDisplayName(), text, translated,
      fromLang: myLang, targetLang, createdAt: now
    });
    await db.collection('chats').doc(chatId).set({
      lastMessage: text, lastAt: now,
      ['unread_' + chatOpenWith.uid]: firebase.firestore.FieldValue.increment(1)
    }, { merge: true });
    $('chStatus').textContent = '';
  } catch (e) { $('chStatus').textContent = '⚠️ فشل الإرسال: ' + (e.message || ''); }
}
if ($('chBack')) $('chBack').addEventListener('click', () => {
  $('chatOverlay').style.display = 'none';
  if (chatUnsub) { try { chatUnsub(); } catch (e) {} chatUnsub = null; }
  chatOpenWith = null;
});
if ($('chSend')) $('chSend').addEventListener('click', sendChatMessage);
if ($('chInput')) $('chInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
});
</script>
</body>
