<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat-Core - Messenger</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --messenger-bg: #0f0f1e;
  --messenger-header: #1a1a2e;
  --messenger-sidebar: #16162a;
  --messenger-footer: #1a1a2e;
  --messenger-bubble-sender: #0084ff;
  --messenger-bubble-receiver: #3a3a4a;
  --messenger-text: #ffffff;
  --messenger-border: rgba(255,255,255,0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--messenger-bg);
  color: var(--messenger-text);
  height: 100dvh;
}

/* Auth Overlay */
#authOverlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 15, 30, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999999;
  backdrop-filter: blur(20px);
}

.auth-box {
  background: rgba(26, 26, 46, 0.8);
  backdrop-filter: blur(20px);
  padding: 30px 20px;
  border-radius: 24px;
  width: 100%;
  max-width: 350px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  border: 1px solid var(--messenger-border);
  text-align: center;
}

.auth-box h1 {
  color: #0084ff;
  margin-bottom: 5px;
  font-size: 26px;
  text-shadow: 0 0 15px rgba(0,132,255,0.6);
}

.auth-box h2 {
  color: #fff;
  margin-bottom: 20px;
  font-size: 18px;
  font-weight: normal;
}

.auth-input {
  width: 100%;
  padding: 14px;
  margin-bottom: 15px;
  border-radius: 12px;
  border: 1px solid var(--messenger-border);
  background: rgba(0,0,0,0.4);
  color: #fff;
  outline: none;
  font-size: 14px;
  transition: 0.3s;
}

.auth-input:focus {
  border-color: #0084ff;
  box-shadow: 0 0 15px rgba(0,132,255,0.3);
}

.auth-btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #0084ff, #0066cc);
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 10px;
  transition: 0.3s;
  font-size: 15px;
  box-shadow: 0 4px 15px rgba(0,132,255,0.4);
}

.auth-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,132,255,0.6);
}

.auth-btn-outline {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.3);
  background: transparent;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
  font-size: 15px;
}

.auth-btn-outline:hover {
  background: rgba(255,255,255,0.1);
}

#authError {
  color: #ff6b6b;
  font-size: 13px;
  margin-bottom: 10px;
  min-height: 18px;
}

/* Landing Overlay */
#landingOverlay {
  position: fixed;
  inset: 0;
  background: var(--messenger-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 15px;
  z-index: 99999;
}

#landingOverlay h1 {
  color: #0084ff;
  font-size: 32px;
  margin-bottom: 10px;
  text-shadow: 0 0 15px rgba(0,132,255,0.4);
}

.mode-btn {
  padding: 16px 20px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid var(--messenger-border);
  color: #fff;
  cursor: pointer;
  width: 100%;
  max-width: 280px;
  font-weight: bold;
  background: var(--messenger-header);
  transition: all 0.3s;
}

.mode-btn:hover {
  background: #252545;
  transform: translateY(-2px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* Remote Mode Container (Messenger Style) */
#remoteModeContainer {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--messenger-bg);
  z-index: 100;
}

/* Header */
.messenger-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: var(--messenger-header);
  border-bottom: 1px solid var(--messenger-border);
  display: flex;
  align-items: center;
  padding: 0 15px;
  gap: 15px;
  z-index: 1000;
}

.header-toggle {
  background: none;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  padding: 5px 10px;
}

.header-toggle:hover {
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
}

.header-info {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.header-name {
  font-size: 16px;
  font-weight: bold;
  color: #fff;
}

.header-status {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
}

.header-actions {
  display: flex;
  gap: 10px;
}

.header-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  padding: 8px;
  border-radius: 50%;
  transition: all 0.3s;
}

.header-btn:hover {
  background: rgba(255,255,255,0.1);
}

.header-btn.active {
  color: #0084ff;
  background: rgba(0,132,255,0.2);
}

/* Sidebar */
.messenger-sidebar {
  position: fixed;
  top: 60px;
  left: 0;
  bottom: 0;
  width: 280px;
  background: var(--messenger-sidebar);
  border-right: 1px solid var(--messenger-border);
  transform: translateX(-100%);
  transition: transform 0.3s;
  z-index: 999;
  overflow-y: auto;
}

.messenger-sidebar.open {
  transform: translateX(0);
}

.sidebar-header {
  padding: 15px;
  border-bottom: 1px solid var(--messenger-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.sidebar-header h3 {
  font-size: 16px;
  color: #fff;
}

.sidebar-header button {
  background: #0084ff;
  border: none;
  color: #fff;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
}

.sidebar-header button:hover {
  background: #0066cc;
}

.friend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 15px;
  border-bottom: 1px solid var(--messenger-border);
  cursor: pointer;
  transition: background 0.3s;
}

.friend-item:hover {
  background: rgba(255,255,255,0.05);
}

.friend-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #0084ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #fff;
  flex-shrink: 0;
}

.friend-info {
  flex: 1;
  min-width: 0;
}

.friend-name {
  font-size: 14px;
  color: #fff;
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.friend-status {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
}

.friend-actions {
  display: flex;
  gap: 5px;
}

.friend-action-btn {
  background: none;
  border: none;
  color: rgba(255,255,255,0.6);
  font-size: 16px;
  cursor: pointer;
  padding: 5px;
  border-radius: 50%;
  transition: all 0.3s;
}

.friend-action-btn:hover {
  background: rgba(255,255,255,0.1);
  color: #fff;
}

.friend-action-btn.call {
  color: #0084ff;
}

.friend-action-btn.call:hover {
  background: rgba(0,132,255,0.2);
}

.friend-action-btn.delete {
  color: #ff4444;
}

.friend-action-btn.delete:hover {
  background: rgba(255,68,68,0.2);
}

/* Chat Area */
.messenger-chat {
  position: fixed;
  top: 60px;
  left: 0;
  right: 0;
  bottom: 70px;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  max-width: 70%;
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  word-wrap: break-word;
  cursor: pointer;
  transition: all 0.3s;
  user-select: none;
}

.msg:active {
  opacity: 0.7;
}

.msg.user-a {
  align-self: flex-end;
  background: var(--messenger-bubble-sender);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.msg.user-b {
  align-self: flex-start;
  background: var(--messenger-bubble-receiver);
  color: #fff;
  border-bottom-left-radius: 4px;
}

.msg.bot {
  align-self: center;
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.8);
  font-style: italic;
  font-size: 13px;
  max-width: 80%;
}

.msg.playing {
  box-shadow: 0 0 20px rgba(0, 132, 255, 0.6);
  border: 2px solid #0084ff;
}

.lang-tag {
  display: inline-block;
  font-size: 10px;
  padding: 2px 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 6px;
  margin-right: 6px;
  opacity: 0.8;
  font-weight: bold;
}

/* Footer */
.messenger-footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70px;
  background: var(--messenger-footer);
  border-top: 1px solid var(--messenger-border);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 10px;
  z-index: 1000;
}

.footer-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  padding: 10px;
  border-radius: 50%;
  transition: all 0.3s;
}

.footer-btn:hover {
  background: rgba(255,255,255,0.1);
}

.footer-btn.mic {
  background: #0084ff;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.footer-btn.mic.recording {
  background: #ff4444;
  animation: pulse 1s infinite;
}

.footer-input {
  flex: 1;
  background: rgba(255,255,255,0.1);
  border: 1px solid var(--messenger-border);
  border-radius: 20px;
  padding: 12px 15px;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: 0.3s;
}

.footer-input:focus {
  border-color: #0084ff;
  background: rgba(255,255,255,0.15);
}

.footer-send {
  background: #0084ff;
  border: none;
  color: #fff;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}

.footer-send:hover {
  background: #0066cc;
  transform: scale(1.1);
}

.footer-send:disabled {
  background: #666;
  cursor: not-allowed;
  transform: none;
}

/* Call Overlay */
#callOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  backdrop-filter: blur(20px);
  z-index: 9999998;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 30px;
}

#callOverlay.active {
  display: flex;
}

.call-avatar {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0084ff, #0066cc);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  animation: ringPulse 1.5s infinite;
}

.call-name {
  font-size: 28px;
  font-weight: bold;
  color: #fff;
}

.call-status {
  font-size: 16px;
  color: rgba(255,255,255,0.7);
}

.call-actions {
  display: flex;
  gap: 40px;
}

.call-btn {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  cursor: pointer;
  transition: all 0.3s;
}

.call-btn.accept {
  background: #00c853;
  color: #fff;
}

.call-btn.accept:hover {
  background: #00a843;
  transform: scale(1.1);
}

.call-btn.decline {
  background: #ff4444;
  color: #fff;
}

.call-btn.decline:hover {
  background: #cc0000;
  transform: scale(1.1);
}

/* Add Friend Form */
#addFriendForm {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--messenger-sidebar);
  padding: 20px;
  border-radius: 16px;
  border: 1px solid var(--messenger-border);
  z-index: 10000;
  min-width: 300px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

#addFriendForm h3 {
  color: #fff;
  margin-bottom: 15px;
  font-size: 18px;
}

#addFriendForm input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid var(--messenger-border);
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 14px;
  margin-bottom: 10px;
  outline: none;
}

#addFriendForm input:focus {
  border-color: #0084ff;
}

#addFriendForm button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #0084ff;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 5px;
  transition: 0.3s;
}

#addFriendForm button:hover {
  background: #0066cc;
}

#addFriendForm button:last-child {
  background: #666;
}

#addFriendForm button:last-child:hover {
  background: #555;
}

/* Status */
#status {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 132, 255, 0.9);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 1001;
  display: none;
  backdrop-filter: blur(10px);
}

#status.show {
  display: block;
}

/* Media Menu */
#mediaMenu {
  display: none;
  position: fixed;
  bottom: 80px;
  left: 10px;
  background: var(--messenger-sidebar);
  border: 1px solid var(--messenger-border);
  border-radius: 12px;
  padding: 10px;
  z-index: 1001;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.media-option {
  display: block;
  width: 100%;
  padding: 10px 15px;
  background: none;
  border: none;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  text-align: right;
  border-radius: 8px;
  transition: 0.3s;
}

.media-option:hover {
  background: rgba(255,255,255,0.1);
}

/* Animations */
@keyframes ringPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 132, 255, 0.7); }
  50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(0, 132, 255, 0); }
}

@keyframes pulse {
  50% { transform: scale(1.1); }
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,0.3);
}
</style>
</head>
<body>

<!-- Auth Overlay -->
<div id="authOverlay">
  <div class="auth-box">
    <h1>🌐 Chat-Core</h1>
    <h2 id="authTitle">تسجيل الدخول</h2>
    <div id="authError"></div>
    <input type="email" id="authEmail" class="auth-input" placeholder="البريد الإلكتروني">
    <input type="password" id="authPassword" class="auth-input" placeholder="كلمة المرور">
    <button id="authSubmitBtn" class="auth-btn">دخول</button>
    <button id="authToggleBtn" class="auth-btn-outline">إنشاء حساب جديد</button>
  </div>
</div>

<!-- Landing Overlay -->
<div id="landingOverlay" style="display:none;">
  <h1>🌐 Chat-Core</h1>
  <p style="color:rgba(255,255,255,0.6); margin-bottom:15px;">اختر وضع التشغيل</p>
  <button class="mode-btn" id="btnLocal">🌐 Face-to-Face</button>
  <button class="mode-btn" id="btnRemote">💬 Remote Mode</button>
  <button class="mode-btn" id="btnLogout">🚪 تسجيل الخروج</button>
</div>

<!-- Remote Mode Container (Messenger Style) -->
<div id="remoteModeContainer">
  <!-- Header -->
  <div class="messenger-header">
    <button class="header-toggle" id="toggleSidebar">☰</button>
    <div class="header-info">
      <div class="header-name" id="remoteHeaderName">Remote Chat</div>
      <div class="header-status" id="remoteHeaderStatus">متصل</div>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="transToggleBtn" title="الترجمة">🌐</button>
      <button class="header-btn" id="callBtn" title="اتصال">📞</button>
      <button class="header-btn" id="backBtn" title="رجوع">←</button>
    </div>
  </div>

  <!-- Sidebar (Friends) -->
  <div class="messenger-sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>الأصدقاء</h3>
      <button id="addFriendBtn">➕</button>
    </div>
    <div id="friendsList"></div>
  </div>

  <!-- Chat Area -->
  <div class="messenger-chat" id="chat"></div>

  <!-- Footer -->
  <div class="messenger-footer">
    <button class="footer-btn mic" id="micBtn" title="تسجيل صوتي">🎤</button>
    <input type="text" class="footer-input" id="textInput" placeholder="اكتب رسالة...">
    <button class="footer-btn" id="mediaBtn" title="وسائط">+</button>
    <button class="footer-send" id="sendBtn" title="إرسال">➤</button>
  </div>
</div>

<!-- Add Friend Form -->
<div id="addFriendForm">
  <h3>إضافة صديق</h3>
  <input type="text" id="friendCodeInput" placeholder="كود الصديق">
  <button id="confirmAddFriend">إضافة</button>
  <button id="cancelAddFriend">إلغاء</button>
</div>

<!-- Call Overlay -->
<div id="callOverlay">
  <div class="call-avatar">📞</div>
  <div class="call-name" id="callName">Unknown</div>
  <div class="call-status" id="callStatus">مكالمة واردة...</div>
  <div class="call-actions">
    <button class="call-btn decline" id="callDecline">✕</button>
    <button class="call-btn accept" id="callAccept">📞</button>
  </div>
</div>

<!-- Status -->
<div id="status"></div>

<!-- Media Menu -->
<div id="mediaMenu">
  <button class="media-option" id="cameraBtn">📸 كاميرا</button>
  <button class="media-option" id="galleryBtn">🖼️ معرض</button>
  <button class="media-option" id="videoBtn">🎬 فيديو</button>
</div>

<input type="file" id="cameraUpload" accept="image/*" capture="environment" style="display:none;">
<input type="file" id="galleryUpload" accept="image/*" style="display:none;">
<input type="file" id="videoUpload" accept="video/*" style="display:none;">  
<script>
'use strict';

// 1. Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyCCp08HOuP4vpXlvBkzjOgGAwQoeTsOKJ8",
  authDomain: "chat-core-app.firebaseapp.com",
  projectId: "chat-core-app",
  storageBucket: "chat-core-app.firebasestorage.app",
  messagingSenderId: "216958872856",
  appId: "1:216958872856:web:f03d559611b327c91b426d",
  measurementId: "G-DHB0S6TW96"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
let db = null;

// 2. Global Variables
let currentUser = null;
let myFriendCode = null;
let friendsCache = [];
let currentIncomingCall = null;
let isTranslatorMode = true; // Default ON
let ws = null;
let currentRoomCode = '';
let myLang = 'ar';

// 3. UI Helpers
const $ = id => document.getElementById(id);
function showStatus(msg) {
  const s = $('status');
  s.textContent = msg;
  s.classList.add('show');
  setTimeout(() => s.classList.remove('show'), 3000);
}

// 4. Auth Logic
let isLoginMode = true;
$('authSubmitBtn').addEventListener('click', () => {
  const email = $('authEmail').value;
  const pass = $('authPassword').value;
  if(!email || !pass) return $('authError').textContent = "أدخل البيانات";
  $('authSubmitBtn').textContent = "...";
  const p = isLoginMode ? auth.signInWithEmailAndPassword(email, pass) : auth.createUserWithEmailAndPassword(email, pass);
  p.catch(e => { $('authError').textContent = e.message; $('authSubmitBtn').textContent = isLoginMode ? 'دخول' : 'تسجيل'; });
});
$('authToggleBtn').addEventListener('click', () => {
  isLoginMode = !isLoginMode;
  $('authTitle').textContent = isLoginMode ? 'تسجيل الدخول' : 'حساب جديد';
  $('authSubmitBtn').textContent = isLoginMode ? 'دخول' : 'تسجيل';
  $('authToggleBtn').textContent = isLoginMode ? 'إنشاء حساب' : 'لدي حساب';
  $('authError').textContent = '';
});

auth.onAuthStateChanged(user => {

// 7. Friends System
async function initFriends() {
  if(!currentUser) return;
  const uid = currentUser.uid;
  const name = currentUser.displayName || currentUser.email.split('@')[0];
  
  // Get or Create Friend Code
  const userRef = db.collection('users').doc(uid);
  const snap = await userRef.get();
  if(snap.exists && snap.data().code) {
    myFriendCode = snap.data().code;
  } else {
    const code = Math.random().toString(36).substring(2, 8).toUpperCase();
    await userRef.set({ code, name }, { merge: true });
    myFriendCode = code;
  }

  // Listen to Friends
  db.collection('users').doc(uid).collection('friends').onSnapshot(snap => {
    friendsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderFriends();
  });

  // Listen to Calls
  db.collection('calls').where('to_uid', '==', uid).where('status', '==', 'ringing').onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if(ch.type === 'added') {
        const call = { id: ch.doc.id, ...ch.doc.data() };
        showIncomingCall(call);
      }
    });
  });
}

function renderFriends() {
  const list = $('friendsList');

    return;

  friendsCache.forEach(f => {
    const div = document.createElement('div');

    div.innerHTML = `

  });
}

function playRingtone() {
  // Simple beep using AudioContext
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 440;
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

  <script>
// 12. Audio Processing & Smart Voice Isolation
let localRecorder = null;
let localStreamMic = null;
let localChunks = [];
let localStartTime = 0;
let isRecording = false;
let audioCtx = null;
let analyser = null;
let noiseFloor = 0;

async function toggleLocalMic() {
  const btn = $('micBtn');
  
  if (isRecording) {
    // Stop Recording
    if (localRecorder && localRecorder.state === 'recording') {
      localRecorder.stop();
    }
    btn.classList.remove('recording');
    isRecording = false;
    showStatus('جارٍ معالجة الصوت... ⏳');
    return;
  }

  // Start Recording
  try {
    localStreamMic = await navigator.mediaDevices.getUserMedia({ 
      audio: { 
        echoCancellation: true, 
        noiseSuppression: true, 
        autoGainControl: true 
      } 
    });
    
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(localStreamMic);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    
    const rmsBuffer = new Float32Array(analyser.fftSize);
    let calibrationCount = 0;
    
    // Smart Noise Gate Calibration
    const calibrate = setInterval(() => {
      analyser.getFloatTimeDomainData(rmsBuffer);
      let sum = 0;
      for (let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i] * rmsBuffer[i];
      const rms = Math.sqrt(sum / rmsBuffer.length);
      noiseFloor += rms;
      calibrationCount++;
      
      if (calibrationCount >= 10) {
        noiseFloor = Math.min(noiseFloor / calibrationCount, 0.05);
        clearInterval(calibrate);
      }
    }, 100);

    let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    localRecorder = new MediaRecorder(localStreamMic, { mimeType });
    localChunks = [];
    
    localRecorder.ondataavailable = e => { if (e.data.size > 0) localChunks.push(e.data); };
    
    localRecorder.onstop = async () => {
      clearInterval(calibrate);
      localStreamMic.getTracks().forEach(t => t.stop());
      audioCtx.close();
      
      const durationMs = Date.now() - localStartTime;
      if (durationMs < 800) {
        showStatus('⚠️ مدة قصيرة جداً');
        return;
      }
      
      const blob = new Blob(localChunks, { type: mimeType });
      await processAudio(blob, durationMs);
    };
    
    localRecorder.start(1000);
    localStartTime = Date.now();
    isRecording = true;
    btn.classList.add('recording');
    showStatus('جارٍ التسجيل... اضغط للإيقاف 🎤');
    
  } catch (e) {
    showStatus('⚠️ تعذر الوصول للميكروفون');
    console.error(e);
  }
}

async function processAudio(blob, durationMs) {
  const formData = new FormData();
  formData.append('file', blob, 'audio.webm');
  formData.append('target_lang', myLang);
  formData.append('language', myLang);
  formData.append('duration_ms', String(durationMs));
  
  try {
    const res = await fetch('https://chat-core-tts.onrender.com/transcribe', { 
      method: 'POST', 
      body: formData 
    });
    
    if (res.ok) {
      const data = await res.json();
      if (data.original && data.original.length > 1) {
        addMsg('user-a', data.original, myLang);
        if (isTranslatorMode && data.translated) {
          addMsg('bot', `↳ ${data.translated}`);
          speak(data.translated, myLang);
        }
      } else {
        showStatus('⚠️ لم يتم التقاط صوت واضح');
      }
    }
  } catch (e) {
    showStatus('⚠️ فشل إرسال الصوت');
  }
}

// 13. Text-to-Speech (TTS) with Retry
let currentAudio = null;
let currentSpeechId = 0;

async function speak(text, lang) {
  if (!text) return;
  const cleaned = text.replace(/[*_#`~|\\\/<>()\[\]{}«»"']/g, ' ').trim();
  if (!cleaned) return;
  
  const myId = ++currentSpeechId;
  let retryCount = 0;
  const maxRetries = 2;
  
  while (retryCount <= maxRetries) {
    try {
      const res = await fetch('https://chat-core-tts.onrender.com/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: cleaned.slice(0, 4000), lang: lang || 'ar', voice: 'woman' })
      });
      
      if (!res.ok) throw new Error('TTS Error');
      if (myId !== currentSpeechId) return; // Cancelled by new speech
      
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      currentAudio = new Audio(url);
      
      currentAudio.onended = () => { 
        URL.revokeObjectURL(url); 
        document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing'));
      };
      
      await currentAudio.play();
      return;
    } catch (e) {
      retryCount++;
      if (retryCount > maxRetries) break;
      await new Promise(r => setTimeout(r, 500));
    }
  }
  
  // Fallback to Browser SpeechSynthesis
  if ('speechSynthesis' in window) {
    const utt = new SpeechSynthesisUtterance(cleaned);
    utt.lang = lang || 'ar';
    speechSynthesis.speak(utt);
  }
}

function stopAudio() {
  currentSpeechId++;
  if (currentAudio) { 
    currentAudio.pause(); 
    currentAudio = null; 
  }
  if ('speechSynthesis' in window) { 
    speechSynthesis.cancel(); 
  }
  document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing'));
}

async function handleImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const img = new Image();
    img.src = ev.target.result;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxWidth = 800;
      let width = img.width, height = img.height;
      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const compressed = canvas.toDataURL('image/jpeg', 0.7);
      
      addMsg('user-a', '📷 صورة', myLang);

  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
