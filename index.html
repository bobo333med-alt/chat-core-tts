<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat-Core - Translator</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.15);
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  --glass-blur: blur(12px);
  --text-main: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: radial-gradient(circle at 50% 0%, #1a2a6c 0%, #0d1b3e 50%, #050a1f 100%);
  color: var(--text-main);
  display: flex; flex-direction: column; padding: 10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  height: 100dvh; transition: opacity 0.3s;
}
@keyframes ringPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); } }
@keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes pulse { 50% { transform: scale(1.1); } }

#authOverlay { position: fixed; inset: 0; background: rgba(13, 27, 62, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999999; padding: 20px; overflow-y: auto; backdrop-filter: blur(20px); }
.auth-lang-switch { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; background: rgba(255,255,255,0.1); padding: 5px; border-radius: 12px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
.lang-btn { background: transparent; border: none; color: rgba(255,255,255,0.6); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.3s; }
.lang-btn.active { background: rgba(0, 240, 255, 0.3); color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
.auth-box { background: rgba(26, 42, 108, 0.6); backdrop-filter: blur(20px); padding: 30px 20px; border-radius: 24px; width: 100%; max-width: 350px; box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); text-align: center; margin: auto; }
.auth-box h1 { color: #00f0ff; margin-bottom: 5px; font-size: 26px; text-shadow: 0 0 15px rgba(0,240,255,0.6); }
.auth-box h2 { color: #fff; margin-bottom: 20px; font-size: 18px; font-weight: normal; }
.auth-input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: #fff; outline: none; font-size: 14px; transition: 0.3s; }
.auth-input:focus { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0,240,255,0.3); }
.auth-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; font-size: 15px; box-shadow: 0 4px 15px rgba(0,176,155,0.4); }
.auth-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,176,155,0.6); }
.auth-btn.outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; box-shadow: none; }
.auth-btn.outline:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
.social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; font-size: 14px; }
.social-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
#authError { color: #ff6b6b; font-size: 13px; margin-bottom: 10px; min-height: 18px; word-wrap: break-word; }
.divider { display: flex; align-items: center; margin: 20px 0; color: rgba(255,255,255,0.5); font-size: 12px; }
.divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.2); margin: 0 10px; }

.overlay { position: fixed; inset: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; color: #fff; padding: 20px; z-index: 99999; overflow-y: auto; }
.overlay h1 { font-size: 32px; color: #00f0ff; margin-bottom: 5px; text-shadow: 0 0 15px rgba(0,240,255,0.4); }
.overlay h2 { font-size: 20px; color: #fff; margin-bottom: 10px; font-weight: normal; }
.mode-btn { padding: 16px 20px; font-size: 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); color: #fff; cursor: pointer; width: 100%; max-width: 280px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(10px); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: inset 0 0 10px rgba(255,255,255,0.1), 0 4px 15px rgba(0,0,0,0.3); background: rgba(255,255,255,0.05); position: relative; }
.mode-btn:active { transform: scale(0.96); }
#btnLocal { border-color: rgba(138, 43, 226, 0.5); background: linear-gradient(90deg, rgba(138,43,226,0.2), rgba(0,0,0,0)); }
#btnRemote { border-color: rgba(16, 185, 129, 0.6); background: linear-gradient(90deg, rgba(16,185,129,0.25), rgba(0,0,0,0)); }
#btnLogout { border-color: rgba(255, 69, 0, 0.5); background: linear-gradient(90deg, rgba(255,69,0,0.2), rgba(0,0,0,0)); margin-top: 20px; }

/* Messenger / Remote Hub */
.messenger-shell { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 420px; height: 92dvh; background: rgba(16, 28, 72, 0.78); padding: 18px; border-radius: 24px; backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 10px 35px rgba(0,0,0,0.55); }
.messenger-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.12); }
.messenger-header h2 { margin: 0; font-size: 19px; color: #00f0ff; display: flex; align-items: center; gap: 8px; }
.messenger-card { background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.messenger-shell input[type="text"], .messenger-shell select { padding: 11px 13px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.45); color: #fff; font-size: 13px; outline: none; }
.messenger-shell input:focus, .messenger-shell select:focus { border-color: #00f0ff; }
#frMyCode { color: #00f0ff; letter-spacing: 3px; font-size: 18px; text-shadow: 0 0 10px rgba(0,240,255,0.4); }
#frCopyCode { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 11px; border-radius: 8px; cursor: pointer; font-size: 13px; }
#frAddBtn { background: linear-gradient(135deg, #11998e, #38ef7d); border: none; color: #fff; padding: 0 16px; border-radius: 12px; cursor: pointer; font-size: 17px; font-weight: bold; }
#frMsg { color: #fbbf24; min-height: 16px; font-size: 12px; text-align: center; }
#frList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.friend-item { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 10px 12px; transition: 0.2s; }
.friend-item:hover { background: rgba(255,255,255,0.12); }
.friend-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #10b981); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: #fff; flex-shrink: 0; }
.friend-info { flex: 1; min-width: 0; cursor: pointer; }
.friend-name { font-size: 14px; font-weight: bold; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.friend-sub { font-size: 11px; color: rgba(255,255,255,0.55); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-pill-btn { border: none; border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: bold; color: #fff; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.icon-pill-btn:active { transform: scale(0.92); }

/* Messenger 1-to-1 Chat Overlay */
#chatOverlay { background: radial-gradient(circle at 50% 0%, #1a2a6c 0%, #0d1b3e 60%, #050a1f 100%); justify-content: flex-start; gap: 8px; padding: 12px; }
.ch-topbar { width: 100%; max-width: 440px; display: flex; align-items: center; gap: 8px; background: rgba(26, 42, 108, 0.75); border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 8px 10px; flex-shrink: 0; }
#chBack { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 10px; padding: 7px 11px; cursor: pointer; font-weight: bold; }
#chMsgs { flex: 1; width: 100%; max-width: 440px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: rgba(26, 42, 108, 0.55); border: 1px solid rgba(255,255,255,0.18); border-radius: 18px; }
.ch-bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-wrap: break-word; border: 1px solid rgba(255,255,255,0.12); cursor: pointer; }
.ch-bubble.mine { align-self: flex-end; background: linear-gradient(135deg, rgba(99, 102, 241, 0.92), rgba(79, 70, 229, 0.92)); color: #fff; border-bottom-right-radius: 4px; }
.ch-bubble.theirs { align-self: flex-start; background: rgba(255,255,255,0.12); color: #fff; border-bottom-left-radius: 4px; }
.ch-input-row { display: flex; gap: 8px; width: 100%; max-width: 440px; flex-shrink: 0; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
#chInput { flex: 1; border-radius: 20px; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.22); color: #fff; padding: 12px 15px; font-size: 14px; outline: none; order: 0; }
#chSend { background: linear-gradient(135deg, #4568dc, #b06ab3); border: none; color: #fff; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; font-size: 16px; box-shadow: 0 4px 15px rgba(69,104,220,0.35); flex-shrink: 0; }
#chMicBtn { background: linear-gradient(135deg, #11998e, #38ef7d); border: none; color: #fff; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; font-size: 17px; flex-shrink: 0; }
#chMicBtn.recording { background: #ef4444; animation: pulse 0.8s infinite; }

/* Face-to-Face & Call Room UI */
.top-header { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 10px; flex-shrink: 0; position: relative; z-index: 10001; }
.top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(26, 42, 108, 0.6); padding: 8px 15px; border-radius: 16px; width: 95%; max-width: 400px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
.user-section { display: flex; align-items: center; gap: 6px; }
.lang-select { padding: 0 5px; border-radius: 8px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.2); font-size: 10px; outline: none; width: 85px !important; height: 28px; text-align: center; }
.mic-btn { width: 44px; height: 44px; border-radius: 50%; border: none; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.mic-btn.blue { background: #6366f1; } .mic-btn.green { background: #10b981; }
.mic-btn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; box-shadow: 0 0 15px rgba(239,68,68,0.6); }
.mic-btn:disabled { background: #475569 !important; opacity: 0.5; }

#avatar-wrap { width: 100px; height: 100px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all 0.3s; }
#avatar-container { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; background: #1e293b; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,240,255,0.2); z-index: 1; transition: all 0.3s; border: 2px solid rgba(255,255,255,0.2); }
#avatar-logo, #avatar-video { width: 100%; height: 100%; object-fit: cover; display: block; }
#avatar-video { display: none; }
#avatar-wrap.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: #000; }
#avatar-wrap.fullscreen #avatar-container { width: 100vw; height: 100vh; border-radius: 0 !important; background: transparent; box-shadow: none; border: none; }
#avatar-wrap.fullscreen #avatar-logo, #avatar-wrap.fullscreen #avatar-video { object-fit: contain; width: 100vw; height: 100vh; }
#avatar-wrap.fullscreen #closeFullscreen { display: flex; }
#removeAvatarBtn { display: none; position: absolute; top: 50%; right: -15px; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; background: #000; border: 2px solid #fff; cursor: pointer; z-index: 999; color: white; font-weight: bold; font-size: 14px; align-items: center; justify-content: center; }
body.remote-mode #avatar-wrap { display: none !important; }

#closeFullscreen, #closeVideoFullscreen { display: none; position: fixed; background: #e57373; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 10000; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.inner-white-dot { width: 14px; height: 14px; background: #fff; border-radius: 50%; }
#closeFullscreen { top: 80px; right: 20px; } #closeVideoFullscreen { top: 20px; right: 20px; }

#videoContainer { display: none; position: relative; width: 100%; max-width: 400px; height: 200px; margin: 0 auto 10px; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.5); cursor: pointer; transition: all 0.3s; z-index: 500; border: 1px solid rgba(255,255,255,0.1); }
#remoteVideo { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
#localVideo { position: absolute; bottom: 10px; right: 10px; width: 80px; height: 100px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,0.5); background: #1e293b; z-index: 2; pointer-events: auto; }
#videoStatus { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 6px; font-size: 10px; color: #10b981; z-index: 2; pointer-events: none; }
#tapToPlayOverlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.7); color: #fff; z-index: 10; align-items: center; justify-content: center; flex-direction: column; font-weight: bold; font-size: 16px; cursor: pointer; }
body.video-maximized #videoContainer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; max-width: 100vw; z-index: 99999; margin: 0; border-radius: 0; }
body.video-maximized #localVideo { width: 90px; height: 130px; bottom: 20px; right: 20px; border-radius: 12px; }
body.video-maximized #closeVideoFullscreen { display: flex; }
body.video-maximized #topHeader, body.video-maximized #extraControls, body.video-maximized #chatContainer, body.video-maximized #inputRow, body.video-maximized #status, body.video-maximized #remoteBar { display: none !important; }

#floatingMicBtn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #11998e, #38ef7d); color: white; display: none; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(56,239,125,0.4); z-index: 100000; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: all 0.3s; }
#floatingMicBtn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; box-shadow: 0 0 20px rgba(239,68,68,0.8); }
body.video-maximized #floatingMicBtn { display: flex; }

.chat-container { position: relative; flex: 1; display: flex; flex-direction: column; margin-bottom: 10px; min-height: 100px; }
#chat { flex: 1; background: rgba(26, 42, 108, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 32px rgba(0,0,0,0.3); border-radius: 20px; padding: 15px; overflow-y: auto; }
.msg { padding: 12px 16px; border-radius: 16px; margin-bottom: 8px; max-width: 85%; line-height: 1.6; word-wrap: break-word; font-size: 15px; transition: opacity 0.2s; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); user-select: none; }
.msg:active { opacity: 0.7; }
.msg.playing { box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); border: 1px solid #00f0ff; }
.user-a { background: linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(79, 70, 229, 0.9)); margin-right: auto; border-bottom-right-radius: 4px; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
.user-b { background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(5, 150, 105, 0.9)); margin-left: auto; border-bottom-left-radius: 4px; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
.bot { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); margin: 0 auto 8px auto; text-align: center; font-style: italic; font-size: 13px; cursor: default; backdrop-filter: blur(5px); }
.lang-tag { display: inline-block; font-size: 10px; padding: 2px 6px; background: rgba(255,255,255,0.15); border-radius: 6px; margin-right: 6px; opacity: 0.8; font-weight: bold; }
#clearBtn { position: absolute; bottom: 2px; left: 10px; width: 32px; height: 32px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
#clearBtn svg { fill: #2d3748; width: 16px; height: 16px; }
#imagePreviewContainer { display: none; position: absolute; bottom: 60px; right: 10px; background: rgba(26, 42, 108, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 5px; align-items: center; gap: 8px; z-index: 1000; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
#imagePreview { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
#cancelImageBtn { background: #dc2626; color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

.row { display: flex; gap: 8px; align-items: center; flex-shrink: 0; position: relative; }
input[type=text] { flex: 1; padding: 12px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: #fff; font-size: 14px; order: 3; outline: none; backdrop-filter: blur(5px); }
input[type=text]:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.1); }
button.btn { padding: 0; border: none; border-radius: 50%; font-weight: bold; width: 42px; height: 42px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
#musicBtn { background: rgba(255,255,255,0.1); color: #fff; order: 1; font-size: 18px; border: 1px solid rgba(255,255,255,0.2); }
#mediaBtn { background: linear-gradient(135deg, #4568dc, #b06ab3); color: #ffffff; order: 2; font-size: 24px; width: 38px; height: 38px; padding-bottom: 2px; font-weight: normal; }
#remoteMicBtn { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; order: 2; width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 4px 15px rgba(56,239,125,0.4); display: none; transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.2); }
#remoteMicBtn.recording { background: #ef4444 !important; box-shadow: 0 0 20px rgba(239,68,68,0.8); animation: pulse 1s infinite; }
#toggleCamBtn { background: rgba(255,255,255,0.1); color: #fff; order: 2; width: 46px; height: 46px; border-radius: 50%; display: none; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: all 0.3s ease; }
#toggleCamBtn.off { background: #ef4444; }
#sendBtn { background: linear-gradient(135deg, #4568dc, #b06ab3); order: 4; color: #fff; }
#sendBtn svg { width: 20px; height: 20px; fill: white; transform: translateX(-2px) translateY(2px); }
#stopAudioBtn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; outline: none; }
#stopAudioBtn svg { fill: #2d3748; width: 14px; height: 14px; }
#status { text-align: center; font-size: 13px; color: #00f0ff; margin-top: 6px; min-height: 18px; font-weight: bold; text-shadow: 0 0 5px rgba(0,240,255,0.3); }

.extra-controls { display: flex; gap: 8px; margin-bottom: 10px; justify-content: center; flex-wrap: wrap; width: 100%; padding: 0 5px; align-items: center; }
.extra-controls button, .extra-controls select { padding: 8px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; font-size: 11px; cursor: pointer; outline: none; white-space: nowrap; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); transition: 0.3s; }
.extra-controls button:active { transform: scale(0.95); }
.toggle-btn { background: rgba(255,255,255,0.1) !important; color: white !important; transition: 0.3s; border: 1px solid rgba(255,255,255,0.2) !important; }

const REQUEST_TIMEOUT_MS = 60000;

function compressImage(base64Str, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve) => {
    const img = new Image(); img.src = base64Str;
    img.onload = () => {
      const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
      if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(base64Str);
  });
}

      addMsg('⚠️ تعذر الوصول إلى المايك أو الكاميرا.', 'bot');
      return;

  if (!pc) {
    const iceServers = [
      { urls: 'stun:stun.relay.metered.ca:80' },
      { urls: 'turn:global.relay.metered.ca:80', username: '4201486c5fb862688f36878e', credential: 'r55gTJrk5t/MiLew' },
      { urls: 'turn:global.relay.metered.ca:443', username: '4201486c5fb862688f36878e', credential: 'r55gTJrk5t/MiLew' }

    pc = new RTCPeerConnection({ iceServers });
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    pc.ontrack = (event) => {
      remoteVideo.srcObject = event.streams[0];
      if (event.streams[0].getVideoTracks().length > 0) videoContainer.style.display = 'block';
      remoteVideo.play().catch(() => { tapToPlayOverlay.style.display = 'flex'; });

// ===== Face-to-Face Local Mic =====
async function toggleLocalMic(speaker) {
  if (isLocalProcessing) return;
  unlockAudio();

  if (localRecorder && localRecorder.state === 'recording') {
    localRecorder.stop();
    micA.classList.remove('recording'); micB.classList.remove('recording');
    setStatus('⏳ Processing...');
    return;
  }
  if (localRecorder) { try { localRecorder.stop(); } catch (e) {} }

  const lang = speaker === 'A' ? langA.value : langB.value;
  const targetLang = speaker === 'A' ? langB.value : langA.value;
  const btn = speaker === 'A' ? micA : micB;

  try {
    localStreamMic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1, sampleRate: 48000 }
    });
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(localStreamMic);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    const rmsBuffer = new Float32Array(analyser.fftSize);
    let rmsMax = 0, silenceStart = Date.now(), noiseFloor = 0, calibrationCount = 0;

    const calibrationInterval = setInterval(() => {
      try {
        analyser.getFloatTimeDomainData(rmsBuffer);
        let sum = 0; for (let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i] * rmsBuffer[i];
        noiseFloor += Math.sqrt(sum / rmsBuffer.length);
        calibrationCount++;
        if (calibrationCount >= 10) { noiseFloor = Math.min(noiseFloor / calibrationCount, 0.05); clearInterval(calibrationInterval); }
      } catch (e) {}
    }, 100);

    const intervalId = setInterval(() => {
      try {
        analyser.getFloatTimeDomainData(rmsBuffer);
        let sum = 0; for (let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i] * rmsBuffer[i];
        const rms = Math.sqrt(sum / rmsBuffer.length);
        if (rms > rmsMax) rmsMax = rms;
        const threshold = Math.max(0.02, noiseFloor + 0.015);
        if (rms > threshold) silenceStart = Date.now();
        else if (Date.now() - silenceStart > LONG_RECORD_SILENCE_MS && localRecorder && localRecorder.state === 'recording') {
          localRecorder.stop();
        }
      } catch (e) {}
    }, 100);

    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    localRecorder = new MediaRecorder(localStreamMic, { mimeType });
    localChunks = [];
    localRecorder.ondataavailable = e => { if (e.data.size > 0) localChunks.push(e.data); };

    localRecorder.onstop = async () => {
      clearInterval(intervalId); clearInterval(calibrationInterval);
      if (localStreamMic) localStreamMic.getTracks().forEach(t => t.stop());
      try { if (audioCtx.state !== 'closed') await audioCtx.close(); } catch (e) {}

      const durationMs = Date.now() - localStartTime;
      if (durationMs < 800 || rmsMax < 0.005) {
        isLocalProcessing = false; unlockMics();
        if (durationMs >= 800) addMsg('⚠️ لم يُسمع صوت واضح.', 'bot');
        return;
      }

      const blob = new Blob(localChunks, { type: localRecorder.mimeType });
      setStatus('⏳ جاري استخراج النص والترجمة...');
      const formData = new FormData();
      formData.append('file', blob, 'audio.webm');
      formData.append('target_lang', targetLang);
      formData.append('language', lang);
      formData.append('duration_ms', String(durationMs));

      try {
        const res = await fetch(TRANSCRIBE_URL, { method: 'POST', body: formData });
        if (res.ok) {
          const data = await res.json();
          if (data.original && data.original.length > 1) {
            addMsg(`You: ${data.original}`, speaker === 'A' ? 'user-a' : 'user-b', lang);
            if (isTranslatorMode) {
              if (data.translated) { addMsg(`↳ ${data.translated}`, 'bot', targetLang); speak(data.translated, targetLang); }
            } else {
              ask(data.original, lang, targetLang, speaker);
            }
          } else {
            addMsg('⚠️ لم يتم التعرف على كلام.', 'bot');
          }
        }
      } catch (e) { addMsg('⚠️ فشل إرسال الصوت.', 'bot'); }

      isLocalProcessing = false; unlockMics();
    };

    localRecorder.start(1000);
    localStartTime = Date.now();
    btn.classList.add('recording');
    micA.disabled = speaker !== 'A'; micB.disabled = speaker !== 'B';
    setStatus(`🎤 Listening (${speaker === 'A' ? 'You' : 'Friend'})...`);
  } catch (e) {
    addMsg("⚠️ تعذر الوصول للمايك: " + e.message, "bot");
    isLocalProcessing = false; unlockMics();
  }
}
function unlockMics() {
  micA.disabled = false; micB.disabled = false;
  micA.classList.remove('recording'); micB.classList.remove('recording');
  resetStatus();
}

async function startManualTranslation() {
  if (isManualTranslating) return;
  try {
    const transStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1, sampleRate: 48000 }
    });
    const rawTrack = transStream.getAudioTracks()[0];
    translationAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = translationAudioCtx.createMediaStreamSource(new MediaStream([rawTrack]));
    const hp = translationAudioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 80;
    const analyser = translationAudioCtx.createAnalyser(); analyser.fftSize = 512;
    const destination = translationAudioCtx.createMediaStreamDestination();
    source.connect(hp); hp.connect(analyser); analyser.connect(destination);

    const filteredTrack = destination.stream.getAudioTracks()[0];
    const rmsBuffer = new Float32Array(analyser.fftSize);
    let rmsMax = 0, silenceStart = Date.now(), chunkStartTime = Date.now(), chunkIndex = 0, noiseFloor = 0, calibrationCount = 0;

    const calibrationInterval = setInterval(() => {
      try {
        analyser.getFloatTimeDomainData(rmsBuffer);
        let sum = 0; for (let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i] * rmsBuffer[i];
        noiseFloor += Math.sqrt(sum / rmsBuffer.length);
        calibrationCount++;
        if (calibrationCount >= 10) { noiseFloor = Math.min(noiseFloor / calibrationCount, 0.05); clearInterval(calibrationInterval); }
      } catch (e) {}
    }, 100);

    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    const startNewChunk = () => {
      let chunks = [];
      audioRecorder = new MediaRecorder(new MediaStream([filteredTrack]), { mimeType });
      audioRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      audioRecorder.onstop = async () => {
        const durationMs = Date.now() - chunkStartTime;
        if (chunks.length === 0 || durationMs < 800 || rmsMax < 0.005) return;
        const blob = new Blob(chunks, { type: mimeType });
        const formData = new FormData();
        formData.append('file', blob, 'audio.webm');
        formData.append('target_lang', myLang);
        formData.append('language', myLang);
        formData.append('duration_ms', String(durationMs));
        try {
          const res = await fetch(TRANSCRIBE_URL, { method: 'POST', body: formData });
          if (res.ok) {
            const data = await res.json();
            if (data.original && data.original.length > 1) {
              addMsg(`You: ${data.original}`, 'user-a', myLang);
              sendRemoteMessage(data.original);
            }
          }
        } catch (e) { console.warn('Audio chunk upload failed', e); }
        chunkIndex++;
      };
      audioRecorder.start(1000);
      chunkStartTime = Date.now(); rmsMax = 0; silenceStart = Date.now();
    };
    startNewChunk();

    const vadInterval = setInterval(() => {
      if (!isManualTranslating) return;
      try {
        analyser.getFloatTimeDomainData(rmsBuffer);
        let sum = 0; for (let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i] * rmsBuffer[i];
        const rms = Math.sqrt(sum / rmsBuffer.length);
        const threshold = Math.max(0.02, noiseFloor + 0.015);
        if (rms > threshold) { if (rms > rmsMax) rmsMax = rms; silenceStart = Date.now(); }
        else if (Date.now() - silenceStart > LONG_RECORD_SILENCE_MS && audioRecorder && audioRecorder.state === 'recording') {
          audioRecorder.stop();
          setTimeout(() => { if (isManualTranslating) startNewChunk(); }, 200);
        }
        if (Date.now() - chunkStartTime > LONG_RECORD_CHUNK_MS && audioRecorder && audioRecorder.state === 'recording') {
          audioRecorder.stop();
          setTimeout(() => { if (isManualTranslating) startNewChunk(); }, 200);
        }
      } catch (e) {}
    }, 200);

    isManualTranslating = true;
    updateTranslatorUI();
    setStatus('🎤 جاري التسجيل... اضغط للإيقاف والترجمة');
    window._vadInterval = vadInterval;
    window._rawTrack = rawTrack;
    window._calibrationInterval = calibrationInterval;
  } catch (e) {
    addMsg("⚠️ تعذر الوصول للمايك.", 'bot');
  }
}

function stopManualTranslation() {
  if (!isManualTranslating) return;
  isManualTranslating = false;
  if (window._vadInterval) { clearInterval(window._vadInterval); window._vadInterval = null; }
  if (window._calibrationInterval) { clearInterval(window._calibrationInterval); window._calibrationInterval = null; }
  if (window._rawTrack) { try { window._rawTrack.stop(); } catch (e) {} window._rawTrack = null; }
  if (audioRecorder && audioRecorder.state === 'recording') audioRecorder.stop();
  try { if (translationAudioCtx && translationAudioCtx.state !== 'closed') translationAudioCtx.close(); } catch (e) {}
  translationAudioCtx = null;
  updateTranslatorUI();
}

}

async function ask(text, sourceLang, targetLang, speaker, isImage = false) {
  if (isSending) return;
  setBusy(true); setStatus('Processing...');
  const messages = [{ role: 'system', content: buildSystemPrompt(targetLang, sourceLang, isImage) }];
  let finalText = text || '';
  if (attachedFileText) finalText += "\n\nFile Content:\n" + attachedFileText;
  let userContent = finalText;
  if (attachedImageBase64) {
    userContent = [
      { type: "text", text: finalText || "Describe this image in detail." },
      { type: "image_url", image_url: { url: attachedImageBase64 } }
    ];
  }
  messages.push({ role: 'user', content: userContent });

  try {
    const res = await fetchWithTimeout(SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, is_vision: attachedImageBase64 != null, is_translation: isTranslatorMode, session_id: SESSION_ID })
    }, REQUEST_TIMEOUT_MS);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);

      const parts = replyText.split('|||');

      addMsg(`↳ ${parts[1].trim()}`, 'bot', targetLang);

      if (isTranslatorMode && replyText === text) replyText = "⚠️ Translation failed. Please try again.";
      addMsg(replyText, isTranslatorMode ? (speaker === 'A' ? 'user-b' : 'user-a') : 'user-b', targetLang || 'AUTO', isImage ? attachedImageBase64 : null);
      resetStatus();
      speak(replyText, targetLang || langA.value);
    }

async function ensureMyCode() {
  const uref = db.collection('users').doc(currentUser.uid);
  const snap = await uref.get();
  if (snap.exists && snap.data().code) { myFriendCode = snap.data().code; return; }
  for (let i = 0; i < 5; i++) {
    const code = genFriendCode(); const cref = db.collection('codes').doc(code);
    try {
      await db.runTransaction(async tx => {
        const c = await tx.get(cref);
        if (c.exists) throw new Error('taken');
        tx.set(cref, { uid: currentUser.uid, name: myDisplayName() });
        tx.set(uref, { code, name: myDisplayName() }, { merge: true });
      });
      myFriendCode = code; return;
    } catch (e) { if (e.message !== 'taken') throw e; }
  }
  throw new Error('Could not allocate a friend code');
}

    } catch (e) { friendsInitPromise = null; throw e; }
  })();
  friendsInitPromise.catch(() => {});
  return friendsInitPromise;
}

function teardownFriends() {
  friendsUnsubs.forEach(u => { try { u(); } catch (e) {} });
  friendsUnsubs = []; friendsReady = false; friendsInitPromise = null; myFriendCode = null;
  if (outgoingCallUnsub) { try { outgoingCallUnsub(); } catch (e) {} outgoingCallUnsub = null; }
  if (chatUnsub) { try { chatUnsub(); } catch (e) {} chatUnsub = null; }
  chatsByFriend = {}; chatOpenWith = null; chatMsgsCache = [];
  $('chatOverlay').style.display = 'none';
  friendsCache = []; requestsCache = []; renderFriendsUI();
  hideIncomingCall();
}

function playRingtone() {
  if (ringtoneAudio) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const ringOnce = () => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(440, ctx.currentTime);
      o.frequency.setValueAtTime(480, ctx.currentTime + 0.45);
      g.gain.setValueAtTime(0.28, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.95);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.95);
    };
    ringOnce();
    ringtoneAudio = { ctx };
    window._ringInterval = setInterval(() => { try { ringOnce(); } catch (e) {} }, 2000);
  } catch (e) {}
}
function stopRingtone() {
  if (window._ringInterval) { clearInterval(window._ringInterval); window._ringInterval = null; }
  if (ringtoneAudio) { try { ringtoneAudio.ctx.close(); } catch (e) {} ringtoneAudio = null; }
}

function showIncomingCall(call) {
  if (currentIncomingCall) return;
  currentIncomingCall = call;
  $('callIcon').textContent = call.call_type === 'video' ? '📹' : '📞';
  $('callName').textContent = call.from_name || 'Unknown';
  $('callStatus').textContent = call.call_type === 'video' ? frT('incomingVideo') : frT('incomingVoice');
  callOverlay.classList.add('active');

}
function hideIncomingCall() {
  currentIncomingCall = null;
  callOverlay.classList.remove('active');

}

async function acceptCall() {

async function callFriend(friend, withVideo = false) {
  if (!db || !currentUser || !friend) return;
  try {
    setFrMsg(frT('ringing') + (friend.name || '') + '...');
    const res = await fetch(ROOM_CREATE_URL, { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const roomCode = data.code;

    const callRef = await db.collection('calls').add({
      from_uid: currentUser.uid,
      from_name: myDisplayName(),
      to_uid: friend.uid,
      room_code: roomCode,
      call_type: withVideo ? 'video' : 'voice',
      status: 'ringing',
      createdAt: Date.now()
    });
    outgoingCallDocId = callRef.id;

    if (outgoingCallUnsub) { try { outgoingCallUnsub(); } catch (e) {} }
    outgoingCallUnsub = callRef.onSnapshot(snap => {
      if (!snap.exists) return;
      const d = snap.data();
      if (d.status === 'rejected') {
        setFrMsg('❌ تم رفض المكالمة من ' + (friend.name || ''));
        if (appMode === 'remote') cleanupAll();
        if (outgoingCallUnsub) { outgoingCallUnsub(); outgoingCallUnsub = null; }
      }
    });

    $('remoteJoinOverlay').style.display = 'none';
    $('chatOverlay').style.display = 'none';
    setFrMsg('');
    await connectRemote(roomCode, myDisplayName(), myLang, true, withVideo, friend.name || 'Friend');
    addMsg(`📞 جاري الاتصال بـ ${friend.name}... في انتظار الرد`, 'bot');

    setTimeout(async () => {
      try {
        const s = await callRef.get();
        if (s.exists && s.data().status === 'ringing') {
          await callRef.update({ status: 'cancelled' });
        }
      } catch (e) {}
    }, 35000);
  } catch (e) {
    setFrMsg('⚠️ فشل بدء المكالمة: ' + (e.message || ''));
  }
}

$('callDecline').addEventListener('click', declineCall);

async function sendFriendRequest(raw) {
  const code = (raw || '').trim().toUpperCase(); if (!code) return;
  if (code === myFriendCode) return setFrMsg(frT('self'));
  try {
    const c = await db.collection('codes').doc(code).get();
    if (!c.exists) return setFrMsg(frT('notfound'));
    const to = c.data().uid;
    if (friendsCache.some(f => f.uid === to)) return setFrMsg(frT('already'));
    const incoming = requestsCache.find(r => r.from === to);
    if (incoming) { await acceptRequest(incoming); return; }
    await db.collection('friend_requests').doc(currentUser.uid + '_' + to).set({
      from: currentUser.uid, fromName: myDisplayName(), to, createdAt: Date.now()
    });
    setFrMsg(frT('sent')); $('frAddInput').value = '';
  } catch (e) { setFrMsg(frErrText(e)); }
}
async function acceptRequest(r) {
  try {
    const me = currentUser.uid, other = r.from, now = Date.now();
    const batch = db.batch();
    batch.set(db.collection('users').doc(other).collection('friends').doc(me), { uid: me, name: myDisplayName(), since: now });
    batch.set(db.collection('users').doc(me).collection('friends').doc(other), { uid: other, name: r.fromName || '?', since: now });
    batch.delete(db.collection('friend_requests').doc(r.id));
    await batch.commit();
  } catch (e) { setFrMsg(frErrText(e)); }
}
async function declineRequest(r) { try { await db.collection('friend_requests').doc(r.id).delete(); } catch (e) { setFrMsg(frErrText(e)); } }
async function removeFriend(f) {
  if (!confirm(frT('confirmRemove'))) return;
  try {
    const me = currentUser.uid;
    const batch = db.batch();
    batch.delete(db.collection('users').doc(me).collection('friends').doc(f.uid));
    batch.delete(db.collection('users').doc(f.uid).collection('friends').doc(me));
    await batch.commit();
  } catch (e) { setFrMsg(frErrText(e)); }
}

$('frAddInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendFriendRequest($('frAddInput').value); } });

// ===== TTS & WebSocket =====
async function speak(text, lang) {
  if (!text) return;
  stopAudio();
  const cleaned = cleanTextForTTS(text);
  if (!cleaned) return;
  const myId = ++currentSpeechId;
  isBotTalking = true; setAvatarState(true);

  let retryCount = 0;
  while (retryCount <= 2) {
    try {
      const voice = voiceSelect ? voiceSelect.value : 'woman';
      const res = await fetch(TTS_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: cleaned.slice(0, 4000), lang: lang || 'ar', voice, session_id: SESSION_ID })
      });
      if (!res.ok) throw new Error('tts ' + res.status);
      if (myId !== currentSpeechId) return;
      const blob = await res.blob(); const url = URL.createObjectURL(blob);
      currentAudio = new Audio(url);
      currentAudio.onended = () => { URL.revokeObjectURL(url); isBotTalking = false; setAvatarState(false); document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing')); };
      currentAudio.onerror = () => { URL.revokeObjectURL(url); isBotTalking = false; setAvatarState(false); document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing')); };
      await currentAudio.play().catch(() => {});
      return;
    } catch (e) {
      retryCount++;
      if (retryCount > 2) break;
      await new Promise(r => setTimeout(r, 500));
    }
  }
  if (myId !== currentSpeechId) return;
  if ('speechSynthesis' in window) {
    try {
      const utt = new SpeechSynthesisUtterance(cleaned);
      utt.lang = localeFor(lang || 'ar');
      utt.onend = () => { isBotTalking = false; setAvatarState(false); };
      utt.onerror = () => { isBotTalking = false; setAvatarState(false); };
      speechSynthesis.speak(utt);
    } catch (e) { isBotTalking = false; setAvatarState(false); }
  } else { isBotTalking = false; setAvatarState(false); }
}
function stopAudio() {
  currentSpeechId++;
  if (currentAudio) { try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {} currentAudio = null; }
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
  isBotTalking = false; setAvatarState(false);
  document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing'));
}
function setAvatarState(talking) {
  try {
    if (avatarVideo && avatarVideo.style.display === 'block' && avatarVideo.src) {
      if (talking) avatarVideo.play().catch(() => {});
      else { avatarVideo.pause(); try { avatarVideo.currentTime = 0; } catch (e) {} }
    }
  } catch (e) {}
}

function startPing() {
  stopPing();
  pingInterval = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) { try { ws.send(JSON.stringify({ type: 'ping' })); } catch (e) {} }
  }, 20000);
}
function stopPing() { if (pingInterval) { clearInterval(pingInterval); pingInterval = null; } }
function connectWS(roomCode) {
  try { if (ws) ws.close(); } catch (e) {}
  ws = new WebSocket(WS_BASE + '/ws/' + String(roomCode).toUpperCase());
  ws.onopen = () => { try { ws.send(JSON.stringify({ type: 'join', name: myName, lang: myLang })); } catch (e) {} startPing(); };
  ws.onmessage = (evt) => { try { handleWSMessage(JSON.parse(evt.data)); } catch (e) {} };
  ws.onerror = () => setStatus('⚠️ خطأ في الاتصال');
  ws.onclose = () => {
    stopPing();
    if (shouldReconnect && hasJoinedOnce && currentRoomCode) {
      if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
      wsReconnectTimer = setTimeout(() => { if (shouldReconnect && currentRoomCode) connectWS(currentRoomCode); }, 3000);
    }
  };
}
function sendRemoteMessage(text) {
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  try { ws.send(JSON.stringify({ type: 'message', text, translate: !!isTranslatorMode })); } catch (e) {}
}

async function handleWSMessage(msg) {
  if (!msg || !msg.type) return;
  const type = msg.type;
  if (type === 'pong') return;
  if (type === 'error') { addMsg('⚠️ ' + (msg.message || 'خطأ'), 'bot'); return; }
  if (type === 'joined') {
    hasJoinedOnce = true;
    const n = (msg.users || []).length;
    if (onlineCount) onlineCount.textContent = n + '/2';
    setStatus('✅ متصل');
    if (appMode === 'remote' && myIsCaller && !_rtcInitiated && n > 1) {
      _rtcInitiated = true; setTimeout(() => startVideoCall(true, callWithVideo), 300);
    }
    return;
  }
  if (type === 'user_joined') {
    if (onlineCount) onlineCount.textContent = '2/2';
    addMsg('📞 ' + (msg.name || 'صديقك') + ' انضم للمكالمة', 'bot');
    if (appMode === 'remote' && myIsCaller && !_rtcInitiated) {
      _rtcInitiated = true; setTimeout(() => startVideoCall(true, callWithVideo), 300);
    }
    return;
  }
  if (type === 'user_left') {
    if (onlineCount) onlineCount.textContent = '1/2';
    addMsg('👋 ' + (msg.name || 'صديقك') + ' أنهى المكالمة', 'bot');
    return;
  }
  if (type === 'translated') {
    if (msg.is_mine) return;
    addMsg((msg.from_name || 'صديق') + ': ' + (msg.original || ''), 'user-b', msg.from_lang || 'en');
    if (isTranslatorMode && msg.translated && msg.translated !== msg.original) {
      addMsg('↳ ' + msg.translated, 'bot', msg.target_lang || myLang);
      if (!msg.no_tts) speak(msg.translated, msg.target_lang || myLang);
    }
    return;
  }
  if (type === 'chat_media') {
    addMsg((msg.from_name || 'صديق') + ' 📷:', 'user-b', msg.from_lang || 'en', msg.data);
    return;
  }
  if (type === 'rtc-offer') { await handleRtcOffer(msg.offer); return; }
  if (type === 'rtc-answer') { await handleRtcAnswer(msg.answer); return; }
  if (type === 'rtc-ice') { await handleRtcIce(msg.candidate); return; }
}
async function handleRtcOffer(offer) {
  try {
    if (!pc) await startVideoCall(false, callWithVideo);
    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'rtc-answer', answer }));
    for (const c of iceCandidatesQueue) { try { await pc.addIceCandidate(c); } catch (e) {} }
    iceCandidatesQueue = [];
  } catch (e) { console.warn('rtc offer', e); }
}
async function handleRtcAnswer(answer) {
  try {
    if (!pc || pc.signalingState !== 'have-local-offer') return;
    await pc.setRemoteDescription(answer);
    for (const c of iceCandidatesQueue) { try { await pc.addIceCandidate(c); } catch (e) {} }
    iceCandidatesQueue = [];
  } catch (e) { console.warn('rtc answer', e); }
}
async function handleRtcIce(candidate) {
  if (!candidate) return;
  if (!pc || !pc.remoteDescription) { iceCandidatesQueue.push(candidate); return; }
  try { await pc.addIceCandidate(candidate); } catch (e) {}
}

async function connectRemote(roomCode, participantName, lang, isCaller, withVideo = true, peerName = 'Call') {
  myName = participantName; myLang = lang;
  currentRoomCode = String(roomCode).toUpperCase();
  myIsCaller = !!isCaller; hasJoinedOnce = false; shouldReconnect = true;
  _rtcInitiated = false; iceCandidatesQueue = [];
  callWithVideo = !!withVideo;
  isTranslatorMode = chTranslateEnabled;
  roomCodeLabel.textContent = peerName;
  setModeUI('remote');
  setStatus('⏳ جاري الاتصال...');
  connectWS(currentRoomCode);
}

// ===== 1-to-1 Messenger Chat =====
const CHAT_LANGS = [['ar','🇹🇳 العربية'],['fr','🇫🇷 Français'],['en','🇬🇧 English'],['de','🇩🇪 Deutsch'],['tr','🇹🇷 Türkçe'],['it','🇮🇹 Italiano'],['zh','🇨🇳 中文'],['ru','🇷🇺 Русский'],['es','🇪🇸 Español'],['pt','🇵🇹 Português'],['nl','🇳🇱 Nederlands'],['no','🇳🇴 Norsk']];
function populateChLang() {
  const el = $('chLang'); if (!el || _chLangPopulated) return;
  el.innerHTML = '';
  CHAT_LANGS.forEach(([v, label]) => { const o = document.createElement('option'); o.value = v; o.textContent = label; el.appendChild(o); });
  _chLangPopulated = true;
}

function updateChTransUI() {
  const btn = $('chTransToggle');
  if (!btn) return;
  btn.textContent = chTranslateEnabled ? '🌐 ON' : '🌐 OFF';
  btn.classList.toggle('active', chTranslateEnabled);
  $('chLang').style.display = chTranslateEnabled ? 'inline-block' : 'none';
  $('chSubStatus').textContent = chTranslateEnabled ? 'الترجمة الفورية مفعلة 🌐' : 'دردشة مباشرة بنفس اللغة 💬';
}
$('chTransToggle').addEventListener('click', () => {
  chTranslateEnabled = !chTranslateEnabled;
  updateChTransUI();
});

async function openChat(friend) {
  if (!db || !currentUser || !friend) return;
  chatOpenWith = friend; chatMsgsCache = []; populateChLang();
  $('chName').textContent = friend.name || '?';
  $('chLang').value = myLang || 'ar';
  updateChTransUI();
  $('chMsgs').innerHTML = ''; $('chStatus').textContent = 'جارٍ التحميل...';
  $('chatOverlay').style.display = 'flex';
  const chatId = [currentUser.uid, friend.uid].sort().join('_');
  if (chatUnsub) { try { chatUnsub(); } catch (e) {} }
  chatUnsub = db.collection('chats').doc(chatId).collection('messages').orderBy('createdAt', 'asc').limit(100)
    .onSnapshot(snap => {
      chatMsgsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderChatMsgs(); $('chStatus').textContent = '';
      try { db.collection('chats').doc(chatId).set({ ['unread_' + currentUser.uid]: 0 }, { merge: true }); } catch (e) {}
    }, err => { $('chStatus').textContent = '⚠️ ' + (err.message || ''); });
}

function renderChatMsgs() {
  const box = $('chMsgs'); box.innerHTML = '';
  chatMsgsCache.forEach(m => {
    const mine = m.from === currentUser.uid;
    const div = document.createElement('div');
    div.className = 'ch-bubble ' + (mine ? 'mine' : 'theirs');
    div.setAttribute('dir', 'auto');
    let html = escapeHtml(m.text || '');
    if (m.translated && m.translated !== m.text) {
      html += '<br><span style="font-size:12px; opacity:0.85; font-style:italic; margin-top:4px; display:block; color:#a7f3d0;">↳ ' + escapeHtml(m.translated) + '</span>';
    }
    div.innerHTML = html;
    div.addEventListener('click', () => {
      const toSpeak = (m.translated && m.translated !== m.text) ? m.translated : m.text;
      const spLang = (m.translated && m.translated !== m.text) ? (m.targetLang || myLang) : (m.fromLang || myLang);
      speak(toSpeak, spLang);
    });
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

async function sendChatMessage(overrideText = null) {
  const text = (overrideText !== null ? overrideText : ($('chInput').value || '')).trim();
  if (!text || !chatOpenWith || !db || !currentUser) return;
  const targetLang = $('chLang').value || 'en';
  if (overrideText === null) $('chInput').value = '';
  let translated = '';

  if (chTranslateEnabled && targetLang !== myLang) {
    $('chStatus').textContent = '⏳ جاري الترجمة...';
    try {
      const res = await fetch(SERVER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [
            { role: 'system', content: 'Translate from ' + langNameFor(myLang) + ' to ' + langNameFor(targetLang) + '. Output ONLY the translation.' },
            { role: 'user', content: text }
          ],
          is_translation: true
        })
      });
      const data = await res.json();
      translated = (data.reply || '').trim();
    } catch (e) { translated = ''; }
  }

  try {
    const chatId = [currentUser.uid, chatOpenWith.uid].sort().join('_');
    const now = Date.now();
    await db.collection('chats').doc(chatId).collection('messages').add({
      from: currentUser.uid, fromName: myDisplayName(), text, translated,
      fromLang: myLang, targetLang, createdAt: now
    });
    await db.collection('chats').doc(chatId).set({
      lastMessage: text, lastAt: now,
      ['unread_' + chatOpenWith.uid]: firebase.firestore.FieldValue.increment(1)
    }, { merge: true });
    $('chStatus').textContent = '';
  } catch (e) { $('chStatus').textContent = '⚠️ فشل الإرسال: ' + (e.message || ''); }
}

// Voice note to text/translation inside 1-to-1 Messenger chat
$('chMicBtn').addEventListener('click', async () => {
  if (chRecorder && chRecorder.state === 'recording') {
    chRecorder.stop();
    $('chMicBtn').classList.remove('recording');
    return;
  }
  try {
    chStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    chRecorder = new MediaRecorder(chStream, { mimeType });
    chChunks = [];
    const startTs = Date.now();
    chRecorder.ondataavailable = e => { if (e.data.size > 0) chChunks.push(e.data); };
    chRecorder.onstop = async () => {
      if (chStream) chStream.getTracks().forEach(t => t.stop());
      const dur = Date.now() - startTs;
      if (dur < 700 || !chChunks.length) return;
      $('chStatus').textContent = '⏳ جاري تحويل الصوت...';
      const fd = new FormData();
      fd.append('file', new Blob(chChunks, { type: mimeType }), 'audio.webm');
      fd.append('language', myLang);
      fd.append('target_lang', myLang);
      fd.append('duration_ms', String(dur));
      try {
        const res = await fetch(TRANSCRIBE_URL, { method: 'POST', body: fd });
        if (res.ok) {
          const data = await res.json();
          if (data.original && data.original.length > 1) {
            await sendChatMessage(data.original);
            return;
          }
        }
      } catch (e) {}
      $('chStatus').textContent = '';
    };
    chRecorder.start(500);
    $('chMicBtn').classList.add('recording');
    $('chStatus').textContent = '🎤 تحدث الآن... اضغط للإرسال';
  } catch (e) {
    $('chStatus').textContent = '⚠️ تعذر فتح المايك';
  }
});

$('chVoiceCallBtn').addEventListener('click', () => { if (chatOpenWith) callFriend(chatOpenWith, false); });
$('chVideoCallBtn').addEventListener('click', () => { if (chatOpenWith) callFriend(chatOpenWith, true); });

if ($('chBack')) $('chBack').addEventListener('click', () => {
  $('chatOverlay').style.display = 'none';
  if (chatUnsub) { try { chatUnsub(); } catch (e) {} chatUnsub = null; }
  chatOpenWith = null;
});
if ($('chSend')) $('chSend').addEventListener('click', () => sendChatMessage());
if ($('chInput')) $('chInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
});
