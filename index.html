<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat-Core - Translator</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: Tahoma, sans-serif; background: #0ea5e9; color: #fff; display: flex; flex-direction: column; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); height: 100dvh; transition: opacity 0.3s; }
  
  /* Auth Screen Styles */
  #authOverlay { position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999999; padding: 20px; overflow-y: auto; }
  .auth-lang-switch { position: absolute; top: 20px; right: 20px; display: flex; gap: 5px; }
  .lang-btn { background: #334155; border: 1px solid #475569; color: #fff; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
  .lang-btn.active { background: #0ea5e9; border-color: #0ea5e9; }
  
  .auth-box { background: #1e293b; padding: 30px; border-radius: 15px; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; margin: auto; }
  .auth-box h2 { color: #0ea5e9; margin-bottom: 20px; font-size: 24px; }
  .auth-input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; font-size: 14px; }
  .auth-input:focus { border-color: #0ea5e9; }
  .auth-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #10b981; color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; font-size: 14px;}
  .auth-btn:hover { background: #059669; }
  .auth-btn.outline { background: transparent; border: 1px solid #6366f1; color: #6366f1; }
  .auth-btn.outline:hover { background: #6366f1; color: #fff; }
  .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #334155; color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; font-size: 14px; }
  .social-btn:hover { background: #475569; }
  #authError { color: #ef4444; font-size: 12px; margin-bottom: 10px; min-height: 18px; word-wrap: break-word; }
  .divider { display: flex; align-items: center; margin: 15px 0; color: #64748b; font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #334155; margin: 0 10px; }

  /* App Layout & Elements */
  .top-header { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 10px; flex-shrink: 0; position: relative; z-index: 10001; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 6px 12px; border-radius: 10px; width: 95%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .user-section { display: flex; align-items: center; gap: 4px; }
  .lang-select { padding: 0 2px; border-radius: 4px; background: #0f172a; color: #ffffff; border: 1px solid #334155; font-size: 9px; outline: none; width: 75px !important; height: 24px; text-align: center; }
  .mic-btn { width: 30px; height: 30px; border-radius: 50%; border: none; color: #fff; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
  .mic-btn.blue { background: #6366f1; } .mic-btn.green { background: #10b981; } .mic-btn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; }
  .mic-btn:disabled { background: #475569 !important; opacity: 0.5; }
  @keyframes pulse { 50% { transform: scale(1.1); } }
  
  #avatar-wrap { width: 100px; height: 100px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all 0.3s; }
  #avatar-container { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; background: #1e293b; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0,0,0,0.3); z-index: 1; transition: all 0.3s; }
  #avatar-logo, #avatar-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #avatar-video { display: none; }
  #avatar-wrap.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: #000; }
  #avatar-wrap.fullscreen #avatar-container { width: 100vw; height: 100vh; border-radius: 0 !important; background: transparent; box-shadow: none; }
  #avatar-wrap.fullscreen #avatar-logo, #avatar-wrap.fullscreen #avatar-video { object-fit: contain; width: 100vw; height: 100vh; }
  #avatar-wrap.fullscreen #closeFullscreen { display: flex; }
  #removeAvatarBtn { display: none; position: absolute; top: 50%; right: -15px; transform: translateY(-50%); width: 14px; height: 14px; border-radius: 50%; background: #000; border: none; cursor: pointer; z-index: 10; }
  
  /* Hide Avatar in Remote/Meeting modes */
  body.remote-mode #avatar-wrap, body.meeting-mode #avatar-wrap { display: none !important; }

  #closeFullscreen, #closeVideoFullscreen { display: none; position: fixed; background: #e57373; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 10000; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .inner-white-dot { width: 14px; height: 14px; background: #fff; border-radius: 50%; }
  #closeFullscreen { top: 80px; right: 20px; } #closeVideoFullscreen { top: 20px; right: 20px; }
  #videoContainer { display: none; position: relative; width: 100%; max-width: 400px; height: 200px; margin: 0 auto 10px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer; transition: all 0.3s; z-index: 500; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  #localVideo { position: absolute; bottom: 10px; right: 10px; width: 80px; height: 100px; object-fit: cover; border-radius: 8px; border: 2px solid #fff; background: #1e293b; z-index: 2; pointer-events: auto; }
  #videoStatus { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 6px; font-size: 10px; color: #10b981; z-index: 2; pointer-events: none; }
  body.video-maximized #videoContainer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; max-width: 100vw; z-index: 99999; margin: 0; border-radius: 0; }
  body.video-maximized #remoteVideo { object-fit: cover; }
  body.video-maximized #localVideo { width: 90px; height: 130px; bottom: 20px; right: 20px; border-radius: 12px; }
  body.video-maximized #closeVideoFullscreen { display: flex; }
  body.video-maximized #topHeader, body.video-maximized #extraControls, body.video-maximized #chatContainer, body.video-maximized #inputRow, body.video-maximized #status, body.video-maximized #remoteBar { display: none !important; }
  
  #meetingGridContainer { display: none; position: relative; width: 100%; flex: 1; background: #0f172a; border-radius: 12px; padding: 10px; overflow-y: auto; margin-bottom: 10px; }
  #videoGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-content: start; }
  .participant-box { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; border: 2px solid #334155; }
  .participant-box video { width: 100%; height: 100%; object-fit: cover; }
  .participant-name { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; font-size: 10px; color: #fff; z-index: 2; }
  body.meeting-mode .chat-container { max-height: 35vh; }
  
  #floatingMicBtn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 50%; background: #10b981; color: white; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100000; border: none; cursor: pointer; transition: all 0.3s; }
  #floatingMicBtn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; }
  body.video-maximized #floatingMicBtn { display: flex; }
  
  .chat-container { position: relative; flex: 1; display: flex; flex-direction: column; margin-bottom: 10px; min-height: 100px; }
  #chat { flex: 1; background: #1e293b; border-radius: 12px; padding: 12px; overflow-y: auto; }
  .msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; max-width: 85%; line-height: 1.6; word-wrap: break-word; font-size: 15px; transition: opacity 0.2s; cursor: pointer; }
  .msg:active { opacity: 0.7; }
  .user-a { background: #4f46e5; margin-right: auto; border-bottom-right-radius: 4px; } 
  .user-b { background: #10b981; margin-left: auto; border-bottom-left-radius: 4px; color: #000;} 
  .bot { background: #334155; margin: 0 auto 8px auto; text-align: center; font-style: italic; font-size: 13px; cursor: default; }
  .lang-tag { display: inline-block; font-size: 10px; padding: 2px 6px; background: rgba(255,255,255,0.15); border-radius: 6px; margin-right: 6px; opacity: 0.8; font-weight: bold; }
  
  #clearBtn { position: absolute; bottom: 2px; left: 10px; width: 30px; height: 30px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #clearBtn svg { fill: #2d3748; width: 16px; height: 16px; }
  
  #imagePreviewContainer { display: none; position: absolute; bottom: 50px; right: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 5px; align-items: center; gap: 8px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  #imagePreview { width: 45px; height: 45px; border-radius: 4px; object-fit: cover; }
  #cancelImageBtn { background: #dc2626; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  
  .row { display: flex; gap: 6px; align-items: center; flex-shrink: 0; position: relative; }
  input[type=text] { flex: 1; padding: 10px; padding-left: 35px; border-radius: 24px; border: 1px solid #1e293b; background: #ffffff; color: #000; font-size: 14px; order: 3; }
  
  button.btn { padding: 0; border: none; border-radius: 50%; font-weight: bold; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s; }
  #musicBtn { background: #ffffff; color: #000000; order: 1; font-size: 16px; }
  #mediaBtn { background: #1d4ed8; color: #ffffff; order: 2; font-size: 22px; width: 32px; height: 32px; padding-bottom: 2px; font-weight: normal; }
  #remoteMicBtn { background: #10b981; color: #fff; order: 2; width: 42px; height: 42px; border-radius: 50%; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4); display: none; transition: all 0.3s ease; }
  #remoteMicBtn.recording { background: #ef4444 !important; box-shadow: 0 0 15px rgba(239, 68, 68, 0.8); animation: pulse 1s infinite; }
  #toggleCamBtn { background: #475569; color: #fff; order: 2; width: 42px; height: 42px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); display: none; border: none; cursor: pointer; transition: all 0.3s ease; }
  #toggleCamBtn.off { background: #ef4444; }
  #sendBtn { background: #1d4ed8; order: 4; color: #fff; }
  #sendBtn svg { width: 20px; height: 20px; fill: white; transform: translateX(-2px) translateY(2px); }
  
  #stopAudioBtn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; outline: none; }
  #stopAudioBtn svg { fill: #2d3748; width: 14px; height: 14px; }
  #status { text-align: center; font-size: 12px; color: #0f172a; margin-top: 6px; min-height: 18px; font-weight: bold; }
  
  .extra-controls { display: flex; gap: 6px; margin-bottom: 8px; justify-content: center; flex-wrap: wrap; width: 100%; padding: 0 5px; align-items: center; }
  .extra-controls button, .extra-controls select { padding: 6px 12px; border-radius: 15px; border: none; background: #475569; color: #fff; font-size: 10px; cursor: pointer; outline: none; white-space: nowrap; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; }
  
  /* زر الترجمة الجديد */
  .toggle-btn { background: #ef4444 !important; color: white !important; transition: 0.3s; font-weight: bold; }
  .toggle-btn.active { background: #10b981 !important; }

  .btn-back { background: #e57373 !important; color: white !important; }
  
  body.remote-mode #extraControls, body.meeting-mode #extraControls { justify-content: space-between; padding: 0 10px; }
  body.remote-mode #extraControls > *, body.meeting-mode #extraControls > * { flex: 1 1 30%; }
  
  #actionMenu { display: none; position: fixed; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px; z-index: 2000; flex-direction: column; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .action-btn { padding: 8px 12px; border-radius: 8px; border: none; background: #0f172a; color: #fff; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  
  #musicMenu { display: none; position: fixed; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; z-index: 2000; width: 200px; max-height: 250px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  #musicMenu h4 { font-size: 12px; margin-bottom: 8px; text-align: center; color: #94a3b8; }
  .music-item { padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 4px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; }
  .music-item:hover { background: #334155; } .music-item.active { background: #0ea5e9; color: #fff; font-weight: bold; } 
  .music-item.add-more, .music-item.stop-btn, .music-item.pause-btn { text-align: center; font-weight: bold; justify-content: center; }
  .music-item.add-more { background: #22c55e; } .music-item.stop-btn { background: #991b1b; margin-bottom: 6px; } .music-item.pause-btn { background: #475569; margin-bottom: 6px; }
  .song-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; direction: ltr; }
  .delete-song { color: #ef4444; font-weight: bold; padding: 0 6px; font-size: 14px; }
  
  #remoteBar { display: none; background: #1e293b; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; justify-content: space-between; align-items: center; color: #fff; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  #remoteBar .room-info { display: flex; align-items: center; gap: 8px; justify-content: center; flex: 1; }
  #remoteBar strong { color: #fbbf24; letter-spacing: 2px; font-size: 14px; }
  #copyRoomBtn { background: #6366f1; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; }
  
  .overlay { position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; color: #fff; padding: 20px; z-index: 99999; overflow-y: auto; }
  .overlay h1 { font-size: 28px; color: #0ea5e9; margin-bottom: 10px; }
  .overlay h2 { font-size: 20px; color: #10b981; margin-bottom: 5px; }
  .overlay .mode-btn { padding: 15px 30px; font-size: 16px; border-radius: 12px; border: none; color: #fff; cursor: pointer; width: 260px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #btnLocal { background: #6366f1; } #btnRemote { background: #10b981; } #btnMeeting { background: #1d4ed8; }
  #btnMeeting .plus-icon { font-size: 24px; font-weight: bold; margin-bottom: 3px; }
  .join-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .join-form input, .join-form select { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; width: 100%; outline: none; }
  .join-form input:focus { border-color: #0ea5e9; }
  .join-form button { padding: 12px; border-radius: 8px; border: none; color: #fff; cursor: pointer; font-weight: bold; font-size: 14px; }
  #createRoomBtn, #createMeetingBtn { background: #10b981; }
  #joinRoomBtn, #joinMeetingBtn { background: #6366f1; }
  #joinRow { display: flex; gap: 8px; }
  #joinCodeInput, #joinMeetingCodeInput { flex: 1; text-transform: uppercase; text-align: center; letter-spacing: 2px; }
  #backToLandingBtn, #backToLandingFromMeetBtn { background: transparent; border: none; color: #94a3b8; cursor: pointer; margin-top: 5px; font-size: 13px; text-decoration: underline; }
</style>
</head>
<body>

<!-- Auth Screen Overlay -->
<div id="authOverlay">
  <div class="auth-lang-switch">
    <button class="lang-btn active" onclick="changeAuthLang('ar')">AR</button>
    <button class="lang-btn" onclick="changeAuthLang('fr')">FR</button>
    <button class="lang-btn" onclick="changeAuthLang('en')">EN</button>
  </div>
  
  <div class="auth-box">
    <h1 style="color:#0ea5e9; margin-bottom:10px;">🌐 Chat-Core</h1>
    <h2 id="authTitle">تسجيل الدخول</h2>
    <div id="authError"></div>
    
    <input type="email" id="authEmail" class="auth-input" placeholder="البريد الإلكتروني">
    <input type="password" id="authPassword" class="auth-input" placeholder="كلمة المرور">
    
    <button id="authSubmitBtn" class="auth-btn" onclick="handleEmailAuth()">دخول</button>
    <button id="authToggleBtn" class="auth-btn outline" onclick="toggleAuthMode()">إنشاء حساب جديد</button>
    
    <div class="divider" id="authDivider">أو</div>
    
    <button class="social-btn" onclick="loginWithGoogle()" id="btnAuthGoogle">🌐 Google</button>
    <button class="social-btn" onclick="loginWithGithub()" id="btnAuthGithub">🐙 GitHub</button>
    <button class="social-btn" onclick="loginWithTwitter()" id="btnAuthTwitter">🐦 X</button>
  </div>
</div>

<button id="floatingMicBtn" title="Talk">
  <svg viewBox="0 0 24 24" width="30" height="30" fill="white"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
</button>

<!-- Landing Page (Option Selection) -->
<div class="overlay" id="landingOverlay" style="display:none;">
  <h1>🌐 Chat-Core</h1>
  <p style="color:#94a3b8; font-size:13px; margin-bottom:10px;">اختر وضع التشغيل</p>
  <button class="mode-btn" id="btnLocal">🌐 Face-to-Face</button>
  <button class="mode-btn" id="btnRemote">💬 Remote Mode</button>
  <button class="mode-btn" id="btnMeeting"><span class="plus-icon">+</span> Meeting Room</button>
  
  <button class="mode-btn" id="btnFriends" style="background:#f59e0b; position:relative;">👥 <span id="btnFriendsLabel">الأصدقاء</span><span id="friendsBadge" style="display:none; position:absolute; top:-6px; right:-6px; min-width:22px; height:22px; border-radius:11px; background:#ef4444; font-size:12px; line-height:22px; text-align:center; padding:0 5px;">0</span></button>

  <button class="mode-btn" id="btnLogout" style="background: #ef4444; margin-top: 20px;">🚪 تسجيل الخروج</button>
</div>

<!-- Friends Overlay -->
<div class="overlay" id="friendsOverlay" style="display:none;">
  <h2>👥 <span id="frTitle">الأصدقاء</span></h2>
  <div class="join-form" style="max-width:340px;">
    <div style="text-align:center; font-size:12px; color:#94a3b8;" id="frMyCodeLabel">كود الصداقة الخاص بك</div>
    <div style="display:flex; gap:8px; align-items:center; justify-content:center;">
      <strong id="frMyCode" style="color:#fbbf24; letter-spacing:3px; font-size:18px;">--------</strong>
      <button id="frCopyCode" style="background:#6366f1; padding:6px 10px; font-size:11px;">📋</button>
    </div>
    <div id="joinRowFr" style="display:flex; gap:8px;">
      <input type="text" id="frAddInput" placeholder="كود صديق" maxlength="8" style="flex:1; text-transform:uppercase; text-align:center; letter-spacing:2px;">
      <button id="frAddBtn" style="background:#10b981;">➕</button>
    </div>
    <div id="frMsg" style="min-height:16px; font-size:12px; text-align:center; color:#fbbf24;"></div>
    <div id="frRequestsBox" style="display:none;">
      <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;" id="frReqTitle">طلبات الصداقة</div>
      <div id="frRequests" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
    <div style="font-size:12px; color:#94a3b8;" id="frListTitle">قائمة الأصدقاء</div>
    <div id="frList" style="display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;"></div>
    <button id="frBackBtn" style="background:transparent; color:#94a3b8; text-decoration:underline; font-weight:normal;">← رجوع</button>
  </div>
</div>

<!-- Friend chat overlay -->
<div class="overlay" id="chatOverlay" style="display:none; justify-content:flex-start; gap:8px; padding:10px;">
  <div style="width:100%; max-width:420px; display:flex; align-items:center; gap:8px; flex-shrink:0;">
    <button id="chBack" style="background:#475569; color:#fff; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:bold;">←</button>
    <strong id="chName" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px;"></strong>

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function addMsg(text, className, lang, imageBase64 = null) {
  const div = document.createElement('div');
  div.className = 'msg ' + className;
  div.setAttribute('dir', 'auto');
  
  const displayLang = lang ? String(lang).toUpperCase() : 'AUTO';
  if (displayLang !== 'AUTO' || className === 'user-b' || className === 'user-a') {
    const tag = document.createElement('span'); tag.className = 'lang-tag'; tag.textContent = displayLang;
    div.appendChild(tag);
  }
  
  if (imageBase64) {
      const img = document.createElement('img');
      img.src = imageBase64; img.style.maxWidth = '150px'; img.style.borderRadius = '8px'; img.style.display = 'block'; img.style.marginTop = '5px'; img.style.border = '2px solid #475569'; img.style.cursor = 'pointer';
      img.onclick = (e) => { e.stopPropagation(); window.open(imageBase64, '_blank'); };
      div.appendChild(img);
  }
  
  if (text) {
      div.insertAdjacentHTML('beforeend', escapeHtml(text).replace(/\n/g, '<br>'));
      div.addEventListener('click', () => {
          if (isSending || appMode === 'remote' || appMode === 'meeting') return;
          div.style.opacity = '0.5'; setTimeout(() => div.style.opacity = '1', 200);
          if (isTranslatorMode) speak(text, lang || langA.value); // النطق فقط إذا كان المترجم يعمل
      });
  }
  
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function unlockAudio() {

}

function fetchWithTimeout(url, options, timeoutMs) {
  const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), timeoutMs);
  return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
}

function cleanTextForTTS(text) {
  if (!text) return "";
  return text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1F018}-\u{1F270}\u{238C}-\u{2454}\u{20D0}-\u{20FF}\u{FE0F}]/gu, '').replace(/[*_#`~|\\\/<>()\[\]{}«»"']/g, ' ').replace(/\s+/g, ' ').trim();
}

function removeRepeatedWords(text) {
  if (!text) return "";
  let cleaned = text;
  cleaned = cleaned.replace(/\b(\w+)(?:\s+\1\b)+/gi, '$1');
  cleaned = cleaned.replace(/\b(\w+)[,.]?\s+\1\b/gi, '$1');
  return cleaned.trim();
}

function compressImage(base64Str, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve) => {
    const img = new Image(); img.src = base64Str;
    img.onload = () => {
      const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
      if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(base64Str);
  });
}

function handleTrackSubscribed(track, publication, participant) {
    if (track.kind === 'video' || track.kind === 'audio') {
        let boxId = 'participant-' + participant.identity;
        let box = document.getElementById(boxId);
        if (!box) {
            box = document.createElement('div'); box.id = boxId; box.className = 'participant-box';
            let nameLabel = document.createElement('div'); nameLabel.className = 'participant-name'; nameLabel.textContent = participant.name || participant.identity;
            box.appendChild(nameLabel); videoGrid.appendChild(box);
        }
        if (track.kind === 'video') {
            const videoEl = track.attach(); videoEl.autoplay = true; videoEl.playsInline = true;
            videoEl.style.width = '100%'; videoEl.style.height = '100%'; videoEl.style.objectFit = 'cover';
            const oldVideo = box.querySelector('video'); if (oldVideo) oldVideo.remove();
            box.insertBefore(videoEl, box.firstChild);
        } else if (track.kind === 'audio') {
            const audioEl = track.attach(); audioEl.autoplay = true; box.appendChild(audioEl);
        }
    }
}

async function connectLiveKit(roomCode, participantName) {
    try {
        setStatus("Loading video engine...");
        await loadLiveKit();
        setStatus("Getting token... (قد يستغرق الخادم حتى دقيقة إن كان نائماً)");
        const controller = new AbortController(); const timeout = setTimeout(() => controller.abort(), 70000);
        const res = await fetch(TOKEN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ room_name: roomCode, participant_name: participantName }), signal: controller.signal });
        clearTimeout(timeout);
        if (!res.ok) { let errMsg = "Token fetch failed"; try { const errData = await res.json(); if (errData.detail) errMsg = errData.detail; } catch(e){} throw new Error(errMsg); }
        const { token, url } = await res.json();

        setStatus("Connecting to LiveKit...");
        if (livekitRoom) { await livekitRoom.disconnect(); livekitRoom = null; }
        videoGrid.innerHTML = '';
        livekitRoom = new LivekitClient.Room();
        
        livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed, handleTrackSubscribed);
        livekitRoom.on(LivekitClient.RoomEvent.TrackUnsubscribed, handleTrackUnsubscribed);
        livekitRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, handleParticipantDisconnected);
        
        livekitRoom.on(LivekitClient.RoomEvent.Connected, async () => {
            setStatus("✅ Connected to Meeting");
            try {
                await livekitRoom.localParticipant.setCameraEnabled(true);
                isCameraOn = true; toggleCamBtn.classList.remove('off');
            } catch (err) {
                console.warn("Camera error:", err);
                isCameraOn = false; toggleCamBtn.classList.add('off');
                addMsg("⚠️ الكاميرا: " + cameraErrorText(err), 'bot');
            }
            try {
                await livekitRoom.localParticipant.setMicrophoneEnabled(true);
            } catch (err) {
                console.warn("Mic error:", err);
                addMsg("⚠️ المايك: " + cameraErrorText(err), 'bot');
            }
            try { await livekitRoom.startAudio(); } catch(e) {}
        });

        livekitRoom.on(LivekitClient.RoomEvent.Disconnected, () => { setStatus("Disconnected"); addMsg("⚠️ تم قطع الاتصال بالاجتماع.", "bot"); });
        livekitRoom.on(LivekitClient.RoomEvent.Reconnecting, () => setStatus("Reconnecting..."));
        livekitRoom.on(LivekitClient.RoomEvent.Reconnected, () => setStatus("✅ Reconnected"));
        livekitRoom.on(LivekitClient.RoomEvent.MediaDevicesError, (e) => { console.error(e); addMsg("⚠️ خطأ في أجهزة الوسائط (كاميرا/مايك).", "bot"); });

        livekitRoom.on(LivekitClient.RoomEvent.LocalTrackPublished, (publication, participant) => {
             if (publication.track.kind === 'video') {
                 let boxId = 'participant-' + participant.identity; let box = document.getElementById(boxId);
                 if (!box) {
                     box = document.createElement('div'); box.id = boxId; box.className = 'participant-box';
                     let nameLabel = document.createElement('div'); nameLabel.className = 'participant-name'; nameLabel.textContent = (participant.name || participant.identity) + " (You)";
                     box.appendChild(nameLabel); videoGrid.appendChild(box);
                 }
                 const oldVideo = box.querySelector('video'); if (oldVideo) oldVideo.remove();
                 const videoEl = publication.track.attach(); videoEl.autoplay = true; videoEl.playsInline = true; videoEl.muted = true; 
                 videoEl.style.width = '100%'; videoEl.style.height = '100%'; videoEl.style.objectFit = 'cover';
                 box.insertBefore(videoEl, box.firstChild);
             }
        });

        livekitRoom.on(LivekitClient.RoomEvent.LocalTrackUnpublished, (publication, participant) => {
             if (publication.track && publication.track.kind === 'video') {
                 let box = document.getElementById('participant-' + participant.identity);
                 if (box) { const videoEl = box.querySelector('video'); if (videoEl) videoEl.remove(); }
             }
        });

        await livekitRoom.connect(url, token);
    } catch (e) {
        console.error(e);
        if (e.name === 'AbortError') { addMsg("⚠️ الخادم يستغرق وقتاً طويلاً للاستجابة. يرجى المحاولة مرة أخرى.", 'bot'); setStatus("Connection timeout"); } 
        else { addMsg("⚠️ Failed to join meeting: " + e.message, 'bot'); setStatus("Meeting Error"); }
    }
}

function cameraErrorText(err) {
  const n = err && err.name;
  if (n === 'NotAllowedError' || n === 'PermissionDeniedError') return 'تم رفض الإذن. اسمح بالكاميرا والمايك من إعدادات المتصفح (أيقونة القفل بجانب العنوان) ثم أعد المحاولة.';
  if (n === 'NotFoundError' || n === 'DevicesNotFoundError') return 'لم يتم العثور على كاميرا أو مايك في هذا الجهاز.';
  if (n === 'NotReadableError' || n === 'TrackStartError') return 'الجهاز مستخدم من تطبيق أو تبويب آخر. أغلقه وأعد المحاولة.';
  if (n === 'SecurityError' || (location.protocol !== 'https:' && location.hostname !== 'localhost')) return 'الكاميرا تعمل فقط عبر HTTPS.';
  return (err && err.message) ? err.message : 'خطأ غير معروف';
}

async function preflightMedia() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    s.getTracks().forEach(t => t.stop());
  } catch (e) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: true });
      s.getTracks().forEach(t => t.stop());
      addMsg("⚠️ المايك: " + cameraErrorText(e), 'bot');
    } catch (e2) {
      addMsg("⚠️ الكاميرا: " + cameraErrorText(e2), 'bot');
    }
  }
}

function enterRemoteRoom(code) {
  currentRoomCode = code; hasJoinedOnce = false; shouldReconnect = true;
  $('remoteJoinOverlay').style.display = 'none'; setModeUI('remote'); roomCodeLabel.textContent = code; onlineCount.textContent = '1/4'; chatEl.innerHTML = '';
  setStatus(`Connecting to ${code}...`); connectWebSocket(code);
}

function connectWebSocket(code) {
  if (ws) { try { ws.close(); } catch(e){} }
  ws = new WebSocket(WS_BASE + '/ws/' + code);
  ws.onopen = () => { ws.send(JSON.stringify({ type: 'join', name: myName, lang: myLang })); startPing(); };
  ws.onmessage = handleWsMessage;
  ws.onerror = (e) => { console.error('WS Error', e); addMsg('⚠️ WebSocket Error.', 'bot'); };
  ws.onclose = (ev) => {
    stopPing();
    if (!hasJoinedOnce) { addMsg(`⚠️ Failed to join. Error code: ${ev.code}`, 'bot'); setStatus('Connection failed'); return; }
    if (shouldReconnect && (appMode === 'remote' || appMode === 'meeting')) { setStatus(`Disconnected. Retrying...`); wsReconnectTimer = setTimeout(() => connectWebSocket(code), 3000); }
  };
}

function handleWsMessage(ev) {
  const data = JSON.parse(ev.data);
  switch (data.type) {
    case 'joined':
      hasJoinedOnce = true; 
      if (appMode === 'remote') onlineCount.textContent = `${data.users.length}/4`;
      if (appMode === 'meeting') onlineCount.textContent = `${data.users.length} online`;
      addMsg(`✅ Joined room ${currentRoomCode}`, 'bot');
      if (appMode === 'remote' && data.users.length > 1) { startVideoCall(true); }
      else if (appMode === 'remote') { addMsg('⏳ Waiting for other user to join...', 'bot'); }
      break;
    case 'user_joined':
      addMsg(`👤 ${data.name} joined`, 'bot');
      if (appMode === 'meeting') { onlineCount.textContent = `${data.users.length} online`; } 
      else if (appMode === 'remote') { startVideoCall(false); }
      break;
    case 'translated':
      if (data.is_mine) return;
      addMsg(`${data.from_name}: ${data.original}`, 'user-b', data.from_lang);
      
      if (data.no_tts) {
          // المترجم مغلق، لا نفعل شيئاً
      } else if (isTranslatorMode) {
          if (data.translated && data.translated !== data.original) { addMsg(`→ ${data.translated}`, 'bot', myLang); speak(data.translated, myLang); } 
          else { speak(data.original, myLang); }
      }
      break;
    case 'chat_media':
      if (data.media_type === 'image') { addMsg('', 'user-b', data.from_lang, data.data); }
      break;
    case 'rtc-offer':
      if (appMode === 'meeting') break;
      startVideoCall(false).then(async () => {
        if (!pc) return;
        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        while (iceCandidatesQueue.length > 0) { await pc.addIceCandidate(new RTCIceCandidate(iceCandidatesQueue.shift())).catch(e => {}); }
        const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'rtc-answer', answer: answer }));
      });
      break;
    case 'rtc-answer':
      if (appMode === 'meeting') break;
      if (pc) {
        pc.setRemoteDescription(new RTCSessionDescription(data.answer)).then(() => {
            while (iceCandidatesQueue.length > 0) { pc.addIceCandidate(new RTCIceCandidate(iceCandidatesQueue.shift())).catch(e => {}); }
        });
      }
      break;
    case 'rtc-ice':
      if (appMode === 'meeting') break;
      if (pc && pc.remoteDescription && pc.remoteDescription.type) { pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => {}); } 
      else { iceCandidatesQueue.push(data.candidate); }
      break;
    case 'error': addMsg(`⚠️ ${data.message}`, 'bot'); break;
  }
}

function sendRemoteMessage(text) { 
  if (ws && ws.readyState === WebSocket.OPEN) 
    ws.send(JSON.stringify({ type: 'message', text, translate: isTranslatorMode })); 
}
function startPing() { stopPing(); pingInterval = setInterval(() => { if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'ping'})); }, 30000); }
function stopPing() { if (pingInterval) clearInterval(pingInterval); }

function unlockMics() {

async function speak(text, lang) {
  stopAudio(); isBotTalking = true;

  if (isRecording) { try { recognition.stop(); } catch(e){} isRecording = false; }

  const cleanText = cleanTextForTTS(text);
  if (!cleanText) { 
      isBotTalking = false;
      if (isMicIntendedOn) { isRecording = true; try { recognition.start(); } catch(e){} }
      else unlockMics(); 
      return; 
  }

  const myId = ++currentSpeechId; setStatus('Speaking...');
  setAvatarState(true);
  
  const resumeMic = () => {
      isBotTalking = false; setAvatarState(false);
      if (isMicIntendedOn) {
          setTimeout(() => {
              if (isMicIntendedOn && !isBotTalking) { isRecording = true; try { recognition.start(); } catch(e){} }
          }, 800); 
      } else { unlockMics(); }
  };

  try {
    const res = await fetch(TTS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: cleanText, lang, voice: voiceSelect.value, session_id: SESSION_ID }) });
    if (res.ok) {
      const blob = await res.blob(); if (myId !== currentSpeechId) return;
      currentAudio = new Audio(URL.createObjectURL(blob));
      currentAudio.onended = resumeMic;
      currentAudio.onerror = () => { speakBrowser(cleanText, lang, myId); };
      await currentAudio.play(); return;
    }
  } catch (e) { console.warn('Server TTS failed'); }
  
  speakBrowser(cleanText, lang, myId);
}

function speakBrowser(text, lang, myId) {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); 
  u.lang = localeFor(lang);
  
  const voiceType = voiceSelect.value;
  if (voiceType === 'man') { u.pitch = 0.5; u.rate = 0.9; } 
  else if (voiceType === 'woman') { u.pitch = 1.0; u.rate = 1.0; } 
  else if (voiceType === 'girl') { u.pitch = 1.3; u.rate = 1.05; } 
  else if (voiceType === 'child') { u.pitch = 1.5; u.rate = 1.1; }

  const resumeMic = () => {
      if (myId === currentSpeechId) { 
          isBotTalking = false; setAvatarState(false); 
          if (isMicIntendedOn) { 
              setTimeout(() => {
                  if (isMicIntendedOn && !isBotTalking) { isRecording = true; try { recognition.start(); } catch(e){} }
              }, 800);
          } else unlockMics(); 
      } 
  };

  u.onend = resumeMic; u.onerror = resumeMic; speechSynthesis.speak(u);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (SR) {
  recognition = new SR();
  recognition.continuous = true; 
  recognition.interimResults = true; 

  const processVoice = (text) => {
    const clean = removeRepeatedWords(text).trim();
    if (!clean) return;

    const now = Date.now();
    if (clean === lastSentText && (now - lastSentTime) < 3000) return; 
    lastSentText = clean;
    lastSentTime = now;

    const isA = activeSpeaker === 'A';
    if (appMode === 'remote' || appMode === 'meeting') {
        addMsg(`You: ${clean}`, 'user-a', myLang);
        sendRemoteMessage(clean);
    } else {
        addMsg(clean, isA ? 'user-a' : 'user-b', isA ? langA.value : langB.value);
        ask(clean, isA ? langA.value : langB.value, isA ? langB.value : langA.value, activeSpeaker);
    }
  };

  recognition.onresult = (e) => {
    if (isProcessingAudio) return; 
    
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; ++i) {
      if (e.results[i].isFinal) {
        let newPart = e.results[i][0].transcript.trim();
        if (newPart) {
            let cleanBuffer = finalTranscriptBuffer.toLowerCase().replace(/[.,?!]/g, '').trim();
            let cleanNewPart = newPart.toLowerCase().replace(/[.,?!]/g, '').trim();
            if (cleanNewPart.length > 0) {
                if (cleanBuffer.endsWith(cleanNewPart) || finalTranscriptBuffer.includes(newPart + " ")) {
                    // تجاهل
                } else if (cleanNewPart.startsWith(cleanBuffer) && cleanBuffer.length > 0) {
                    finalTranscriptBuffer = newPart + " ";
                } else {
                    finalTranscriptBuffer += newPart + " ";
                }
            }
        }
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    
    setStatus(`🎤 Listening... ${finalTranscriptBuffer.slice(-30)}${interim}`);

    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => {
      if (finalTranscriptBuffer.trim()) {
        const textToSend = finalTranscriptBuffer.trim();
        finalTranscriptBuffer = ""; 
        isProcessingAudio = true; 
        try { recognition.stop(); } catch(e){} 
        processVoice(textToSend);
        resetStatus();
      }
    }, 2500); 
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech') return;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { isMicIntendedOn = false; unlockMics(); setStatus('Mic permission denied.'); return; }
    setStatus('Mic Error: ' + e.error);
  };

  recognition.onend = () => {
    isProcessingAudio = false;
    if (isMicIntendedOn && !isBotTalking) {
        setTimeout(() => { if (isMicIntendedOn && !isBotTalking) { try { recognition.start(); } catch(e) {} } }, 500); 
    } else if (!isMicIntendedOn) { unlockMics(); }
  };

  const startMic = (speaker) => {
    unlockAudio();
    
    if (isMicIntendedOn && activeSpeaker === speaker) {
        isMicIntendedOn = false; isRecording = false; clearTimeout(silenceTimer); try { recognition.stop(); } catch(e){}
        if (finalTranscriptBuffer.trim()) { processVoice(finalTranscriptBuffer.trim()); finalTranscriptBuffer = ""; }
        unlockMics(); return;
    }

    if (isMicIntendedOn) { try { recognition.stop(); } catch(e){} }
    stopAudio(); activeSpeaker = speaker; setAvatarState(true); isMicIntendedOn = true; isRecording = true; finalTranscriptBuffer = "";
    
    if (speaker === 'A') { recognition.lang = localeFor(langA.value); micA.classList.add('recording'); micB.disabled = true; setStatus('🎤 Listening (You)...'); } 
    else if (speaker === 'B') { recognition.lang = localeFor(langB.value); micB.classList.add('recording'); micA.disabled = true; setStatus('🎤 Listening (Friend)...'); } 
    else { recognition.lang = localeFor(myLang); if (remoteMicBtn) remoteMicBtn.classList.add('recording'); if (floatingMicBtn) floatingMicBtn.classList.add('recording'); setStatus('🎤 Listening...'); }
    try { recognition.start(); } catch (e) {}
  };
  
  micA.addEventListener('click', () => startMic('A'));
  micB.addEventListener('click', () => startMic('B'));
  if (remoteMicBtn) remoteMicBtn.addEventListener('click', () => startMic('R'));
  if (floatingMicBtn) floatingMicBtn.addEventListener('click', () => startMic('R'));
}

function buildSystemPrompt(targetLang, sourceLang) {
  if (isTranslatorMode) {
    return `You are a professional translator. Translate the user's text naturally from ${langNameFor(sourceLang)} to ${langNameFor(targetLang)}. If the input contains repeated words or stuttering (e.g., "fruits fruits fruits" or "hello hello"), ignore the repetition and translate the meaning only once. Output ONLY the translated text. DO NOT add conversational words, explanations, or quotes.`;
  }
  return `You are Chat-Core, a wise human friend. Reply in ${langNameFor(targetLang)}. DO NOT use markdown or bold text like **.`;
}

async function ask(text, sourceLang, targetLang, speaker) {
  if (isSending) return;
  
  // إذا كانت اللغتان متطابقتين، أو المترجم مغلق، اعرض النص مباشرة
  if (sourceLang === targetLang || !isTranslatorMode) {
      addMsg(text, isTranslatorMode ? (speaker === 'A' ? 'user-b' : 'user-a') : 'user-b', targetLang);
      return; 
  }

  setBusy(true); setStatus('Processing...');
  const messages = [{ role: 'system', content: buildSystemPrompt(targetLang, sourceLang) }];
  let finalText = text || '';
  if (attachedFileText) finalText += "\n\nFile Content:\n" + attachedFileText;
  let userContent = attachedImageBase64 ? [{ type: "text", text: finalText || "Analyze this image." }, { type: "image_url", image_url: { url: attachedImageBase64 } }] : finalText;
  messages.push({ role: 'user', content: userContent });

  try {
    const res = await fetchWithTimeout(SERVER_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, is_vision: attachedImageBase64 != null, is_translation: isTranslatorMode, session_id: SESSION_ID })
    }, REQUEST_TIMEOUT_MS);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    addMsg(data.reply.trim(), isTranslatorMode ? (speaker === 'A' ? 'user-b' : 'user-a') : 'user-b', targetLang || 'AUTO');
    resetStatus(); speak(data.reply.trim(), targetLang || langA.value);
    attachedImageBase64 = null; attachedFileText = null; imagePreviewContainer.style.display = 'none';
  } catch (e) { addMsg('Error: ' + e.message, 'bot'); } finally { setBusy(false); }
}

  const row = document.createElement('div');
  row.style.cssText = 'display:flex; align-items:center; gap:6px; background:#0f172a; border-radius:8px; padding:6px 8px;';
  const n = document.createElement('span'); n.textContent = name; n.style.cssText = 'flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px;';
  row.appendChild(n); return row;
}

function renderFriendsUI() {
  const badge = $('friendsBadge');
  const totalUnread = currentUser ? Object.values(chatsByFriend).reduce((n, c) => n + (c['unread_' + currentUser.uid] || 0), 0) : 0;
  const badgeCount = requestsCache.length + totalUnread;
  badge.style.display = badgeCount ? 'block' : 'none'; badge.textContent = badgeCount;
  $('frRequestsBox').style.display = requestsCache.length ? 'block' : 'none';
  const reqEl = $('frRequests'); reqEl.innerHTML = '';
  requestsCache.forEach(r => {
    const row = frRow(r.fromName || '?');
    row.appendChild(frBtn(frT('accept'), '#10b981', () => acceptRequest(r)));
    row.appendChild(frBtn(frT('decline'), '#475569', () => declineRequest(r)));
    reqEl.appendChild(row);
  });
  const listEl = $('frList'); listEl.innerHTML = '';
  if (!friendsCache.length) {
    const e = document.createElement('div'); e.textContent = frT('empty'); e.style.cssText = 'font-size:12px; color:#64748b; text-align:center; padding:8px;'; listEl.appendChild(e);
  }
  friendsCache.forEach(f => {
    const row = frRow(f.name || '?');
    const ch = chatsByFriend[f.uid]; const un = (ch && currentUser) ? (ch['unread_' + currentUser.uid] || 0) : 0;
    row.appendChild(frBtn('💬' + (un ? ' ' + un : ''), un ? '#ef4444' : '#0ea5e9', () => openChat(f)));
    row.appendChild(frBtn('📞', '#1d4ed8', () => callFriend(f)));
    row.appendChild(frBtn('✕', '#991b1b', () => removeFriend(f)));
    listEl.appendChild(row);
  });
  if (myFriendCode) $('frMyCode').textContent = myFriendCode;
}

async function ensureMyCode() {
  const uref = db.collection('users').doc(currentUser.uid);
  const snap = await uref.get();
  if (snap.exists && snap.data().code) { myFriendCode = snap.data().code; return; }
  for (let i = 0; i < 5; i++) {
    const code = genFriendCode(); const cref = db.collection('codes').doc(code);
    try {
      await db.runTransaction(async tx => {
        const c = await tx.get(cref);
        if (c.exists) throw new Error('taken');
        tx.set(cref, { uid: currentUser.uid, name: myDisplayName() });
        tx.set(uref, { code, name: myDisplayName() }, { merge: true });
      });
      myFriendCode = code; return;
    } catch (e) { if (e.message !== 'taken') throw e; }
  }
  throw new Error('Could not allocate a friend code');
}

function initFriends() {
  if (friendsReady) return Promise.resolve();
  if (friendsInitPromise) return friendsInitPromise;
  friendsInitPromise = (async () => {
    try {
      await loadFirestore();
      db = firebase.firestore();
      await ensureMyCode();
      const me = currentUser.uid;
      friendsUnsubs.push(db.collection('users').doc(me).collection('friends').onSnapshot(s => {
        friendsCache = s.docs.map(d => ({ id: d.id, ...d.data() })); renderFriendsUI();
      }, e => { lastFriendsError = e; }));
      friendsUnsubs.push(db.collection('friend_requests').where('to', '==', me).onSnapshot(s => {
        requestsCache = s.docs.map(d => ({ id: d.id, ...d.data() })); renderFriendsUI();
      }, e => { lastFriendsError = e; }));
      friendsUnsubs.push(db.collection('invites').where('to', '==', me).onSnapshot(s => {
        s.docChanges().forEach(ch => {
          if (ch.type !== 'added') return;
          const inv = { id: ch.doc.id, ...ch.doc.data() };
          if (Date.now() - (inv.createdAt || 0) > 120000) { ch.doc.ref.delete().catch(() => {}); return; }
          showInvite(inv);
        });
      }, e => { lastFriendsError = e; }));
      friendsUnsubs.push(db.collection('chats').where('members', 'array-contains', me).onSnapshot(s => {
        s.docs.forEach(d => {
          const data = d.data({ serverTimestamps: 'estimate' });
          const other = (data.members || []).find(m => m !== me);
          if (other) chatsByFriend[other] = { id: d.id, ...data };
        });
        markDelivered(s); renderFriendsUI();
        if (chatOpenWith) { renderChatMsgs(); markRead(); }
      }, e => { lastFriendsError = e; }));
      friendsReady = true; lastFriendsError = null; renderFriendsUI();
    } catch (e) {
      console.warn('Friends init failed', e); lastFriendsError = e; friendsInitPromise = null; throw e;
    }
  })();
  friendsInitPromise.catch(() => {});
  return friendsInitPromise;
}

function teardownFriends() {
  friendsUnsubs.forEach(u => { try { u(); } catch (e) {} });
  friendsUnsubs = []; friendsReady = false; friendsInitPromise = null; myFriendCode = null;
  if (chatUnsub) { try { chatUnsub(); } catch (e) {} chatUnsub = null; }
  chatsByFriend = {}; chatOpenWith = null; chatMsgsCache = []; chatTranslations = {}; $('chatOverlay').style.display = 'none';
  friendsCache = []; requestsCache = []; currentInvite = null; $('inviteToast').style.display = 'none'; renderFriendsUI();
}

async function sendFriendRequest(raw) {
  const code = (raw || '').trim().toUpperCase(); if (!code) return;
  if (code === myFriendCode) return setFrMsg(frT('self'));
  try {
    const c = await db.collection('codes').doc(code).get();
    if (!c.exists) return setFrMsg(frT('notfound'));
    const to = c.data().uid;
    if (friendsCache.some(f => f.uid === to)) return setFrMsg(frT('already'));
    const incoming = requestsCache.find(r => r.from === to);
    if (incoming) { await acceptRequest(incoming); return; }
    await db.collection('friend_requests').doc(currentUser.uid + '_' + to).set({ from: currentUser.uid, fromName: myDisplayName(), to, createdAt: Date.now() });
    setFrMsg(frT('sent')); $('frAddInput').value = '';
  } catch (e) { setFrMsg(frErrText(e)); }
}

async function acceptRequest(r) {
  try {
    const me = currentUser.uid, other = r.from, now = Date.now();
    const batch = db.batch();
    batch.set(db.collection('users').doc(other).collection('friends').doc(me), { uid: me, name: myDisplayName(), since: now });
    batch.set(db.collection('users').doc(me).collection('friends').doc(other), { uid: other, name: r.fromName || '?', since: now });
    batch.delete(db.collection('friend_requests').doc(r.id));
    await batch.commit();
  } catch (e) { setFrMsg(frErrText(e)); }
}
async function declineRequest(r) { try { await db.collection('friend_requests').doc(r.id).delete(); } catch (e) { setFrMsg(frErrText(e)); } }

async function removeFriend(f) {
  if (!confirm(frT('confirmRemove'))) return;
  try {
    const me = currentUser.uid;
    const batch = db.batch();
    batch.delete(db.collection('users').doc(me).collection('friends').doc(f.uid));
    batch.delete(db.collection('users').doc(f.uid).collection('friends').doc(me));
    await batch.commit();
  } catch (e) { setFrMsg(frErrText(e)); }
}

async function callFriend(f) {
  const code = "MTG" + Math.random().toString(36).substring(2, 8).toUpperCase();
  try {
    await db.collection('invites').add({ from: currentUser.uid, fromName: myDisplayName(), to: f.uid, room: code, createdAt: Date.now() });
  } catch (e) { setFrMsg(frErrText(e)); return; }
  const name = ($('meetPlayerName').value || myDisplayName()).trim();
  enterMeeting(code, name, $('meetPlayerLang').value);
}

function showInvite(inv) {
  currentInvite = inv;
  $('inviteText').textContent = frT('invite')(inv.fromName || '?');
  $('inviteToast').style.display = 'block';
}
async function dismissInvite(deleteDoc = true) {
  const inv = currentInvite; currentInvite = null; $('inviteToast').style.display = 'none';
  if (inv && deleteDoc) { try { await db.collection('invites').doc(inv.id).delete(); } catch (e) {} }
}
$('inviteDecline').addEventListener('click', () => dismissInvite());
$('inviteJoin').addEventListener('click', async () => {
  const inv = currentInvite; if (!inv) return;
  await dismissInvite();
  if (appMode !== 'none') { backBtn.click(); await new Promise(r => setTimeout(r, 500)); }
  enterMeeting(inv.room, ($('meetPlayerName').value || myDisplayName()).trim(), $('meetPlayerLang').value);
});

$('btnFriends').addEventListener('click', async () => {
  $('landingOverlay').style.display = 'none'; $('friendsOverlay').style.display = 'flex';
  applyFriendsLang(); renderFriendsUI();
  if (!friendsReady) {
    setFrMsg(frT('wait'));
    try { await initFriends(); setFrMsg(''); } catch (e) { setFrMsg(frErrText(e)); }
  } else { setFrMsg(''); }
});
$('frBackBtn').addEventListener('click', () => { $('friendsOverlay').style.display = 'none'; $('landingOverlay').style.display = 'flex'; });
$('frAddBtn').addEventListener('click', () => sendFriendRequest($('frAddInput').value));
$('frAddInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendFriendRequest($('frAddInput').value); } });
$('frCopyCode').addEventListener('click', () => {
  if (!myFriendCode) return;
  navigator.clipboard.writeText(myFriendCode).then(() => setFrMsg(frT('copied'))).catch(() => alert(myFriendCode));
});
renderPlaylist(); 
</script>
</body>
</html>
