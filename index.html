<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat-Core - Translator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: Tahoma, sans-serif; background: #0ea5e9; color: #fff; display: flex; flex-direction: column; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); height: 100dvh; transition: opacity 0.3s; }
  
  .top-header { display: flex; justify-content: center; align-items: center; gap: 12px; width: 100%; margin-bottom: 10px; flex-shrink: 0; position: relative; z-index: 10001; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 6px 12px; border-radius: 10px; width: 92%; max-width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .user-section { display: flex; align-items: center; gap: 6px; }
  .lang-select { padding: 4px 2px; border-radius: 6px; background: #0f172a; color: #ffffff; border: 1px solid #334155; font-size: 10px; font-family: Tahoma; outline: none; width: 80px; }
  
  .mic-btn { width: 32px; height: 32px; border-radius: 50%; border: none; color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
  .mic-btn.blue { background: #6366f1; box-shadow: 0 0 8px rgba(99,102,241,0.5); }
  .mic-btn.green { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.5); }
  .mic-btn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; box-shadow: 0 0 12px rgba(239,68,68,0.8); }
  .mic-btn:disabled { background: #475569 !important; opacity: 0.5; animation: none; }
  @keyframes pulse { 50% { transform: scale(1.1); } }

  #lockBtn { border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; padding: 0; outline: none; }
  #lockBtn.unlocked { width: 14px; height: 14px; border-radius: 50%; background: #ef4444; border: 1px solid #dc2626; }
  #lockBtn.locked { width: 34px; height: 34px; border-radius: 50%; background: #ef4444; color: white; font-size: 16px; box-shadow: 0 0 10px rgba(239,68,68,0.5); }
  .locked-ui { opacity: 0.4; pointer-events: none; filter: blur(1px); }

  #avatar-wrap { width: 100px; height: 100px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all 0.3s; }
  #avatar-container { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; background: #1e293b; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0,0,0,0.3); z-index: 1; transition: all 0.3s; }
  #avatar-logo, #avatar-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #avatar-video { display: none; }
  #avatar-wrap.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; margin: 0; background: #000; }
  #avatar-wrap.fullscreen #avatar-container { width: 100vw; height: 100vh; border-radius: 0 !important; background: transparent; box-shadow: none; }
  #avatar-wrap.fullscreen #avatar-logo, #avatar-wrap.fullscreen #avatar-video { object-fit: contain; width: 100vw; height: 100vh; }
  #avatar-wrap.fullscreen #closeFullscreen { display: flex; }
  #avatar-wrap.fullscreen #removeAvatarBtn { top: 20px; right: 20px; width: 18px; height: 18px; }
  #closeFullscreen { display: none; position: fixed; top: 80px; right: 20px; background: rgba(0,0,0,0.6); border: none; color: #fff; font-size: 24px; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 10000; align-items: center; justify-content: center; }
  #removeAvatarBtn { display: none; position: absolute; top: 5px; right: 5px; width: 12px; height: 12px; border-radius: 50%; background: #000000; border: none; cursor: pointer; z-index: 10; padding: 0; opacity: 0.8; }

  #videoContainer { display: none; position: relative; width: 100%; max-width: 400px; height: 200px; margin: 0 auto 10px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer; transition: all 0.3s; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
  #localVideo { position: absolute; bottom: 10px; right: 10px; width: 80px; height: 100px; object-fit: cover; border-radius: 8px; border: 2px solid #fff; background: #1e293b; z-index: 2; }
  #videoStatus { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 6px; font-size: 10px; color: #10b981; z-index: 2; }
  #videoContainer.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; max-width: 100%; z-index: 9999; margin: 0; border-radius: 0; }
  #videoContainer.fullscreen #remoteVideo { object-fit: contain; }
  #videoContainer.fullscreen #localVideo { width: 120px; height: 160px; bottom: 20px; right: 20px; }
  #closeVideoFullscreen { display: none; position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.6); border: none; color: #fff; font-size: 24px; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 10000; align-items: center; justify-content: center; }
  #videoContainer.fullscreen #closeVideoFullscreen { display: flex; }

  .chat-container { position: relative; flex: 1; display: flex; flex-direction: column; margin-bottom: 10px; min-height: 100px; }
  #chat { flex: 1; background: #1e293b; border-radius: 12px; padding: 12px; overflow-y: auto; }
  .msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; max-width: 85%; line-height: 1.6; word-wrap: break-word; font-size: 15px; }
  .user-a { background: #4f46e5; margin-right: auto; border-bottom-right-radius: 4px; } 
  .user-b { background: #10b981; margin-left: auto; border-bottom-left-radius: 4px; color: #000;} 
  .bot { background: #334155; margin: 0 auto 8px auto; text-align: center; font-style: italic; font-size: 13px;}
  .lang-tag { display: inline-block; font-size: 10px; padding: 2px 6px; background: rgba(255,255,255,0.15); border-radius: 6px; margin-right: 6px; opacity: 0.8; font-weight: bold; }
  
  #clearBtn { position: absolute; bottom: 2px; left: 10px; width: 30px; height: 30px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #clearBtn svg { fill: #2d3748; width: 16px; height: 16px; }

  #imagePreviewContainer { display: none; position: absolute; bottom: 50px; right: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 5px; align-items: center; gap: 8px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  #imagePreview { width: 45px; height: 45px; border-radius: 4px; object-fit: cover; }
  #cancelImageBtn { background: #dc2626; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }

  .row { display: flex; gap: 6px; align-items: center; flex-shrink: 0; position: relative; }
  input[type=text] { flex: 1; padding: 10px; border-radius: 24px; border: 1px solid #1e293b; background: #ffffff; color: #000; font-size: 14px; order: 3; }
  button.btn { padding: 0; border: none; border-radius: 50%; font-weight: bold; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s; }
  #musicBtn { background: #ffffff; color: #000000; order: 1; font-size: 16px; }
  #mediaBtn { background: #ffffff; color: #f97316; order: 2; font-size: 11px; font-weight: bold; }
  #remoteMicBtn { background: #6366f1; color: #fff; order: 2; font-size: 16px; display: none; }
  #sendBtn { background: #1d4ed8; order: 4; color: #fff; }
  #sendBtn svg { width: 20px; height: 20px; fill: white; transform: translateX(-2px) translateY(2px); }
  #status { text-align: center; font-size: 12px; color: #0f172a; margin-top: 6px; min-height: 18px; font-weight: bold; }
  
  .extra-controls { display: flex; gap: 5px; margin-bottom: 8px; justify-content: center; flex-wrap: wrap; }
  .extra-controls button, .extra-controls select { padding: 5px 10px; border-radius: 15px; border: none; background: #475569; color: #fff; font-size: 11px; cursor: pointer; outline: none; }
  .extra-controls button.active { background: #eab308; color: #000; }

  #actionMenu { display: none; position: fixed; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px; z-index: 2000; flex-direction: column; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .action-btn { padding: 8px 12px; border-radius: 8px; border: none; background: #0f172a; color: #fff; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  
  #musicMenu { display: none; position: fixed; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; z-index: 2000; width: 200px; max-height: 250px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  #musicMenu h4 { font-size: 12px; margin-bottom: 8px; text-align: center; color: #94a3b8; }
  .music-item { padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 4px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; }
  .music-item:hover { background: #334155; } .music-item.active { background: #0ea5e9; color: #fff; font-weight: bold; } 
  .music-item.add-more, .music-item.stop-btn, .music-item.pause-btn { text-align: center; font-weight: bold; justify-content: center; }
  .music-item.add-more { background: #22c55e; } .music-item.stop-btn { background: #991b1b; margin-bottom: 6px; } .music-item.pause-btn { background: #475569; margin-bottom: 6px; }
  .song-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; direction: ltr; }
  .delete-song { color: #ef4444; font-weight: bold; padding: 0 6px; font-size: 14px; }

  #remoteBar { display: none; background: #1e293b; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; justify-content: space-between; align-items: center; color: #fff; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  #remoteBar .room-info { display: flex; align-items: center; gap: 8px; }
  #remoteBar strong { color: #fbbf24; letter-spacing: 2px; font-size: 14px; }
  #copyRoomBtn { background: #6366f1; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; }
  #leaveRoomBtn { background: #ef4444; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }

  .overlay { position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; color: #fff; padding: 20px; z-index: 99999; }
  .overlay h1 { font-size: 28px; color: #0ea5e9; margin-bottom: 10px; }
  .overlay h2 { font-size: 20px; color: #10b981; margin-bottom: 5px; }
  .overlay .mode-btn { padding: 15px 30px; font-size: 16px; border-radius: 12px; border: none; color: #fff; cursor: pointer; width: 260px; font-weight: bold; }
  #btnLocal { background: #6366f1; }
  #btnRemote { background: #10b981; }
  
  .join-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .join-form input, .join-form select { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; width: 100%; outline: none; }
  .join-form input:focus { border-color: #0ea5e9; }
  .join-form button { padding: 12px; border-radius: 8px; border: none; color: #fff; cursor: pointer; font-weight: bold; font-size: 14px; }
  #createRoomBtn { background: #10b981; }
  #joinRoomBtn { background: #6366f1; }
  #joinRow { display: flex; gap: 8px; }
  #joinCodeInput { flex: 1; text-transform: uppercase; text-align: center; letter-spacing: 2px; }
  #backToLandingBtn { background: transparent; border: none; color: #94a3b8; cursor: pointer; margin-top: 5px; font-size: 13px; text-decoration: underline; }
</style>
</head>
<body>

<div class="overlay" id="landingOverlay">
  <h1>🌐 Chat-Core</h1>
  <p style="color:#94a3b8; font-size:13px; margin-bottom:10px;">اختر وضع التشغيل</p>
  <button class="mode-btn" id="btnLocal">🌐 Face-to-Face</button>
  <button class="mode-btn" id="btnRemote">💬 Remote Mode</button>
</div>

<div class="overlay" id="remoteJoinOverlay" style="display:none;">
  <h2>💬 Remote Mode</h2>
  <div class="join-form">
    <input type="text" id="playerName" placeholder="اسمك" maxlength="30">
    <select id="playerLang">
      <option value="ar">🇹🇳 العربية (Arabic)</option>
      <option value="fr">🇫🇷 Français (French)</option>
      <option value="en">🇬🇧 English</option>
      <option value="de">🇩🇪 Deutsch (German)</option>
      <option value="tr">🇹🇷 Türkçe (Turkish)</option>
      <option value="it">🇮🇹 Italiano (Italian)</option>
      <option value="zh">🇨🇳 中文 (Chinese)</option>
      <option value="ru">🇷🇺 Русский (Russian)</option>

    <button id="createRoomBtn">➕ إنشاء غرفة</button>
    
    <div style="text-align:center; color:#94a3b8; font-size:12px; margin:5px 0;">أو</div>
    
    <div id="joinRow">
      <input type="text" id="joinCodeInput" placeholder="الكود" maxlength="6">
      <button id="joinRoomBtn">انضمام</button>
    </div>
    <button id="backToLandingBtn">← رجوع</button>
  </div>
</div>

<div id="remoteBar">
  <div class="room-info">
    <span>Room: <strong id="roomCodeLabel">------</strong></span>
    <button id="copyRoomBtn">📋 نسخ</button>
  </div>
  <span id="onlineCount">1/4</span>
  <button id="leaveRoomBtn">خروج</button>
</div>

<div class="top-header" id="topHeader">
  <button id="lockBtn" class="unlocked" title="Lock/Unlock"></button>
  <div class="top-bar" id="topBar">
    <div class="user-section" id="friendSection">
      <span style="font-size:9px; color:#94a3b8;">Friend</span>
      <select id="langB" class="lang-select">
        <option value="fr">French</option><option value="ar">Arabic</option><option value="en">English</option>
        <option value="de">German</option><option value="tr">Turkish</option><option value="it">Italian</option>
        <option value="zh">Chinese</option><option value="ru">Russian</option>
      </select>
      <button id="micB" class="mic-btn green" title="Talk">🎤</button>
    </div>
    <div class="user-section" id="youSection">
      <span style="font-size:9px; color:#94a3b8;">You</span>
      <select id="langA" class="lang-select">
        <option value="ar">Arabic</option><option value="fr">French</option><option value="en">English</option>
        <option value="de">German</option><option value="tr">Turkish</option><option value="it">Italian</option>
        <option value="zh">Chinese</option><option value="ru">Russian</option>
      </select>
      <button id="micA" class="mic-btn blue" title="Talk">🎤</button>
    </div>
  </div>
</div>

<div class="extra-controls" id="extraControls">
    <button id="translateModeBtn" class="active">Translator Mode ON</button>
    <select id="voiceSelect">
      <option value="man">👨 Man</option><option value="woman">👩 Woman</option>
      <option value="girl">👧 Girl</option><option value="child">🧒 Child</option>
    </select>
    <button id="uploadBtn">📁 Avatar</button>
</div>

<div id="videoContainer">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div id="videoStatus">📡 متصل بالكاميرا</div>
  <button id="closeVideoFullscreen" title="إغلاق">✕</button>
</div>

<div id="avatar-wrap">
  <div id="avatar-container">
    <img id="avatar-logo" src="https://cdn.jsdelivr.net/gh/bobo333med-alt/vibe-core@main/image_718b1365.jpg" alt="Logo" onerror="this.src='https://cdn.jsdelivr.net/gh/bobo333med-alt/vibe-core@main/image_bb189f9b%20%281%29.jpg'">
    <video id="avatar-video" autoplay loop muted playsinline></video>
  </div>
  <button id="removeAvatarBtn" title="Reset">✕</button>
  <button id="closeFullscreen" title="Close">✕</button>
</div>

<div class="chat-container" id="chatContainer">
  <div id="chat"></div>
  <button id="clearBtn" title="Clear Chat">
    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
  </button>
</div>

<div id="imagePreviewContainer">
  <img id="imagePreview" src="" alt="Preview">
  <button id="cancelImageBtn">✕</button>
</div>

<div class="row" id="inputRow">
  <button class="btn" id="musicBtn" title="Music">🎵</button>
  <button class="btn" id="mediaBtn" title="Media">media</button>
  <button class="btn" id="remoteMicBtn" title="Talk">🎤</button>
  <input type="text" id="textInput" placeholder="Type..." />
  <button class="btn" id="sendBtn" title="Send"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>

<div id="status" class="status-text">Ready</div>

<div id="actionMenu">
  <button class="action-btn" id="menuCamera">📸 Camera</button>
  <button class="action-btn" id="menuGallery">🖼️ Gallery</button>
  <button class="action-btn" id="menuFile">📄 File</button>

<input type="file" id="cameraUpload" accept="image/*" capture="environment" style="display: none;">
<input type="file" id="galleryUpload" accept="image/*" style="display: none;">
<input type="file" id="fileUpload" accept=".txt" style="display: none;">
<input type="file" id="audioUpload" accept="audio/*" multiple style="display: none;">
<input type="file" id="videoUpload" accept="video/*" style="display: none;">
<audio id="bgAudio"></audio>
<div id="musicMenu"><h4>🎵 Playlist</h4><div id="musicList"></div></div>

<script>
'use strict';

const SERVER_URL = "https://vibe-core-0m1r.onrender.com/chat";
const TTS_URL = "https://vibe-core-0m1r.onrender.com/tts";
const ROOM_CREATE_URL = "https://vibe-core-0m1r.onrender.com/rooms/create";
const WS_BASE = SERVER_URL.replace('https://', 'wss://').replace('http://', 'ws://').replace('/chat', '');
const REQUEST_TIMEOUT_MS = 90000;
const HISTORY_LIMIT = 12;
const SESSION_ID = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));

const $ = id => document.getElementById(id);
const chatEl = $('chat'), inputEl = $('textInput'), sendBtn = $('sendBtn');
const micA = $('micA'), micB = $('micB'), remoteMicBtn = $('remoteMicBtn');
const langA = $('langA'), langB = $('langB');
const clearBtn = $('clearBtn'), statusEl = $('status');
const avatarWrap = $('avatar-wrap'), avatarLogo = $('avatar-logo'), avatarVideo = $('avatar-video');
const translateModeBtn = $('translateModeBtn'), voiceSelect = $('voiceSelect');
const topHeader = $('topHeader'), remoteBar = $('remoteBar'), roomCodeLabel = $('roomCodeLabel'), onlineCount = $('onlineCount'), leaveRoomBtn = $('leaveRoomBtn');
const videoContainer = $('videoContainer'), remoteVideo = $('remoteVideo'), localVideo = $('localVideo'), closeVideoFullscreen = $('closeVideoFullscreen');
const imagePreviewContainer = $('imagePreviewContainer'), imagePreview = $('imagePreview'), cancelImageBtn = $('cancelImageBtn');
const mediaBtn = $('mediaBtn'), actionMenu = $('actionMenu'), menuCamera = $('menuCamera'), menuGallery = $('menuGallery'), menuFile = $('menuFile');
const cameraUpload = $('cameraUpload'), galleryUpload = $('galleryUpload'), fileUpload = $('fileUpload'), audioUpload = $('audioUpload');
const musicBtn = $('musicBtn'), musicMenu = $('musicMenu'), musicList = $('musicList'), bgAudio = $('bgAudio');
const lockBtn = $('lockBtn'), uploadBtn = $('uploadBtn'), videoUpload = $('videoUpload'), removeAvatarBtn = $('removeAvatarBtn'), closeFullscreen = $('closeFullscreen');

const uiElements = [$('extraControls'), $('avatar-wrap'), $('chatContainer'), $('inputRow'), $('status'), $('topBar'), imagePreviewContainer];

let appMode = 'none';
let chatHistory = [], isTranslatorMode = true, activeSpeaker = null, isRecording = false, isSending = false, isCompressing = false, isLocked = false;
let currentAudio = null, attachedImageBase64 = null, attachedFileText = null, currentSpeechId = 0, isBotTalking = false;
let ws = null, wsReconnectTimer = null, pingInterval = null, myName = 'User', myLang = 'ar', currentRoomCode = '', shouldReconnect = false, hasJoinedOnce = false;
let pc = null, localStream = null;
let playlist = [], currentSongIndex = -1, currentAvatarObjectUrl = null;

function setStatus(s) { statusEl.textContent = s; }
function resetStatus() { setStatus(appMode === 'remote' ? `Room ${currentRoomCode}` : (isTranslatorMode ? 'Translator Mode ON 🌐' : 'Chat Mode ON 💬')); }
resetStatus();

function setBusy(busy) {
  isSending = busy;
  sendBtn.disabled = busy || isCompressing;
  micA.disabled = busy; micB.disabled = busy; remoteMicBtn.disabled = busy;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addMsg(text, className, lang) {
  const div = document.createElement('div');
  div.className = 'msg ' + className;
  div.setAttribute('dir', 'auto');
  if (lang) {
    const tag = document.createElement('span'); tag.className = 'lang-tag'; tag.textContent = String(lang).toUpperCase();
    div.appendChild(tag);
  }
  div.insertAdjacentHTML('beforeend', escapeHtml(text).replace(/\n/g, '<br>'));
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function unlockAudio() {
  if ('speechSynthesis' in window) { try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {} }
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) {}
}
document.body.addEventListener('click', unlockAudio, { once: true });

function fetchWithTimeout(url, options, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
}

function langNameFor(code) { return { 'ar': 'Arabic', 'en': 'English', 'fr': 'French', 'de': 'German', 'tr': 'Turkish', 'it': 'Italian', 'zh': 'Chinese', 'ru': 'Russian' }[code] || 'English'; }
function localeFor(code) { return { 'ar': 'ar-TN', 'en': 'en-US', 'fr': 'fr-FR', 'de': 'de-DE', 'tr': 'tr-TR', 'it': 'it-IT', 'zh': 'zh-CN', 'ru': 'ru-RU' }[code] || 'en-US'; }

function compressImage(base64Str, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve) => {
    const img = new Image();
    img.src = base64Str;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let width = img.width, height = img.height;
      if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(base64Str);
  });
}

  if (mode === 'local') {
    topHeader.style.display = 'flex'; remoteBar.style.display = 'none'; remoteMicBtn.style.display = 'none';

}

async function handleImage(e) {
  const file = e.target.files[0]; if (!file) return;
  isCompressing = true; sendBtn.disabled = true; setStatus('Compressing...');
  const reader = new FileReader();
  reader.onload = async ev => {
    attachedFileText = null;
    attachedImageBase64 = await compressImage(ev.target.result);
    imagePreview.src = attachedImageBase64; imagePreviewContainer.style.display = 'flex';
    isCompressing = false; sendBtn.disabled = isSending; setStatus('Image attached.');
  };
  reader.readAsDataURL(file);
}
galleryUpload.addEventListener('change', handleImage);
cameraUpload.addEventListener('change', handleImage);
fileUpload.addEventListener('change', (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    attachedImageBase64 = null; attachedFileText = ev.target.result;
    imagePreview.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="45" height="45" viewBox="0 0 24 24" fill="%23fff"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>';
    imagePreviewContainer.style.display = 'flex'; setStatus('File attached.');
  };
  reader.readAsText(file);
});
cancelImageBtn.addEventListener('click', (e) => {

  imagePreviewContainer.style.display = 'none'; setStatus('Attachment removed.');
});

audioUpload.addEventListener('change', (e) => {
  const files = e.target.files;
  for (let i = 0; i < files.length; i++) playlist.push({ name: files[i].name, url: URL.createObjectURL(files[i]) });
  renderPlaylist(); e.target.value = '';
});
function renderPlaylist() {
  musicList.innerHTML = '';
  const stopBtn = document.createElement('div'); stopBtn.className = 'music-item stop-btn'; stopBtn.textContent = '🛑 Stop'; stopBtn.onclick = stopMusic; musicList.appendChild(stopBtn);
  const pauseBtn = document.createElement('div'); pauseBtn.className = 'music-item pause-btn'; pauseBtn.textContent = bgAudio.paused ? '▶️ Play' : '⏸️ Pause';
  pauseBtn.onclick = (e) => { e.stopPropagation(); if (bgAudio.src) { if (bgAudio.paused) bgAudio.play(); else bgAudio.pause(); renderPlaylist(); } }; musicList.appendChild(pauseBtn);
  const addBtn = document.createElement('div'); addBtn.className = 'music-item add-more'; addBtn.textContent = '➕ Add'; addBtn.onclick = () => { audioUpload.value = ''; audioUpload.click(); }; musicList.appendChild(addBtn);
  playlist.forEach((song, index) => {
    const div = document.createElement('div'); div.className = 'music-item';
    const name = document.createElement('span'); name.className = 'song-name'; name.textContent = song.name;
    const del = document.createElement('span'); del.className = 'delete-song'; del.textContent = '✕';
    del.onclick = (e) => { e.stopPropagation(); if (currentSongIndex === index) stopMusic(); playlist.splice(index, 1); if(currentSongIndex > index) currentSongIndex--; renderPlaylist(); };
    div.appendChild(name); div.appendChild(del);
    if (index === currentSongIndex && !bgAudio.paused) div.classList.add('active');
    div.onclick = () => { if (currentSongIndex === index && !bgAudio.paused) { bgAudio.pause(); renderPlaylist(); } else { currentSongIndex = index; bgAudio.src = playlist[index].url; bgAudio.play(); renderPlaylist(); } };
    musicList.appendChild(div);
  });
}
function stopMusic() { bgAudio.pause(); bgAudio.currentTime = 0; currentSongIndex = -1; renderPlaylist(); }
bgAudio.addEventListener('ended', () => { if(playlist.length > 0) { currentSongIndex = (currentSongIndex + 1) % playlist.length; bgAudio.src = playlist[currentSongIndex].url; bgAudio.play(); renderPlaylist(); } });
bgAudio.addEventListener('play', renderPlaylist); bgAudio.addEventListener('pause', renderPlaylist);
renderPlaylist(); 

function buildSystemPrompt(targetLang) {
  if (isTranslatorMode) return `Translate the user's input into ${langNameFor(targetLang)}. Output ONLY the translated text.`;
  return `You are Chat-Core, a wise human friend. Reply in ${langNameFor(targetLang)}.`;
}

async function ask(text, targetLang, speaker) {
  if (isSending || isLocked) return;
  setBusy(true); setStatus('Processing...');
  const messages = [{ role: 'system', content: buildSystemPrompt(targetLang) }];
  let finalText = text || '';
  if (attachedFileText) finalText += "\n\nFile Content:\n" + attachedFileText;
  let userContent = attachedImageBase64 ? [{ type: "text", text: finalText || "Analyze this image." }, { type: "image_url", image_url: { url: attachedImageBase64 } }] : finalText;
  messages.push({ role: 'user', content: userContent });

  try {
    const res = await fetchWithTimeout(SERVER_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, is_vision: attachedImageBase64 != null, is_translation: isTranslatorMode, session_id: SESSION_ID })
    }, REQUEST_TIMEOUT_MS);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    addMsg(data.reply.trim(), isTranslatorMode ? (speaker === 'A' ? 'user-b' : 'user-a') : 'user-b', targetLang);
    resetStatus(); speak(data.reply.trim(), targetLang);
    attachedImageBase64 = null; attachedFileText = null; imagePreviewContainer.style.display = 'none';
  } catch (e) { addMsg('Error: ' + e.message, 'bot'); } finally { setBusy(false); }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (SR) {
  recognition = new SR();
  recognition.continuous = false; recognition.interimResults = false;
  recognition.onresult = e => {
    const text = e.results[0][0].transcript;
    if (!text.trim()) return unlockMics();
    if (appMode === 'remote') {
      addMsg(`You: ${text}`, 'user-a', myLang); sendRemoteMessage(text); setTimeout(unlockMics, 400);
    } else {
      addMsg(text, activeSpeaker === 'A' ? 'user-a' : 'user-b', activeSpeaker === 'A' ? langA.value : langB.value);
      ask(text, activeSpeaker === 'A' ? langB.value : langA.value, activeSpeaker);
    }
  };
  recognition.onend = () => { isRecording = false; if (!isBotTalking && !isSending) unlockMics(); };
  const startMic = (speaker) => {
    if (isRecording) { recognition.stop(); return; }
    stopAudio(); activeSpeaker = speaker;
    recognition.lang = localeFor(speaker === 'A' ? langA.value : langB.value);
    (speaker === 'A' ? micA : micB).classList.add('recording'); setStatus('Listening...');
    try { recognition.start(); } catch (e) {}
  };
  micA.addEventListener('click', () => startMic('A'));
  micB.addEventListener('click', () => startMic('B'));
  remoteMicBtn.addEventListener('click', () => {
    if (isRecording) { recognition.stop(); return; }
    stopAudio(); recognition.lang = localeFor(myLang);
    remoteMicBtn.classList.add('recording'); setStatus('Listening...');
    try { recognition.start(); } catch (e) {}
  });
}

sendBtn.addEventListener('click', () => {
  const t = inputEl.value.trim();
  if (appMode === 'remote') {
    if (t) { addMsg(`You: ${t}`, 'user-a', myLang); sendRemoteMessage(t); inputEl.value = ''; }
  } else {
    if (t || attachedImageBase64) { addMsg(t || '📷 Image', 'user-a', langA.value); ask(t, langB.value, 'A'); inputEl.value = ''; }
  }
});

async function startVideoCall() {
  if (localStream) return;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    localVideo.srcObject = localStream;
    videoContainer.style.display = 'block';
    if (!pc) pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    pc.ontrack = (event) => { remoteVideo.srcObject = event.streams[0]; };
    pc.onicecandidate = (event) => { if (event.candidate) ws.send(JSON.stringify({ type: 'rtc-ice', candidate: event.candidate })); };
  } catch (err) { console.error('Camera access denied', err); }
}

$('createRoomBtn').addEventListener('click', async () => {
  const name = $('playerName').value.trim(), lang = $('playerLang').value;
  if (!name) return alert('أدخل اسمك');
  myName = name; myLang = lang;
  langA.value = lang; // مزامنة القائمة العلوية مع لغة الدخول
  
  const btn = $('createRoomBtn'); btn.textContent = '⏳ جارٍ الاتصال...'; btn.disabled = true;
  try {
    const res = await fetch(ROOM_CREATE_URL, { method: 'POST' });
    const data = await res.json();
    if (!data.code) throw new Error('لم يتم استلام الكود');
    enterRemoteRoom(data.code);
  } catch (e) { alert('فشل إنشاء الغرفة: ' + e.message); } 
  finally { btn.textContent = '➕ إنشاء غرفة'; btn.disabled = false; }
});
$('joinRoomBtn').addEventListener('click', () => {
  const name = $('playerName').value.trim(), lang = $('playerLang').value, code = $('joinCodeInput').value.trim().toUpperCase();
  if (!name) return alert('أدخل اسمك');
  if (code.length !== 6) return alert('كود غير صحيح');
  myName = name; myLang = lang; 
  langA.value = lang;
  enterRemoteRoom(code);
});

function enterRemoteRoom(code) {
  currentRoomCode = code; hasJoinedOnce = false; shouldReconnect = true;
  $('remoteJoinOverlay').style.display = 'none'; setModeUI('remote');
  roomCodeLabel.textContent = code; onlineCount.textContent = '1/4'; chatEl.innerHTML = '';
  setStatus(`Connecting to ${code}...`);
  connectWebSocket(code);
}

function connectWebSocket(code) {
  if (ws) { try { ws.close(); } catch(e){} }
  ws = new WebSocket(WS_BASE + '/ws/' + code);
  
  ws.onopen = () => { 
    ws.send(JSON.stringify({ type: 'join', name: myName, lang: myLang })); 
    startPing(); 
  };
  
  ws.onmessage = handleWsMessage;
  
  ws.onerror = (e) => {
    console.error('WS Error', e);
    addMsg('⚠️ حدث خطأ في الاتصال بالسيرفر (WebSocket). قد يكون بسبب الشبكة.', 'bot');
  };

  ws.onclose = (ev) => {
    stopPing();
    console.log('WS closed', ev.code, ev.reason);
    
    if (!hasJoinedOnce) { 
      addMsg(`⚠️ فشل الاتصال بالغرفة. كود الخطأ: ${ev.code}`, 'bot');
      setStatus('فشل الاتصال');
      return; 
    }
    
    if (shouldReconnect && appMode === 'remote') {
      setStatus(`انقطع الاتصال. جارٍ إعادة المحاولة...`);
      wsReconnectTimer = setTimeout(() => connectWebSocket(code), 3000);
    }
  };
}

function handleWsMessage(ev) {
  const data = JSON.parse(ev.data);
  switch (data.type) {
    case 'joined':
      hasJoinedOnce = true; onlineCount.textContent = `${data.users.length}/4`;
      addMsg(`✅ انضممت للغرفة ${currentRoomCode}`, 'bot');
      if (data.users.length > 1) {
        startVideoCall().then(() => {
          if (pc) pc.createOffer().then(offer => { pc.setLocalDescription(offer); ws.send(JSON.stringify({ type: 'rtc-offer', offer: offer })); });
        });
      }
      break;
    case 'user_joined':
      addMsg(`👤 ${data.name} joined`, 'bot');
      startVideoCall();
      break;
    case 'translated':
      if (data.is_mine) return;
      addMsg(`${data.from_name}: ${data.original}`, 'user-b', data.from_lang);
      if (data.translated && data.translated !== data.original) { addMsg(`→ ${data.translated}`, 'bot', myLang); speak(data.translated, myLang); } 
      else { speak(data.original, myLang); }
      break;
    case 'rtc-offer':
      startVideoCall().then(async () => {
        if (!pc) return;
        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'rtc-answer', answer: answer }));
      });
      break;
    case 'rtc-answer':
      if (pc) pc.setRemoteDescription(new RTCSessionDescription(data.answer));
      break;
    case 'rtc-ice':
      if (pc) pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => {});
      break;
    case 'error':
      addMsg(`⚠️ ${data.message}`, 'bot');
      break;
  }
}

function sendRemoteMessage(text) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'message', text })); }
function startPing() { stopPing(); pingInterval = setInterval(() => { if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'ping'})); }, 30000); }
function stopPing() { if (pingInterval) clearInterval(pingInterval); }

leaveRoomBtn.addEventListener('click', () => {
  shouldReconnect = false; if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
  stopPing(); if (ws) ws.close();
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (pc) { pc.close(); pc = null; }
  videoContainer.style.display = 'none'; videoContainer.classList.remove('fullscreen'); remoteVideo.srcObject = null; localVideo.srcObject = null;
  appMode = 'none'; setModeUI('none'); remoteBar.style.display = 'none'; topHeader.style.display = 'flex';
  chatEl.innerHTML = ''; currentRoomCode = ''; $('landingOverlay').style.display = 'flex';
});

function unlockMics() {
  activeSpeaker = null;
  micA.disabled = false; micB.disabled = false; remoteMicBtn.disabled = false;
  micA.classList.remove('recording'); micB.classList.remove('recording'); remoteMicBtn.classList.remove('recording');
  if (!isBotTalking) resetStatus();
}
function stopAudio() {
  currentSpeechId++;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  isBotTalking = false;
}
async function speak(text, lang) {
  if (isLocked) return; stopAudio(); isBotTalking = true;
  const myId = ++currentSpeechId; setStatus('Speaking...');
  try {
    const res = await fetch(TTS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, lang, voice: voiceSelect.value, session_id: SESSION_ID }) });
    if (res.ok) {
      const blob = await res.blob(); if (myId !== currentSpeechId) return;
      currentAudio = new Audio(URL.createObjectURL(blob));
      currentAudio.onended = () => { isBotTalking = false; unlockMics(); };
      await currentAudio.play(); return;
    }
  } catch (e) { console.warn('Server TTS failed'); }
  speakBrowser(text, lang, myId);
}
function speakBrowser(text, lang, myId) {
  const u = new SpeechSynthesisUtterance(text); u.lang = localeFor(lang);
  u.onend = () => { if (myId === currentSpeechId) { isBotTalking = false; unlockMics(); } };
  speechSynthesis.speak(u);
}
