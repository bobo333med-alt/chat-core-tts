<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>vibe-core</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: Tahoma, sans-serif; background: #0ea5e9; color: #fff; display: flex; flex-direction: column; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); height: 100dvh; }
  
  #uploadBtn { position: fixed; top: 15px; left: 15px; width: 50px; height: 35px; border-radius: 8px; background: #ffffff; border: 2px solid #cbd5e1; color: #eab308; font-size: 18px; cursor: pointer; z-index: 1000; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .top-bar { display: flex; justify-content: center; align-items: flex-start; margin-bottom: 10px; flex-shrink: 0; gap: 5px; }
  .lang-controls { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; flex: 1; }
  .lang-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .lang-label { font-size: 9px; color: #0f172a; font-weight: bold; }
  .lang-select { padding: 4px; border-radius: 6px; background: #0f172a; color: #ffffff; border: 1px solid #1e293b; font-size: 10px; font-family: Tahoma; outline: none; width: 70px; }
  .lang-select option { background-color: #0f172a; color: #ffffff; }
  
  #avatar-wrap { width: 180px; height: 180px; margin: 0 auto 12px; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.3s; }
  #avatar-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; transition: border-color 0.3s; }
  #avatar-ring.talking { border-color: #22c55e; animation: ring-pulse 1s infinite; }
  #avatar-ring.thinking { border-color: #eab308; border-top-color: transparent; animation: spin 1s linear infinite; }
  #avatar-ring.listening { border-color: #ef4444; animation: ring-pulse 0.6s infinite; }
  @keyframes ring-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: 0.7; } }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  #avatar-container { width: 160px; height: 160px; border-radius: 50%; overflow: hidden; position: relative; background: #1e293b; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 25px rgba(0,0,0,0.3); z-index: 1; transition: all 0.3s; cursor: pointer; }
  #avatar-logo, #avatar-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #avatar-video { display: none; }
  
  #avatar-wrap.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: #000; margin: 0; }
  #avatar-wrap.fullscreen #avatar-container { width: 95vmin; height: 95vmin; }
  #avatar-wrap.fullscreen #avatar-ring { width: 98vmin; height: 98vmin; top: 50%; left: 50%; transform: translate(-50%, -50%); inset: auto; border-width: 5px; }
  #avatar-wrap.fullscreen #closeFullscreen { display: flex; }
  #avatar-wrap.fullscreen #fsMicBtn { display: flex; }
  
  #closeFullscreen { display: none; position: fixed; top: 20px; right: 20px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); color: #fff; font-size: 26px; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; z-index: 10000; align-items: center; justify-content: center; }
  #fsMicBtn { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; border-radius: 50%; background: #6366f1; border: 4px solid rgba(255,255,255,0.2); color: #fff; font-size: 36px; cursor: pointer; z-index: 10000; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(99,102,241,0.8); }
  #fsMicBtn.recording { background: #ef4444; animation: pulse 0.8s infinite; }
  
  #wave { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 0; overflow: hidden; transition: height 0.3s; margin-bottom: 8px; flex-shrink: 0; }
  #wave.on { height: 26px; }
  #wave span { width: 3px; background: #22c55e; border-radius: 2px; animation: wave-bar 0.6s infinite ease-in-out; }
  #wave span:nth-child(1) { animation-delay: 0s; } #wave span:nth-child(2) { animation-delay: 0.1s; } #wave span:nth-child(3) { animation-delay: 0.2s; } #wave span:nth-child(4) { animation-delay: 0.3s; } #wave span:nth-child(5) { animation-delay: 0.4s; }
  @keyframes wave-bar { 0%, 100% { height: 6px; } 50% { height: 26px; } }
  
  #chat { flex: 1; background: #1e293b; border-radius: 12px; padding: 12px; overflow-y: auto; margin-bottom: 10px; min-height: 100px; position: relative; }
  .msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; max-width: 85%; line-height: 1.6; word-wrap: break-word; font-size: 15px; }
  .user { background: #4f46e5; margin-left: auto; } .bot { background: #334155; margin-right: auto; }
  .lang-tag { display: inline-block; font-size: 10px; padding: 2px 6px; background: rgba(255,255,255,0.15); border-radius: 6px; margin-right: 6px; opacity: 0.8; font-weight: bold; }
  
  #imagePreviewContainer { display: none; padding: 5px 10px; background: #1e293b; border-radius: 10px; margin-bottom: 5px; align-items: center; gap: 10px; width: fit-content; }
  #imagePreview { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; }
  #cancelImageBtn { background: #dc2626; border: none; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  
  #actionMenu { display: none; position: fixed; bottom: 70px; right: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); flex-direction: column; gap: 8px; }
  .action-btn { padding: 10px 15px; border-radius: 8px; border: none; background: #0f172a; color: #fff; font-size: 14px; cursor: pointer; text-align: right; display: flex; align-items: center; gap: 10px; transition: background 0.2s; }
  .action-btn:hover { background: #334155; }
  
  #musicMenu { display: none; position: fixed; bottom: 70px; right: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 220px; max-height: 280px; overflow-y: auto; }
  #musicMenu h4 { font-size: 12px; margin-bottom: 8px; text-align: center; color: #94a3b8; }
  .music-item { padding: 8px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 4px; background: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-item:hover { background: #334155; } .music-item.active { background: #0ea5e9; color: #fff; font-weight: bold; } .music-item.add-more { background: #22c55e; text-align: center; font-weight: bold; } .music-item.stop-btn { background: #991b1b; text-align: center; font-weight: bold; margin-bottom: 8px; }
  
  .row { display: flex; gap: 4px; align-items: center; flex-shrink: 0; position: relative; }
  input[type=text] { flex: 1; padding: 10px; border-radius: 24px; border: 1px solid #1e293b; background: #ffffff; color: #000; font-size: 14px; min-width: 40px; order: 3; }
  button.btn { padding: 0; border: none; border-radius: 50%; color: #fff; font-size: 16px; font-weight: bold; width: 40px; height: 40px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background 0.3s; }
  button.btn:disabled { background: #475569; cursor: not-allowed; }
  
  #imageBtn { background: #10b981; order: 1; } #micBtn { background: #6366f1; order: 2; } #micBtn.recording { background: #ef4444; animation: pulse 0.8s infinite; }
  #translateModeBtn { background: #475569; order: 4; } #translateModeBtn.active { background: #eab308; color: #000; box-shadow: 0 0 10px #eab308; } 
  #sendBtn { background: #1d4ed8; order: 5; position: relative; }
  #sendBtn svg { width: 20px; height: 20px; fill: white; transform: translateX(-2px) translateY(2px); }
  
  #clearBtn { position: fixed; bottom: 80px; left: 15px; width: 35px; height: 35px; border-radius: 50%; background: #991b1b; border: 2px solid #7f1d1d; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #status { text-align: center; font-size: 12px; color: #0f172a; margin-top: 6px; min-height: 18px; flex-shrink: 0; font-weight: bold; }
  
  body.fs-active .top-bar, body.fs-active #chat, body.fs-active #wave, body.fs-active .row, body.fs-active #status, body.fs-active #imagePreviewContainer, body.fs-active #uploadBtn, body.fs-active #musicMenu, body.fs-active #clearBtn, body.fs-active #actionMenu { display: none; }
  body.fs-active #avatar-wrap { margin: 0; }
</style>
</head>
<body>

<button id="uploadBtn" title="تحميل فيديو للأفاتار">📁</button>

<div class="top-bar">
  <div class="lang-controls">
    <div class="lang-group">
      <span class="lang-label">Language A</span>
      <select id="micLang" class="lang-select">
        <option value="ar">Arabic</option>
        <option value="fr">French</option>
        <option value="en">English</option>
        <option value="tr">Turkish</option>
        <option value="it">Italian</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
        <option value="zh">Chinese</option>
        <option value="ja">Japanese</option>
      </select>
    </div>
    <div class="lang-group">
      <span class="lang-label">Language B</span>
      <select id="replyLang" class="lang-select">
        <option value="fr">French</option>
        <option value="ar">Arabic</option>
        <option value="en">English</option>
        <option value="tr">Turkish</option>
        <option value="it">Italian</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
        <option value="zh">Chinese</option>
        <option value="ja">Japanese</option>
      </select>
    </div>
    <div class="lang-group">
      <span class="lang-label">Voice</span>
      <select id="voiceSelect" class="lang-select">
        <option value="man">👨 Man</option>
        <option value="woman">👩 Woman</option>
        <option value="girl">👧 Girl</option>
        <option value="child">🧒 Child</option>
        <option value="oldman">👴 Old</option>
        <option value="oldwoman">👵 Old W</option>
      </select>
    </div>
  </div>
</div>

<div id="avatar-wrap">
  <div id="avatar-ring"></div>
  <div id="avatar-container">
    <img id="avatar-logo" src="https://cdn.jsdelivr.net/gh/bobo333med-alt/vibe-core@main/image_bb189f9b%20%281%29.jpg" alt="vibe-core logo">
    <video id="avatar-video" autoplay loop muted playsinline></video>
  </div>
  <button id="closeFullscreen" title="Close">✕</button>
  <button id="fsMicBtn" title="Talk">🎤</button>
  <input type="file" id="videoUpload" accept="video/*" style="display: none;">
</div>

<div id="wave"></div>
<div id="chat"></div>
<button id="clearBtn" title="Clear Chat">🗑️</button>

<div id="imagePreviewContainer">
  <img id="imagePreview" src="" alt="Preview">
  <button id="cancelImageBtn">✕</button>
</div>

<div id="actionMenu">
  <button class="action-btn" id="menuCamera">📸 كاميرا</button>
  <button class="action-btn" id="menuGallery">🖼️ صور</button>
  <button class="action-btn" id="menuMusic">🎵 موسيقى</button>
</div>

<audio id="bgAudio"></audio>
<input type="file" id="audioUpload" accept="audio/*" multiple style="display: none;">
<input type="file" id="cameraUpload" accept="image/*" capture="environment" style="display: none;">
<div id="musicMenu">
  <h4>🎵 قائمة الأغاني</h4>
  <div id="musicList"></div>
</div>

<div class="row">
  <button class="btn" id="imageBtn" title="Options">📷</button>
  <button class="btn" id="micBtn" title="Talk">🎤</button>
  <input type="text" id="textInput" placeholder="Type..." />
  <button class="btn" id="translateModeBtn" title="Translator Mode">🌐</button>
  <button class="btn" id="sendBtn" title="Send"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
</div>
<div id="status">Ready</div>

<script>
'use strict';
// 🎯 روابط السيرفر (تأكد بلي Render خدم)
const SERVER_URL = "https://vibe-core-0m1r.onrender.com/chat";
const TRANSCRIBE_URL = "https://vibe-core-0m1r.onrender.com/transcribe"; 
const REQUEST_TIMEOUT_MS = 90000;
const MAX_TEXT_FILE_SIZE = 500 * 1024;
const HISTORY_LIMIT = 6;

const $ = id => document.getElementById(id);
const chatEl = $('chat'), inputEl = $('textInput'), sendBtn = $('sendBtn'), micBtn = $('micBtn'), fsMicBtn = $('fsMicBtn');
const clearBtn = $('clearBtn'), statusEl = $('status'), avatarWrap = $('avatar-wrap'), avatarRing = $('avatar-ring');
const avatarContainer = $('avatar-container'), avatarLogo = $('avatar-logo'), avatarVideo = $('avatar-video'), waveEl = $('wave');
const closeFullscreen = $('closeFullscreen'), micLang = $('micLang'), replyLang = $('replyLang'), voiceSelect = $('voiceSelect');
const translateModeBtn = $('translateModeBtn'), imageBtn = $('imageBtn'), actionMenu = $('actionMenu'), menuCamera = $('menuCamera');
const menuGallery = $('menuGallery'), menuMusic = $('menuMusic'), cameraUpload = $('cameraUpload'), audioUpload = $('audioUpload');
const bgAudio = $('bgAudio'), musicMenu = $('musicMenu'), musicList = $('musicList'), imagePreviewContainer = $('imagePreviewContainer');
const imagePreview = $('imagePreview'), cancelImageBtn = $('cancelImageBtn'), uploadBtn = $('uploadBtn'), videoUpload = $('videoUpload');

let attachedImageBase64 = null, attachedTextContent = null, chatHistory = [];
let isTranslatorMode = false, isRecording = false, isBotTalking = false, isSending = false;
let currentAudio = null, audioUnlocked = false, playlist = [], currentSongIndex = -1, cachedVoices = [], currentAvatarObjectUrl = null;
let mediaRecorder = null, audioChunks = [];

function setStatus(s) { statusEl.textContent = s; }
function resetStatus() { setStatus(isTranslatorMode ? '🌐 Translator Mode' : 'Ready'); }

function addMsg(text, who, lang) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  if (lang && isTranslatorMode) {
    const tag = document.createElement('span');
    tag.className = 'lang-tag'; tag.textContent = String(lang).toUpperCase(); div.appendChild(tag);
  }
  div.appendChild(document.createTextNode(text));
  chatEl.appendChild(div); chatEl.scrollTop = chatEl.scrollHeight;
}

function setAvatar(state) {
  avatarRing.className = '';
  if (state === 'talking') { avatarRing.classList.add('talking'); waveEl.classList.add('on'); }
  else if (state === 'thinking') { avatarRing.classList.add('thinking'); waveEl.classList.remove('on'); }
  else if (state === 'listening') { avatarRing.classList.add('listening'); waveEl.classList.remove('on'); }
  else { waveEl.classList.remove('on'); }
}

function fetchWithTimeout(url, options, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
}

function langNameFor(code) { return { 'ar': 'Arabic', 'en': 'English', 'fr': 'French', 'tr': 'Turkish', 'it': 'Italian', 'es': 'Spanish', 'de': 'German', 'zh': 'Chinese', 'ja': 'Japanese' }[code] || 'English'; }
function ttsLangCodeFor(code) { return { 'ar': 'ar-SA', 'fr': 'fr-FR', 'en': 'en-US', 'tr': 'tr-TR', 'it': 'it-IT', 'es': 'es-ES', 'de': 'de-DE', 'zh': 'zh-CN', 'ja': 'ja-JP' }[code] || 'en-US'; }

function pickBestVoice(voices, langCode) {
  if (!voices || voices.length === 0) return null;
  const langLower = langCode.toLowerCase(), langBase = langLower.split('-')[0];
  let candidates = voices.filter(v => v.lang.toLowerCase().startsWith(langLower));
  if (candidates.length === 0) candidates = voices.filter(v => v.lang.toLowerCase().split('-')[0] === langBase);
  if (candidates.length === 0) return null;
  const score = v => { let s = 0; const n = v.name.toLowerCase(); if (n.includes('google')) s += 80; if (n.includes('natural') || n.includes('neural')) s += 100; if (n.includes('premium') || n.includes('enhanced')) s += 50; return s; };
  candidates.sort((a, b) => score(b) - score(a)); return candidates[0];
}

function unlockAudio() {
  if (audioUnlocked) return;
  if ('speechSynthesis' in window) { try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {} }
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) {}
  audioUnlocked = true;
}
document.body.addEventListener('click', unlockAudio, { once: true });

for (let i = 0; i < 5; i++) waveEl.appendChild(document.createElement('span'));

function showAvatarVideo(src) { avatarLogo.style.display = 'none'; avatarVideo.style.display = 'block'; avatarVideo.src = src; avatarVideo.play().catch(() => {}); }

avatarContainer.addEventListener('click', function (e) { e.stopPropagation(); if (avatarWrap.classList.contains('fullscreen')) exitFullscreen(); else enterFullscreen(); });
avatarWrap.addEventListener('click', function () { if (avatarWrap.classList.contains('fullscreen')) exitFullscreen(); });
closeFullscreen.addEventListener('click', function (e) { e.stopPropagation(); exitFullscreen(); });
function enterFullscreen() { avatarWrap.classList.add('fullscreen'); document.body.classList.add('fs-active'); }
function exitFullscreen() { avatarWrap.classList.remove('fullscreen'); document.body.classList.remove('fs-active'); }

clearBtn.addEventListener('click', function (e) {
  e.stopPropagation(); chatEl.querySelectorAll('.msg').forEach(m => m.remove()); chatHistory = []; stopAudio(); addMsg('تم مسح المحادثة.', 'bot', 'ar');
});

translateModeBtn.addEventListener('click', function () { isTranslatorMode = !isTranslatorMode; translateModeBtn.classList.toggle('active', isTranslatorMode); resetStatus(); });

uploadBtn.addEventListener('click', () => { videoUpload.value = ''; videoUpload.click(); });
videoUpload.addEventListener('change', function (e) {
  const file = e.target.files[0]; if (!file || !file.type.startsWith('video/')) { setStatus('Video only!'); return; }
  if (currentAvatarObjectUrl) URL.revokeObjectURL(currentAvatarObjectUrl);
  currentAvatarObjectUrl = URL.createObjectURL(file); showAvatarVideo(currentAvatarObjectUrl); setStatus('Avatar updated!');
});

imageBtn.addEventListener('click', function (e) { e.stopPropagation(); actionMenu.style.display = (actionMenu.style.display === 'flex') ? 'none' : 'flex'; });
menuCamera.addEventListener('click', () => { actionMenu.style.display = 'none'; cameraUpload.value = ''; cameraUpload.click(); });
menuGallery.addEventListener('click', () => { actionMenu.style.display = 'none'; galleryInput.value = ''; galleryInput.click(); });
menuMusic.addEventListener('click', () => { actionMenu.style.display = 'none'; audioUpload.value = ''; audioUpload.click(); });

const galleryInput = document.createElement('input'); galleryInput.type = 'file'; galleryInput.accept = 'image/*,text/plain,.txt'; galleryInput.style.display = 'none';
galleryInput.addEventListener('change', handleImageSelection); document.body.appendChild(galleryInput);
cameraUpload.addEventListener('change', handleImageSelection);

function handleImageSelection(e) {
  const file = e.target.files[0]; if (!file) return;
  if (file.type.startsWith('image/')) {
    const reader = new FileReader(); reader.onload = ev => { attachedImageBase64 = ev.target.result; attachedTextContent = null; imagePreview.src = attachedImageBase64; imagePreviewContainer.style.display = 'flex'; setStatus('Image attached.'); }; reader.readAsDataURL(file); return;
  }
  const isText = file.type === 'text/plain' || file.name.toLowerCase().endsWith('.txt');
  if (!isText) { setStatus('Only images or .txt'); return; }
  const reader = new FileReader(); reader.onload = ev => { attachedImageBase64 = null; attachedTextContent = ev.target.result; imagePreview.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="%23fff"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>'; imagePreviewContainer.style.display = 'flex'; setStatus('File attached.'); }; reader.readAsText(file);
}

cancelImageBtn.addEventListener('click', function (e) { e.stopPropagation(); attachedImageBase64 = null; attachedTextContent = null; imagePreviewContainer.style.display = 'none'; resetStatus(); });

audioUpload.addEventListener('change', function (e) {
  const files = e.target.files; for (let i = 0; i < files.length; i++) playlist.push({ name: files[i].name, url: URL.createObjectURL(files[i]) });
  renderPlaylist(); musicMenu.style.display = 'block'; e.target.value = '';
});

function renderPlaylist() {
  musicList.innerHTML = ''; const stopBtn = document.createElement('div'); stopBtn.className = 'music-item stop-btn'; stopBtn.textContent = '🛑 إيقاف'; stopBtn.addEventListener('click', e => { e.stopPropagation(); stopMusic(); }); musicList.appendChild(stopBtn);
  const addBtn = document.createElement('div'); addBtn.className = 'music-item add-more'; addBtn.textContent = '➕ إضافة'; addBtn.addEventListener('click', e => { e.stopPropagation(); audioUpload.value = ''; audioUpload.click(); }); musicList.appendChild(addBtn);
  playlist.forEach((song, index) => { const div = document.createElement('div'); div.className = 'music-item'; div.dataset.index = index; div.textContent = song.name; if (index === currentSongIndex) div.classList.add('active'); div.addEventListener('click', e => { e.stopPropagation(); playSong(index); }); musicList.appendChild(div); });
}

function stopMusic() { bgAudio.pause(); bgAudio.currentTime = 0; bgAudio.removeAttribute('src'); bgAudio.load(); currentSongIndex = -1; musicList.querySelectorAll('.music-item[data-index]').forEach(el => el.classList.remove('active')); }
function playSong(index) { if (index < 0 || index >= playlist.length) return; const song = playlist[index]; if (currentSongIndex === index && !bgAudio.paused) { stopMusic(); return; } currentSongIndex = index; bgAudio.src = song.url; bgAudio.play().catch(() => {}); musicList.querySelectorAll('.music-item[data-index]').forEach(el => el.classList.remove('active')); const el = musicList.querySelector(`.music-item[data-index="${index}"]`); if (el) el.classList.add('active'); }
bgAudio.addEventListener('ended', function () { if (playlist.length === 0) return; const nextIndex = (currentSongIndex + 1) % playlist.length; playSong(nextIndex); });

document.addEventListener('click', function (e) { if (!actionMenu.contains(e.target) && !imageBtn.contains(e.target)) actionMenu.style.display = 'none'; if (!musicMenu.contains(e.target)) musicMenu.style.display = 'none'; });

function buildSystemPrompt(targetLang) {
  if (isTranslatorMode) {
    return `You are a literal translation engine. Your ONLY task is to translate the user's input.
Output ONLY the exact translated text. Do NOT answer, explain, or chat.`;
  }
  const langName = langNameFor(targetLang);
  return `You are vibe-core, a smart AI. Reply ONLY in ${langName}. Never mention AI.`;
}

// 🎯 دالة المايك الذكية (تسجل وتبعث للسيرفر)
async function toggleMic() {
  unlockAudio();
  
  if (isRecording) {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("المتصفح تاعك ما يدعمش المايك، ولا إنت تخدم في HTTP. لازم HTTPS ولا localhost.");
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    
    let options = { mimeType: 'audio/webm' };
    if (!MediaRecorder.isTypeSupported('audio/webm')) {
      if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };
      else if (MediaRecorder.isTypeSupported('audio/ogg')) options = { mimeType: 'audio/ogg' };
      else options = {}; 
    }

    mediaRecorder = new MediaRecorder(stream, options);
    audioChunks = [];

    mediaRecorder.ondataavailable = event => {
      if (event.data.size > 0) audioChunks.push(event.data);
    };

    mediaRecorder.onstop = async () => {
      isRecording = false;
      micBtn.classList.remove('recording');
      fsMicBtn.classList.remove('recording');
      setAvatar('thinking');
      setStatus('⏳ جاري تفريغ الصوت...');

      const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      const formData = new FormData();
      formData.append('file', audioBlob, 'voice.webm');

      try {
        const res = await fetchWithTimeout(TRANSCRIBE_URL, { method: 'POST', body: formData }, REQUEST_TIMEOUT_MS);
        
        if (!res.ok) throw new Error("السيرفر رفض الصوت (كود " + res.status + "). تأكد بلي زدت python-multipart.");

        const data = await res.json();
        
        if (data.text && data.language) {
          addMsg(data.text, 'user', data.language);
          ask(data.text, data.language);
        } else {
          setStatus('ما سمعتش مليح، عاود.');
          setAvatar('idle');
        }
      } catch (e) {
        addMsg('Error: ' + e.message, 'bot', 'en');
        setStatus('Error');
        setAvatar('idle');
      }
    };

    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add('recording');
    fsMicBtn.classList.add('recording');
    setStatus('🎙️ أحكي توة...');
    setAvatar('listening');

  } catch (err) {
    if (err.name === 'NotAllowedError') alert('حظرت المايك! أمشي لإعدادات المتصفح وسمح بالمايك.');
    else alert('ما نجمناش نوصلو للمايك: ' + err.message);
    console.error(err);
  }
}

micBtn.addEventListener('click', toggleMic);
fsMicBtn.addEventListener('click', e => { e.stopPropagation(); toggleMic(); });

async function ask(text, detectedLang) {
  if (isSending) return;
  isSending = true;
  sendBtn.disabled = true;
  setStatus(isTranslatorMode ? '🌐 Translating...' : 'Processing...');
  setAvatar('thinking');
  stopAudio();

  const micLangBase = micLang.value;
  const replyLangBase = replyLang.value;
  let finalTargetLang = replyLangBase;

  if (isTranslatorMode) {
    if (detectedLang === micLangBase || detectedLang.startsWith(micLangBase)) {
      finalTargetLang = replyLangBase; 
    } else {
      finalTargetLang = micLangBase; 
    }
  }

  const systemPrompt = buildSystemPrompt(finalTargetLang);
  const messages = [{ role: 'system', content: systemPrompt }];

  if (!isTranslatorMode) {
    chatHistory.slice(-HISTORY_LIMIT).forEach(m => messages.push({ role: m.role, content: m.content }));
  }

  let finalText = text || '';
  if (attachedTextContent) finalText = attachedTextContent;

  let userContent;
  if (attachedImageBase64) {
    userContent = [{ type: 'text', text: finalText || 'Translate this image.' }, { type: 'image_url', image_url: { url: attachedImageBase64 } }];
  } else {
    userContent = finalText;
  }
  messages.push({ role: 'user', content: userContent });

  let reply = null;

  try {
    const res = await fetchWithTimeout(SERVER_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: messages, is_vision: attachedImageBase64 != null })
    }, REQUEST_TIMEOUT_MS);

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || `Server error (${res.status})`);
    reply = data.reply;

  } catch (e) {
    if (e.name === 'AbortError') { addMsg('⏱️ الخادم بطيء.', 'bot', 'ar'); setStatus('Timeout'); } 
    else { addMsg('Error: ' + e.message, 'bot', 'en'); setStatus('Error'); }
    setAvatar('idle');
  } finally {
    isSending = false; sendBtn.disabled = false;

    if (reply) {
      reply = reply.trim().replace(/^"|"$/g, '');
      addMsg(reply, 'bot', finalTargetLang); 
      resetStatus();
      speak(reply, finalTargetLang);

      if (!isTranslatorMode) {
        let historyText = text || '';
        if (attachedImageBase64) historyText = '[Image] ' + historyText;
        if (historyText) { chatHistory.push({ role: 'user', content: historyText }); chatHistory.push({ role: 'assistant', content: reply }); if(chatHistory.length > HISTORY_LIMIT) chatHistory = chatHistory.slice(-HISTORY_LIMIT); }
      }
      attachedImageBase64 = null; attachedTextContent = null; imagePreviewContainer.style.display = 'none';
    }
  }
}

function send() {
  unlockAudio();
  if (isSending) return;
  const t = inputEl.value.trim();
  if (!t && !attachedImageBase64 && !attachedTextContent) return;
  
  const detectedLang = micLang.value; 
  let displayTxt = t;
  if (attachedImageBase64) displayTxt = t ? '📷 ' + t : '📷 [Image]';
  if (attachedTextContent) displayTxt = t ? '📄 ' + t : '📄 [File]';
  
  addMsg(displayTxt, 'user', detectedLang); 
  inputEl.value = '';
  ask(t, detectedLang);
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); send(); } });

function stopAudio() { if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; } if ('speechSynthesis' in window) speechSynthesis.cancel(); setAvatar('idle'); resetStatus(); isBotTalking = false; }

function speak(text, lang) {
  if (!text) return;
  stopAudio(); isBotTalking = true;
  if (!bgAudio.paused) bgAudio.pause();

  let textToSpeak = text.replace(/[*_#`~|\\\/<>]/g, ' ').replace(/[ًٌٍَُِّْ]/g, '').replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').replace(/\s+/g, ' ').trim();
  if (!textToSpeak) { isBotTalking = false; return; }

  setAvatar('thinking'); setStatus('Preparing voice...');

  if (!('speechSynthesis' in window)) { speakFallback(textToSpeak, lang); return; }

  const langCode = ttsLangCodeFor(lang);
  const voices = cachedVoices.length ? cachedVoices : speechSynthesis.getVoices();
  const bestVoice = pickBestVoice(voices, langCode);

  const u = new SpeechSynthesisUtterance(textToSpeak);
  if (bestVoice) u.voice = bestVoice;
  u.lang = bestVoice ? bestVoice.lang : langCode;

  const v = voiceSelect.value;
  if (v === 'woman') { u.pitch = 1.1; u.rate = 1.0; } else if (v === 'girl') { u.pitch = 1.35; u.rate = 1.05; } else if (v === 'child') { u.pitch = 1.55; u.rate = 1.15; } else if (v === 'oldman') { u.pitch = 0.75; u.rate = 0.9; } else if (v === 'oldwoman') { u.pitch = 1.0; u.rate = 0.9; } else { u.pitch = 1.0; u.rate = 0.95; }

  u.onstart = () => { setAvatar('talking'); setStatus('Speaking...'); };
  u.onended = () => { setAvatar('idle'); resetStatus(); isBotTalking = false; };
  u.onerror = () => speakFallback(textToSpeak, lang);

  speechSynthesis.speak(u);
}

function speakFallback(text, lang) {
  const url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' + lang + '&q=' + encodeURIComponent(text);
  const audio = new Audio(url); currentAudio = audio;
  audio.onplaying = () => { setAvatar('talking'); setStatus('Speaking...'); };
  const done = () => { setAvatar('idle'); resetStatus(); isBotTalking = false; };
  audio.onended = done; audio.onerror = done; audio.play().catch(done);
}

if ('speechSynthesis' in window) { const loadVoices = () => { cachedVoices = speechSynthesis.getVoices(); }; loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

addMsg('عسلامة! أنا vibe-core. اضغط على المايك وحكي بأي لغة تحب، وأنا نترجملك ونقرالك بالصوت.', 'bot', 'ar');
</script>
