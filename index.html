<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار Firebase</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<style>
body { background: #0f0f1e; color: #fff; font-family: Arial; padding: 20px; text-align: center; }
input { padding: 12px; margin: 5px; border-radius: 8px; border: 1px solid #333; background: #1a1a2e; color: #fff; width: 80%; }
button { padding: 12px 30px; margin: 5px; border-radius: 8px; border: none; background: #0084ff; color: #fff; font-size: 16px; cursor: pointer; }
#msg { margin-top: 20px; padding: 10px; border-radius: 8px; min-height: 20px; }
</style>
</head>
<body>
<h1>🧪 اختبار Firebase</h1>
<input type="email" id="email" placeholder="البريد">
<input type="password" id="pass" placeholder="كلمة المرور">
<br>
<button id="loginBtn">دخول</button>
<button id="registerBtn">تسجيل جديد</button>
<div id="msg"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCCp08HOuP4vpXlvBkzjOgGAwQoeTsOKJ8",
  authDomain: "chat-core-app.firebaseapp.com",
  projectId: "chat-core-app",
  storageBucket: "chat-core-app.firebasestorage.app",
  messagingSenderId: "216958872856",
  appId: "1:216958872856:web:f03d559611b327c91b426d"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const msg = document.getElementById('msg');

msg.textContent = "✅ Firebase تم تحميله";

document.getElementById('loginBtn').addEventListener('click', async () => {
  msg.textContent = "⏳ جاري...";
  try {
    await auth.signInWithEmailAndPassword(
      document.getElementById('email').value,
      document.getElementById('pass').value
    );
    msg.textContent = "✅ تم الدخول بنجاح!";
  } catch(e) {
    msg.textContent = "❌ " + e.message;
  }
});

document.getElementById('registerBtn').addEventListener('click', async () => {
  msg.textContent = "⏳ جاري إنشاء الحساب...";
  try {
    await auth.createUserWithEmailAndPassword(
      document.getElementById('email').value,
      document.getElementById('pass').value
    );
    msg.textContent = "✅ تم إنشاء الحساب!";
  } catch(e) {
    msg.textContent = "❌ " + e.message;
  }
});

auth.onAuthStateChanged(user => {
  if(user) msg.textContent += " | 👤 " + user.email;
});
</script>
</body>
</html>
