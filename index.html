<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat-Core - Messenger</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #0f0f1e;
  --header: #1a1a2e;
  --sidebar: #16162a;
  --bubble-sender: #0084ff;
  --bubble-receiver: #3a3a4a;
  --border: rgba(255,255,255,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: radial-gradient(circle at 50% 0%, #1a2a6c 0%, #0d1b3e 50%, #050a1f 100%);
  color: #fff;
  height: 100dvh;
}

/* AUTH */
#authOverlay {
  position: fixed; inset: 0; background: rgba(13, 27, 62, 0.95);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999999; backdrop-filter: blur(20px);
}
.auth-box {
  background: rgba(26, 42, 108, 0.6); backdrop-filter: blur(20px);
  padding: 30px 20px; border-radius: 24px; width: 90%; max-width: 380px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2); text-align: center;
}
.auth-box h1 { color: #00f0ff; margin-bottom: 5px; font-size: 28px; text-shadow: 0 0 15px rgba(0,240,255,0.6); }
.auth-box h2 { color: #fff; margin-bottom: 20px; font-size: 18px; font-weight: normal; }
.auth-input {
  width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4);
  color: #fff; outline: none; font-size: 14px; transition: 0.3s;
}
.auth-input:focus { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0,240,255,0.3); }
.auth-btn {
  width: 100%; padding: 14px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff;
  font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; font-size: 15px;
  box-shadow: 0 4px 15px rgba(0,176,155,0.4);
}
.auth-btn:hover { transform: translateY(-2px); }
.auth-btn-outline {
  width: 100%; padding: 14px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.3); background: transparent;
  color: #fff; cursor: pointer; transition: 0.3s; font-size: 15px;
}
.auth-btn-outline:hover { background: rgba(255,255,255,0.1); }
#authError { color: #ff6b6b; font-size: 13px; margin-bottom: 10px; min-height: 18px; }

/* MODE SELECTION */
#modeSelection {
  display: none; position: fixed; inset: 0; background: transparent;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 15px; z-index: 99999; padding: 20px; overflow-y: auto;
}
#modeSelection.active { display: flex; }
#modeSelection h1 { font-size: 32px; color: #00f0ff; margin-bottom: 5px; text-shadow: 0 0 15px rgba(0,240,255,0.4); }
#modeSelection p { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 10px; }
.mode-btn {
  padding: 16px 20px; font-size: 16px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.2); color: #fff; cursor: pointer;
  width: 100%; max-width: 280px; font-weight: bold;
  backdrop-filter: blur(10px); transition: all 0.3s;
  box-shadow: inset 0 0 10px rgba(255,255,255,0.1), 0 4px 15px rgba(0,0,0,0.3);
  background: rgba(255,255,255,0.05);
}
.mode-btn:active { transform: scale(0.96); }
.mode-btn.face { border-color: rgba(138, 43, 226, 0.5); background: linear-gradient(90deg, rgba(138,43,226,0.2), rgba(0,0,0,0)); }
.mode-btn.remote { border-color: rgba(46, 139, 87, 0.5); background: linear-gradient(90deg, rgba(46,139,87,0.2), rgba(0,0,0,0)); }
.mode-btn.logout { border-color: rgba(255, 69, 0, 0.5); background: linear-gradient(90deg, rgba(255,69,0,0.2), rgba(0,0,0,0)); margin-top: 10px; }

/* MAIN APP */
#app { display: none; height: 100vh; flex-direction: column; }
#app.active { display: flex; }

/* HEADER */
.header {
  background: var(--header); padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border); height: 56px; flex-shrink: 0;
}
.header-btn {
  background: none; border: none; color: #fff; font-size: 20px;
  cursor: pointer; padding: 8px; border-radius: 50%; transition: 0.3s;
}
.header-btn:hover { background: rgba(255,255,255,0.1); }
.header-btn.active { color: #00f0ff; }
.header-info { flex: 1; min-width: 0; }
.header-title { font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
.mode-indicator {
  font-size: 10px; padding: 2px 7px; border-radius: 10px;
  background: rgba(0,240,255,0.2); color: #00f0ff; font-weight: bold;
}
.header-status { font-size: 11px; color: rgba(255,255,255,0.6); }

/* FACE-TO-FACE CONTROLS */
.face-controls {
  display: none; background: var(--header); padding: 10px;
  border-bottom: 1px solid var(--border); gap: 8px; flex-shrink: 0;
}
.face-controls.active { display: flex; flex-wrap: wrap; }
.face-row { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 140px; }
.face-row label { font-size: 10px; color: rgba(255,255,255,0.6); }
.face-row select {
  flex: 1; padding: 6px 8px; border-radius: 8px;
  border: 1px solid var(--border); background: rgba(0,0,0,0.4);
  color: #fff; font-size: 12px; outline: none;
}
.face-mic {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  font-size: 18px; cursor: pointer; transition: 0.3s;
  display: flex; align-items: center; justify-content: center;
}
.face-mic.a { background: #6366f1; color: #fff; }
.face-mic.b { background: #10b981; color: #fff; }
.face-mic.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; }

/* SIDEBAR */
.sidebar {
  position: fixed; top: 56px; right: 0; bottom: 0; width: 280px;
  background: var(--sidebar); border-left: 1px solid var(--border);
  transform: translateX(100%); transition: transform 0.3s;
  z-index: 100; overflow-y: auto;
}
.sidebar.open { transform: translateX(0); }
.sidebar-header {
  padding: 12px 15px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.sidebar-header h3 { font-size: 15px; }
.sidebar-header button {
  background: #0084ff; border: none; color: #fff;
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px;
}
.friend-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.05);
  transition: 0.3s;
}
.friend-item:hover { background: rgba(255,255,255,0.05); }
.friend-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, #0084ff, #0066cc);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: bold; flex-shrink: 0;
}
.friend-info { flex: 1; min-width: 0; }
.friend-name { font-size: 13px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.friend-status { font-size: 11px; color: rgba(255,255,255,0.6); }
.friend-actions { display: flex; gap: 4px; }
.friend-action {
  background: none; border: none; color: rgba(255,255,255,0.6);
  font-size: 16px; cursor: pointer; padding: 4px; border-radius: 50%; transition: 0.3s;
}
.friend-action:hover { background: rgba(255,255,255,0.1); color: #fff; }
.friend-action.call { color: #0084ff; }
.friend-action.delete { color: #ff4444; }

/* CHAT AREA */
.chat-area {
  flex: 1; overflow-y: auto; padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.msg {
  max-width: 78%; padding: 10px 14px; border-radius: 16px;
  font-size: 14px; line-height: 1.5; word-wrap: break-word;
  cursor: pointer; transition: 0.3s; user-select: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.msg:active { opacity: 0.7; }
.msg.user-a {
  align-self: flex-end; background: var(--bubble-sender); color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.user-b {
  align-self: flex-start; background: var(--bubble-receiver); color: #fff;
  border-bottom-left-radius: 4px;
}
.msg.bot {
  align-self: center; background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.8); font-style: italic; font-size: 12px; max-width: 85%;
}
.msg.playing { box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); border: 2px solid #00f0ff; }
.msg img { max-width: 150px; border-radius: 8px; display: block; margin-top: 5px; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; }
.lang-tag {
  display: inline-block; font-size: 9px; padding: 2px 5px;
  background: rgba(255,255,255,0.2); border-radius: 5px;
  margin-left: 5px; font-weight: bold;
}

/* FOOTER */
.footer {
  background: var(--header); padding: 8px 10px;
  display: flex; align-items: center; gap: 8px;
  border-top: 1px solid var(--border); height: 64px; flex-shrink: 0;
}
.footer-btn {
  background: none; border: none; color: #fff; font-size: 22px;
  cursor: pointer; padding: 8px; border-radius: 50%; transition: 0.3s;
}
.footer-btn:hover { background: rgba(255,255,255,0.1); }
.footer-btn.mic {
  background: #0084ff; width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.footer-btn.mic.recording { background: #ff4444; animation: pulse 1s infinite; }
.footer-input {
  flex: 1; background: rgba(255,255,255,0.1);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 10px 14px; color: #fff; font-size: 14px; outline: none; transition: 0.3s;
}
.footer-input:focus { border-color: #0084ff; }
.footer-send {
  background: #0084ff; border: none; color: #fff;
  width: 42px; height: 42px; border-radius: 50%;
  cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center; transition: 0.3s;
}
.footer-send:hover { background: #0066cc; transform: scale(1.1); }
.footer-send:disabled { background: #666; cursor: not-allowed; transform: none; }

/* AVATAR */
#avatarWrap {
  width: 90px; height: 90px; margin: 8px auto;
  position: relative; cursor: pointer;
}
#avatarContainer {
  width: 100%; height: 100%; border-radius: 50%;
  overflow: hidden; background: #1e293b;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 20px rgba(0,240,255,0.2);
  border: 2px solid rgba(255,255,255,0.2);
}
#avatarLogo, #avatarVideo { width: 100%; height: 100%; object-fit: cover; display: block; }
#avatarVideo { display: none; }

/* STATUS */
#status {
  position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%);
  background: rgba(0, 240, 255, 0.9); color: #fff;
  padding: 6px 14px; border-radius: 18px; font-size: 12px;
  z-index: 1001; display: none; backdrop-filter: blur(10px);
  font-weight: bold;
}
#status.show { display: block; }

/* MODAL */
.modal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.8); z-index: 10000;
  align-items: center; justify-content: center;
}
.modal.active { display: flex; }
.modal-content {
  background: var(--sidebar); padding: 22px; border-radius: 16px;
  width: 90%; max-width: 340px; border: 1px solid var(--border);
}
.modal-content h3 { margin-bottom: 12px; font-size: 17px; }
.modal-content input, .modal-content select {
  width: 100%; padding: 11px; margin: 6px 0; border-radius: 8px;
  border: 1px solid var(--border); background: rgba(0,0,0,0.3);
  color: #fff; font-size: 13px; outline: none;
}
.modal-content button {
  width: 100%; padding: 11px; margin: 5px 0; border-radius: 8px;
  border: none; background: #0084ff; color: #fff;
  font-weight: bold; cursor: pointer; transition: 0.3s;
}
.modal-content button:hover { background: #0066cc; }
.modal-content button.cancel { background: #666; }

/* CALL OVERLAY */
#callOverlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.95); z-index: 99999;
  flex-direction: column; align-items: center; justify-content: center; gap: 25px;
}
#callOverlay.active { display: flex; }
.call-avatar {
  width: 130px; height: 130px; border-radius: 50%;
  background: linear-gradient(135deg, #0084ff, #0066cc);
  display: flex; align-items: center; justify-content: center;
  font-size: 55px; animation: ringPulse 1.5s infinite;
}
.call-name { font-size: 24px; font-weight: bold; }
.call-status { font-size: 14px; color: rgba(255,255,255,0.7); }
.call-actions { display: flex; gap: 35px; }
.call-btn {
  width: 65px; height: 65px; border-radius: 50%;
  border: none; font-size: 26px; cursor: pointer; transition: 0.3s;
}
.call-btn.accept { background: #00c853; color: #fff; }
.call-btn.decline { background: #ff4444; color: #fff; }
.call-btn:hover { transform: scale(1.1); }

/* MEDIA MENU */
#mediaMenu {
  display: none; position: fixed; bottom: 75px; left: 10px;
  background: var(--sidebar); border: 1px solid var(--border);
  border-radius: 12px; padding: 8px; z-index: 1001;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.media-option {
  display: block; width: 100%; padding: 9px 12px; background: none;
  border: none; color: #fff; font-size: 13px; cursor: pointer;
  text-align: right; border-radius: 8px; transition: 0.3s;
}
.media-option:hover { background: rgba(255,255,255,0.1); }

/* MUSIC MENU */
#musicMenu {
  display: none; position: fixed; bottom: 75px; right: 10px;
  background: var(--sidebar); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px; z-index: 1001;
  width: 200px; max-height: 280px; overflow-y: auto;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
#musicMenu h4 { font-size: 12px; margin-bottom: 8px; text-align: center; color: #00f0ff; }
.music-item {
  padding: 7px; border-radius: 7px; cursor: pointer; font-size: 12px;
  margin-bottom: 4px; background: rgba(255,255,255,0.05);
  display: flex; justify-content: space-between; align-items: center; transition: 0.2s;
}
.music-item:hover { background: rgba(255,255,255,0.15); }
.music-item.active { background: rgba(0, 240, 255, 0.2); color: #00f0ff; font-weight: bold; }

/* ANIMATIONS */
@keyframes pulse { 50% { transform: scale(1.1); } }
@keyframes ringPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 132, 255, 0.7); }
  50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(0, 132, 255, 0); }
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="authOverlay">
  <div class="auth-box">
    <h1>🌐 Chat-Core</h1>
    <h2 id="authTitle">تسجيل الدخول</h2>
    <div id="authError"></div>
    <input type="email" id="authEmail" class="auth-input" placeholder="البريد الإلكتروني">
    <input type="password" id="authPassword" class="auth-input" placeholder="كلمة المرور">
    <button id="authSubmitBtn" class="auth-btn">دخول</button>
    <button id="authToggleBtn" class="auth-btn-outline">إنشاء حساب جديد</button>
  </div>
</div>

<!-- MODE SELECTION -->
<div id="modeSelection">
  <h1>🌐 Chat-Core</h1>
  <p>اختر وضع التشغيل</p>
  <button class="mode-btn face" id="btnFace">🌐 Face-to-Face</button>
  <button class="mode-btn remote" id="btnRemote">💬 Remote Mode (Messenger)</button>
  <button class="mode-btn logout" id="btnLogout">🚪 تسجيل الخروج</button>
</div>

<!-- MAIN APP -->
<div id="app">
  <!-- HEADER -->
  <div class="header">
    <button class="header-btn" id="toggleSidebar" style="display:none;">☰</button>
    <div class="header-info">
      <div class="header-title">
        <span class="mode-indicator" id="modeIndicator">FACE</span>
        <span id="headerTitle">Chat-Core</span>
      </div>
      <div class="header-status" id="headerStatus">جاهز</div>
    </div>
    <button class="header-btn" id="transToggle" title="الترجمة">🌐</button>
    <button class="header-btn" id="clearChatBtn" title="مسح">🗑️</button>
    <button class="header-btn" id="backToModeBtn" title="الوضع">🔄</button>
  </div>

  <!-- FACE-TO-FACE CONTROLS -->
  <div class="face-controls" id="faceControls">
    <div class="face-row">
      <label>أنت:</label>
      <select id="langA">
        <option value="ar">🇹🇳 العربية</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="es">🇪🇸 Español</option>
      </select>
      <button class="face-mic a" id="micA">🎤</button>
    </div>
    <div class="face-row">
      <button class="face-mic b" id="micB">🎤</button>
      <select id="langB">
        <option value="fr">🇫🇷 Français</option>
        <option value="ar">🇹🇳 العربية</option>
        <option value="en">🇬🇧 English</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="es">🇪🇸 Español</option>
      </select>
      <label>صديق:</label>
    </div>
  </div>

  <!-- SIDEBAR (Remote only) -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>الأصدقاء</h3>
      <button id="addFriendBtn">➕</button>
    </div>
    <div id="friendsList"></div>
  </div>

  <!-- AVATAR (Face only) -->
  <div id="avatarWrap" style="display:none;">
    <div id="avatarContainer">
      <img id="avatarLogo" src="https://cdn.jsdelivr.net/gh/bobo333med-alt/vibe-core@main/image_718b1365.jpg" alt="Logo">
      <video id="avatarVideo" autoplay loop muted playsinline></video>
    </div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chat"></div>

  <!-- FOOTER -->
  <div class="footer" id="footer">
    <button class="footer-btn" id="musicBtn" title="موسيقى" style="display:none;">🎵</button>
    <button class="footer-btn" id="mediaBtn" title="وسائط" style="display:none;">+</button>
    <button class="footer-btn mic" id="micBtn" title="ميكروفون">🎤</button>
    <input type="text" class="footer-input" id="textInput" placeholder="اكتب رسالة...">
    <select id="voiceSelect" style="display:none; background:rgba(0,0,0,0.4); color:#fff; border:1px solid var(--border); border-radius:8px; padding:6px; font-size:11px;">
      <option value="man">👨 رجل</option>
      <option value="woman" selected>👩 امرأة</option>
      <option value="girl">👧 طفلة</option>
      <option value="child">🧒 طفل</option>
    </select>
    <button class="footer-btn" id="uploadBtn" title="Avatar" style="display:none;">📁</button>
    <button class="footer-send" id="sendBtn">➤</button>
  </div>
</div>

<!-- ADD FRIEND MODAL -->
<div class="modal" id="addFriendModal">
  <div class="modal-content">
    <h3>إضافة صديق</h3>
    <input type="text" id="friendCodeInput" placeholder="كود الصديق">
    <button id="confirmAddFriend">إضافة</button>
    <button class="cancel" id="cancelAddFriend">إلغاء</button>
  </div>
</div>

<!-- CALL OVERLAY -->
<div id="callOverlay">
  <div class="call-avatar">📞</div>
  <div class="call-name" id="callName">Unknown</div>
  <div class="call-status" id="callStatus">مكالمة واردة...</div>
  <div class="call-actions">
    <button class="call-btn decline" id="callDecline">✕</button>
    <button class="call-btn accept" id="callAccept">📞</button>
  </div>
</div>

<!-- MEDIA MENU -->
<div id="mediaMenu">
  <button class="media-option" id="cameraBtn">📸 كاميرا</button>
  <button class="media-option" id="galleryBtn">🖼️ معرض</button>
  <button class="media-option" id="videoBtn">🎬 فيديو</button>
</div>

<!-- MUSIC MENU -->
<div id="musicMenu">
  <h4>🎵 قائمة التشغيل</h4>
  <div id="musicList"></div>
</div>

<!-- STATUS -->
<div id="status"></div>

<!-- FILE INPUTS -->

function showStatus(msg) {
  const s = $('status');
  s.textContent = msg;
  s.classList.add('show');
  setTimeout(() => s.classList.remove('show'), 3000);
}

function setStatus(msg) { $('headerStatus').textContent = msg; }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function langNameFor(code) {
  return { 'ar': 'Arabic', 'en': 'English', 'fr': 'French', 'de': 'German', 'tr': 'Turkish', 'it': 'Italian', 'zh': 'Chinese', 'ru': 'Russian', 'es': 'Spanish', 'pt': 'Portuguese', 'nl': 'Dutch', 'no': 'Norwegian' }[code] || 'English';
}

function localeFor(code) {
  return { 'ar': 'ar', 'en': 'en-US', 'fr': 'fr-FR', 'de': 'de-DE', 'tr': 'tr-TR', 'it': 'it-IT', 'zh': 'zh-CN', 'ru': 'ru-RU', 'es': 'es-ES', 'pt': 'pt-PT', 'nl': 'nl-NL', 'no': 'no-NO' }[code] || 'en-US';
}

function cleanTextForTTS(text) {
  if (!text) return "";
  return text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1F018}-\u{1F270}\u{238C}-\u{2454}\u{20D0}-\u{20FF}\u{FE0F}]/gu, '')
    .replace(/[*_#`~|\\\/<>()\[\]{}«»"']/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function compressImage(base64Str, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve) => {
    const img = new Image(); img.src = base64Str;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let width = img.width, height = img.height;
      if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(base64Str);
  });
}

async function startMode(mode) {
  appMode = mode;
  $('modeSelection').classList.remove('active');
  $('app').classList.add('active');
  $('chat').innerHTML = '';
  
  const uid = currentUser.uid;
  const name = currentUser.displayName || currentUser.email.split('@')[0];
  
  // Get/Create Friend Code
  const userRef = db.collection('users').doc(uid);
  const snap = await userRef.get();
  if(snap.exists && snap.data().code) myFriendCode = snap.data().code;
  else {
    const code = Math.random().toString(36).substring(2, 8).toUpperCase();
    await userRef.set({ code, name, email: currentUser.email }, { merge: true });
    myFriendCode = code;
  }

  // Listen to Friends
  db.collection('users').doc(uid).collection('friends').onSnapshot(snap => {
    friendsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderFriends();
  });

  // Listen to Calls
  db.collection('calls').where('to_uid', '==', uid).where('status', '==', 'ringing').onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if(ch.type === 'added') {
        const call = { id: ch.doc.id, ...ch.doc.data() };
        if(Date.now() - (call.createdAt || 0) > 60000) { ch.doc.ref.delete(); return; }
        showIncomingCall(call);
      }
    });
  });

  if(mode === 'face') {
    $('modeIndicator').textContent = 'FACE';
    $('headerTitle').textContent = 'Face-to-Face';
    $('faceControls').classList.add('active');
    $('avatarWrap').style.display = 'block';
    $('sidebar').style.display = 'none';
    $('toggleSidebar').style.display = 'none';
    $('musicBtn').style.display = 'block';
    $('mediaBtn').style.display = 'block';
    $('uploadBtn').style.display = 'block';
    $('voiceSelect').style.display = 'block';
    $('micBtn').style.display = 'none';
    addMsg('bot', '🌐 وضع Face-to-Face: اضغط 🎤 للتحدث');
  } else {
    $('modeIndicator').textContent = 'REMOTE';
    $('headerTitle').textContent = 'Remote Chat';
    $('faceControls').classList.remove('active');
    $('avatarWrap').style.display = 'none';
    $('sidebar').style.display = 'block';
    $('toggleSidebar').style.display = 'block';
    $('musicBtn').style.display = 'none';
    $('mediaBtn').style.display = 'none';
    $('uploadBtn').style.display = 'none';
    $('voiceSelect').style.display = 'none';
    $('micBtn').style.display = 'flex';
    connectWebSocket();
    addMsg('bot', '💬 تم الاتصال بالغرفة');
  }
}

async function toggleLocalMic(speaker) {
  if(isLocalProcessing) return;
  
  if(localRecorder && localRecorder.state === 'recording') {
    localRecorder.stop();
    $('micA').classList.remove('recording');
    $('micB').classList.remove('recording');
    setStatus('⏳ Processing...');
    return;
  }
  
  if(localRecorder) { try { localRecorder.stop(); } catch(e){} }
  
  currentSpeaker = speaker;
  const lang = speaker === 'A' ? $('langA').value : $('langB').value;
  const targetLang = speaker === 'A' ? $('langB').value : $('langA').value;
  const btn = speaker === 'A' ? $('micA') : $('micB');
  
  try {
    localStreamMic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1, sampleRate: 48000 }
    });
    
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(localStreamMic);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    const rmsBuffer = new Float32Array(analyser.fftSize);
    let rmsMax = 0, silenceStart = Date.now();
    let noiseFloor = 0, calibrationCount = 0;
    let intervalId = null, calibrationInterval = null;
    
    // Smart Noise Gate
    calibrationInterval = setInterval(() => {
      try {
        analyser.getFloatTimeDomainData(rmsBuffer);
        let sum = 0;
        for(let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i]*rmsBuffer[i];
        noiseFloor += Math.sqrt(sum / rmsBuffer.length);
        calibrationCount++;
        if(calibrationCount >= 10) {
          noiseFloor = Math.min(noiseFloor / calibrationCount, 0.05);
          clearInterval(calibrationInterval);
        }
      } catch(e){}
    }, 100);
    
    intervalId = setInterval(() => {
      try {
        analyser.getFloatTimeDomainData(rmsBuffer);
        let sum = 0;
        for(let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i]*rmsBuffer[i];
        const rms = Math.sqrt(sum / rmsBuffer.length);
        if(rms > rmsMax) rmsMax = rms;
        const threshold = Math.max(0.02, noiseFloor + 0.015);
        if(rms > threshold) silenceStart = Date.now();
        else if(Date.now() - silenceStart > 3000 && localRecorder && localRecorder.state === 'recording') {
          localRecorder.stop();
        }
      } catch(e){}
    }, 100);

    let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    localRecorder = new MediaRecorder(localStreamMic, { mimeType });
    localChunks = [];
    
    localRecorder.ondataavailable = e => { if(e.data.size > 0) localChunks.push(e.data); };
    
    localRecorder.onstop = async () => {
      if(intervalId) clearInterval(intervalId);
      if(calibrationInterval) clearInterval(calibrationInterval);
      if(localStreamMic) localStreamMic.getTracks().forEach(t => t.stop());
      try { if(audioCtx.state !== 'closed') await audioCtx.close(); } catch(e){}
      
      const durationMs = Date.now() - Date.now(); // Will be fixed below
      
      if(rmsMax < 0.005) {
        isLocalProcessing = false;
        $('micA').classList.remove('recording');
        $('micB').classList.remove('recording');
        setStatus('جاهز');
        if(durationMs >= 800) addMsg('bot', '⚠️ لم يُسمع صوت واضح.');
        return;
      }
      
      const blob = new Blob(localChunks, { type: mimeType });
      setStatus('⏳ جاري استخراج النص...');
      
      const formData = new FormData();
      formData.append('file', blob, 'audio.webm');
      formData.append('target_lang', targetLang);
      formData.append('language', lang);
      formData.append('duration_ms', String(durationMs));
      
      try {
        const res = await fetch(TRANSCRIBE_URL, { method: 'POST', body: formData });
        if(res.ok) {
          const data = await res.json();
          if(data.original && data.original.length > 1) {
            addMsg(speaker === 'A' ? 'user-a' : 'user-b', `${data.original}`, lang);
            if(isTranslatorMode && data.translated) {
              addMsg('bot', `↳ ${data.translated}`, targetLang);
              speak(data.translated, targetLang);
            } else {
              ask(data.original, lang, targetLang, speaker);
            }
          } else {
            addMsg('bot', '⚠️ لم يتم التعرف على كلام.');
          }
        }
      } catch(e) { addMsg('bot', '⚠️ فشل إرسال الصوت.'); }
      
      isLocalProcessing = false;
      $('micA').classList.remove('recording');
      $('micB').classList.remove('recording');
      setStatus('جاهز');
    };
    
    localRecorder.start(1000);
    isLocalProcessing = true;
    btn.classList.add('recording');
    setStatus(`🎤 Listening (${speaker === 'A' ? 'You' : 'Friend'})...`);
  } catch(e) {
    addMsg('bot', "⚠️ تعذر الوصول للمايك: " + e.message);
    isLocalProcessing = false;
  }
}

$('micA').addEventListener('click', () => toggleLocalMic('A'));
$('micB').addEventListener('click', () => toggleLocalMic('B'));

async function ask(text, sourceLang, targetLang, speaker, isImage = false) {
  if(isSending) return;
  isSending = true; $('sendBtn').disabled = true; setStatus('Processing...');
  
  const systemPrompt = isTranslatorMode
    ? `You are an expert translator. Translate from ${langNameFor(sourceLang)} to ${langNameFor(targetLang)}. Preserve tone and style. Output ONLY the translation.`
    : `You are Chat-Core, a helpful assistant. Reply ONLY in ${langNameFor(targetLang)}. Use natural conversational tone.`;
  
  const messages = [{ role: 'system', content: systemPrompt }];
  
  let userContent = text || '';
  if(attachedImageBase64) {
    userContent = [
      { type: "text", text: text || "Describe this image." },
      { type: "image_url", image_url: { url: attachedImageBase64 } }
    ];
  }
  messages.push({ role: 'user', content: userContent });
  
  try {
    const res = await fetch(SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, is_vision: attachedImageBase64 != null, is_translation: isTranslatorMode, session_id: SESSION_ID })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail);
    
    let replyText = data.reply.trim();
    
    if(isImage && replyText.includes('|||')) {
      const parts = replyText.split('|||');
      addMsg(speaker === 'A' ? 'user-a' : 'user-b', `📷 ${parts[0].trim()}`, sourceLang, attachedImageBase64);
      addMsg('bot', `↳ ${parts[1].trim()}`, targetLang);
      speak(parts[1].trim(), targetLang);
    } else {
      addMsg('user-b', replyText, targetLang || 'AUTO', isImage ? attachedImageBase64 : null);
      setStatus('جاهز');
      speak(replyText, targetLang || 'ar');
    }
    
    attachedImageBase64 = null; attachedFileText = null;
  } catch(e) { addMsg('bot', 'Error: ' + e.message); }
  finally { isSending = false; $('sendBtn').disabled = false; }
}

// ===== REMOTE MODE LOGIC =====
function connectWebSocket() {
  const wsUrl = `${WS_BASE}/${currentRoomCode}`;
  ws = new WebSocket(wsUrl);
  
  ws.onopen = () => {
    const name = currentUser.email.split('@')[0];
    ws.send(JSON.stringify({ type: 'join', name, lang: 'ar' }));
  };
  
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if(msg.type === 'translated' && !msg.is_mine) {
      addMsg('user-b', `${msg.from_name}: ${msg.original}`, msg.from_lang);
      if(msg.translated && isTranslatorMode) {
        addMsg('bot', `↳ ${msg.translated}`, msg.target_lang);
        speak(msg.translated, msg.target_lang);
      }
    } else if(msg.type === 'user_joined') {
      addMsg('bot', `👋 ${msg.name} انضم`);
    } else if(msg.type === 'user_left') {
      addMsg('bot', `👋 ${msg.name} غادر`);
    }
  };
  
  ws.onerror = () => showStatus('⚠️ خطأ في الاتصال');
  ws.onclose = () => {
    if(appMode === 'remote') {
      setTimeout(() => connectWebSocket(), 3000);
    }
  };
}

function sendRemoteMessage(text) {
  if(ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'message', text, translate: isTranslatorMode }));
    addMsg('user-a', text, 'AR');
  }
}

// Remote Mic (Manual Translation)
$('micBtn').addEventListener('click', async () => {
  if(isManualTranslating) {
    stopManualTranslation();
  } else {
    await startManualTranslation();
  }
});

async function startManualTranslation() {
  try {
    const transStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    const rawTrack = transStream.getAudioTracks()[0];
    
    let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    audioRecorder = new MediaRecorder(new MediaStream([rawTrack]), { mimeType });
    let chunks = [];
    
    audioRecorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
    audioRecorder.onstop = async () => {
      if(chunks.length === 0) return;
      const blob = new Blob(chunks, { type: mimeType });
      showStatus('⏳ جاري معالجة الصوت...');
      
      const formData = new FormData();
      formData.append('file', blob, 'audio.webm');
      formData.append('target_lang', 'ar');
      formData.append('language', 'ar');
      
      try {
        const res = await fetch(TRANSCRIBE_URL, { method: 'POST', body: formData });
        if(res.ok) {
          const data = await res.json();
          if(data.original) {
            addMsg('user-a', data.original, 'AR');
            sendRemoteMessage(data.original);
          }
        }
      } catch(e) { showStatus('❌ فشل إرسال الصوت'); }
      
      chunks = [];
    };
    
    audioRecorder.start(1000);
    isManualTranslating = true;
    $('micBtn').classList.add('recording');
    showStatus('🎤 Recording... Press mic to stop');
    window._rawTrack = rawTrack;
  } catch(e) { showStatus('❌ لا يمكن الوصول للميكروفون'); }
}

function stopManualTranslation() {
  if(!isManualTranslating) return;
  isManualTranslating = false;
  if(window._rawTrack) { try { window._rawTrack.stop(); } catch(e){} window._rawTrack = null; }
  if(audioRecorder && audioRecorder.state === 'recording') audioRecorder.stop();
  $('micBtn').classList.remove('recording');
  showStatus('تم الإرسال');
}

// ===== FRIENDS SYSTEM =====
function renderFriends() {
  const list = $('friendsList');
  list.innerHTML = '';
  if(friendsCache.length === 0) {
    list.innerHTML = '<div style="padding:20px; text-align:center; color:rgba(255,255,255,0.5);">لا يوجد أصدقاء<br>اضغط ➕ للإضافة</div>';
    return;
  }
  friendsCache.forEach(f => {
    const div = document.createElement('div');
    div.className = 'friend-item';
    div.innerHTML = `
      <div class="friend-avatar">${(f.name || '?').charAt(0).toUpperCase()}</div>
      <div class="friend-info">
        <div class="friend-name">${f.name || 'Unknown'}</div>
        <div class="friend-status">متصل</div>
      </div>
      <div class="friend-actions">
        <button class="friend-action call" onclick="callFriend('${f.id}', '${f.name}')">📞</button>
        <button class="friend-action delete" onclick="removeFriend('${f.id}')">🗑️</button>
      </div>
    `;
    list.appendChild(div);
  });
}

window.callFriend = async (uid, name) => {
  const roomCode = 'ROOM' + Math.random().toString(36).substring(2, 6).toUpperCase();
  await db.collection('calls').add({
    from_uid: currentUser.uid,
    from_name: currentUser.email.split('@')[0],
    to_uid: uid,
    room_code: roomCode,
    status: 'ringing',
    createdAt: Date.now()
  });
  showStatus(`📞 جاري الاتصال بـ ${name}...`);
  setTimeout(async () => {
    const calls = await db.collection('calls').where('from_uid', '==', currentUser.uid).where('to_uid', '==', uid).where('status', '==', 'ringing').limit(1).get();
    calls.forEach(doc => doc.ref.update({ status: 'cancelled' }));
  }, 30000);
};

window.removeFriend = async (uid) => {
  if(confirm('حذف هذا الصديق؟')) {
    await db.collection('users').doc(currentUser.uid).collection('friends').doc(uid).delete();
    await db.collection('users').doc(uid).collection('friends').doc(currentUser.uid).delete();
    showStatus('تم الحذف');
  }
};

$('transToggle').addEventListener('click', function() {
  isTranslatorMode = !isTranslatorMode;
  this.classList.toggle('active', isTranslatorMode);
  showStatus(isTranslatorMode ? '🌐 الترجمة مفعلة' : 'الترجمة معطلة');

$('addFriendBtn').addEventListener('click', () => $('addFriendModal').classList.add('active'));
$('cancelAddFriend').addEventListener('click', () => $('addFriendModal').classList.remove('active'));
$('confirmAddFriend').addEventListener('click', async () => {
  const code = $('friendCodeInput').value.trim().toUpperCase();
  if(!code) return showStatus('⚠️ أدخل الكود');
  const users = await db.collection('users').where('code', '==', code).get();
  if(users.empty) return showStatus('❌ كود غير صحيح');
  const targetUser = users.docs[0];
  const targetUid = targetUser.id, targetName = targetUser.data().name;
  const batch = db.batch();
  batch.set(db.collection('users').doc(currentUser.uid).collection('friends').doc(targetUid), { name: targetName, uid: targetUid });
  batch.set(db.collection('users').doc(targetUid).collection('friends').doc(currentUser.uid), { name: currentUser.email.split('@')[0], uid: currentUser.uid });
  await batch.commit();
  $('addFriendModal').classList.remove('active');
  $('friendCodeInput').value = '';
  showStatus(`✅ تمت إضافة ${targetName}`);
});

// ===== CALL SYSTEM =====
function showIncomingCall(call) {
  $('callName').textContent = call.from_name;
  $('callStatus').textContent = 'مكالمة واردة...';
  $('callOverlay').dataset.callId = call.id;
  $('callOverlay').classList.add('active');
  playRingtone();
}

function playRingtone() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 440; gain.gain.setValueAtTime(0.1, ctx.currentTime);
    osc.start(); osc.stop(ctx.currentTime + 0.5);
    window._ringInterval = setInterval(() => {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 480; g.gain.setValueAtTime(0.1, ctx.currentTime);
      o.start(); o.stop(ctx.currentTime + 0.5);
    }, 2000);
  } catch(e) {}
}

$('callDecline').addEventListener('click', async () => {
  const callId = $('callOverlay').dataset.callId;
  if(callId) await db.collection('calls').doc(callId).update({ status: 'rejected' });
  if(window._ringInterval) clearInterval(window._ringInterval);
  $('callOverlay').classList.remove('active');
});

$('callAccept').addEventListener('click', async () => {
  const callId = $('callOverlay').dataset.callId;
  if(callId) await db.collection('calls').doc(callId).update({ status: 'accepted' });
  if(window._ringInterval) clearInterval(window._ringInterval);
  showStatus('✅ تم قبول المكالمة');
  $('callOverlay').classList.remove('active');
});

// ===== CHAT UI =====
function addMsg(type, text, lang = '', imageBase64 = null) {
  const chat = $('chat');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  
  if(imageBase64) {
    const img = document.createElement('img');
    img.src = imageBase64;
    img.onclick = (e) => { e.stopPropagation(); window.open(imageBase64, '_blank'); };
    div.appendChild(img);
  }
  
  if(lang && type !== 'bot') {
    div.innerHTML = `${escapeHtml(text)} <span class="lang-tag">${lang.toUpperCase()}</span>`;
  } else {
    div.textContent = text;
  }
  
  div.addEventListener('click', () => {
    if(type === 'bot') return;
    document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing'));
    div.classList.add('playing');
    speak(text, lang || 'ar');
  });
  
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

$('clearChatBtn').addEventListener('click', () => {
  $('chat').innerHTML = '';
  showStatus('تم مسح المحادثة');
});

// ===== INPUT HANDLING =====
$('sendBtn').addEventListener('click', () => {
  const text = $('textInput').value.trim();
  if(!text && !attachedImageBase64) return;
  
  if(appMode === 'remote') {
    if(text) { sendRemoteMessage(text); $('textInput').value = ''; }
  } else {
    addMsg('user-a', text || '📷 Image', $('langA').value, attachedImageBase64);
    ask(text, $('langA').value, $('langB').value, 'A', attachedImageBase64 != null);
    $('textInput').value = '';
  }
});

$('textInput').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') $('sendBtn').click();
});

// ===== TTS =====
function speak(text, lang = 'ar') {
  if(!text) return;
  stopAudio();
  const cleaned = cleanTextForTTS(text);
  if(!cleaned) return;
  const speechId = ++currentSpeechId;
  isBotTalking = true;
  
  let retryCount = 0;
  const maxRetries = 2;
  
  const tryTTS = () => {
    if(retryCount > maxRetries) {
      fallbackTTS(cleaned, lang);
      return;
    }
    
    fetch(TTS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: cleaned.slice(0, 4000), lang, voice: $('voiceSelect') ? $('voiceSelect').value : 'woman' })
    })
    .then(res => { if(!res.ok) throw new Error('TTS failed'); return res.blob(); })
    .then(blob => {
      if(speechId !== currentSpeechId) return;
      const url = URL.createObjectURL(blob);
      currentAudio = new Audio(url);
      currentAudio.onended = () => {
        URL.revokeObjectURL(url);
        isBotTalking = false;
        document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing'));
      };
      currentAudio.onerror = () => {
        URL.revokeObjectURL(url);
        retryCount++;
        setTimeout(tryTTS, 500);
      };
      currentAudio.play().catch(() => { retryCount++; setTimeout(tryTTS, 500); });
    })
    .catch(() => { retryCount++; setTimeout(tryTTS, 500); });
  };
  
  tryTTS();
}

function fallbackTTS(text, lang) {
  if('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = localeFor(lang);
    u.onend = () => {
      isBotTalking = false;
      document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing'));
    };
    speechSynthesis.speak(u);
  }
}

function stopAudio() {
  currentSpeechId++;
  if(currentAudio) { try { currentAudio.pause(); currentAudio.currentTime = 0; } catch(e){} currentAudio = null; }
  if('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch(e){} }
  isBotTalking = false;
  document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing'));
}

// ===== MEDIA HANDLING =====
$('mediaBtn').addEventListener('click', () => {
  const m = $('mediaMenu');
  m.style.display = m.style.display === 'block' ? 'none' : 'block';
});

$('musicBtn').addEventListener('click', () => {
  const m = $('musicMenu');
  m.style.display = m.style.display === 'block' ? 'none' : 'block';
});

document.addEventListener('click', (e) => {
  if(!$('mediaBtn').contains(e.target) && !$('mediaMenu').contains(e.target)) $('mediaMenu').style.display = 'none';
  if(!$('musicBtn').contains(e.target) && !$('musicMenu').contains(e.target)) $('musicMenu').style.display = 'none';
});

$('cameraBtn').addEventListener('click', () => $('cameraUpload').click());
$('galleryBtn').addEventListener('click', () => $('galleryUpload').click());
$('videoBtn').addEventListener('click', () => $('videoUpload').click());

async function handleImageUpload(e) {
  const file = e.target.files[0];
  if(!file) return;
  isCompressing = true; $('sendBtn').disabled = true; showStatus('Compressing...');
  const reader = new FileReader();
  reader.onload = async ev => {
    const compressed = await compressImage(ev.target.result);
    attachedImageBase64 = compressed;
    showStatus('📷 Image attached');
    isCompressing = false; $('sendBtn').disabled = false;
  };
  reader.readAsDataURL(file);
}

$('galleryUpload').addEventListener('change', handleImageUpload);
$('cameraUpload').addEventListener('change', handleImageUpload);

$('videoUpload').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 100 * 1024 * 1024) return showStatus('❌ حجم كبير جداً (100MB)');
  addMsg('user-a', `🎬 ${file.name}`, 'AUTO');
  showStatus('⏳ جاري معالجة الفيديو...');
  const formData = new FormData();
  formData.append('file', file);
  formData.append('target_lang', $('langB').value);
  formData.append('language', $('langA').value);
  try {
    const res = await fetch(TRANSCRIBE_URL, { method: 'POST', body: formData });
    if(res.ok) {
      const data = await res.json();
      if(data.original) addMsg('user-b', data.original, 'AUTO');
      if(data.translated) addMsg('bot', data.translated, $('langB').value);
    }
  } catch(err) { addMsg('bot', '⚠️ فشل معالجة الفيديو'); }
  e.target.value = '';
});

// ===== AVATAR =====
$('uploadBtn').addEventListener('click', () => { $('videoAvatarUpload').value = ''; $('videoAvatarUpload').click(); });
$('videoAvatarUpload').addEventListener('change', (e) => {
  const file = e.target.files[0]; if(!file) return;
  if(currentAvatarObjectUrl) URL.revokeObjectURL(currentAvatarObjectUrl);
  currentAvatarObjectUrl = URL.createObjectURL(file);
  $('avatarLogo').style.display = 'none';
  $('avatarVideo').style.display = 'block';
  $('avatarVideo').src = currentAvatarObjectUrl;
  if(isBotTalking) $('avatarVideo').play();
});

// ===== MUSIC =====
$('audioUpload').addEventListener('change', (e) => {
  const files = e.target.files;
  for(let i = 0; i < files.length; i++) playlist.push({ name: files[i].name, url: URL.createObjectURL(files[i]) });
  renderPlaylist();
  e.target.value = '';
});

function renderPlaylist() {
  const list = $('musicList');
  list.innerHTML = '<div class="music-item" onclick="stopMusic()" style="text-align:center; background:rgba(239,68,68,0.2);">🛑 Stop</div>';
  playlist.forEach((song, index) => {
    const div = document.createElement('div');
    div.className = 'music-item' + (index === currentSongIndex ? ' active' : '');
    div.innerHTML = `<span style="flex:1; overflow:hidden; text-overflow:ellipsis;">${song.name}</span><span onclick="event.stopPropagation(); playlist.splice(${index},1); renderPlaylist();" style="color:#ff4444; cursor:pointer;">✕</span>`;
    div.onclick = () => { currentSongIndex = index; $('bgAudio').src = song.url; $('bgAudio').play(); renderPlaylist(); };
    list.appendChild(div);
  });
}

window.stopMusic = () => { $('bgAudio').pause(); $('bgAudio').currentTime = 0; currentSongIndex = -1; renderPlaylist(); };
$('bgAudio').addEventListener('ended', () => {
  if(playlist.length > 0) {
    currentSongIndex = (currentSongIndex + 1) % playlist.length;
    $('bgAudio').src = playlist[currentSongIndex].url;
    $('bgAudio').play();
    renderPlaylist();
  }
});

console.log('✅ Chat-Core Messenger initialized');
</script>
