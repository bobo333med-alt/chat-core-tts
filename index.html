<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat-Core Messenger</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f1e;
  color: #fff;
  height: 100vh;
  overflow: hidden;
}

/* Auth */
#authOverlay {
  position: fixed;
  inset: 0;
  background: #0f0f1e;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.auth-box {
  background: #1a1a2e;
  padding: 30px;
  border-radius: 20px;
  width: 90%;
  max-width: 400px;
  border: 1px solid rgba(255,255,255,0.1);
}
.auth-box h1 { color: #0084ff; text-align: center; margin-bottom: 20px; font-size: 28px; }
.auth-box input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 15px;
  outline: none;
}
.auth-box input:focus { border-color: #0084ff; }
.auth-box button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 10px;
  border: none;
  background: #0084ff;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
.auth-box button:hover { background: #0066cc; }
.auth-box button:disabled { background: #666; cursor: not-allowed; }
#authError { color: #ff4444; text-align: center; margin: 10px 0; min-height: 20px; font-size: 14px; }

/* Main App */
#app { display: none; height: 100vh; flex-direction: column; }
#app.active { display: flex; }

/* Header */
.header {
  background: #1a1a2e;
  padding: 12px 15px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  height: 60px;
}
.header-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  padding: 8px;
  border-radius: 50%;
  transition: 0.3s;
}
.header-btn:hover { background: rgba(255,255,255,0.1); }
.header-btn.active { color: #0084ff; }
.header-info { flex: 1; }
.header-title { font-size: 16px; font-weight: bold; }
.header-status { font-size: 12px; color: rgba(255,255,255,0.6); }

/* Sidebar */
.sidebar {
  position: fixed;
  top: 60px;
  right: 0;
  bottom: 0;
  width: 280px;
  background: #16162a;
  border-left: 1px solid rgba(255,255,255,0.1);
  transform: translateX(100%);
  transition: transform 0.3s;
  z-index: 100;
  overflow-y: auto;
}
.sidebar.open { transform: translateX(0); }
.sidebar-header {
  padding: 15px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sidebar-header h3 { font-size: 16px; }
.sidebar-header button {
  background: #0084ff;
  border: none;
  color: #fff;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
}
.friend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 15px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  cursor: pointer;
  transition: 0.3s;
}
.friend-item:hover { background: rgba(255,255,255,0.05); }
.friend-avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0084ff, #0066cc);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  flex-shrink: 0;
}
.friend-info { flex: 1; min-width: 0; }
.friend-name { font-size: 14px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.friend-status { font-size: 12px; color: rgba(255,255,255,0.6); }
.friend-actions { display: flex; gap: 5px; }
.friend-action {
  background: none;
  border: none;
  color: rgba(255,255,255,0.6);
  font-size: 18px;
  cursor: pointer;
  padding: 5px;
  border-radius: 50%;
  transition: 0.3s;
}
.friend-action:hover { background: rgba(255,255,255,0.1); color: #fff; }
.friend-action.call { color: #0084ff; }
.friend-action.delete { color: #ff4444; }

/* Chat Area */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.msg {
  max-width: 75%;
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  word-wrap: break-word;
  cursor: pointer;
  transition: 0.3s;
  user-select: none;
}
.msg:active { opacity: 0.7; }
.msg.user-a {
  align-self: flex-end;
  background: #0084ff;
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.user-b {
  align-self: flex-start;
  background: #3a3a4a;
  color: #fff;
  border-bottom-left-radius: 4px;
}
.msg.bot {
  align-self: center;
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.8);
  font-style: italic;
  font-size: 13px;
  max-width: 80%;
}
.msg.playing { box-shadow: 0 0 20px rgba(0, 132, 255, 0.6); border: 2px solid #0084ff; }
.lang-tag {
  display: inline-block;
  font-size: 10px;
  padding: 2px 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 6px;
  margin-left: 6px;
  font-weight: bold;
}

/* Footer */
.footer {
  background: #1a1a2e;
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-top: 1px solid rgba(255,255,255,0.1);
  height: 70px;
}
.footer-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  padding: 10px;
  border-radius: 50%;
  transition: 0.3s;
}
.footer-btn:hover { background: rgba(255,255,255,0.1); }
.footer-btn.mic {
  background: #0084ff;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.footer-btn.mic.recording { background: #ff4444; animation: pulse 1s infinite; }
.footer-input {
  flex: 1;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 12px 15px;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: 0.3s;
}
.footer-input:focus { border-color: #0084ff; }
.footer-send {
  background: #0084ff;
  border: none;
  color: #fff;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.3s;
}
.footer-send:hover { background: #0066cc; transform: scale(1.1); }
.footer-send:disabled { background: #666; cursor: not-allowed; transform: none; }

/* Status */
#status {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 132, 255, 0.9);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 1001;
  display: none;
  backdrop-filter: blur(10px);
}
#status.show { display: block; }

/* Add Friend Modal */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 10000;
  align-items: center;
  justify-content: center;
}
.modal.active { display: flex; }
.modal-content {
  background: #1a1a2e;
  padding: 25px;
  border-radius: 16px;
  width: 90%;
  max-width: 350px;
  border: 1px solid rgba(255,255,255,0.1);
}
.modal-content h3 { margin-bottom: 15px; font-size: 18px; }
.modal-content input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 14px;
  outline: none;
}
.modal-content button {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  border-radius: 8px;
  border: none;
  background: #0084ff;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
.modal-content button:hover { background: #0066cc; }
.modal-content button.cancel { background: #666; }

/* Call Overlay */
#callOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 99999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 30px;
}
#callOverlay.active { display: flex; }
.call-avatar {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0084ff, #0066cc);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  animation: ringPulse 1.5s infinite;
}
.call-name { font-size: 28px; font-weight: bold; }
.call-status { font-size: 16px; color: rgba(255,255,255,0.7); }
.call-actions { display: flex; gap: 40px; }
.call-btn {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: none;
  font-size: 28px;
  cursor: pointer;
  transition: 0.3s;
}
.call-btn.accept { background: #00c853; color: #fff; }
.call-btn.decline { background: #ff4444; color: #fff; }
.call-btn:hover { transform: scale(1.1); }

@keyframes pulse { 50% { transform: scale(1.1); } }
@keyframes ringPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 132, 255, 0.7); }
  50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(0, 132, 255, 0); }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
</style>
</head>
<body>

<!-- Auth -->
<div id="authOverlay">
  <div class="auth-box">
    <h1>🌐 Chat-Core</h1>
    <div id="authError"></div>
    <input type="email" id="authEmail" placeholder="البريد الإلكتروني">
    <input type="password" id="authPassword" placeholder="كلمة المرور">
    <button id="loginBtn">دخول</button>
    <button id="registerBtn" style="background:transparent; border:1px solid #0084ff;">إنشاء حساب جديد</button>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <div class="header">
    <button class="header-btn" id="toggleSidebar">☰</button>
    <div class="header-info">
      <div class="header-title" id="headerTitle">Chat-Core</div>
      <div class="header-status" id="headerStatus">متصل</div>
    </div>
    <button class="header-btn" id="transToggle" title="الترجمة">🌐</button>
    <button class="header-btn" id="logoutBtn" title="خروج">🚪</button>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>الأصدقاء</h3>
      <button id="addFriendBtn">➕</button>
    </div>
    <div id="friendsList"></div>
  </div>

  <div class="chat-area" id="chat"></div>

  <div class="footer">
    <button class="footer-btn mic" id="micBtn">🎤</button>
    <input type="text" class="footer-input" id="textInput" placeholder="اكتب رسالة...">
    <button class="footer-send" id="sendBtn">➤</button>
  </div>
</div>

<!-- Add Friend Modal -->
<div class="modal" id="addFriendModal">
  <div class="modal-content">
    <h3>إضافة صديق</h3>
    <input type="text" id="friendCodeInput" placeholder="كود الصديق">
    <button id="confirmAddFriend">إضافة</button>
    <button class="cancel" id="cancelAddFriend">إلغاء</button>
  </div>
</div>

<!-- Call Overlay -->
<div id="callOverlay">
  <div class="call-avatar">📞</div>
  <div class="call-name" id="callName">Unknown</div>
  <div class="call-status" id="callStatus">مكالمة واردة...</div>
  <div class="call-actions">
    <button class="call-btn decline" id="callDecline">✕</button>
    <button class="call-btn accept" id="callAccept">📞</button>
  </div>
</div>

<!-- Status -->
<div id="status"></div>

<script>
'use strict';

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCCp08HOuP4vpXlvBkzjOgGAwQoeTsOKJ8",
  authDomain: "chat-core-app.firebaseapp.com",
  projectId: "chat-core-app",
  storageBucket: "chat-core-app.firebasestorage.app",
  messagingSenderId: "216958872856",
  appId: "1:216958872856:web:f03d559611b327c91b426d"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Global State
let currentUser = null;
let myFriendCode = null;
let friendsCache = [];
let isTranslatorMode = true;
let ws = null;
let currentRoomCode = 'GLOBAL';

// UI Helpers
const $ = id => document.getElementById(id);
function showStatus(msg) {
  const s = $('status');
  s.textContent = msg;
  s.classList.add('show');
  setTimeout(() => s.classList.remove('show'), 3000);
}

// Auth
$('loginBtn').addEventListener('click', async () => {
  const email = $('authEmail').value.trim();
  const pass = $('authPassword').value;
  if(!email || !pass) return $('authError').textContent = "⚠️ أدخل البيانات";
  $('loginBtn').textContent = "⏳ جاري...";
  $('loginBtn').disabled = true;
  $('authError').textContent = "";
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    $('authError').textContent = "❌ " + e.message;
    $('loginBtn').textContent = "دخول";
    $('loginBtn').disabled = false;
  }
});

$('registerBtn').addEventListener('click', async () => {
  const email = $('authEmail').value.trim();
  const pass = $('authPassword').value;
  if(!email || !pass) return $('authError').textContent = "⚠️ أدخل البيانات";
  if(pass.length < 6) return $('authError').textContent = "⚠️ كلمة المرور 6 أحرف على الأقل";
  $('registerBtn').textContent = "⏳ جاري...";
  $('registerBtn').disabled = true;
  $('authError').textContent = "";
  try {
    await auth.createUserWithEmailAndPassword(email, pass);
    $('authError').textContent = "✅ تم إنشاء الحساب!";
  } catch(e) {
    $('authError').textContent = "❌ " + e.message;
    $('registerBtn').textContent = "إنشاء حساب جديد";
    $('registerBtn').disabled = false;
  }
});

auth.onAuthStateChanged(user => {
  if(user) {
    currentUser = user;
    $('authOverlay').style.display = 'none';
    $('app').classList.add('active');
    initApp();
  } else {
    currentUser = null;
    $('authOverlay').style.display = 'flex';
    $('app').classList.remove('active');
  }
});

// App Init
async function initApp() {
  const uid = currentUser.uid;
  const name = currentUser.displayName || currentUser.email.split('@')[0];
  
  // Get/Create Friend Code
  const userRef = db.collection('users').doc(uid);
  const snap = await userRef.get();
  if(snap.exists && snap.data().code) {
    myFriendCode = snap.data().code;
  } else {
    const code = Math.random().toString(36).substring(2, 8).toUpperCase();
    await userRef.set({ code, name, email: currentUser.email }, { merge: true });
    myFriendCode = code;
  }

  // Listen to Friends
  db.collection('users').doc(uid).collection('friends').onSnapshot(snap => {
    friendsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderFriends();
  });

  // Listen to Calls
  db.collection('calls').where('to_uid', '==', uid).where('status', '==', 'ringing').onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if(ch.type === 'added') {
        const call = { id: ch.doc.id, ...ch.doc.data() };
        showIncomingCall(call);
      }
    });
  });

  // Connect to WebSocket
  connectWebSocket();
}

function renderFriends() {
  const list = $('friendsList');
  list.innerHTML = '';
  if(friendsCache.length === 0) {
    list.innerHTML = '<div style="padding:20px; text-align:center; color:rgba(255,255,255,0.5);">لا يوجد أصدقاء<br>اضغط ➕ للإضافة</div>';
    return;
  }
  friendsCache.forEach(f => {
    const div = document.createElement('div');
    div.className = 'friend-item';
    div.innerHTML = `
      <div class="friend-avatar">${(f.name || '?').charAt(0).toUpperCase()}</div>
      <div class="friend-info">
        <div class="friend-name">${f.name || 'Unknown'}</div>
        <div class="friend-status">متصل</div>
      </div>
      <div class="friend-actions">
        <button class="friend-action call" onclick="callFriend('${f.id}', '${f.name}')">📞</button>
        <button class="friend-action delete" onclick="removeFriend('${f.id}')">🗑️</button>
      </div>
    `;
    list.appendChild(div);
  });
}

window.callFriend = async (uid, name) => {
  const roomCode = 'ROOM' + Math.random().toString(36).substring(2, 6).toUpperCase();
  await db.collection('calls').add({
    from_uid: currentUser.uid,
    from_name: currentUser.displayName || currentUser.email.split('@')[0],
    to_uid: uid,
    room_code: roomCode,
    status: 'ringing',
    createdAt: Date.now()
  });
  showStatus(`📞 جاري الاتصال بـ ${name}...`);
};

window.removeFriend = async (uid) => {
  if(confirm('حذف هذا الصديق؟')) {
    await db.collection('users').doc(currentUser.uid).collection('friends').doc(uid).delete();
    await db.collection('users').doc(uid).collection('friends').doc(currentUser.uid).delete();
    showStatus('تم الحذف');
  }
};

// Sidebar
$('toggleSidebar').addEventListener('click', () => $('sidebar').classList.toggle('open'));
$('transToggle').addEventListener('click', function() {
  isTranslatorMode = !isTranslatorMode;
  this.classList.toggle('active', isTranslatorMode);
  showStatus(isTranslatorMode ? '🌐 الترجمة مفعلة' : 'الترجمة معطلة');
});
$('logoutBtn').addEventListener('click', () => auth.signOut());

// Add Friend
$('addFriendBtn').addEventListener('click', () => $('addFriendModal').classList.add('active'));
$('cancelAddFriend').addEventListener('click', () => $('addFriendModal').classList.remove('active'));
$('confirmAddFriend').addEventListener('click', async () => {
  const code = $('friendCodeInput').value.trim().toUpperCase();
  if(!code) return showStatus('⚠️ أدخل الكود');
  
  const users = await db.collection('users').where('code', '==', code).get();
  if(users.empty) return showStatus('❌ كود غير صحيح');
  
  const targetUser = users.docs[0];
  const targetUid = targetUser.id;
  const targetName = targetUser.data().name;
  
  const batch = db.batch();
  batch.set(db.collection('users').doc(currentUser.uid).collection('friends').doc(targetUid), {
    name: targetName, uid: targetUid
  });
  batch.set(db.collection('users').doc(targetUid).collection('friends').doc(currentUser.uid), {
    name: currentUser.displayName || currentUser.email.split('@')[0], uid: currentUser.uid
  });
  await batch.commit();
  
  $('addFriendModal').classList.remove('active');
  $('friendCodeInput').value = '';
  showStatus(`✅ تمت إضافة ${targetName}`);
});

// Call System
function showIncomingCall(call) {
  $('callName').textContent = call.from_name;
  $('callStatus').textContent = 'مكالمة واردة...';
  $('callOverlay').classList.add('active');
  playRingtone();
}

function playRingtone() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 440;
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}

$('callDecline').addEventListener('click', async () => {
  const callId = $('callOverlay').dataset.callId;
  if(callId) await db.collection('calls').doc(callId).update({ status: 'rejected' });
  $('callOverlay').classList.remove('active');
});

$('callAccept').addEventListener('click', async () => {
  const callId = $('callOverlay').dataset.callId;
  if(callId) {
    await db.collection('calls').doc(callId).update({ status: 'accepted' });
    showStatus('✅ تم قبول المكالمة');
  }
  $('callOverlay').classList.remove('active');
});

// WebSocket
function connectWebSocket() {
  const wsUrl = `wss://chat-core-tts.onrender.com/ws/${currentRoomCode}`;
  ws = new WebSocket(wsUrl);
  
  ws.onopen = () => {
    const name = currentUser.displayName || currentUser.email.split('@')[0];
    ws.send(JSON.stringify({ type: 'join', name, lang: 'ar' }));
    addMsg('bot', '💬 تم الاتصال بالغرفة');
  };
  
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if(msg.type === 'translated' && !msg.is_mine) {
      addMsg('user-b', `${msg.from_name}: ${msg.original}`, msg.from_lang);
      if(msg.translated && isTranslatorMode) {
        addMsg('bot', `↳ ${msg.translated}`);
      }
    }
  };
  
  ws.onerror = () => showStatus('⚠️ خطأ في الاتصال');
}

function sendRemoteMessage(text) {
  if(ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'message', text, translate: isTranslatorMode }));
    addMsg('user-a', text, 'AR');
  }
}

// Chat UI
function addMsg(type, text, lang = '') {
  const chat = $('chat');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  
  if(lang && type !== 'bot') {
    div.innerHTML = `${text} <span class="lang-tag">${lang.toUpperCase()}</span>`;
  } else {
    div.textContent = text;
  }
  
  div.addEventListener('click', () => {
    document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing'));
    div.classList.add('playing');
    speak(text, lang || 'ar');
  });
  
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// Input
$('sendBtn').addEventListener('click', () => {
  const text = $('textInput').value.trim();
  if(text) {
    sendRemoteMessage(text);
    $('textInput').value = '';
  }
});

$('textInput').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') $('sendBtn').click();
});

// Audio Recording
let localRecorder = null;
let localStreamMic = null;
let localChunks = [];
let isRecording = false;

$('micBtn').addEventListener('click', async () => {
  if(isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
});

async function startRecording() {
  try {
    localStreamMic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    
    let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
      ? 'audio/webm;codecs=opus' : 'audio/webm';
    
    localRecorder = new MediaRecorder(localStreamMic, { mimeType });
    localChunks = [];
    
    localRecorder.ondataavailable = e => {
      if(e.data.size > 0) localChunks.push(e.data);
    };
    
    localRecorder.onstop = async () => {
      if(localStreamMic) localStreamMic.getTracks().forEach(t => t.stop());
      if(localChunks.length === 0) return;
      
      const blob = new Blob(localChunks, { type: mimeType });
      showStatus('⏳ جاري معالجة الصوت...');
      
      const formData = new FormData();
      formData.append('file', blob, 'audio.webm');
      formData.append('target_lang', 'ar');
      formData.append('language', 'ar');
      
      try {
        const res = await fetch('https://chat-core-tts.onrender.com/transcribe', {
          method: 'POST', body: formData
        });
        if(res.ok) {
          const data = await res.json();
          if(data.original) {
            addMsg('user-a', data.original, 'AR');
            sendRemoteMessage(data.original);
          }
        }
      } catch(e) {
        showStatus('❌ فشل إرسال الصوت');
      }
      
      isRecording = false;
      $('micBtn').classList.remove('recording');
    };
    
    localRecorder.start(1000);
    isRecording = true;
    $('micBtn').classList.add('recording');
    showStatus('🎤 جارٍ التسجيل... اضغط للإيقاف');
  } catch(e) {
    showStatus('❌ لا يمكن الوصول للميكروفون');
  }
}

function stopRecording() {
  if(localRecorder && localRecorder.state === 'recording') {
    localRecorder.stop();
  }
}

// TTS
let currentAudio = null;
let currentSpeechId = 0;

function speak(text, lang = 'ar') {
  if(!text) return;
  if(currentAudio) { currentAudio.pause(); currentAudio = null; }
  
  const speechId = ++currentSpeechId;
  
  fetch('https://chat-core-tts.onrender.com/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text.slice(0, 4000), lang, voice: 'woman' })
  })
  .then(res => { if(!res.ok) throw new Error('TTS failed'); return res.blob(); })
  .then(blob => {
    if(speechId !== currentSpeechId) return;
    const url = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    currentAudio.onended = () => {
      URL.revokeObjectURL(url);
      document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing'));
    };
    currentAudio.play().catch(() => fallbackTTS(text, lang));
  })
  .catch(() => fallbackTTS(text, lang));
}

function fallbackTTS(text, lang) {
  if('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang === 'ar' ? 'ar-SA' : lang === 'fr' ? 'fr-FR' : 'en-US';
    utterance.onend = () => {
      document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing'));
    };
    speechSynthesis.speak(utterance);
  }
}

console.log('✅ Chat-Core Messenger initialized');
