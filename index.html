<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat-Core - Translator</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: Tahoma, sans-serif; background: #0ea5e9; color: #fff; display: flex; flex-direction: column; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); height: 100dvh; transition: opacity 0.3s; }
#authOverlay { position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999999; padding: 20px; overflow-y: auto; }
.auth-lang-switch { position: absolute; top: 20px; right: 20px; display: flex; gap: 5px; }
.lang-btn { background: #334155; border: 1px solid #475569; color: #fff; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
.lang-btn.active { background: #0ea5e9; border-color: #0ea5e9; }
.auth-box { background: #1e293b; padding: 30px; border-radius: 15px; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; margin: auto; }
.auth-box h2 { color: #0ea5e9; margin-bottom: 20px; font-size: 24px; }
.auth-input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; font-size: 14px; }
.auth-input:focus { border-color: #0ea5e9; }
.auth-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #10b981; color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; font-size: 14px;}
.auth-btn:hover { background: #059669; }
.auth-btn.outline { background: transparent; border: 1px solid #6366f1; color: #6366f1; }
.auth-btn.outline:hover { background: #6366f1; color: #fff; }
.social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #334155; color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; font-size: 14px; }
.social-btn:hover { background: #475569; }
#authError { color: #ef4444; font-size: 12px; margin-bottom: 10px; min-height: 18px; word-wrap: break-word; }
.divider { display: flex; align-items: center; margin: 15px 0; color: #64748b; font-size: 12px; }
.divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #334155; margin: 0 10px; }
.top-header { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 10px; flex-shrink: 0; position: relative; z-index: 10001; }
.top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 6px 12px; border-radius: 10px; width: 95%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
.user-section { display: flex; align-items: center; gap: 4px; }
.lang-select { padding: 0 2px; border-radius: 4px; background: #0f172a; color: #ffffff; border: 1px solid #334155; font-size: 9px; outline: none; width: 75px !important; height: 24px; text-align: center; }
.mic-btn { width: 30px; height: 30px; border-radius: 50%; border: none; color: #fff; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
.mic-btn.blue { background: #6366f1; } .mic-btn.green { background: #10b981; } .mic-btn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; }
.mic-btn:disabled { background: #475569 !important; opacity: 0.5; }
@keyframes pulse { 50% { transform: scale(1.1); } }
#avatar-wrap { width: 100px; height: 100px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all 0.3s; }
#avatar-container { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; background: #1e293b; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0,0,0,0.3); z-index: 1; transition: all 0.3s; }
#avatar-logo, #avatar-video { width: 100%; height: 100%; object-fit: cover; display: block; }
#avatar-video { display: none; }
#avatar-wrap.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: #000; }
#avatar-wrap.fullscreen #avatar-container { width: 100vw; height: 100vh; border-radius: 0 !important; background: transparent; box-shadow: none; }
#avatar-wrap.fullscreen #avatar-logo, #avatar-wrap.fullscreen #avatar-video { object-fit: contain; width: 100vw; height: 100vh; }
#avatar-wrap.fullscreen #closeFullscreen { display: flex; }
#removeAvatarBtn { display: none; position: absolute; top: 50%; right: -15px; transform: translateY(-50%); width: 14px; height: 14px; border-radius: 50%; background: #000; border: none; cursor: pointer; z-index: 10; }
body.remote-mode #avatar-wrap, body.meeting-mode #avatar-wrap { display: none !important; }
#closeFullscreen, #closeVideoFullscreen { display: none; position: fixed; background: #e57373; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 10000; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.inner-white-dot { width: 14px; height: 14px; background: #fff; border-radius: 50%; }
#closeFullscreen { top: 80px; right: 20px; } #closeVideoFullscreen { top: 20px; right: 20px; }
#videoContainer { display: none; position: relative; width: 100%; max-width: 400px; height: 200px; margin: 0 auto 10px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer; transition: all 0.3s; z-index: 500; }
#remoteVideo { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
#localVideo { position: absolute; bottom: 10px; right: 10px; width: 80px; height: 100px; object-fit: cover; border-radius: 8px; border: 2px solid #fff; background: #1e293b; z-index: 2; pointer-events: auto; }
#videoStatus { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 6px; font-size: 10px; color: #10b981; z-index: 2; pointer-events: none; }
#tapToPlayOverlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.7); color: #fff; z-index: 10; align-items: center; justify-content: center; flex-direction: column; font-weight: bold; font-size: 16px; cursor: pointer; }
body.video-maximized #videoContainer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; max-width: 100vw; z-index: 99999; margin: 0; border-radius: 0; }
body.video-maximized #remoteVideo { object-fit: cover; }
body.video-maximized #localVideo { width: 90px; height: 130px; bottom: 20px; right: 20px; border-radius: 12px; }
body.video-maximized #closeVideoFullscreen { display: flex; }
body.video-maximized #topHeader, body.video-maximized #extraControls, body.video-maximized #chatContainer, body.video-maximized #inputRow, body.video-maximized #status, body.video-maximized #remoteBar { display: none !important; }
#meetingGridContainer { display: none; position: relative; width: 100%; flex: 1; background: #0f172a; border-radius: 12px; padding: 10px; overflow-y: auto; margin-bottom: 10px; }
#videoGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-content: start; }
.participant-box { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; border: 2px solid #334155; }
.participant-box video { width: 100%; height: 100%; object-fit: cover; }
.participant-name { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; font-size: 10px; color: #fff; z-index: 2; }
body.meeting-mode .chat-container { max-height: 35vh; }
#floatingMicBtn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 50%; background: #10b981; color: white; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100000; border: none; cursor: pointer; transition: all 0.3s; }
#floatingMicBtn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; }
body.video-maximized #floatingMicBtn { display: flex; }
.chat-container { position: relative; flex: 1; display: flex; flex-direction: column; margin-bottom: 10px; min-height: 100px; }
#chat { flex: 1; background: #1e293b; border-radius: 12px; padding: 12px; overflow-y: auto; }
.msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; max-width: 85%; line-height: 1.6; word-wrap: break-word; font-size: 15px; transition: opacity 0.2s; cursor: pointer; }
.msg:active { opacity: 0.7; }
.user-a { background: #4f46e5; margin-right: auto; border-bottom-right-radius: 4px; }
.user-b { background: #10b981; margin-left: auto; border-bottom-left-radius: 4px; color: #000;}
.bot { background: #334155; margin: 0 auto 8px auto; text-align: center; font-style: italic; font-size: 13px; cursor: default; }
.lang-tag { display: inline-block; font-size: 10px; padding: 2px 6px; background: rgba(255,255,255,0.15); border-radius: 6px; margin-right: 6px; opacity: 0.8; font-weight: bold; }
#clearBtn { position: absolute; bottom: 2px; left: 10px; width: 30px; height: 30px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
#clearBtn svg { fill: #2d3748; width: 16px; height: 16px; }
#imagePreviewContainer { display: none; position: absolute; bottom: 50px; right: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 5px; align-items: center; gap: 8px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
#imagePreview { width: 45px; height: 45px; border-radius: 4px; object-fit: cover; }
#cancelImageBtn { background: #dc2626; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.row { display: flex; gap: 6px; align-items: center; flex-shrink: 0; position: relative; }
input[type=text] { flex: 1; padding: 10px; padding-left: 35px; border-radius: 24px; border: 1px solid #1e293b; background: #ffffff; color: #000; font-size: 14px; order: 3; }
button.btn { padding: 0; border: none; border-radius: 50%; font-weight: bold; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s; }
#musicBtn { background: #ffffff; color: #000000; order: 1; font-size: 16px; }
#mediaBtn { background: #1d4ed8; color: #ffffff; order: 2; font-size: 22px; width: 32px; height: 32px; padding-bottom: 2px; font-weight: normal; }
#remoteMicBtn { background: #10b981; color: #fff; order: 2; width: 42px; height: 42px; border-radius: 50%; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4); display: none; transition: all 0.3s ease; }
#remoteMicBtn.recording { background: #ef4444 !important; box-shadow: 0 0 15px rgba(239, 68, 68, 0.8); animation: pulse 1s infinite; }
#toggleCamBtn { background: #475569; color: #fff; order: 2; width: 42px; height: 42px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); display: none; border: none; cursor: pointer; transition: all 0.3s ease; }
#toggleCamBtn.off { background: #ef4444; }
#sendBtn { background: #1d4ed8; order: 4; color: #fff; }
#sendBtn svg { width: 20px; height: 20px; fill: white; transform: translateX(-2px) translateY(2px); }
#stopAudioBtn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; outline: none; }
#stopAudioBtn svg { fill: #2d3748; width: 14px; height: 14px; }
#status { text-align: center; font-size: 12px; color: #0f172a; margin-top: 6px; min-height: 18px; font-weight: bold; }
.extra-controls { display: flex; gap: 6px; margin-bottom: 8px; justify-content: center; flex-wrap: wrap; width: 100%; padding: 0 5px; align-items: center; }
.extra-controls button, .extra-controls select { padding: 6px 12px; border-radius: 15px; border: none; background: #475569; color: #fff; font-size: 10px; cursor: pointer; outline: none; white-space: nowrap; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; }
.toggle-btn { background: #ef4444 !important; color: white !important; font-weight: bold; transition: 0.3s; }
.toggle-btn.active { background: #10b981 !important; }
.btn-back { background: #e57373 !important; color: white !important; }
body.remote-mode #extraControls, body.meeting-mode #extraControls { justify-content: space-between; padding: 0 10px; }
body.remote-mode #extraControls > *, body.meeting-mode #extraControls > * { flex: 1 1 30%; }
#actionMenu { display: none; position: fixed; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px; z-index: 2000; flex-direction: column; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
.action-btn { padding: 8px 12px; border-radius: 8px; border: none; background: #0f172a; color: #fff; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
#musicMenu { display: none; position: fixed; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; z-index: 2000; width: 200px; max-height: 250px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
#musicMenu h4 { font-size: 12px; margin-bottom: 8px; text-align: center; color: #94a3b8; }
.music-item { padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 4px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; }
.music-item:hover { background: #334155; } .music-item.active { background: #0ea5e9; color: #fff; font-weight: bold; }
.music-item.add-more, .music-item.stop-btn, .music-item.pause-btn { text-align: center; font-weight: bold; justify-content: center; }
.music-item.add-more { background: #22c55e; } .music-item.stop-btn { background: #991b1b; margin-bottom: 6px; } .music-item.pause-btn { background: #475569; margin-bottom: 6px; }
.song-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; direction: ltr; }
.delete-song { color: #ef4444; font-weight: bold; padding: 0 6px; font-size: 14px; }
#remoteBar { display: none; background: #1e293b; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; justify-content: space-between; align-items: center; color: #fff; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
#remoteBar .room-info { display: flex; align-items: center; gap: 8px; justify-content: center; flex: 1; }
#remoteBar strong { color: #fbbf24; letter-spacing: 2px; font-size: 14px; }
#copyRoomBtn { background: #6366f1; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; }
.overlay { position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; color: #fff; padding: 20px; z-index: 99999; overflow-y: auto; }
.overlay h1 { font-size: 28px; color: #0ea5e9; margin-bottom: 10px; }
.overlay h2 { font-size: 20px; color: #10b981; margin-bottom: 5px; }
.overlay .mode-btn { padding: 15px 30px; font-size: 16px; border-radius: 12px; border: none; color: #fff; cursor: pointer; width: 260px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
#btnLocal { background: #6366f1; } #btnRemote { background: #10b981; } #btnMeeting { background: #1d4ed8; }
#btnMeeting .plus-icon { font-size: 24px; font-weight: bold; margin-bottom: 3px; }
.join-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
.join-form input[type="text"], .join-form select { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; width: 100%; outline: none; }
.join-form input:focus { border-color: #0ea5e9; }
.join-form button { padding: 12px; border-radius: 8px; border: none; color: #fff; cursor: pointer; font-weight: bold; font-size: 14px; }
#createRoomBtn, #createMeetingBtn { background: #10b981; }
#joinRoomBtn, #joinMeetingBtn { background: #6366f1; }
#joinRow { display: flex; gap: 8px; }
#joinCodeInput, #joinMeetingCodeInput { flex: 1; text-transform: uppercase; text-align: center; letter-spacing: 2px; }
#backToLandingBtn, #backToLandingFromMeetBtn { background: transparent; border: none; color: #94a3b8; cursor: pointer; margin-top: 5px; font-size: 13px; text-decoration: underline; }
.checkbox-row { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 13px; color: #94a3b8; cursor: pointer; }
.checkbox-row input { width: 16px; height: 16px; cursor: pointer; }
</style>
</head>
<body>

<div id="authOverlay">
  <div class="auth-lang-switch">
    <button class="lang-btn active" onclick="changeAuthLang('ar')">AR</button>
    <button class="lang-btn" onclick="changeAuthLang('fr')">FR</button>
    <button class="lang-btn" onclick="changeAuthLang('en')">EN</button>
  </div>
  <div class="auth-box">
    <h1 style="color:#0ea5e9; margin-bottom:10px;">🌐 Chat-Core</h1>
    <h2 id="authTitle">تسجيل الدخول</h2>
    <div id="authError"></div>
    <input type="email" id="authEmail" class="auth-input" placeholder="البريد الإلكتروني">
    <input type="password" id="authPassword" class="auth-input" placeholder="كلمة المرور">
    <button id="authSubmitBtn" class="auth-btn" onclick="handleEmailAuth()">دخول</button>
    <button id="authToggleBtn" class="auth-btn outline" onclick="toggleAuthMode()">إنشاء حساب جديد</button>
    <div class="divider" id="authDivider">أو</div>
    <button class="social-btn" onclick="loginWithGoogle()" id="btnAuthGoogle">🌐 Google</button>
    <button class="social-btn" onclick="loginWithGithub()" id="btnAuthGithub">🐙 GitHub</button>
    <button class="social-btn" onclick="loginWithTwitter()" id="btnAuthTwitter">🐦 X</button>
  </div>
</div>

<button id="floatingMicBtn" title="Talk">
  <svg viewBox="0 0 24 24" width="30" height="30" fill="white"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
</button>

<div class="overlay" id="landingOverlay" style="display:none;">
  <h1>🌐 Chat-Core</h1>
  <p style="color:#94a3b8; font-size:13px; margin-bottom:10px;">اختر وضع التشغيل</p>
  <button class="mode-btn" id="btnLocal">🌐 Face-to-Face</button>
  <button class="mode-btn" id="btnRemote">💬 Remote Mode</button>
  <button class="mode-btn" id="btnMeeting"><span class="plus-icon">+</span> Meeting Room</button>
  <button class="mode-btn" id="btnFriends" style="background:#f59e0b; position:relative;">👥 <span id="btnFriendsLabel">الأصدقاء</span><span id="friendsBadge" style="display:none; position:absolute; top:-6px; right:-6px; min-width:22px; height:22px; border-radius:11px; background:#ef4444; font-size:12px; line-height:22px; text-align:center; padding:0 5px;">0</span></button>
  <button class="mode-btn" id="btnLogout" style="background: #ef4444; margin-top: 20px;">🚪 تسجيل الخروج</button>
</div>

<div class="overlay" id="friendsOverlay" style="display:none;">
  <h2>👥 <span id="frTitle">الأصدقاء</span></h2>
  <div class="join-form" style="max-width:340px;">
    <div style="text-align:center; font-size:12px; color:#94a3b8;" id="frMyCodeLabel">كود الصداقة الخاص بك</div>
    <div style="display:flex; gap:8px; align-items:center; justify-content:center;">
      <strong id="frMyCode" style="color:#fbbf24; letter-spacing:3px; font-size:18px;">--------</strong>
      <button id="frCopyCode" style="background:#6366f1; padding:6px 10px; font-size:11px;">📋</button>
    </div>
    <div id="joinRowFr" style="display:flex; gap:8px;">
      <input type="text" id="frAddInput" placeholder="كود صديق" maxlength="8" style="flex:1; text-transform:uppercase; text-align:center; letter-spacing:2px;">
      <button id="frAddBtn" style="background:#10b981;">➕</button>
    </div>
    <div id="frMsg" style="min-height:16px; font-size:12px; text-align:center; color:#fbbf24;"></div>
    <div id="frRequestsBox" style="display:none;">
      <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;" id="frReqTitle">طلبات الصداقة</div>
      <div id="frRequests" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
    <div style="font-size:12px; color:#94a3b8;" id="frListTitle">قائمة الأصدقاء</div>
    <div id="frList" style="display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;"></div>
    <button id="frBackBtn" style="background:transparent; color:#94a3b8; text-decoration:underline; font-weight:normal;">← رجوع</button>
  </div>
</div>

<div class="overlay" id="chatOverlay" style="display:none; justify-content:flex-start; gap:8px; padding:10px;">
  <div style="width:100%; max-width:420px; display:flex; align-items:center; gap:8px; flex-shrink:0;">
    <button id="chBack" style="background:#475569; color:#fff; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:bold;">←</button>
    <strong id="chName" style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px;"></strong>
    <select id="chLang" class="lang-select" style="width:92px; height:30px; font-size:10px;" title="Translate to"></select>
  </div>

async function startManualTranslation() {
  if (isManualTranslating) return;
  try {
    const transStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true, noiseSuppression: true, autoGainControl: true,
        channelCount: 1, sampleRate: 48000
      }
    });
    const rawTrack = transStream.getAudioTracks()[0];

    // High-pass filter + RMS monitor
    translationAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = translationAudioCtx.createMediaStreamSource(new MediaStream([rawTrack]));
    const hp = translationAudioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 80;
    const analyser = translationAudioCtx.createAnalyser();
    analyser.fftSize = 512;
    const destination = translationAudioCtx.createMediaStreamDestination();
    source.connect(hp); hp.connect(analyser); analyser.connect(destination);

    const filteredTrack = destination.stream.getAudioTracks()[0];
    const rmsBuffer = new Float32Array(analyser.fftSize);
    let rmsMax = 0;

    let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    audioRecorder = new MediaRecorder(new MediaStream([filteredTrack]), { mimeType });
    let chunks = [];
    audioRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

    const rmsInterval = setInterval(() => {
      try {
        analyser.getFloatTimeDomainData(rmsBuffer);
        let sum = 0; for (let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i]*rmsBuffer[i];
        const rms = Math.sqrt(sum / rmsBuffer.length);
        if (rms > rmsMax) rmsMax = rms;
      } catch(e){}
    }, 100);

    audioRecorder.onstop = async () => {
      clearInterval(rmsInterval);
      try { rawTrack.stop(); } catch(e){}
      try { if (translationAudioCtx && translationAudioCtx.state !== 'closed') await translationAudioCtx.close(); } catch(e){}
      translationAudioCtx = null;
      const durationMs = Date.now() - translationStartTime;
      if (chunks.length === 0) return;
      if (durationMs < 400) { addMsg('⚠️ تسجيل قصير جداً.', 'bot'); resetStatus(); return; }
      if (rmsMax < 0.008) { addMsg('⚠️ لم يُسمع صوت واضح.', 'bot'); resetStatus(); return; }
      const blob = new Blob(chunks, { type: audioRecorder.mimeType });
      setStatus('⏳ Translating...');
      const formData = new FormData();
      formData.append('file', blob, 'audio.webm');
      formData.append('target_lang', myLang);
      formData.append('language', myLang);
      formData.append('duration_ms', String(durationMs));
      try {
        const res = await fetch(TRANSCRIBE_URL, { method: 'POST', body: formData });
        if (res.ok) {
          const data = await res.json();
          if (data.original && data.original.length > 1 && data.original !== "لم يتم التعرف على أي كلام.") {
            addMsg(`You: ${data.original}`, 'user-a', myLang);
            sendRemoteMessage(data.original);
          } else { addMsg(`⚠️ لم يتم التعرف على كلام.`, 'bot'); }
        }
      } catch(e) { console.warn('Audio upload failed', e); }
      resetStatus();
    };

    audioRecorder.start();
    translationStartTime = Date.now();
    isManualTranslating = true;
    updateTranslatorUI();
    setStatus('🎤 Recording... Press mic to stop & translate');
    recordTimer = setTimeout(() => { if (isManualTranslating) stopManualTranslation(); }, 15000);
  } catch (e) {
    console.error("Mic access failed", e);
    addMsg("⚠️ تعذر الوصول للمايك.", "bot");
  }
}
function stopManualTranslation() {
  if (!isManualTranslating) return;
  isManualTranslating = false;
  clearTimeout(recordTimer);
  if (audioRecorder && audioRecorder.state === 'recording') audioRecorder.stop();
  updateTranslatorUI();
}

  const processVoice = (text) => {
    const clean = removeRepeatedWords(text).trim();
    if (!clean) return;

    if (clean === lastSentText && (now - lastSentTime) < 3000) return;
    lastSentText = clean; lastSentTime = now;
    const isA = activeSpeaker === 'A';

    ask(clean, isA ? langA.value : langB.value, isA ? langB.value : langA.value, activeSpeaker);
  };
  recognition.onresult = (e) => {
    if (isProcessingAudio) return;
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; ++i) {
      if (e.results[i].isFinal) {
        let newPart = e.results[i][0].transcript.trim();
        if (newPart) {
          let cleanBuffer = finalTranscriptBuffer.toLowerCase().replace(/[.,?!]/g, '').trim();
          let cleanNewPart = newPart.toLowerCase().replace(/[.,?!]/g, '').trim();

    clearTimeout(silenceTimer);

    else if (speaker === 'B') { recognition.lang = localeFor(langB.value); micB.classList.add('recording'); micA.disabled = true; setStatus('🎤 Listening (Friend)...'); }

async function speak(text, lang) {
  if (!text) return;
  stopAudio();
  const cleaned = cleanTextForTTS(text);
  if (!cleaned) return;
  const myId = ++currentSpeechId;
  isBotTalking = true; setAvatarState(true);
  try {
    const voice = voiceSelect ? voiceSelect.value : 'woman';
    const res = await fetch(TTS_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: cleaned.slice(0, 4000), lang: lang || 'ar', voice, session_id: SESSION_ID })
    });
    if (!res.ok) throw new Error('tts ' + res.status);
    if (myId !== currentSpeechId) return;
    const blob = await res.blob(); const url = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    currentAudio.onended = () => { URL.revokeObjectURL(url); isBotTalking = false; setAvatarState(false); };
    currentAudio.onerror = () => { URL.revokeObjectURL(url); isBotTalking = false; setAvatarState(false); };
    await currentAudio.play().catch(() => {});
    return;
  } catch (e) {}
  if (myId !== currentSpeechId) return;
  if ('speechSynthesis' in window) {
    try {
      const utt = new SpeechSynthesisUtterance(cleaned);
      utt.lang = localeFor(lang || 'ar');
      utt.onend = () => { isBotTalking = false; setAvatarState(false); };
      utt.onerror = () => { isBotTalking = false; setAvatarState(false); };
      speechSynthesis.speak(utt);
    } catch (e) { isBotTalking = false; setAvatarState(false); }
  } else { isBotTalking = false; setAvatarState(false); }
}
function stopAudio() {
  currentSpeechId++;
  if (currentAudio) { try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {} currentAudio = null; }
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
  isBotTalking = false; setAvatarState(false);
}
function setAvatarState(talking) {
  try {
    if (avatarVideo && avatarVideo.style.display === 'block' && avatarVideo.src) {
      if (talking) avatarVideo.play().catch(() => {});
      else { avatarVideo.pause(); try { avatarVideo.currentTime = 0; } catch (e) {} }
    }
  } catch (e) {}
}
function startPing() {
  stopPing();
  pingInterval = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) { try { ws.send(JSON.stringify({ type: 'ping' })); } catch (e) {} }
  }, 20000);
}
function stopPing() { if (pingInterval) { clearInterval(pingInterval); pingInterval = null; } }
function connectWS(roomCode) {
  try { if (ws) ws.close(); } catch (e) {}
  ws = new WebSocket(WS_BASE + '/ws/' + String(roomCode).toUpperCase());
  ws.onopen = () => { try { ws.send(JSON.stringify({ type: 'join', name: myName, lang: myLang })); } catch (e) {} startPing(); };
  ws.onmessage = (evt) => { try { handleWSMessage(JSON.parse(evt.data)); } catch (e) { console.warn('ws parse', e); } };
  ws.onerror = () => setStatus('⚠️ خطأ في الاتصال');
  ws.onclose = () => {
    stopPing();
    if (shouldReconnect && hasJoinedOnce && currentRoomCode) {
      if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
      wsReconnectTimer = setTimeout(() => { if (shouldReconnect && currentRoomCode) connectWS(currentRoomCode); }, 3000);
    }
  };
}
function sendRemoteMessage(text) {
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  try { ws.send(JSON.stringify({ type: 'message', text, translate: !!isTranslatorMode })); } catch (e) {}
}
async function handleWSMessage(msg) {
  if (!msg || !msg.type) return;
  const type = msg.type;
  if (type === 'pong') return;
  if (type === 'error') { addMsg('⚠️ ' + (msg.message || 'خطأ'), 'bot'); return; }
  if (type === 'joined') {
    hasJoinedOnce = true;
    const n = (msg.users || []).length;
    if (onlineCount) onlineCount.textContent = n + '/50';
    setStatus('✅ متصل');
    if (msg.history && msg.history.length) {
      addMsg('📜 سجل سابق:', 'bot');
      msg.history.forEach(h => {
        addMsg((h.from || '?') + ': ' + (h.original || ''), 'user-b', h.from_lang || 'en');
        if (h.translated && h.translated !== h.original) addMsg('↳ ' + h.translated, 'bot', myLang);
      });
    }
    if (appMode === 'remote' && myIsCaller && !_rtcInitiated && n > 1) {
      _rtcInitiated = true; setTimeout(() => startVideoCall(true), 300);
    }
    return;
  }
  if (type === 'user_joined') {
    addMsg('👋 ' + (msg.name || 'مستخدم') + ' انضم', 'bot');
    if (appMode === 'remote' && myIsCaller && !_rtcInitiated) {
      _rtcInitiated = true; setTimeout(() => startVideoCall(true), 300);
    }
    return;
  }
  if (type === 'user_left') { addMsg('👋 ' + (msg.name || 'مستخدم') + ' غادر', 'bot'); return; }
  if (type === 'translated') {
    if (msg.is_mine) return;
    addMsg((msg.from_name || 'صديق') + ': ' + (msg.original || ''), 'user-b', msg.from_lang || 'en');
    if (msg.translated && msg.translated !== msg.original) {
      addMsg('↳ ' + msg.translated, 'bot', msg.target_lang || myLang);
      if (!msg.no_tts && isTranslatorMode) speak(msg.translated, msg.target_lang || myLang);
    }
    return;
  }
  if (type === 'chat_media') { addMsg((msg.from_name || 'صديق') + ' 📷:', 'user-b', msg.from_lang || 'en', msg.data); return; }
  if (type === 'rtc-offer') { await handleRtcOffer(msg.offer); return; }
  if (type === 'rtc-answer') { await handleRtcAnswer(msg.answer); return; }
  if (type === 'rtc-ice') { await handleRtcIce(msg.candidate); return; }
}
async function handleRtcOffer(offer) {
  try {
    if (!pc) await startVideoCall(false);
    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'rtc-answer', answer }));
    for (const c of iceCandidatesQueue) { try { await pc.addIceCandidate(c); } catch (e) {} }
    iceCandidatesQueue = [];
  } catch (e) { console.warn('rtc offer', e); }
}
async function handleRtcAnswer(answer) {
  try {
    if (!pc || pc.signalingState !== 'have-local-offer') return;
    await pc.setRemoteDescription(answer);
    for (const c of iceCandidatesQueue) { try { await pc.addIceCandidate(c); } catch (e) {} }
    iceCandidatesQueue = [];
  } catch (e) { console.warn('rtc answer', e); }
}
async function handleRtcIce(candidate) {
  if (!candidate) return;
  if (!pc || !pc.remoteDescription) { iceCandidatesQueue.push(candidate); return; }
  try { await pc.addIceCandidate(candidate); } catch (e) {}
}
async function connectRemote(roomCode, participantName, lang, isCaller) {
  myName = participantName; myLang = lang;
  currentRoomCode = String(roomCode).toUpperCase();
  myIsCaller = !!isCaller; hasJoinedOnce = false; shouldReconnect = true;
  _rtcInitiated = false; iceCandidatesQueue = [];
  isTranslatorMode = $('remoteTransCheck') ? $('remoteTransCheck').checked : false;
  roomCodeLabel.textContent = currentRoomCode;
  setModeUI('remote');
  setStatus('⏳ جاري الاتصال بالغرفة...');
  connectWS(currentRoomCode);
}
async function enterMeeting(roomCode, participantName, lang) {
  myName = participantName; myLang = lang;
  currentRoomCode = String(roomCode).toUpperCase();
  hasJoinedOnce = false; shouldReconnect = true;
  isTranslatorMode = $('meetingTransCheck') ? $('meetingTransCheck').checked : false;
  roomCodeLabel.textContent = currentRoomCode;
  setModeUI('meeting');
  setStatus('⏳ جاري الاتصال بالاجتماع...');
  connectWS(currentRoomCode);
  await connectLiveKit(currentRoomCode, participantName);
}

// Friends Chat
const CHAT_LANGS = [['ar','🇹🇳 العربية'],['fr','🇫🇷 Français'],['en','🇬🇧 English'],['de','🇩🇪 Deutsch'],['tr','🇹🇷 Türkçe'],['it','🇮🇹 Italiano'],['zh','🇨🇳 中文'],['ru','🇷🇺 Русский'],['es','🇪🇸 Español'],['pt','🇵🇹 Português'],['nl','🇳🇱 Nederlands'],['no','🇳🇴 Norsk']];
function populateChLang() {
  const el = $('chLang'); if (!el || _chLangPopulated) return;
  el.innerHTML = '';
  CHAT_LANGS.forEach(([v, label]) => { const o = document.createElement('option'); o.value = v; o.textContent = label; el.appendChild(o); });
  _chLangPopulated = true;
}
async function openChat(friend) {
  if (!db || !currentUser || !friend) return;
  chatOpenWith = friend; chatMsgsCache = []; populateChLang();
  $('chName').textContent = friend.name || '?';
  $('chLang').value = myLang || 'ar';
  $('chMsgs').innerHTML = ''; $('chStatus').textContent = 'جارٍ التحميل...';
  $('chatOverlay').style.display = 'flex';
  const chatId = [currentUser.uid, friend.uid].sort().join('_');
  if (chatUnsub) { try { chatUnsub(); } catch (e) {} }
  chatUnsub = db.collection('chats').doc(chatId).collection('messages').orderBy('createdAt', 'asc').limit(100)
    .onSnapshot(snap => {
      chatMsgsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderChatMsgs(); $('chStatus').textContent = '';
      try { db.collection('chats').doc(chatId).set({ ['unread_' + currentUser.uid]: 0 }, { merge: true }); } catch (e) {}
    }, err => { $('chStatus').textContent = '⚠️ ' + (err.message || ''); });
}
function renderChatMsgs() {
  const box = $('chMsgs'); box.innerHTML = '';
  chatMsgsCache.forEach(m => {
    const mine = m.from === currentUser.uid;
    const div = document.createElement('div');
    div.style.cssText = 'max-width:80%; padding:8px 12px; border-radius:10px; font-size:13px; line-height:1.5; word-wrap:break-word; ' +
      (mine ? 'align-self:flex-end; background:#4f46e5; color:#fff;' : 'align-self:flex-start; background:#0f172a; color:#fff;');
    let html = escapeHtml(m.text || '');
    if (m.translated && m.translated !== m.text) html += '<br><span style="font-size:11px; opacity:0.75; font-style:italic;">↳ ' + escapeHtml(m.translated) + '</span>';
    div.innerHTML = html; box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}
async function sendChatMessage() {
  const text = ($('chInput').value || '').trim();
  if (!text || !chatOpenWith || !db || !currentUser) return;
  const targetLang = $('chLang').value || 'en';
  $('chInput').value = ''; $('chStatus').textContent = '⏳ جاري الترجمة...';
  let translated = '';
  try {
    const res = await fetch(SERVER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [
        { role: 'system', content: 'Translate from ' + langNameFor(myLang) + ' to ' + langNameFor(targetLang) + '. Output ONLY the translation.' },
        { role: 'user', content: text }
      ], is_translation: true })
    });
    const data = await res.json(); translated = (data.reply || '').trim();
  } catch (e) { translated = ''; }
  try {
    const chatId = [currentUser.uid, chatOpenWith.uid].sort().join('_');
    const now = Date.now();
    await db.collection('chats').doc(chatId).collection('messages').add({
      from: currentUser.uid, fromName: myDisplayName(), text, translated,
      fromLang: myLang, targetLang, createdAt: now
    });
    await db.collection('chats').doc(chatId).set({
      lastMessage: text, lastAt: now,
      ['unread_' + chatOpenWith.uid]: firebase.firestore.FieldValue.increment(1)
    }, { merge: true });
    $('chStatus').textContent = '';
  } catch (e) { $('chStatus').textContent = '⚠️ فشل الإرسال: ' + (e.message || ''); }
}
if ($('chBack')) $('chBack').addEventListener('click', () => {
  $('chatOverlay').style.display = 'none';
  if (chatUnsub) { try { chatUnsub(); } catch (e) {} chatUnsub = null; }
  chatOpenWith = null;
});
if ($('chSend')) $('chSend').addEventListener('click', sendChatMessage);
if ($('chInput')) $('chInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
});
