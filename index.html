<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat-Core - Translator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: Tahoma, sans-serif; background: #0ea5e9; color: #fff; display: flex; flex-direction: column; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); height: 100dvh; transition: opacity 0.3s; }
  .top-header { display: flex; justify-content: center; align-items: center; gap: 12px; width: 100%; margin-bottom: 10px; flex-shrink: 0; position: relative; z-index: 10001; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 6px 12px; border-radius: 10px; width: 92%; max-width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: opacity 0.3s; }
  .user-section { display: flex; align-items: center; gap: 6px; }
  .lang-select { padding: 4px 2px; border-radius: 6px; background: #0f172a; color: #ffffff; border: 1px solid #334155; font-size: 10px; font-family: Tahoma; outline: none; width: 75px; }
  .lang-select option { background-color: #0f172a; color: #ffffff; }
  .mic-btn { width: 32px; height: 32px; border-radius: 50%; border: none; color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
  .mic-btn.blue { background: #6366f1; box-shadow: 0 0 8px rgba(99,102,241,0.5); }
  .mic-btn.green { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.5); }
  .mic-btn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; box-shadow: 0 0 12px rgba(239,68,68,0.8); }
  .mic-btn:disabled { background: #475569 !important; box-shadow: none; cursor: not-allowed; opacity: 0.5; animation: none; }
  @keyframes pulse { 50% { transform: scale(1.1); } }
  #lockBtn { border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; padding: 0; outline: none; pointer-events: auto !important; }
  #lockBtn.unlocked { width: 14px; height: 14px; border-radius: 50%; background: #ef4444; border: 1px solid #dc2626; }
  #lockBtn.locked { width: 34px; height: 34px; border-radius: 50%; background: #ef4444; color: white; font-size: 16px; box-shadow: 0 0 10px rgba(239,68,68,0.5); }
  .locked-ui { opacity: 0.4; pointer-events: none; filter: blur(1px); }
  #avatar-wrap { width: 120px; height: 120px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.3s; cursor: pointer; }
  #avatar-container { width: 110px; height: 110px; border-radius: 50%; overflow: hidden; background: #1e293b; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0,0,0,0.3); z-index: 1; transition: all 0.3s; }
  #avatar-logo, #avatar-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #avatar-video { display: none; }
  #avatar-wrap.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; margin: 0; background: #000; }
  #avatar-wrap.fullscreen #avatar-container { width: 100vw; height: 100vh; border-radius: 0 !important; background: transparent; box-shadow: none; }
  #avatar-wrap.fullscreen #avatar-logo, #avatar-wrap.fullscreen #avatar-video { object-fit: contain; width: 100vw; height: 100vh; }
  #avatar-wrap.fullscreen #closeFullscreen { display: flex; }
  #avatar-wrap.fullscreen #removeAvatarBtn { top: 20px; right: 20px; width: 18px; height: 18px; }
  #closeFullscreen { display: none; position: fixed; top: 80px; right: 20px; background: rgba(0,0,0,0.6); border: none; color: #fff; font-size: 24px; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 10000; align-items: center; justify-content: center; }
  #removeAvatarBtn { display: none; position: absolute; top: 5px; right: 5px; width: 12px; height: 12px; border-radius: 50%; background: #000000; border: none; cursor: pointer; z-index: 10; padding: 0; opacity: 0.8; }
  .chat-container { position: relative; flex: 1; display: flex; flex-direction: column; margin-bottom: 10px; min-height: 100px; transition: opacity 0.3s; }
  #chat { flex: 1; background: #1e293b; border-radius: 12px; padding: 12px; overflow-y: auto; }
  .msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; max-width: 85%; line-height: 1.6; word-wrap: break-word; font-size: 15px; }
  .user-a { background: #4f46e5; margin-right: auto; border-bottom-right-radius: 4px; } 
  .user-b { background: #10b981; margin-left: auto; border-bottom-left-radius: 4px; color: #000;} 
  .bot { background: #334155; margin: 0 auto 8px auto; text-align: center; font-style: italic; font-size: 13px;}
  .lang-tag { display: inline-block; font-size: 10px; padding: 2px 6px; background: rgba(255,255,255,0.15); border-radius: 6px; margin-right: 6px; opacity: 0.8; font-weight: bold; }
  #clearBtn { position: absolute; bottom: 2px; left: 10px; width: 30px; height: 30px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
  #clearBtn svg { fill: #2d3748; width: 16px; height: 16px; }
  #imagePreviewContainer { display: none; position: absolute; bottom: 50px; right: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 5px; align-items: center; gap: 8px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  #imagePreview { width: 45px; height: 45px; border-radius: 4px; object-fit: cover; }
  #cancelImageBtn { background: #dc2626; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .row { display: flex; gap: 6px; align-items: center; flex-shrink: 0; transition: opacity 0.3s; position: relative; }
  input[type=text] { flex: 1; padding: 10px; border-radius: 24px; border: 1px solid #1e293b; background: #ffffff; color: #000; font-size: 14px; order: 3; }
  button.btn { padding: 0; border: none; border-radius: 50%; font-weight: bold; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s; }
  #musicBtn { background: #ffffff; color: #000000; order: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-size: 16px; }
  #mediaBtn { background: #ffffff; color: #f97316; order: 2; font-size: 11px; font-family: Arial, sans-serif; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  #remoteMicBtn { background: #6366f1; color: #fff; order: 2; font-size: 16px; display: none; }
  #sendBtn { background: #1d4ed8; order: 4; color: #fff; }
  #sendBtn svg { width: 20px; height: 20px; fill: white; transform: translateX(-2px) translateY(2px); }
  #status { text-align: center; font-size: 12px; color: #0f172a; margin-top: 6px; min-height: 18px; font-weight: bold; transition: opacity 0.3s; }
  .extra-controls { display: flex; gap: 5px; margin-bottom: 8px; justify-content: center; flex-wrap: wrap; transition: opacity 0.3s; }
  .extra-controls button, .extra-controls select { padding: 5px 10px; border-radius: 15px; border: none; background: #475569; color: #fff; font-size: 11px; cursor: pointer; outline: none; }
  .extra-controls button.active { background: #eab308; color: #000; }
  #actionMenu { display: none; position: fixed; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); flex-direction: column; gap: 8px; }
  .action-btn { padding: 8px 12px; border-radius: 8px; border: none; background: #0f172a; color: #fff; font-size: 13px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; }
  #musicMenu { display: none; position: fixed; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; z-index: 2000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 200px; max-height: 250px; overflow-y: auto; }
  #musicMenu h4 { font-size: 12px; margin-bottom: 8px; text-align: center; color: #94a3b8; }
  .music-item { padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 4px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; }
  .music-item:hover { background: #334155; } .music-item.active { background: #0ea5e9; color: #fff; font-weight: bold; } 
  .music-item.add-more, .music-item.stop-btn, .music-item.pause-btn { text-align: center; font-weight: bold; justify-content: center; }
  .music-item.add-more { background: #22c55e; } .music-item.stop-btn { background: #991b1b; margin-bottom: 6px; } .music-item.pause-btn { background: #475569; margin-bottom: 6px; }
  .song-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; direction: ltr; }
  .delete-song { color: #ef4444; font-weight: bold; padding: 0 6px; font-size: 14px; }

  /* Remote bar */
  #remoteBar { display: none; background: #1e293b; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; justify-content: space-between; align-items: center; color: #fff; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  #remoteBar strong { color: #fbbf24; letter-spacing: 2px; font-size: 14px; }
  #leaveRoomBtn { background: #ef4444; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }

  /* Overlays */
  .overlay { position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; color: #fff; padding: 20px; z-index: 99999; }
  .overlay h1 { font-size: 28px; color: #0ea5e9; text-shadow: 0 2px 10px rgba(14,165,233,0.4); margin-bottom: 10px; }
  .overlay h2 { font-size: 20px; color: #10b981; margin-bottom: 5px; }
  .overlay .mode-btn { padding: 15px 30px; font-size: 16px; border-radius: 12px; border: none; color: #fff; cursor: pointer; width: 260px; font-weight: bold; transition: transform 0.15s; }
  .overlay .mode-btn:hover { transform: scale(1.03); }
  .overlay input, .overlay select { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 14px; width: 260px; outline: none; }
  .overlay input:focus { border-color: #0ea5e9; }
  #btnLocal { background: #6366f1; }
  #btnRemote { background: #10b981; }
  #createRoomBtn { background: #10b981; padding: 12px; border-radius: 8px; border: none; color: #fff; cursor: pointer; width: 260px; font-weight: bold; }
  #joinRoomBtn { background: #6366f1; padding: 10px 20px; border-radius: 8px; border: none; color: #fff; cursor: pointer; font-weight: bold; }
  #backToLandingBtn { background: transparent; border: none; color: #94a3b8; cursor: pointer; margin-top: 10px; font-size: 13px; }
  #joinRow { display: flex; gap: 8px; align-items: center; }
  #joinCodeInput { width: 150px !important; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
</style>
</head>
<body>

<!-- ============ Landing Overlay ============ -->
<div class="overlay" id="landingOverlay">
  <h1>🌐 Chat-Core</h1>
  <p style="color:#94a3b8; font-size:13px; margin-bottom:10px;">اختر وضع التشغيل</p>
  <button class="mode-btn" id="btnLocal">🌐 Face-to-Face</button>
  <button class="mode-btn" id="btnRemote">💬 Remote Mode</button>
</div>

<!-- ============ Remote Join Overlay ============ -->
<div class="overlay" id="remoteJoinOverlay" style="display:none;">
  <h2>💬 Remote Mode</h2>
  <input type="text" id="playerName" placeholder="اسمك" maxlength="30">
  <select id="playerLang">
    <option value="ar">🇹🇳 Arabic</option>
    <option value="fr">🇫🇷 French</option>
    <option value="en">🇬🇧 English</option>
  </select>
  <button id="createRoomBtn">➕ إنشاء غرفة</button>
  <div id="joinRow">
    <input type="text" id="joinCodeInput" placeholder="الكود" maxlength="6">
    <button id="joinRoomBtn">انضمام</button>
  </div>
  <button id="backToLandingBtn">← رجوع</button>
</div>

<!-- ============ Remote Room Bar ============ -->
<div id="remoteBar">
  <span>Room: <strong id="roomCodeLabel">------</strong></span>
  <span id="onlineCount">1/4</span>
  <button id="leaveRoomBtn">خروج</button>
</div>

<!-- ============ Top header (local mode only) ============ -->
<div class="top-header" id="topHeader">
  <button id="lockBtn" class="unlocked" title="Lock/Unlock"></button>
  <div class="top-bar" id="topBar">
    <div class="user-section">
      <span style="font-size:9px; color:#94a3b8;">Friend</span>
      <select id="langB" class="lang-select">
        <option value="fr">French</option>
        <option value="ar">Arabic</option>
        <option value="en">English</option>
      </select>
      <button id="micB" class="mic-btn green" title="Talk">🎤</button>
    </div>
    <div class="user-section">
      <span style="font-size:9px; color:#94a3b8;">You</span>
      <select id="langA" class="lang-select">
        <option value="ar">Arabic</option>
        <option value="fr">French</option>
        <option value="en">English</option>
      </select>
      <button id="micA" class="mic-btn blue" title="Talk">🎤</button>
    </div>
  </div>
</div>

<div class="extra-controls" id="extraControls">
    <button id="translateModeBtn" class="active">Translator Mode ON</button>
    <select id="voiceSelect">
      <option value="man">👨 Man</option>
      <option value="woman">👩 Woman</option>
      <option value="girl">👧 Girl</option>
      <option value="child">🧒 Child</option>
    </select>
    <button id="uploadBtn">📁 Avatar</button>
</div>

<div id="avatar-wrap">
  <div id="avatar-container">
    <img id="avatar-logo" src="https://cdn.jsdelivr.net/gh/bobo333med-alt/vibe-core@main/image_718b1365.jpg" alt="Chat-Core logo" onerror="this.src='https://cdn.jsdelivr.net/gh/bobo333med-alt/vibe-core@main/image_bb189f9b%20%281%29.jpg'">
    <video id="avatar-video" autoplay loop muted playsinline></video>
  </div>
  <button id="removeAvatarBtn" title="Reset Avatar"></button>
  <button id="closeFullscreen" title="Close">✕</button>
  <input type="file" id="videoUpload" accept="video/*" style="display: none;">
</div>

<div class="chat-container" id="chatContainer">
  <div id="chat"></div>
  <button id="clearBtn" title="Clear Chat">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
  </button>
</div>

<div id="imagePreviewContainer">
  <img id="imagePreview" src="" alt="Preview">
  <button id="cancelImageBtn">✕</button>
</div>

<div class="row" id="inputRow">
  <button class="btn" id="musicBtn" title="Music">🎵</button>
  <button class="btn" id="mediaBtn" title="Media">media</button>
  <button class="btn" id="remoteMicBtn" title="Talk">🎤</button>
  <input type="text" id="textInput" placeholder="Type..." />
  <button class="btn" id="sendBtn" title="Send"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
</div>
<div id="status" class="status-text">Ready</div>

<div id="actionMenu">
  <button class="action-btn" id="menuCamera">📸 Camera</button>
  <button class="action-btn" id="menuGallery">🖼️ Gallery</button>
  <button class="action-btn" id="menuFile">📄 File</button>
</div>
<input type="file" id="cameraUpload" accept="image/*" capture="environment" style="display: none;">
<input type="file" id="galleryUpload" accept="image/*" style="display: none;">
<input type="file" id="fileUpload" accept=".txt" style="display: none;">
<input type="file" id="audioUpload" accept="audio/*" multiple style="display: none;">
<audio id="bgAudio"></audio>

<div id="musicMenu">
  <h4>🎵 Playlist</h4>
  <div id="musicList"></div>
</div>

<script>
'use strict';

// ============ Config ============
const SERVER_URL = "https://vibe-core-0m1r.onrender.com/chat";
const TTS_URL = "https://vibe-core-0m1r.onrender.com/tts";
const ROOM_CREATE_URL = "https://vibe-core-0m1r.onrender.com/rooms/create";
const WS_BASE = SERVER_URL.replace('https://', 'wss://').replace('http://', 'ws://').replace('/chat', '');
const REQUEST_TIMEOUT_MS = 90000;
const HISTORY_LIMIT = 12;
const SESSION_ID = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));

const $ = id => document.getElementById(id);
const chatEl = $('chat'), inputEl = $('textInput'), sendBtn = $('sendBtn');
const micA = $('micA'), micB = $('micB'), remoteMicBtn = $('remoteMicBtn');
const langA = $('langA'), langB = $('langB');
const clearBtn = $('clearBtn'), statusEl = $('status');
const avatarWrap = $('avatar-wrap'), avatarLogo = $('avatar-logo'), avatarVideo = $('avatar-video'), closeFullscreen = $('closeFullscreen'), removeAvatarBtn = $('removeAvatarBtn');
const translateModeBtn = $('translateModeBtn');
const voiceSelect = $('voiceSelect');
const uploadBtn = $('uploadBtn'), videoUpload = $('videoUpload');
const mediaBtn = $('mediaBtn'), actionMenu = $('actionMenu'), menuCamera = $('menuCamera'), menuGallery = $('menuGallery'), menuFile = $('menuFile');
const cameraUpload = $('cameraUpload'), galleryUpload = $('galleryUpload'), fileUpload = $('fileUpload'), audioUpload = $('audioUpload');
const musicBtn = $('musicBtn'), musicMenu = $('musicMenu'), musicList = $('musicList'), bgAudio = $('bgAudio');
const lockBtn = $('lockBtn');
const imagePreviewContainer = $('imagePreviewContainer');
const imagePreview = $('imagePreview');
const cancelImageBtn = $('cancelImageBtn');
const topHeader = $('topHeader'), remoteBar = $('remoteBar'), roomCodeLabel = $('roomCodeLabel'), onlineCount = $('onlineCount');
const leaveRoomBtn = $('leaveRoomBtn');

const uiElements = [$('extraControls'), $('avatar-wrap'), $('chatContainer'), $('inputRow'), $('status'), $('topBar'), imagePreviewContainer];

// ============ State ============
let appMode = 'none'; // 'none' | 'local' | 'remote'
let chatHistory = [];
let isTranslatorMode = true;
let activeSpeaker = null;
let isRecording = false;
let isSending = false;
let isCompressing = false;
let isLocked = false;
let currentAudio = null;
let currentAvatarObjectUrl = null;
let attachedImageBase64 = null;
let attachedFileText = null;
let playlist = [], currentSongIndex = -1, cachedVoices = [];
let currentSpeechId = 0;
let isBotTalking = false;

// Remote-specific
let ws = null;
let wsReconnectTimer = null;
let pingInterval = null;
let myName = 'User';
let myLang = 'ar';
let currentRoomCode = '';
let shouldReconnect = false;
let hasJoinedOnce = false;
let reconnectAttempts = 0;

// ============ Utils ============
function setStatus(s) { statusEl.textContent = s; }
function resetStatus() { setStatus(appMode === 'remote' ? `Room ${currentRoomCode}` : (isTranslatorMode ? 'Translator Mode ON 🌐' : 'Chat Mode ON 💬')); }
resetStatus();

function setBusy(busy) {
  isSending = busy;
  sendBtn.disabled = busy || isCompressing;
  micA.disabled = busy;
  micB.disabled = busy;
  remoteMicBtn.disabled = busy;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function addMsg(text, className, lang) {
  const div = document.createElement('div');
  div.className = 'msg ' + className;
  div.setAttribute('dir', 'auto');
  if (lang && (isTranslatorMode || appMode === 'remote')) {
    const tag = document.createElement('span');
    tag.className = 'lang-tag';
    tag.textContent = String(lang).toUpperCase();
    div.appendChild(tag);
  }
  div.insertAdjacentHTML('beforeend', escapeHtml(text).replace(/\n/g, '<br>'));
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function unlockAudio() {
  if ('speechSynthesis' in window) { try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {} }
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) {}
}
document.body.addEventListener('click', unlockAudio, { once: true });

function fetchWithTimeout(url, options, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
}

function langNameFor(code) { return { 'ar': 'Arabic', 'en': 'English', 'fr': 'French' }[code] || 'English'; }
function localeFor(code) { return { 'ar': 'ar-TN', 'en': 'en-US', 'fr': 'fr-FR' }[code] || 'en-US'; }

function compressImage(base64Str, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve) => {
    const img = new Image();
    img.src = base64Str;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let width = img.width, height = img.height;
      if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(base64Str);
  });
}

// ============ Mode switching ============
function setModeUI(mode) {
  appMode = mode;
  if (mode === 'local') {
    topHeader.style.display = 'flex';
    remoteBar.style.display = 'none';
    remoteMicBtn.style.display = 'none';
    mediaBtn.style.display = 'flex';
    translateModeBtn.style.display = 'inline-block';
  } else if (mode === 'remote') {
    topHeader.style.display = 'none';
    remoteBar.style.display = 'flex';
    remoteMicBtn.style.display = 'flex';
    mediaBtn.style.display = 'none';
    translateModeBtn.style.display = 'none';
  }
}

$('btnLocal').addEventListener('click', () => {
  $('landingOverlay').style.display = 'none';
  setModeUI('local');
  resetStatus();
});

$('btnRemote').addEventListener('click', () => {
  $('landingOverlay').style.display = 'none';
  $('remoteJoinOverlay').style.display = 'flex';
});

$('backToLandingBtn').addEventListener('click', () => {
  $('remoteJoinOverlay').style.display = 'none';
  $('landingOverlay').style.display = 'flex';
});

// ============ Lock / Avatar / UI ============
lockBtn.addEventListener('click', () => {
  isLocked = !isLocked;
  if (isLocked) {
    lockBtn.classList.remove('unlocked');
    lockBtn.classList.add('locked');
    lockBtn.textContent = '🔒';
    uiElements.forEach(el => el.classList.add('locked-ui'));
    stopAudio();
    if (isRecording && recognition) recognition.stop();
    setStatus('App is locked 🔒');
  } else {
    lockBtn.classList.remove('locked');
    lockBtn.classList.add('unlocked');
    lockBtn.textContent = '';

function renderPlaylist() {
  musicList.innerHTML = '';
  const stopBtn = document.createElement('div'); stopBtn.className = 'music-item stop-btn'; stopBtn.textContent = '🛑 Stop'; stopBtn.onclick = stopMusic; musicList.appendChild(stopBtn);
  const pauseBtn = document.createElement('div'); pauseBtn.className = 'music-item pause-btn'; pauseBtn.textContent = bgAudio.paused ? '▶️ Play' : '⏸️ Pause';
  pauseBtn.onclick = (e) => { e.stopPropagation(); if (bgAudio.src) { if (bgAudio.paused) bgAudio.play(); else bgAudio.pause(); renderPlaylist(); } };
  musicList.appendChild(pauseBtn);
  const addBtn = document.createElement('div'); addBtn.className = 'music-item add-more'; addBtn.textContent = '➕ Add'; addBtn.onclick = () => { audioUpload.value = ''; audioUpload.click(); }; musicList.appendChild(addBtn);
  playlist.forEach((song, index) => {
    const div = document.createElement('div'); div.className = 'music-item';
    const name = document.createElement('span'); name.className = 'song-name'; name.textContent = song.name;
    const del = document.createElement('span'); del.className = 'delete-song'; del.textContent = '✕';
    del.onclick = (e) => { e.stopPropagation(); if (currentSongIndex === index) stopMusic(); playlist.splice(index, 1); if(currentSongIndex > index) currentSongIndex--; renderPlaylist(); };
    div.appendChild(name); div.appendChild(del);
    if (index === currentSongIndex && !bgAudio.paused) div.classList.add('active');
    div.onclick = () => playSong(index);
    musicList.appendChild(div);
  });
}

function stopMusic() { bgAudio.pause(); bgAudio.currentTime = 0; currentSongIndex = -1; renderPlaylist(); }
function playSong(index) { if (currentSongIndex === index && !bgAudio.paused) { bgAudio.pause(); renderPlaylist(); return; } currentSongIndex = index; bgAudio.src = playlist[index].url; bgAudio.play(); renderPlaylist(); }
bgAudio.addEventListener('ended', () => playSong((currentSongIndex + 1) % playlist.length));
bgAudio.addEventListener('play', renderPlaylist); bgAudio.addEventListener('pause', renderPlaylist);
renderPlaylist();

// ============ Prompt builder (local mode) ============
function buildSystemPrompt(targetLang) {
  const langName = langNameFor(targetLang);
  const currentDate = new Date().toLocaleDateString(localeFor(targetLang), { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  if (isTranslatorMode) {
    return `You are a world-class literal translation engine. 
Your ONLY task is to translate the user's input into ${langName}.
RULES:
1. Output ONLY the translated text.
2. DO NOT answer, explain, or add extra words.
3. If an image or file is provided, translate the text inside it into ${langName}.
4. If the user speaks in any language, translate it into ${langName}.`;
  }
  if (targetLang === 'ar') {
    return `You are Chat-Core, a highly intelligent, empathetic, and wise human friend.
CURRENT DATE: Today is ${currentDate}.
CRITICAL DIALECT RULE: You MUST reply in deep Tunisian Derja (شنية، برشة، كيفاش، علاش، توة، باهي، مريقل).
ABSOLUTE RULE 1: YOU ARE STRICTLY FORBIDDEN FROM USING LATIN CHARACTERS. WRITE ONLY IN ARABIC SCRIPT.
ABSOLUTE RULE 2: Use commas and periods to allow the voice to breathe naturally.
MEMORY: Remember the user's name, context, and previous messages.
GENIUS MODE: You are a polymath. Solve complex problems accurately.
NO ROBOT TALK: Reply naturally like a friend.
NEVER mention AI or GPT. You are a real human named Chat-Core.`;
  }
  return `You are Chat-Core, a highly intelligent, empathetic, and wise human.
CURRENT DATE: Today is ${currentDate}.
CRITICAL LANGUAGE RULE: You MUST reply ONLY in ${langName}. DO NOT USE ARABIC.
MEMORY: Remember the user's name, context, and previous messages.
GENIUS MODE: You are a polymath. Solve complex problems accurately.
NO ROBOT TALK: Reply naturally like a friend.
NEVER mention AI or GPT. You are a real human named Chat-Core.`;
}

// ============ Local mode ask() ============
async function ask(text, sourceLang, targetLang, speaker) {
  if (isSending || isLocked) return;
  setBusy(true);
  setStatus('Processing...');

  const systemPrompt = buildSystemPrompt(targetLang);
  const messages = [{ role: 'system', content: systemPrompt }];
  if (!isTranslatorMode) {
    chatHistory.slice(-HISTORY_LIMIT).forEach(m => messages.push(m));
  }

  let finalText = text || '';
  if (attachedFileText) finalText = finalText + "\n\nFile Content:\n" + attachedFileText;

  let userContent;
  if (attachedImageBase64) {
    userContent = [
      { type: "text", text: finalText || (isTranslatorMode ? "Translate the text in this image." : "Analyze this image.") },
      { type: "image_url", image_url: { url: attachedImageBase64 } }
    ];
  } else {
    userContent = finalText;
  }
  messages.push({ role: 'user', content: userContent });

  let reply = null;
  try {
    const res = await fetchWithTimeout(SERVER_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: messages,
        is_vision: attachedImageBase64 != null,
        is_translation: isTranslatorMode,
        session_id: SESSION_ID,
        target_lang: targetLang
      })
    }, REQUEST_TIMEOUT_MS);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Server error');
    reply = data.reply.trim();
  } catch (e) {
    console.error(e);
    addMsg('تعذّر الاتصال. تحقّق من الشبكة وأعد المحاولة.', 'bot');
    setStatus('Error');
  } finally {
    setBusy(false);
    if (reply) {
      const replyClass = (speaker === 'A') ? 'user-b' : 'user-a';
      const finalClass = isTranslatorMode ? replyClass : 'user-b';
      addMsg(reply, finalClass, targetLang);
      resetStatus();
      speak(reply, targetLang);

      if (!isTranslatorMode) {
        let historyText = text || '';
        if (attachedImageBase64) historyText = '[Image] ' + historyText;
        if (attachedFileText) historyText = '[File] ' + historyText;
        historyText = historyText.trim();
        if (historyText) {
          chatHistory.push({ role: 'user', content: historyText });
          chatHistory.push({ role: 'assistant', content: reply });
          if (chatHistory.length > HISTORY_LIMIT) chatHistory = chatHistory.slice(-HISTORY_LIMIT);
        }
      }
      attachedImageBase64 = null;
      attachedFileText = null;
      imagePreviewContainer.style.display = 'none';
    }
  }
}

// ============ Speech recognition ============
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (SR) {
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => { isRecording = true; };

  recognition.onresult = e => {
    if (isLocked) return;
    const text = e.results[0][0].transcript;
    if (!text.trim()) { unlockMics(); return; }

    if (appMode === 'remote') {
      addMsg(`You: ${text}`, 'user-a', myLang);
      sendRemoteMessage(text);
      setTimeout(unlockMics, 400);
      return;
    }

    const isA = activeSpeaker === 'A';
    addMsg(text, isA ? 'user-a' : 'user-b', isA ? langA.value : langB.value);
    ask(text, isA ? langA.value : langB.value, isA ? langB.value : langA.value, activeSpeaker);
  };

  recognition.onerror = e => { setStatus('Mic Error: ' + e.error); unlockMics(); };
  recognition.onend = () => { isRecording = false; if (!isBotTalking && !isSending) unlockMics(); };

  const startMic = (speaker) => {
    if (isLocked) return;
    unlockAudio();
    if (isRecording) { recognition.stop(); return; }
    stopAudio(); activeSpeaker = speaker;
    if (speaker === 'A') {
      recognition.lang = langA.value === 'ar' ? 'ar-TN' : langA.value;
      micA.classList.add('recording'); micB.disabled = true;
      setStatus('Listening (You)...');
    } else {
      recognition.lang = langB.value === 'ar' ? 'ar-TN' : langB.value;
      micB.classList.add('recording'); micA.disabled = true;
      setStatus('Listening (Friend)...');
    }
    try { recognition.start(); } catch (e) {}
  };
  micA.addEventListener('click', () => startMic('A'));
  micB.addEventListener('click', () => startMic('B'));

  remoteMicBtn.addEventListener('click', () => {
    if (appMode !== 'remote' || isLocked) return;
    unlockAudio();
    if (isRecording) { recognition.stop(); return; }
    stopAudio();
    recognition.lang = myLang === 'ar' ? 'ar-TN' : myLang;
    remoteMicBtn.classList.add('recording');
    setStatus('Listening...');
    try { recognition.start(); } catch (e) {}
  });
} else {
  micA.onclick = micB.onclick = remoteMicBtn.onclick = () => alert('Browser does not support Mic.');
}

// ============ Send button (local mode) ============
sendBtn.addEventListener('click', () => {
  if (isLocked || isSending || isCompressing) return;
  const t = inputEl.value.trim();

  if (appMode === 'remote') {
    if (!t) return;
    addMsg(`You: ${t}`, 'user-a', myLang);
    sendRemoteMessage(t);
    inputEl.value = '';
    return;
  }

  if (!t && !attachedImageBase64 && !attachedFileText) return;
  let displayTxt = t;
  if (attachedImageBase64) displayTxt = t ? '📷 ' + t : '📷 [Image]';
  if (attachedFileText) displayTxt = t ? '📄 ' + t : '📄 [File]';
  addMsg(displayTxt, 'user-a', langA.value);
  ask(t, langA.value, langB.value, 'A');
  inputEl.value = '';
});

// ============ Remote: WebSocket ============
$('createRoomBtn').addEventListener('click', async () => {
  const name = $('playerName').value.trim();
  const lang = $('playerLang').value;
  if (!name) { alert('أدخل اسمك'); return; }
  myName = name; myLang = lang;
  $('createRoomBtn').disabled = true;
  try {
    const res = await fetch(ROOM_CREATE_URL, { method: 'POST' });
    const data = await res.json();
    if (!data.code) throw new Error('No code');
    enterRemoteRoom(data.code);
  } catch (e) {
    alert('فشل إنشاء الغرفة: ' + e.message);
  } finally {
    $('createRoomBtn').disabled = false;
  }
});

$('joinRoomBtn').addEventListener('click', () => {
  const name = $('playerName').value.trim();
  const lang = $('playerLang').value;
  const code = $('joinCodeInput').value.trim().toUpperCase();
  if (!name) { alert('أدخل اسمك'); return; }
  if (!code || code.length !== 6) { alert('أدخل كود غرفة صحيح (6 أحرف)'); return; }
  myName = name; myLang = lang;
  enterRemoteRoom(code);
});

function enterRemoteRoom(code) {
  currentRoomCode = code;
  hasJoinedOnce = false;
  reconnectAttempts = 0;
  shouldReconnect = true;

  $('remoteJoinOverlay').style.display = 'none';
  setModeUI('remote');
  roomCodeLabel.textContent = code;
  onlineCount.textContent = '1/4';
  chatEl.innerHTML = '';
  setStatus(`Connecting to ${code}...`);

  connectWebSocket(code);
}

function connectWebSocket(code) {
  if (ws) { try { ws.close(); } catch(e){} }
  const url = WS_BASE + '/ws/' + code;
  console.log('WS connecting:', url);
  ws = new WebSocket(url);

  ws.onopen = () => {
    reconnectAttempts = 0;
    console.log('WS open');
    ws.send(JSON.stringify({ type: 'join', name: myName, lang: myLang }));
    startPing();
  };

  ws.onmessage = handleWsMessage;

  ws.onclose = (ev) => {
    console.log('WS closed', ev.code, ev.reason);
    stopPing();
    if (!hasJoinedOnce) {
      addMsg('⚠️ فشل الانضمام. تحقق من الكود.', 'bot');
      appMode = 'none';
      setModeUI('none');
      $('remoteJoinOverlay').style.display = 'flex';
      return;
    }
    if (shouldReconnect && appMode === 'remote') {
      const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
      reconnectAttempts++;
      setStatus(`انقطع الاتصال. إعادة المحاولة خلال ${Math.round(delay/1000)}s...`);
      wsReconnectTimer = setTimeout(() => connectWebSocket(code), delay);
    }
  };

  ws.onerror = (e) => console.error('WS error', e);
}

function handleWsMessage(ev) {
  let data;
  try { data = JSON.parse(ev.data); } catch(e){ return; }

  switch (data.type) {
    case 'joined':
      hasJoinedOnce = true;
      onlineCount.textContent = `${data.users.length}/4`;
      addMsg(`✅ انضممت للغرفة ${currentRoomCode}`, 'bot');
      (data.history || []).forEach(h => {
        const cls = h.is_mine ? 'user-a' : 'user-b';
        const label = h.is_mine ? 'You' : h.from;
        addMsg(`${label}: ${h.original}`, cls, h.from_lang);
        if (h.translated && h.translated !== h.original && !h.is_mine) {
          addMsg(`→ ${h.translated}`, 'bot', myLang);
        }
      });
      resetStatus();
      break;

    case 'user_joined':
      addMsg(`👤 ${data.name} joined`, 'bot');
      break;

    case 'user_left':
      addMsg(`👤 ${data.name} left`, 'bot');
      break;

    case 'translated':
      if (data.is_mine) return;
      addMsg(`${data.from_name}: ${data.original}`, 'user-b', data.from_lang);
      if (data.translated && data.translated !== data.original) {
        addMsg(`→ ${data.translated}`, 'bot', myLang);
        speak(data.translated, myLang);
      } else {
        speak(data.original, myLang);
      }
      break;

    case 'error':
      addMsg('⚠️ ' + (data.message || 'Error'), 'bot');
      break;

    case 'pong':
      break;
  }
}

function sendRemoteMessage(text) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    addMsg('⚠️ غير متصل. جارٍ إعادة الاتصال...', 'bot');
    return;
  }
  ws.send(JSON.stringify({ type: 'message', text: text }));
}

function startPing() {
  stopPing();
  pingInterval = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'ping' }));
    }
  }, 30000);
}
function stopPing() {
  if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
}

leaveRoomBtn.addEventListener('click', () => {
  shouldReconnect = false;
  if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
  stopPing();
  if (ws) { try { ws.close(); } catch(e){} ws = null; }
  appMode = 'none';
  setModeUI('none');
  remoteBar.style.display = 'none';
  topHeader.style.display = 'flex';
  chatEl.innerHTML = '';
  currentRoomCode = '';
  $('landingOverlay').style.display = 'flex';
  resetStatus();
});

// ============ TTS ============
function unlockMics() {
  activeSpeaker = null;
  micA.disabled = false; micB.disabled = false; remoteMicBtn.disabled = false;
  micA.classList.remove('recording'); micB.classList.remove('recording'); remoteMicBtn.classList.remove('recording');
  if (!isBotTalking) resetStatus();
  if (avatarVideo.src && avatarVideo.style.display !== 'none') avatarVideo.pause();
}

function stopAudio() {
  currentSpeechId++;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  isBotTalking = false;
  if (avatarVideo.src && avatarVideo.style.display !== 'none') avatarVideo.pause();
}

async function speak(text, lang) {
  if (isLocked) return;
  stopAudio();
  isBotTalking = true;
  const myId = ++currentSpeechId;
  setStatus('Speaking...');

  if (avatarVideo.src && avatarVideo.style.display !== 'none') {
    avatarVideo.play().catch(()=>{});
  }

  // Server TTS (Oxen)
  try {
    const res = await fetch(TTS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, lang, voice: voiceSelect.value, session_id: SESSION_ID })
    });
    if (res.ok) {
      const blob = await res.blob();
      if (myId !== currentSpeechId) return;
      currentAudio = new Audio(URL.createObjectURL(blob));
      currentAudio.onended = () => { isBotTalking = false; unlockMics(); };
      currentAudio.onerror = () => { isBotTalking = false; unlockMics(); };
      await currentAudio.play();
      return;
    }
  } catch (e) {
    console.warn('Server TTS failed, fallback', e);
  }

  speakBrowser(text, lang, myId);
}

function speakBrowser(text, lang, myId) {
  const langCode = { 'ar': 'ar-SA', 'fr': 'fr-CA', 'en': 'en-US' }[lang] || 'en-US';
  const voices = cachedVoices.length ? cachedVoices : speechSynthesis.getVoices();
  let candidates = voices.filter(v => v.lang.toLowerCase().startsWith(langCode.toLowerCase().split('-')[0]));
  let bestVoice = candidates[0];

  const sentences = text.match(/[^.!?؟،؛]+[.!?؟،؛]*/g) || [text];
  let chunks = [], current = "";
  sentences.forEach(s => {
    s = s.trim(); if (!s) return;
    if ((current + " " + s).length > 150) { if (current) chunks.push(current); current = s; }
    else { current += " " + s; }
  });
  if (current) chunks.push(current.trim());

  let index = 0;
  function playChunk() {
    if (index >= chunks.length || myId !== currentSpeechId || isLocked) {
      if (myId === currentSpeechId) { isBotTalking = false; unlockMics(); }
      return;
    }
    const u = new SpeechSynthesisUtterance(chunks[index]);
    index++;
    if (bestVoice) u.voice = bestVoice;
    u.lang = bestVoice ? bestVoice.lang : langCode;
    u.onend = () => { if (myId === currentSpeechId) setTimeout(playChunk, 150); };
    u.onerror = () => { if (myId === currentSpeechId) setTimeout(playChunk, 150); };
    speechSynthesis.speak(u);
  }
  setTimeout(playChunk, 100);
}

if ('speechSynthesis' in window) {
  const loadVoices = () => { cachedVoices = speechSynthesis.getVoices(); };
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
