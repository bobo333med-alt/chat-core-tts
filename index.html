<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<style>
:root {
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.15);
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  --glass-blur: blur(12px);
  --text-main: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: radial-gradient(circle at 50% 0%, #1a2a6c 0%, #0d1b3e 50%, #050a1f 100%);
  color: var(--text-main);
  display: flex; flex-direction: column; padding: 10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  height: 100dvh; transition: opacity 0.3s;
}
@keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
@keyframes ringPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } }
@keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes pulse { 50% { transform: scale(1.1); } }
.glass-panel { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow), inset 0 0 20px rgba(255,255,255,0.05); border-radius: 20px; }
#authOverlay { position: fixed; inset: 0; background: rgba(13, 27, 62, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999999; padding: 20px; overflow-y: auto; backdrop-filter: blur(20px); }

.lang-btn { background: transparent; border: none; color: rgba(255,255,255,0.6); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.3s; }
.lang-btn.active { background: rgba(0, 240, 255, 0.3); color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
.auth-box { background: rgba(26, 42, 108, 0.6); backdrop-filter: blur(20px); padding: 30px 20px; border-radius: 24px; width: 100%; max-width: 350px; box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); text-align: center; margin: auto; }
.auth-box h1 { color: #00f0ff; margin-bottom: 5px; font-size: 26px; text-shadow: 0 0 15px rgba(0,240,255,0.6); }
.auth-box h2 { color: #fff; margin-bottom: 20px; font-size: 18px; font-weight: normal; }
.auth-input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: #fff; outline: none; font-size: 14px; transition: 0.3s; }
.auth-input:focus { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0,240,255,0.3); }
.auth-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; font-size: 15px; box-shadow: 0 4px 15px rgba(0,176,155,0.4); }
.auth-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,176,155,0.6); }
.auth-btn.outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; box-shadow: none; }
.auth-btn.outline:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
.social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; font-size: 14px; }
.social-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
#authError { color: #ff6b6b; font-size: 13px; margin-bottom: 10px; min-height: 18px; word-wrap: break-word; }

.divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.2); margin: 0 10px; }
.overlay { position: fixed; inset: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; color: #fff; padding: 20px; z-index: 99999; overflow-y: auto; }
.overlay h1 { font-size: 32px; color: #00f0ff; margin-bottom: 5px; text-shadow: 0 0 15px rgba(0,240,255,0.4); }
.overlay h2 { font-size: 20px; color: #fff; margin-bottom: 15px; font-weight: normal; }
.mode-btn { padding: 16px 20px; font-size: 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); color: #fff; cursor: pointer; width: 100%; max-width: 280px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(10px); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: inset 0 0 10px rgba(255,255,255,0.1), 0 4px 15px rgba(0,0,0,0.3); background: rgba(255,255,255,0.05); }
.mode-btn:active { transform: scale(0.96); }
#btnLocal { border-color: rgba(138, 43, 226, 0.5); background: linear-gradient(90deg, rgba(138,43,226,0.2), rgba(0,0,0,0)); }
#btnRemote { border-color: rgba(46, 139, 87, 0.5); background: linear-gradient(90deg, rgba(46,139,87,0.2), rgba(0,0,0,0)); }
#btnLogout { border-color: rgba(255, 69, 0, 0.5); background: linear-gradient(90deg, rgba(255,69,0,0.2), rgba(0,0,0,0)); margin-top: 20px; }
.join-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; background: rgba(26, 42, 108, 0.6); padding: 25px 20px; border-radius: 24px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 32px rgba(0,0,0,0.5); align-items: stretch; }

.join-form input:focus, .join-form select:focus { border-color: #00f0ff; }

#createRoomBtn { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 4px 15px rgba(56,239,125,0.3); }
#joinRoomBtn { background: linear-gradient(135deg, #4568dc, #b06ab3); box-shadow: 0 4px 15px rgba(69,104,220,0.3); }
#backToLandingBtn { background: transparent; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.2); margin-top: 5px; }
#backToLandingBtn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.top-header { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 10px; flex-shrink: 0; position: relative; z-index: 10001; }
.top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(26, 42, 108, 0.6); padding: 8px 15px; border-radius: 16px; width: 95%; max-width: 400px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
.user-section { display: flex; align-items: center; gap: 6px; }
.lang-select { padding: 0 5px; border-radius: 8px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.2); font-size: 10px; outline: none; width: 85px !important; height: 28px; text-align: center; }
.mic-btn { width: 44px; height: 44px; border-radius: 50%; border: none; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.mic-btn.blue { background: #6366f1; } .mic-btn.green { background: #10b981; }
.mic-btn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; box-shadow: 0 0 15px rgba(239,68,68,0.6); }
.mic-btn:disabled { background: #475569 !important; opacity: 0.5; }
#avatar-wrap { width: 100px; height: 100px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all 0.3s; }
#avatar-container { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; background: #1e293b; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,240,255,0.2); z-index: 1; transition: all 0.3s; border: 2px solid rgba(255,255,255,0.2); }
#avatar-logo, #avatar-video { width: 100%; height: 100%; object-fit: cover; display: block; }
#avatar-video { display: none; }
#avatar-wrap.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: #000; }
#avatar-wrap.fullscreen #avatar-container { width: 100vw; height: 100vh; border-radius: 0 !important; background: transparent; box-shadow: none; border: none; }
#avatar-wrap.fullscreen #avatar-logo, #avatar-wrap.fullscreen #avatar-video { object-fit: contain; width: 100vw; height: 100vh; }
#avatar-wrap.fullscreen #closeFullscreen { display: flex; }
#removeAvatarBtn { display: none; position: absolute; top: 50%; right: -15px; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; background: #000; border: 2px solid #fff; cursor: pointer; z-index: 999; color: white; font-weight: bold; font-size: 14px; align-items: center; justify-content: center; }
body.remote-mode #avatar-wrap { display: none !important; }
#closeFullscreen { display: none; position: fixed; background: #e57373; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 10000; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); top: 80px; right: 20px; }
.inner-white-dot { width: 14px; height: 14px; background: #fff; border-radius: 50%; }
.chat-container { position: relative; flex: 1; display: flex; flex-direction: column; margin-bottom: 10px; min-height: 100px; }
#chat { flex: 1; background: rgba(26, 42, 108, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 32px rgba(0,0,0,0.3); border-radius: 20px; padding: 15px; overflow-y: auto; }
.msg { padding: 12px 16px; border-radius: 16px; margin-bottom: 8px; max-width: 85%; line-height: 1.6; word-wrap: break-word; font-size: 15px; transition: opacity 0.2s; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); user-select: none; }
.msg:active { opacity: 0.7; }
.msg.playing { box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); border: 1px solid #00f0ff; }
.user-a { background: linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(79, 70, 229, 0.9)); margin-right: auto; border-bottom-right-radius: 4px; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
.user-b { background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(5, 150, 105, 0.9)); margin-left: auto; border-bottom-left-radius: 4px; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
.bot { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); margin: 0 auto 8px auto; text-align: center; font-style: italic; font-size: 13px; cursor: default; backdrop-filter: blur(5px); }
.lang-tag { display: inline-block; font-size: 10px; padding: 2px 6px; background: rgba(255,255,255,0.15); border-radius: 6px; margin-right: 6px; opacity: 0.8; font-weight: bold; }
#clearBtn { position: absolute; bottom: 2px; left: 10px; width: 32px; height: 32px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
#clearBtn svg { fill: #2d3748; width: 16px; height: 16px; }
#imagePreviewContainer { display: none; position: absolute; bottom: 60px; right: 10px; background: rgba(26, 42, 108, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 5px; align-items: center; gap: 8px; z-index: 1000; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
#imagePreview { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
#cancelImageBtn { background: #dc2626; color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
.row { display: flex; gap: 8px; align-items: center; flex-shrink: 0; position: relative; }
input[type=text] { flex: 1; padding: 12px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: #fff; font-size: 14px; order: 3; outline: none; backdrop-filter: blur(5px); }
input[type=text]:focus { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.1); }
button.btn { padding: 0; border: none; border-radius: 50%; font-weight: bold; width: 42px; height: 42px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
#musicBtn { background: rgba(255,255,255,0.1); color: #fff; order: 1; font-size: 18px; border: 1px solid rgba(255,255,255,0.2); }
#mediaBtn { background: linear-gradient(135deg, #4568dc, #b06ab3); color: #ffffff; order: 2; font-size: 24px; width: 38px; height: 38px; padding-bottom: 2px; font-weight: normal; }
#remoteMicBtn { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; order: 2; width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 4px 15px rgba(56,239,125,0.4); display: none; transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.2); }
#remoteMicBtn.recording { background: #ef4444 !important; box-shadow: 0 0 20px rgba(239,68,68,0.8); animation: pulse 1s infinite; }

#sendBtn svg { width: 20px; height: 20px; fill: white; transform: translateX(-2px) translateY(2px); }
#stopAudioBtn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; outline: none; }
#stopAudioBtn svg { fill: #2d3748; width: 14px; height: 14px; }
#status { text-align: center; font-size: 13px; color: #00f0ff; margin-top: 6px; min-height: 18px; font-weight: bold; text-shadow: 0 0 5px rgba(0,240,255,0.3); }
.extra-controls { display: flex; gap: 8px; margin-bottom: 10px; justify-content: center; flex-wrap: wrap; width: 100%; padding: 0 5px; align-items: center; }

.extra-controls button:active { transform: scale(0.95); }
.toggle-btn { background: rgba(255,255,255,0.1) !important; color: white !important; transition: 0.3s; border: 1px solid rgba(255,255,255,0.2) !important; }
.toggle-btn.active { background: rgba(16, 185, 129, 0.3) !important; border-color: #10b981 !important; color: #10b981 !important; box-shadow: 0 0 10px rgba(16,185,129,0.2); }
.btn-back { background: rgba(239, 68, 68, 0.3) !important; border-color: #ef4444 !important; color: #fff !important; }
#actionMenu { display: none; position: fixed; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 12px; z-index: 2000; flex-direction: column; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.action-btn { padding: 10px 15px; border-radius: 10px; border: none; background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
.action-btn:hover { background: rgba(255,255,255,0.15); }
#musicMenu { display: none; position: fixed; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 12px; z-index: 2000; width: 220px; max-height: 300px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
#musicMenu h4 { font-size: 13px; margin-bottom: 10px; text-align: center; color: #00f0ff; }
.music-item { padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 5px; background: rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
.music-item:hover { background: rgba(255,255,255,0.15); } .music-item.active { background: rgba(0, 240, 255, 0.2); color: #00f0ff; font-weight: bold; border: 1px solid rgba(0,240,255,0.3); }
.music-item.add-more, .music-item.stop-btn, .music-item.pause-btn { text-align: center; font-weight: bold; justify-content: center; }
.music-item.add-more { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); } 
.music-item.stop-btn { background: rgba(153, 27, 27, 0.3); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); margin-bottom: 8px; } 
.music-item.pause-btn { background: rgba(71, 85, 105, 0.5); margin-bottom: 8px; }
.song-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; direction: ltr; }
.delete-song { color: #ef4444; font-weight: bold; padding: 0 6px; font-size: 15px; }
#remoteBar { display: none; background: rgba(26, 42, 108, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); padding: 10px 15px; border-radius: 16px; margin-bottom: 10px; justify-content: space-between; align-items: center; color: #fff; font-size: 13px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
#remoteBar .room-info { display: flex; align-items: center; gap: 10px; justify-content: center; flex: 1; }
#remoteBar strong { color: #00f0ff; letter-spacing: 2px; font-size: 15px; text-shadow: 0 0 5px rgba(0,240,255,0.3); }
#copyRoomBtn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.3s; }
#copyRoomBtn:hover { background: rgba(255,255,255,0.2); }
.checkbox-row { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 13px; color: rgba(255,255,255,0.7); cursor: pointer; }
.checkbox-row input { width: 18px; height: 18px; cursor: pointer; accent-color: #00f0ff; }
#callOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); z-index: 9999998; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }

.call-btn { width: 70px; height: 70px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }

/* ===== MESSENGER MODE ===== */
#messengerContainer {
  display: none; position: fixed; inset: 0; background: #0f0f1e;
  flex-direction: column; z-index: 90000;
}
#messengerContainer.active { display: flex; }
.messenger-header {
  height: 60px; background: #1a1a2e;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; padding: 0 15px; gap: 12px; z-index: 1000; flex-shrink: 0;
}
.header-btn {
  background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;
  padding: 8px; border-radius: 50%; transition: 0.3s;
}
.header-btn:hover { background: rgba(255,255,255,0.1); }
.header-btn.active { color: #0084ff; background: rgba(0,132,255,0.2); }
.header-info { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.header-name { font-size: 16px; font-weight: bold; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.header-status { font-size: 12px; color: rgba(255,255,255,0.6); }
.header-actions { display: flex; gap: 8px; }
.messenger-sidebar {
  position: fixed; top: 60px; left: 0; bottom: 0; width: 280px;
  background: #16162a; border-right: 1px solid rgba(255,255,255,0.1);
  transform: translateX(-100%); transition: transform 0.3s; z-index: 999; overflow-y: auto;
}
.messenger-sidebar.open { transform: translateX(0); }
.sidebar-header {
  padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);

}

}
.sidebar-header button:hover { background: #0066cc; }
.my-code-row {
  padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.1);

}
.my-code-row strong { color: #00f0ff; letter-spacing: 2px; font-size: 14px; }

.friend-item {
  display: flex; align-items: center; gap: 10px; padding: 12px 15px;

}
.friend-item:hover { background: rgba(255,255,255,0.05); }
.friend-avatar {
  width: 42px; height: 42px; border-radius: 50%;

  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: bold; flex-shrink: 0; color: #fff;
}
.friend-info { flex: 1; min-width: 0; }
.friend-name { font-size: 14px; font-weight: bold; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.friend-status { font-size: 11px; color: rgba(255,255,255,0.6); }
.friend-actions { display: flex; gap: 4px; }
.friend-action {

}
.friend-action:hover { background: rgba(255,255,255,0.1); color: #fff; }
.friend-action.call { color: #0084ff; }

.friend-action.delete:hover { background: rgba(255,68,68,0.2); }
.messenger-chat {
  flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px;
}
.messenger-chat .msg {
  max-width: 75%; padding: 12px 16px; border-radius: 18px; font-size: 15px;
  line-height: 1.5; word-wrap: break-word; cursor: pointer; transition: 0.3s; user-select: none;
}
.messenger-chat .msg.user-a {
  align-self: flex-end; background: #0084ff; color: #fff;
  border-bottom-right-radius: 4px; margin-right: 0;
}
.messenger-chat .msg.user-b {
  align-self: flex-start; background: #3a3a4a; color: #fff;
  border-bottom-left-radius: 4px; margin-left: 0;
}
.messenger-chat .msg.bot {
  align-self: center; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8);
  font-style: italic; font-size: 13px; max-width: 80%; margin: 0 auto;
}
.messenger-footer {
  height: 70px; background: #1a1a2e; border-top: 1px solid rgba(255,255,255,0.1);

.footer-btn {

let isLoginMode = true, currentUser = null, currentAuthLang = 'ar';

const AUTH_TRANS = {
  'ar': { loginTitle: 'تسجيل الدخول', registerTitle: 'إنشاء حساب جديد', email: 'البريد الإلكتروني', pass: 'كلمة المرور', btnLogin: 'دخول', btnRegister: 'تسجيل', toggleToReg: 'إنشاء حساب جديد', toggleToLogin: 'لديك حساب بالفعل؟ سجل دخولك', or: 'أو', google: 'تسجيل الدخول بواسطة Google', github: 'تسجيل الدخول بواسطة GitHub', twitter: 'تسجيل الدخول بواسطة X' },

function changeAuthLang(lang) {
  currentAuthLang = lang;
  localStorage.setItem('authLang', lang);
  const htmlRoot = document.getElementById('htmlRoot');
  htmlRoot.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  htmlRoot.setAttribute('lang', lang);
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  Array.from(document.querySelectorAll('.lang-btn')).find(b => b.textContent.toLowerCase() === lang.toLowerCase()).classList.add('active');

  document.getElementById('authEmail').placeholder = t.email;
  document.getElementById('authPassword').placeholder = t.pass;
  document.getElementById('authSubmitBtn').textContent = isLoginMode ? t.btnLogin : t.btnRegister;

function toggleAuthMode() { isLoginMode = !isLoginMode; changeAuthLang(currentAuthLang); document.getElementById('authError').textContent = ''; }
function showAuthError(msg) { document.getElementById('authError').textContent = msg; }
function handleEmailAuth() {
  const email = document.getElementById('authEmail').value;
  const password = document.getElementById('authPassword').value;

  if(isLoginMode) auth.signInWithEmailAndPassword(email, password).catch(err => { showAuthError(err.message); changeAuthLang(currentAuthLang); });

auth.getRedirectResult().then((r) => { if (r.credential) console.log("redirect ok"); }).catch((e) => showAuthError(e.message));
auth.onAuthStateChanged(user => {
  const authOverlay = document.getElementById('authOverlay');
  const landingOverlay = document.getElementById('landingOverlay');
  if (user) {
    currentUser = user;
    authOverlay.style.display = 'none';

const WS_BASE = BASE_SERVER_URL.replace('https://', 'wss://').replace('http://', 'ws://');
const REQUEST_TIMEOUT_MS = 60000;
const SESSION_ID = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));

const LONG_RECORD_CHUNK_MS = 5 * 60 * 1000;
const LONG_RECORD_SILENCE_MS = 3000;
const MAX_RECORD_DURATION_MS = 60 * 60 * 1000;

function cleanTextForTTS(text) { if (!text) return ""; return text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1F018}-\u{1F270}\u{238C}-\u{2454}\u{20D0}-\u{20FF}\u{FE0F}]/gu, '').replace(/[*_#`~|\\\/<>()\[\]{}«»"']/g, ' ').replace(/\s+/g, ' ').trim(); }
function compressImage(base64Str, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve) => {
    const img = new Image(); img.src = base64Str;
    img.onload = () => {
      const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
      if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(base64Str);
  });
}

async function toggleLocalMic(speaker) {
  if (isLocalProcessing) return;
  unlockAudio();
  
  if (localRecorder && localRecorder.state === 'recording') {
    localRecorder.stop();
    micA.classList.remove('recording'); 
    micB.classList.remove('recording');
    setStatus('⏳ Processing...');
    return;
  }
  
  if (localRecorder) { try { localRecorder.stop(); } catch(e){} }
  
  currentSpeaker = speaker;
  const lang = speaker === 'A' ? langA.value : langB.value;
  const targetLang = speaker === 'A' ? langB.value : langA.value;
  const btn = speaker === 'A' ? micA : micB;
  
  try {
    localStreamMic = await navigator.mediaDevices.getUserMedia({ 
      audio: { 
        echoCancellation: true, 
        noiseSuppression: true, 
        autoGainControl: true,
        channelCount: 1,
        sampleRate: 48000
      } 
    });
    
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(localStreamMic);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    const rmsBuffer = new Float32Array(analyser.fftSize);
    let rmsMax = 0;
    let silenceStart = Date.now();
    let intervalId = null;
    
    let noiseFloor = 0;
    let calibrationCount = 0;
    const calibrationInterval = setInterval(() => {
      try {
        analyser.getFloatTimeDomainData(rmsBuffer);
        let sum = 0; 
        for (let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i]*rmsBuffer[i];
        const rms = Math.sqrt(sum / rmsBuffer.length);
        noiseFloor += rms;
        calibrationCount++;
        if (calibrationCount >= 10) {
          noiseFloor = Math.min(noiseFloor / calibrationCount, 0.05);
          clearInterval(calibrationInterval);
        }
      } catch(e){}
    }, 100);
    
    intervalId = setInterval(() => {
      try {
        analyser.getFloatTimeDomainData(rmsBuffer);
        let sum = 0; 
        for (let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i]*rmsBuffer[i];
        const rms = Math.sqrt(sum / rmsBuffer.length);
        if (rms > rmsMax) rmsMax = rms;
        const threshold = Math.max(0.02, noiseFloor + 0.015);
        if (rms > threshold) silenceStart = Date.now();
        else if (Date.now() - silenceStart > LONG_RECORD_SILENCE_MS && localRecorder && localRecorder.state === 'recording') {
          localRecorder.stop();
        }
      } catch(e){}
    }, 100);

    let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    localRecorder = new MediaRecorder(localStreamMic, { mimeType });
    localChunks = [];
    
    localRecorder.ondataavailable = e => { if (e.data.size > 0) localChunks.push(e.data); };
    
    localRecorder.onstop = async () => {
      if (intervalId) clearInterval(intervalId);
      if (calibrationInterval) clearInterval(calibrationInterval);
      if (localStreamMic) localStreamMic.getTracks().forEach(t => t.stop());
      try { if (audioCtx.state !== 'closed') await audioCtx.close(); } catch(e){}
      
      const durationMs = Date.now() - localStartTime;
      
      if (durationMs < 800 || rmsMax < 0.005) { 
        isLocalProcessing = false; unlockMics(); 
        if (durationMs >= 800) addMsg('⚠️ لم يُسمع صوت واضح.', 'bot');
        return; 
      }
      
      const blob = new Blob(localChunks, { type: localRecorder.mimeType });
      setStatus('⏳ جاري استخراج النص والترجمة...');
      
      const formData = new FormData();
      formData.append('file', blob, 'audio.webm');
      formData.append('target_lang', targetLang); 
      formData.append('language', lang); 
      formData.append('duration_ms', String(durationMs));
      
      try {
        const res = await fetch(TRANSCRIBE_URL, { method: 'POST', body: formData });
        if (res.ok) {
          const data = await res.json();
          if (data.original && data.original.length > 1) {
            addMsg(`You: ${data.original}`, speaker === 'A' ? 'user-a' : 'user-b', lang);
            if (isTranslatorMode) {
              if (data.translated) {
                addMsg(`↳ ${data.translated}`, 'bot', targetLang);
                speak(data.translated, targetLang);
              }
            } else {
              ask(data.original, lang, targetLang, speaker);
            }
          } else {
            addMsg(`⚠️ لم يتم التعرف على كلام.`, 'bot');
          }
        }
      } catch(e) { console.warn('Audio upload failed', e); addMsg('⚠️ فشل إرسال الصوت.', 'bot'); }
      
      isLocalProcessing = false;
      unlockMics();
    };
    
    localRecorder.start(1000);
    localStartTime = Date.now();
    btn.classList.add('recording');
    micA.disabled = speaker !== 'A';
    micB.disabled = speaker !== 'B';
    setStatus(`🎤 Listening (${speaker === 'A' ? 'You' : 'Friend'})...`);
  } catch (e) {
    addMsg("⚠️ تعذر الوصول للمايك: " + e.message, "bot");
    isLocalProcessing = false;
    unlockMics();
  }
}
function unlockMics() {
  micA.disabled = false; micB.disabled = false;
  micA.classList.remove('recording'); micB.classList.remove('recording');
  resetStatus();
}

async function ensureMicStream() {
  if (localStream) return localStream;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: false,
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1, sampleRate: 48000 }
    });
    isWebRtcMicOn = true;
    return localStream;
  } catch (err) {
    addMsg('⚠️ تعذر الوصول للمايك: ' + err.message, 'bot');
    return null;
  }
}

async function startManualTranslation() {
  if (isManualTranslating) return;
  try {
    const transStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1, sampleRate: 48000 }
    });
    const rawTrack = transStream.getAudioTracks()[0];

    translationAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = translationAudioCtx.createMediaStreamSource(new MediaStream([rawTrack]));
    const hp = translationAudioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 80;
    const analyser = translationAudioCtx.createAnalyser();
    analyser.fftSize = 512;
    const destination = translationAudioCtx.createMediaStreamDestination();
    source.connect(hp); hp.connect(analyser); analyser.connect(destination);

    const filteredTrack = destination.stream.getAudioTracks()[0];
    const rmsBuffer = new Float32Array(analyser.fftSize);
    let rmsMax = 0;
    let silenceStart = Date.now();
    let chunkStartTime = Date.now();
    let chunkIndex = 0;
    let noiseFloor = 0;
    let calibrationCount = 0;

    const calibrationInterval = setInterval(() => {
      try {
        analyser.getFloatTimeDomainData(rmsBuffer);
        let sum = 0; for (let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i]*rmsBuffer[i];
        const rms = Math.sqrt(sum / rmsBuffer.length);
        noiseFloor += rms;
        calibrationCount++;
        if (calibrationCount >= 10) {
          noiseFloor = Math.min(noiseFloor / calibrationCount, 0.05);
          clearInterval(calibrationInterval);
        }
      } catch(e){}
    }, 100);

    let mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    
    const startNewChunk = () => {
      let chunks = [];
      audioRecorder = new MediaRecorder(new MediaStream([filteredTrack]), { mimeType });
      audioRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      audioRecorder.onstop = async () => {
        const durationMs = Date.now() - chunkStartTime;
        if (chunks.length === 0 || durationMs < 800 || rmsMax < 0.005) return;
        
        const blob = new Blob(chunks, { type: mimeType });
        const formData = new FormData();
        formData.append('file', blob, 'audio.webm');
        formData.append('target_lang', myLang);
        formData.append('language', myLang);
        formData.append('duration_ms', String(durationMs));
        formData.append('chunk_index', String(chunkIndex));
        
        try {
          const res = await fetch(TRANSCRIBE_URL, { method: 'POST', body: formData });
          if (res.ok) {
            const data = await res.json();
            if (data.original && data.original.length > 1) {
              addMsg(`You: ${data.original}`, 'user-a', myLang);
              sendRemoteMessage(data.original);
            }
          }
        } catch(e) { console.warn('Audio chunk upload failed', e); }
        chunkIndex++;
      };
      audioRecorder.start(1000);
      chunkStartTime = Date.now();
      rmsMax = 0;
      silenceStart = Date.now();
    };

    startNewChunk();

    const vadInterval = setInterval(() => {
      if (!isManualTranslating) return;
      try {
        analyser.getFloatTimeDomainData(rmsBuffer);
        let sum = 0; for (let i = 0; i < rmsBuffer.length; i++) sum += rmsBuffer[i]*rmsBuffer[i];
        const rms = Math.sqrt(sum / rmsBuffer.length);
        
        const threshold = Math.max(0.02, noiseFloor + 0.015);
        if (rms > threshold) {
          if (rms > rmsMax) rmsMax = rms;
          silenceStart = Date.now();
        } else {
          if (Date.now() - silenceStart > LONG_RECORD_SILENCE_MS && audioRecorder && audioRecorder.state === 'recording') {
             audioRecorder.stop();
             setTimeout(() => { if (isManualTranslating) startNewChunk(); }, 200);
          }
        }
        
        if (Date.now() - chunkStartTime > LONG_RECORD_CHUNK_MS && audioRecorder && audioRecorder.state === 'recording') {
          audioRecorder.stop();
          setTimeout(() => { if (isManualTranslating) startNewChunk(); }, 200);
        }
      } catch(e){}
    }, 200);

    isManualTranslating = true;
    updateTranslatorUI();
    setStatus('🎤 Recording... Press mic to stop & translate');
    
    window._vadInterval = vadInterval;
    window._rawTrack = rawTrack;
    window._calibrationInterval = calibrationInterval;

  } catch (e) {
    console.error("Mic access failed", e);
    addMsg("⚠️ تعذر الوصول للمايك.", 'bot');
  }
}
function stopManualTranslation() {
  if (!isManualTranslating) return;
  isManualTranslating = false;
  
  if (window._vadInterval) { clearInterval(window._vadInterval); window._vadInterval = null; }
  if (window._calibrationInterval) { clearInterval(window._calibrationInterval); window._calibrationInterval = null; }
  if (window._rawTrack) { try { window._rawTrack.stop(); } catch(e){} window._rawTrack = null; }
  
  if (audioRecorder && audioRecorder.state === 'recording') {
    audioRecorder.stop();

function buildSystemPrompt(targetLang, sourceLang, isImage = false) {
  if (isImage) {
    return `Describe this image in detail in ${langNameFor(sourceLang)}, then translate your description to ${langNameFor(targetLang)}. Format: [Original description in ${langNameFor(sourceLang)}] ||| [Translation in ${langNameFor(targetLang)}]`;
  }
  if (isTranslatorMode) {
    return `You are an expert expressive translator specializing in Arabic dialects and conversational language. Translate the following text from ${langNameFor(sourceLang)} to ${langNameFor(targetLang)}. Preserve the tone, emotion, and conversational style. Add proper punctuation and formatting to make the text natural and readable. Output ONLY the translated text.`;
  }
  return `You are Chat-Core, a helpful assistant with deep knowledge of Arabic dialects and expressive language. You must reply ONLY in ${langNameFor(targetLang)}. Use natural, conversational tone with proper punctuation and formatting. Never use any other language.`;
}

async function ask(text, sourceLang, targetLang, speaker, isImage = false) {
  if (isSending) return;
  setBusy(true); setStatus('Processing...');
  const messages = [{ role: 'system', content: buildSystemPrompt(targetLang, sourceLang, isImage) }];
  
  let finalText = text || '';
  if (attachedFileText) finalText += "\n\nFile Content:\n" + attachedFileText;
  
  let userContent = finalText;
  if (attachedImageBase64) {
    userContent = [
      { type: "text", text: finalText || "Describe this image in detail." }, 
      { type: "image_url", image_url: { url: attachedImageBase64 } }
    ];
  }
  
  messages.push({ role: 'user', content: userContent });
  
  try {
    const res = await fetchWithTimeout(SERVER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages, is_vision: attachedImageBase64 != null, is_translation: isTranslatorMode, session_id: SESSION_ID }) }, REQUEST_TIMEOUT_MS);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    
    let replyText = data.reply.trim();
    
    if (isImage && replyText.includes('|||')) {
      const parts = replyText.split('|||');
      const original = parts[0].trim();
      const translated = parts[1].trim();
      addMsg(`📷 ${original}`, speaker === 'A' ? 'user-a' : 'user-b', sourceLang, attachedImageBase64);
      addMsg(`↳ ${translated}`, 'bot', targetLang);
      speak(translated, targetLang);
    } else {
      if (isTranslatorMode && replyText === text) {
         replyText = "⚠️ Translation failed. Please try again.";
      }
      addMsg(replyText, isTranslatorMode ? (speaker === 'A' ? 'user-b' : 'user-a') : 'user-b', targetLang || 'AUTO', isImage ? attachedImageBase64 : null);
      resetStatus(); speak(replyText, targetLang || langA.value);
    }
    
    attachedImageBase64 = null; attachedFileText = null; imagePreviewContainer.style.display = 'none';
  } catch (e) { addMsg('Error: ' + e.message, 'bot'); } finally { setBusy(false); }
}

function playRingtone() {
  if (ringtoneAudio) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, ctx.currentTime);
    osc.frequency.setValueAtTime(480, ctx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 1);
    ringtoneAudio = { ctx, osc, gain };
    window._ringInterval = setInterval(() => {
      try {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(440, ctx.currentTime);
        o.frequency.setValueAtTime(480, ctx.currentTime + 0.5);
        g.gain.setValueAtTime(0.3, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + 1);
      } catch(e){}
    }, 2000);
  } catch(e) { console.warn('Ringtone failed', e); }
}
function stopRingtone() {
  if (window._ringInterval) { clearInterval(window._ringInterval); window._ringInterval = null; }
  if (ringtoneAudio) {
    try { ringtoneAudio.ctx.close(); } catch(e){}
    ringtoneAudio = null;
  }
}

  div.addEventListener('click', () => {
    if (type === 'bot') return;
    document.querySelectorAll('#messengerChat .msg.playing').forEach(m => m.classList.remove('playing'));
    div.classList.add('playing');
    speak(text, lang || 'ar');
  });
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

$('toggleSidebar').addEventListener('click', () => $('messengerSidebar').classList.toggle('open'));
$('messengerTransToggle').addEventListener('click', function() {
  isTranslatorMode = !isTranslatorMode;
  this.classList.toggle('active', isTranslatorMode);
  setStatus(isTranslatorMode ? '🌐 الترجمة مفعلة' : 'الترجمة معطلة');
});
$('messengerClear').addEventListener('click', () => { $('messengerChat').innerHTML = ''; setStatus('تم مسح المحادثة'); });
$('messengerBack').addEventListener('click', () => {
  $('messengerContainer').classList.remove('active');
  $('landingOverlay').style.display = 'flex';
  if (ws) ws.close();
  shouldReconnect = false;
});

$('messengerSend').addEventListener('click', () => {
  const text = $('messengerInput').value.trim();
  if (text) {
    addMessengerMsg('user-a', text, myLang);
    sendRemoteMessage(text);
    $('messengerInput').value = '';
  }
});
$('messengerInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') $('messengerSend').click(); });

$('messengerMic').addEventListener('click', async () => {
  if (isManualTranslating) {
    stopManualTranslation();
  } else {
    await startManualTranslation();
  }
});

// ===== REMOTE/WEBSOCKET =====
function connectWS(roomCode) {
  try { if (ws) ws.close(); } catch (e) {}
  ws = new WebSocket(WS_BASE + '/ws/' + String(roomCode).toUpperCase());
  ws.onopen = () => { try { ws.send(JSON.stringify({ type: 'join', name: myName, lang: myLang })); } catch (e) {} startPing(); };
  ws.onmessage = (evt) => { try { handleWSMessage(JSON.parse(evt.data)); } catch (e) { console.warn('ws parse', e); } };
  ws.onerror = () => setStatus('⚠️ خطأ في الاتصال');
  ws.onclose = () => {
    stopPing();
    if (shouldReconnect && hasJoinedOnce && currentRoomCode) {
      if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
      wsReconnectTimer = setTimeout(() => { if (shouldReconnect && currentRoomCode) connectWS(currentRoomCode); }, 3000);
    }
  };
}
function sendRemoteMessage(text) {
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  try { ws.send(JSON.stringify({ type: 'message', text, translate: !!isTranslatorMode })); } catch (e) {}
}
async function handleWSMessage(msg) {
  if (!msg || !msg.type) return;
  const type = msg.type;
  if (type === 'pong') return;
  if (type === 'error') { addMessengerMsg('bot', '⚠️ ' + (msg.message || 'خطأ')); return; }
  if (type === 'joined') {
    hasJoinedOnce = true;
    const n = (msg.users || []).length;
    if (onlineCount) onlineCount.textContent = n + '/50';
    setStatus('✅ متصل');
    if (msg.history && msg.history.length) {
      addMessengerMsg('bot', '📜 سجل سابق:');
      msg.history.forEach(h => {
        addMessengerMsg('user-b', (h.from || '?') + ': ' + (h.original || ''), h.from_lang || 'en');
        if (h.translated && h.translated !== h.original) addMessengerMsg('bot', '↳ ' + h.translated, myLang);
      });
    }
    return;
  }
  if (type === 'user_joined') { addMessengerMsg('bot', '👋 ' + (msg.name || 'مستخدم') + ' انضم'); return; }
  if (type === 'user_left') { addMessengerMsg('bot', '👋 ' + (msg.name || 'مستخدم') + ' غادر'); return; }
  if (type === 'translated') {
    if (msg.is_mine) return;
    addMessengerMsg('user-b', (msg.from_name || 'صديق') + ': ' + (msg.original || ''), msg.from_lang || 'en');
    if (msg.translated && msg.translated !== msg.original) {
      addMessengerMsg('bot', '↳ ' + msg.translated, msg.target_lang || myLang);
      if (!msg.no_tts && isTranslatorMode) speak(msg.translated, msg.target_lang || myLang);
    }
    return;
  }
  if (type === 'chat_media') {
    addMessengerMsg('user-b', (msg.from_name || 'صديق') + ' 📷:', msg.from_lang || 'en');
    return;
  }
}

function startPing() {
  stopPing();
  pingInterval = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) { try { ws.send(JSON.stringify({ type: 'ping' })); } catch (e) {} }
  }, 20000);
}
function stopPing() { if (pingInterval) { clearInterval(pingInterval); pingInterval = null; } }

$('createRoomBtn').addEventListener('click', async () => {
  const name = ($('playerName').value || myDisplayName()).trim();
  const lang = $('playerLang').value || 'ar';
  if (!name) return alert('أدخل اسمك');
  try {
    setStatus('⏳ جاري إنشاء الغرفة...');
    const res = await fetch(ROOM_CREATE_URL, { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.code) throw new Error('no code');
    enterRemote(data.code, name, lang);
  } catch (e) { alert('فشل إنشاء الغرفة: ' + e.message); }
});
$('joinRoomBtn').addEventListener('click', async () => {
  const name = ($('playerName').value || myDisplayName()).trim();
  const lang = $('playerLang').value || 'ar';
  const code = ($('joinCodeInput').value || '').trim().toUpperCase();
  if (!name) return alert('أدخل اسمك');
  if (!code) return alert('أدخل كود الغرفة');
  enterRemote(code, name, lang);
});

// ===== TTS =====
async function speak(text, lang) {
  if (!text) return;
  stopAudio();
  const cleaned = cleanTextForTTS(text);
  if (!cleaned) return;
  const myId = ++currentSpeechId;
  isBotTalking = true; setAvatarState(true);
  
  let retryCount = 0;
  const maxRetries = 2;
  
  while (retryCount <= maxRetries) {
    try {
      const voice = voiceSelect ? voiceSelect.value : 'woman';
      const res = await fetch(TTS_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: cleaned.slice(0, 4000), lang: lang || 'ar', voice, session_id: SESSION_ID })
      });
      if (!res.ok) throw new Error('tts ' + res.status);
      if (myId !== currentSpeechId) return;
      const blob = await res.blob(); const url = URL.createObjectURL(blob);
      currentAudio = new Audio(url);
      currentAudio.onended = () => { URL.revokeObjectURL(url); isBotTalking = false; setAvatarState(false); document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing')); };
      currentAudio.onerror = () => { URL.revokeObjectURL(url); isBotTalking = false; setAvatarState(false); document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing')); };
      await currentAudio.play().catch(() => {});
      return;
    } catch (e) {
      retryCount++;
      if (retryCount > maxRetries) break;
      await new Promise(r => setTimeout(r, 500));
    }
  }
  
  if (myId !== currentSpeechId) return;
  if ('speechSynthesis' in window) {
    try {
      const utt = new SpeechSynthesisUtterance(cleaned);
      utt.lang = localeFor(lang || 'ar');
      utt.onend = () => { isBotTalking = false; setAvatarState(false); document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing')); };
      utt.onerror = () => { isBotTalking = false; setAvatarState(false); document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing')); };
      speechSynthesis.speak(utt);
    } catch (e) { isBotTalking = false; setAvatarState(false); document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing')); }
  } else { isBotTalking = false; setAvatarState(false); document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing')); }
}
function stopAudio() {
  currentSpeechId++;
  if (currentAudio) { try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {} currentAudio = null; }
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
  isBotTalking = false; setAvatarState(false);
  document.querySelectorAll('.msg.playing').forEach(m => m.classList.remove('playing'));
}
function setAvatarState(talking) {
  try {
    if (avatarVideo && avatarVideo.style.display === 'block' && avatarVideo.src) {
      if (talking) avatarVideo.play().catch(() => {});
      else { avatarVideo.pause(); try { avatarVideo.currentTime = 0; } catch (e) {} }
    }
  } catch (e) {}
}

renderPlaylist();
console.log('✅ Chat-Core initialized');
</script>
