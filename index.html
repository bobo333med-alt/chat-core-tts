<!DOCTYPE html>
<html lang="ar" dir="rtl"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat-Core - Translator</title>
<!-- مكتبة LiveKit للفيديو الجماعي -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: Tahoma, sans-serif; background: #0ea5e9; color: #fff; display: flex; flex-direction: column; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); height: 100dvh; transition: opacity 0.3s; }
  
  .top-header { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 10px; flex-shrink: 0; position: relative; z-index: 10001; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 6px 12px; border-radius: 10px; width: 95%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .user-section { display: flex; align-items: center; gap: 4px; }
  
  .lang-select { padding: 0 2px; border-radius: 4px; background: #0f172a; color: #ffffff; border: 1px solid #334155; font-size: 9px; font-family: Tahoma; outline: none; width: 75px !important; height: 24px; text-align: center; }
  
  .mic-btn { width: 30px; height: 30px; border-radius: 50%; border: none; color: #fff; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
  .mic-btn.blue { background: #6366f1; box-shadow: 0 0 8px rgba(99,102,241,0.5); }
  .mic-btn.green { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.5); }
  .mic-btn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; box-shadow: 0 0 12px rgba(239,68,68,0.8); }
  .mic-btn:disabled { background: #475569 !important; opacity: 0.5; animation: none; }
  @keyframes pulse { 50% { transform: scale(1.1); } }

  .locked-ui { opacity: 0.4; pointer-events: none; filter: blur(1px); }

  #avatar-wrap { width: 100px; height: 100px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all 0.3s; }
  #avatar-container { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; background: #1e293b; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0,0,0,0.3); z-index: 1; transition: all 0.3s; }
  #avatar-logo, #avatar-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #avatar-video { display: none; }
  #avatar-wrap.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; margin: 0; background: #000; }
  #avatar-wrap.fullscreen #avatar-container { width: 100vw; height: 100vh; border-radius: 0 !important; background: transparent; box-shadow: none; }
  #avatar-wrap.fullscreen #avatar-logo, #avatar-wrap.fullscreen #avatar-video { object-fit: contain; width: 100vw; height: 100vh; }
  #avatar-wrap.fullscreen #closeFullscreen { display: flex; }
  
  #removeAvatarBtn { 
    display: none; 
    position: absolute; 
    top: 50%;
    right: -15px; 
    transform: translateY(-50%);
    width: 14px; 
    height: 14px; 
    border-radius: 50%; 
    background: #000000; 
    border: none; 
    outline: none; 
    box-shadow: none; 
    cursor: pointer; 
    z-index: 10; 
    padding: 0; 
    opacity: 0.9; 
  }

  #closeFullscreen, #closeVideoFullscreen { 
    display: none; 
    position: fixed; 
    background: #e57373;
    border: none; 
    outline: none; 
    width: 50px; 
    height: 50px; 
    border-radius: 50%; 
    cursor: pointer; 
    z-index: 10000; 
    align-items: center; 
    justify-content: center; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .inner-white-dot { width: 14px; height: 14px; background: #ffffff; border-radius: 50%; }
  #closeFullscreen { top: 80px; right: 20px; }
  #closeVideoFullscreen { top: 20px; right: 20px; }

  #videoContainer { display: none; position: relative; width: 100%; max-width: 400px; height: 200px; margin: 0 auto 10px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); cursor: pointer; transition: all 0.3s; z-index: 500; touch-action: manipulation; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  #localVideo { position: absolute; bottom: 10px; right: 10px; width: 80px; height: 100px; object-fit: cover; border-radius: 8px; border: 2px solid #fff; background: #1e293b; z-index: 2; pointer-events: auto; }
  #videoStatus { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 6px; font-size: 10px; color: #10b981; z-index: 2; pointer-events: none; }
  
  body.video-maximized #videoContainer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; max-width: 100vw; z-index: 99999; margin: 0; border-radius: 0; }
  body.video-maximized #remoteVideo { object-fit: cover; }
  body.video-maximized #localVideo { width: 90px; height: 130px; bottom: 20px; right: 20px; border-radius: 12px; }
  body.video-maximized #closeVideoFullscreen { display: flex; }
  body.video-maximized #topHeader, body.video-maximized #extraControls, body.video-maximized #chatContainer, body.video-maximized #inputRow, body.video-maximized #status, body.video-maximized #remoteBar { display: none !important; }

  #meetingGridContainer {
    display: none;
    position: relative;
    width: 100%;
    flex: 1;
    background: #0f172a;
    border-radius: 12px;
    padding: 10px;
    overflow-y: auto;
    margin-bottom: 10px;
  }
  #videoGrid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    align-content: start;
  }
  .participant-box {
    position: relative;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    aspect-ratio: 4/3;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #334155;
  }
  .participant-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .participant-name {
    position: absolute;
    bottom: 5px;
    left: 5px;
    background: rgba(0,0,0,0.6);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    color: #fff;
    z-index: 2;
  }
  body.meeting-mode .chat-container { max-height: 35vh; }

  #floatingMicBtn {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #10b981;
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    z-index: 100000;
    border: none;
    cursor: pointer;
    transition: all 0.3s;
  }
  #floatingMicBtn.recording { background: #ef4444 !important; animation: pulse 0.8s infinite; }
  body.video-maximized #floatingMicBtn { display: flex; }

  .chat-container { position: relative; flex: 1; display: flex; flex-direction: column; margin-bottom: 10px; min-height: 100px; }
  #chat { flex: 1; background: #1e293b; border-radius: 12px; padding: 12px; overflow-y: auto; }
  .msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; max-width: 85%; line-height: 1.6; word-wrap: break-word; font-size: 15px; transition: opacity 0.2s; cursor: pointer; }
  .msg:active { opacity: 0.7; }
  
  .user-a { background: #4f46e5; margin-right: auto; border-bottom-right-radius: 4px; } 
  .user-b { background: #10b981; margin-left: auto; border-bottom-left-radius: 4px; color: #000;} 
  .bot { background: #334155; margin: 0 auto 8px auto; text-align: center; font-style: italic; font-size: 13px; cursor: default; }
  .bot:active { opacity: 1; }
  
  .lang-tag { display: inline-block; font-size: 10px; padding: 2px 6px; background: rgba(255,255,255,0.15); border-radius: 6px; margin-right: 6px; opacity: 0.8; font-weight: bold; }
  
  #clearBtn { position: absolute; bottom: 2px; left: 10px; width: 30px; height: 30px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #clearBtn svg { fill: #2d3748; width: 16px; height: 16px; }

  #imagePreviewContainer { display: none; position: absolute; bottom: 50px; right: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 5px; align-items: center; gap: 8px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  #imagePreview { width: 45px; height: 45px; border-radius: 4px; object-fit: cover; }
  #cancelImageBtn { background: #dc2626; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }

  .row { display: flex; gap: 6px; align-items: center; flex-shrink: 0; position: relative; }
  input[type=text] { flex: 1; padding: 10px; padding-left: 35px; border-radius: 24px; border: 1px solid #1e293b; background: #ffffff; color: #000; font-size: 14px; order: 3; }
  
  button.btn { padding: 0; border: none; border-radius: 50%; font-weight: bold; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s; }
  #musicBtn { background: #ffffff; color: #000000; order: 1; font-size: 16px; }
  
  #mediaBtn { background: #1d4ed8; color: #ffffff; order: 2; font-size: 22px; width: 32px; height: 32px; padding-bottom: 2px; font-weight: normal; }
  
  #remoteMicBtn { 
    background: #10b981; 
    color: #fff; 
    order: 2; 
    width: 42px;
    height: 42px;
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4);
    display: none; 
    transition: all 0.3s ease;
  }
  #remoteMicBtn.recording {
    background: #ef4444 !important;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
    animation: pulse 1s infinite;
  }
  
  #toggleCamBtn {
    background: #475569;
    color: #fff;
    order: 2;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    display: none;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  #toggleCamBtn.off {
    background: #ef4444;
  }

  #sendBtn { background: #1d4ed8; order: 4; color: #fff; }
  #sendBtn svg { width: 20px; height: 20px; fill: white; transform: translateX(-2px) translateY(2px); }
  
  #stopAudioBtn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; background: #f6ad55; border: 2px solid #dd6b20; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; outline: none; }
  #stopAudioBtn svg { fill: #2d3748; width: 14px; height: 14px; }

  #status { text-align: center; font-size: 12px; color: #0f172a; margin-top: 6px; min-height: 18px; font-weight: bold; }
  
  .extra-controls { display: flex; gap: 6px; margin-bottom: 8px; justify-content: center; flex-wrap: nowrap; width: 100%; padding: 0 5px; align-items: center; }
  .extra-controls button, .extra-controls select { padding: 6px 12px; border-radius: 15px; border: none; background: #475569; color: #fff; font-size: 10px; cursor: pointer; outline: none; white-space: nowrap; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; }
  
  .extra-controls button.active { background: #eab308; color: #000; }
  
  .btn-back { background: #e57373 !important; color: white !important; }

  body.remote-mode #extraControls, body.meeting-mode #extraControls { justify-content: space-between; padding: 0 10px; }
  body.remote-mode #voiceSelect, body.meeting-mode #voiceSelect { width: 48% !important; max-width: 200px; height: 38px !important; text-align: center; }
  body.remote-mode #backBtn, body.meeting-mode #backBtn { width: 48% !important; max-width: 200px; height: 32px !important; display: flex; align-items: center; justify-content: center; }

  #actionMenu { display: none; position: fixed; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px; z-index: 2000; flex-direction: column; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .action-btn { padding: 8px 12px; border-radius: 8px; border: none; background: #0f172a; color: #fff; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  
  #musicMenu { display: none; position: fixed; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px; z-index: 2000; width: 200px; max-height: 250px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  #musicMenu h4 { font-size: 12px; margin-bottom: 8px; text-align: center; color: #94a3b8; }
  .music-item { padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 4px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; }
  .music-item:hover { background: #334155; } .music-item.active { background: #0ea5e9; color: #fff; font-weight: bold; } 
  .music-item.add-more, .music-item.stop-btn, .music-item.pause-btn { text-align: center; font-weight: bold; justify-content: center; }
  .music-item.add-more { background: #22c55e; } .music-item.stop-btn { background: #991b1b; margin-bottom: 6px; } .music-item.pause-btn { background: #475569; margin-bottom: 6px; }
  .song-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; direction: ltr; }
  .delete-song { color: #ef4444; font-weight: bold; padding: 0 6px; font-size: 14px; }

  #remoteBar { display: none; background: #1e293b; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; justify-content: space-between; align-items: center; color: #fff; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  #remoteBar .room-info { display: flex; align-items: center; gap: 8px; }
  #remoteBar strong { color: #fbbf24; letter-spacing: 2px; font-size: 14px; }
  #copyRoomBtn { background: #6366f1; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; }
  #remoteLockBtn { background: #ef4444; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; outline: none; }

  .overlay { position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; color: #fff; padding: 20px; z-index: 99999; overflow-y: auto; }
  .overlay h1 { font-size: 28px; color: #0ea5e9; margin-bottom: 10px; }
  .overlay h2 { font-size: 20px; color: #10b981; margin-bottom: 5px; }
  .overlay .mode-btn { padding: 15px 30px; font-size: 16px; border-radius: 12px; border: none; color: #fff; cursor: pointer; width: 260px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #btnLocal { background: #6366f1; }
  #btnRemote { background: #10b981; }
  
  #btnMeeting { background: #1d4ed8; }
  #btnMeeting .plus-icon { font-size: 24px; font-weight: bold; margin-bottom: 3px; }
  
  .join-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .join-form input, .join-form select { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; width: 100%; outline: none; }
  .join-form input:focus { border-color: #0ea5e9; }
  .join-form button { padding: 12px; border-radius: 8px; border: none; color: #fff; cursor: pointer; font-weight: bold; font-size: 14px; }
  
  /* توحيد ألوان أزرار Meeting Room مع Remote Mode */
  #createRoomBtn, #createMeetingBtn { background: #10b981; }
  #joinRoomBtn, #joinMeetingBtn { background: #6366f1; }
  #joinRow { display: flex; gap: 8px; }
  #joinCodeInput, #joinMeetingCodeInput { flex: 1; text-transform: uppercase; text-align: center; letter-spacing: 2px; }
  #backToLandingBtn, #backToLandingFromMeetBtn { background: transparent; border: none; color: #94a3b8; cursor: pointer; margin-top: 5px; font-size: 13px; text-decoration: underline; }
</style>
</head>
<body>

<button id="floatingMicBtn" title="Talk">
  <svg viewBox="0 0 24 24" width="30" height="30" fill="white"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
</button>

<div class="overlay" id="landingOverlay">
  <h1>🌐 Chat-Core</h1>
  <p style="color:#94a3b8; font-size:13px; margin-bottom:10px;">اختر وضع التشغيل</p>
  <button class="mode-btn" id="btnLocal">🌐 Face-to-Face</button>
  <button class="mode-btn" id="btnRemote">💬 Remote Mode</button>
  <button class="mode-btn" id="btnMeeting"><span class="plus-icon">+</span> Meeting Room</button>
</div>

<!-- شاشة الغرف (نصوص ديناميكية) -->
<div class="overlay" id="remoteJoinOverlay" style="display:none;">
  <h2>💬 Remote Mode</h2>
  <div class="join-form">
    <input type="text" id="playerName" placeholder="Your Name" maxlength="30">
    <select id="playerLang">
      <option value="ar">🇹🇳 العربية</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="en">🇬🇧 English</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="tr">🇹🇷 Türkçe</option>
      <option value="it">🇮🇹 Italiano</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="es">🇪🇸 Español</option>
      <option value="pt">🇵🇹 Português</option>
      <option value="nl">🇳🇱 Nederlands</option>
      <option value="no">🇳🇴 Norsk</option>
    </select>
    <button id="createRoomBtn">➕ Create Room</button>
    
    <div id="orText" style="text-align:center; color:#94a3b8; font-size:12px; margin:5px 0;">Or</div>
    
    <div id="joinRow">
      <input type="text" id="joinCodeInput" placeholder="Room Code" maxlength="6">
      <button id="joinRoomBtn">Join</button>
    </div>
    <button id="backToLandingBtn">← Back</button>
  </div>
</div>

<!-- شاشة الاجتماعات (Meeting Room) -->
<div class="overlay" id="meetingJoinOverlay" style="display:none;">
  <h2><span style="font-size:24px; font-weight:bold;">+</span> Meeting Room</h2>
  <div class="join-form">
    <input type="text" id="meetPlayerName" placeholder="Your Name" maxlength="30">
    <select id="meetPlayerLang">
      <option value="ar">🇹🇳 العربية</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="en">🇬🇧 English</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="tr">🇹🇷 Türkçe</option>
      <option value="it">🇮🇹 Italiano</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="es">🇪🇸 Español</option>
      <option value="pt">🇵🇹 Português</option>
      <option value="nl">🇳🇱 Nederlands</option>
      <option value="no">🇳🇴 Norsk</option>
    </select>
    <button id="createMeetingBtn">➕ Create Meeting</button>
    
    <div style="text-align:center; color:#94a3b8; font-size:12px; margin:5px 0;">Or</div>
    
    <div id="joinRow">
      <input type="text" id="joinMeetingCodeInput" placeholder="Meeting Code" maxlength="12">
      <button id="joinMeetingBtn">Join</button>
    </div>
    <button id="backToLandingFromMeetBtn">← Back</button>
  </div>
</div>

<div id="remoteBar">
  <div class="room-info">
    <span>Room: <strong id="roomCodeLabel">------</strong></span>
    <button id="copyRoomBtn">📋 Copy</button>
  </div>
  <span id="onlineCount">1/4</span>
  <button id="remoteLockBtn">Lock</button>
</div>

<div class="top-header" id="topHeader">
  <div class="top-bar" id="topBar">
    <div class="user-section" id="friendSection">
      <span style="font-size:8px; color:#94a3b8;">Friend</span>
      <select id="langB" class="lang-select">
        <option value="fr">French</option><option value="ar">Arabic</option><option value="en">English</option>
        <option value="de">German</option><option value="tr">Turkish</option><option value="it">Italian</option>
        <option value="zh">Chinese</option><option value="ru">Russian</option>
        <option value="es">Spanish</option><option value="pt">Portuguese</option>
        <option value="nl">Dutch</option><option value="no">Norwegian</option>
      </select>
      <button id="micB" class="mic-btn green" title="Talk">🎤</button>
    </div>
    <div class="user-section" id="youSection">
      <span style="font-size:8px; color:#94a3b8;">You</span>
      <select id="langA" class="lang-select">
        <option value="ar">Arabic</option><option value="fr">French</option><option value="en">English</option>
        <option value="de">German</option><option value="tr">Turkish</option><option value="it">Italian</option>
        <option value="zh">Chinese</option><option value="ru">Russian</option>
        <option value="es">Spanish</option><option value="pt">Portuguese</option>
        <option value="nl">Dutch</option><option value="no">Norwegian</option>
      </select>
      <button id="micA" class="mic-btn blue" title="Talk">🎤</button>
    </div>
  </div>
</div>

<div class="extra-controls" id="extraControls">
    <button id="translateModeBtn" class="active">Translator Mode ON</button>
    <select id="voiceSelect">
      <option value="man">👨 Men</option>
      <option value="woman">👩 Woman</option>
      <option value="girl">👧 Girl</option>
      <option value="child">🧒 Child</option>
    </select>

    .replace(/\s+/g, ' ')
    .trim();
}

function compressImage(base64Str, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve) => {
    const img = new Image();
    img.src = base64Str;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let width = img.width, height = img.height;
      if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(base64Str);
  });
}

function handleTrackSubscribed(track, publication, participant) {
    if (track.kind === 'video' || track.kind === 'audio') {

        if (!box) {
            box = document.createElement('div');
            box.id = boxId;
            box.className = 'participant-box';
            
            let nameLabel = document.createElement('div');
            nameLabel.className = 'participant-name';
            nameLabel.textContent = participant.name || participant.identity;
            box.appendChild(nameLabel);
            
            videoGrid.appendChild(box);
        }
        
        if (track.kind === 'video') {
            const videoEl = track.attach();
            videoEl.autoplay = true;
            videoEl.playsInline = true;
            videoEl.style.width = '100%';
            videoEl.style.height = '100%';
            videoEl.style.objectFit = 'cover';
            
            const oldVideo = box.querySelector('video');
            if (oldVideo) oldVideo.remove();
            box.insertBefore(videoEl, box.firstChild);
        } else if (track.kind === 'audio') {
            const audioEl = track.attach();
            audioEl.autoplay = true;
            box.appendChild(audioEl);
        }
    }
}

function handleTrackUnsubscribed(track, publication, participant) {
    track.detach().forEach(el => el.remove());
}

function handleParticipantDisconnected(participant) {
    let box = document.getElementById('participant-' + participant.identity);
    if (box) box.remove();
}

async function connectLiveKit(roomCode, participantName) {
    try {
        setStatus("Getting token...");
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 25000);

        const res = await fetch(TOKEN_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room_name: roomCode, participant_name: participantName }),
            signal: controller.signal
        });
        clearTimeout(timeout);
        
        if (!res.ok) {
            let errMsg = "Token fetch failed";
            try { const errData = await res.json(); if (errData.detail) errMsg = errData.detail; } catch(e){}
            throw new Error(errMsg);
        }
        
        const { token, url } = await res.json();

        setStatus("Connecting to LiveKit...");
        
        if (livekitRoom) {
            await livekitRoom.disconnect();
            livekitRoom = null;
        }
        videoGrid.innerHTML = '';
        
        livekitRoom = new LivekitClient.Room();
        
        livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed, handleTrackSubscribed);
        livekitRoom.on(LivekitClient.RoomEvent.TrackUnsubscribed, handleTrackUnsubscribed);
        livekitRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, handleParticipantDisconnected);
        
        livekitRoom.on(LivekitClient.RoomEvent.Connected, async () => {
            setStatus("✅ Connected to Meeting");
            try {
                await livekitRoom.localParticipant.setCameraEnabled(true);
                await livekitRoom.localParticipant.setMicrophoneEnabled(true);
            } catch (err) {

function enterRemoteRoom(code) {
  currentRoomCode = code; hasJoinedOnce = false; shouldReconnect = true;
  $('remoteJoinOverlay').style.display = 'none'; setModeUI('remote');
  roomCodeLabel.textContent = code; onlineCount.textContent = '1/4'; chatEl.innerHTML = '';
  setStatus(`Connecting to ${code}...`);
  connectWebSocket(code);
}

function connectWebSocket(code) {
  if (ws) { try { ws.close(); } catch(e){} }
  ws = new WebSocket(WS_BASE + '/ws/' + code);
  
  ws.onopen = () => { 
    ws.send(JSON.stringify({ type: 'join', name: myName, lang: myLang })); 
    startPing(); 
  };
  
  ws.onmessage = handleWsMessage;
  
  ws.onerror = (e) => {
    console.error('WS Error', e);
    addMsg('⚠️ WebSocket Error.', 'bot');
  };

  ws.onclose = (ev) => {
    stopPing();
    if (!hasJoinedOnce) { 
      addMsg(`⚠️ Failed to join. Error code: ${ev.code}`, 'bot');
      setStatus('Connection failed');
      return; 
    }
    if (shouldReconnect && (appMode === 'remote' || appMode === 'meeting')) {
      setStatus(`Disconnected. Retrying...`);
      wsReconnectTimer = setTimeout(() => connectWebSocket(code), 3000);
    }
  };
}

function handleWsMessage(ev) {
  const data = JSON.parse(ev.data);
  switch (data.type) {
    case 'joined':
      hasJoinedOnce = true; 
      if (appMode === 'remote') onlineCount.textContent = `${data.users.length}/4`;
      if (appMode === 'meeting') onlineCount.textContent = `${data.users.length} online`;
      addMsg(`✅ Joined room ${currentRoomCode}`, 'bot');
      if (appMode === 'remote' && data.users.length > 1) {
        startVideoCall(true); 
      }
      break;
    case 'user_joined':
      addMsg(`👤 ${data.name} joined`, 'bot');
      if (appMode === 'meeting') {
          onlineCount.textContent = `${data.users.length} online`; 
      } else if (appMode === 'remote') {
          startVideoCall(false);
      }
      break;
    case 'translated':
      if (data.is_mine) return;
      addMsg(`${data.from_name}: ${data.original}`, 'user-b', data.from_lang);
      if (data.translated && data.translated !== data.original) { addMsg(`→ ${data.translated}`, 'bot', myLang); speak(data.translated, myLang); } 
      else { speak(data.original, myLang); }
      break;
    case 'chat_media':
      if (data.media_type === 'image') {
          addMsg('', 'user-b', data.from_lang, data.data);
      }
      break;
    case 'rtc-offer':
      if (appMode === 'meeting') break;
      startVideoCall(false).then(async () => {
        if (!pc) return;
        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        while (iceCandidatesQueue.length > 0) {
          await pc.addIceCandidate(new RTCIceCandidate(iceCandidatesQueue.shift())).catch(e => {});
        }
        const answer = await pc.createAnswer(); 
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'rtc-answer', answer: answer }));
      });
      break;
    case 'rtc-answer':
      if (appMode === 'meeting') break;
      if (pc) {
        pc.setRemoteDescription(new RTCSessionDescription(data.answer)).then(() => {
            while (iceCandidatesQueue.length > 0) {
              pc.addIceCandidate(new RTCIceCandidate(iceCandidatesQueue.shift())).catch(e => {});
            }
        });
      }
      break;
    case 'rtc-ice':
      if (appMode === 'meeting') break;
      if (pc && pc.remoteDescription && pc.remoteDescription.type) {
        pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => {});
      } else {
        iceCandidatesQueue.push(data.candidate);
      }
      break;
    case 'error':
      addMsg(`⚠️ ${data.message}`, 'bot');
      break;
  }
}

function sendRemoteMessage(text) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'message', text })); }
function startPing() { stopPing(); pingInterval = setInterval(() => { if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'ping'})); }, 30000); }

async function speak(text, lang) {
  if (isLocked) return; 
  
  if (isRecording) {
    try { recognition.stop(); } catch(e){}
    isRecording = false; // To prevent auto restart
    unlockMics();
  }

  const cleanText = cleanTextForTTS(text);
  if (!cleanText) { unlockMics(); return; }

  stopAudio(); isBotTalking = true;
  const myId = ++currentSpeechId; setStatus('Speaking...');
  setAvatarState(true);
  
  try {
    const res = await fetch(TTS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: cleanText, lang, voice: voiceSelect.value, session_id: SESSION_ID }) });
    if (res.ok) {
      const blob = await res.blob(); if (myId !== currentSpeechId) return;
      currentAudio = new Audio(URL.createObjectURL(blob));
      currentAudio.onended = () => { 
        isBotTalking = false; setAvatarState(false); unlockMics(); 
      };
      currentAudio.onerror = () => { speakBrowser(cleanText, lang, myId); };
      await currentAudio.play(); return;
    }
  } catch (e) { console.warn('Server TTS failed'); }
  
  speakBrowser(cleanText, lang, myId);
}

function speakBrowser(text, lang, myId) {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); 
  u.lang = localeFor(lang);
  
  const voiceType = voiceSelect.value;
  if (voiceType === 'man') { u.pitch = 0.5; u.rate = 0.9; } 
  else if (voiceType === 'woman') { u.pitch = 1.0; u.rate = 1.0; } 
  else if (voiceType === 'girl') { u.pitch = 1.3; u.rate = 1.05; } 
  else if (voiceType === 'child') { u.pitch = 1.5; u.rate = 1.1; }

  u.onend = () => { 
    if (myId === currentSpeechId) { 
      isBotTalking = false; setAvatarState(false); unlockMics(); 
    } 
  };
  u.onerror = () => { 
    if (myId === currentSpeechId) { 
      isBotTalking = false; setAvatarState(false); unlockMics(); 
    } 
  };
  speechSynthesis.speak(u);
}

// --- Speech Recognition (Open Mic & Continuous) ---
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let silenceTimer = null;
let finalTranscriptBuffer = "";

if (SR) {
  recognition = new SR();
  recognition.continuous = true; 
  recognition.interimResults = true; 

  const processVoice = (text) => {
    if (!text || !text.trim()) return;
    const isA = activeSpeaker === 'A';
    if (appMode === 'remote' || appMode === 'meeting') {
        addMsg(`You: ${text}`, 'user-a', myLang);
        sendRemoteMessage(text);
    } else {
        addMsg(text, isA ? 'user-a' : 'user-b', isA ? langA.value : langB.value);
        ask(text, isA ? langA.value : langB.value, isA ? langB.value : langA.value, activeSpeaker);
    }
  };

  recognition.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; ++i) {
      if (e.results[i].isFinal) {
        finalTranscriptBuffer += e.results[i][0].transcript + " ";
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    
    // Update status UI with current speech
    setStatus(`🎤 Listening... ${finalTranscriptBuffer}${interim}`.slice(-40));

    // Debounce: Wait for silence before sending
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => {
      if (finalTranscriptBuffer.trim()) {
        processVoice(finalTranscriptBuffer.trim());
        finalTranscriptBuffer = "";
        resetStatus();
      }
    }, 2000); // 2 seconds of silence triggers the send
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech') {
      // Ignore, auto-restart in onend
      return;
    }
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        isRecording = false;
        unlockMics();
        setStatus('Mic permission denied.');
        return;
    }
    setStatus('Mic Error: ' + e.error);
  };

  recognition.onend = () => {
    if (isRecording) {
        // Automatically restart if the browser killed it while we're supposed to be recording
        try { recognition.start(); } catch(e) {} 
    } else {
        unlockMics();
    }
  };

  const startMic = (speaker) => {
    if (isLocked) return;
    unlockAudio();
    
    if (isRecording && activeSpeaker === speaker) {
        // Toggle OFF manually
        isRecording = false;
        clearTimeout(silenceTimer);
        recognition.stop();
        if (finalTranscriptBuffer.trim()) {
            processVoice(finalTranscriptBuffer.trim());
            finalTranscriptBuffer = "";
        }
        unlockMics();
        return;
    }

    // Toggle ON
    if (isRecording) {
        recognition.stop();
    }
    
    stopAudio(); 
    activeSpeaker = speaker;
    setAvatarState(true);
    isRecording = true;
    finalTranscriptBuffer = "";
    
    if (speaker === 'A') {
      recognition.lang = localeFor(langA.value);
      micA.classList.add('recording'); micB.disabled = true;
      setStatus('🎤 Listening (You)...');
    } else if (speaker === 'B') {
      recognition.lang = localeFor(langB.value);
      micB.classList.add('recording'); micA.disabled = true;
      setStatus('🎤 Listening (Friend)...');
    } else {
      recognition.lang = localeFor(myLang);
      if (remoteMicBtn) remoteMicBtn.classList.add('recording'); 
      if (floatingMicBtn) floatingMicBtn.classList.add('recording');
      setStatus('🎤 Listening...');
    }
    try { recognition.start(); } catch (e) {}
  };
  
  micA.addEventListener('click', () => startMic('A'));
  micB.addEventListener('click', () => startMic('B'));
  if (remoteMicBtn) remoteMicBtn.addEventListener('click', () => startMic('R'));
  if (floatingMicBtn) floatingMicBtn.addEventListener('click', () => startMic('R'));
}

function buildSystemPrompt(targetLang, sourceLang) {
  if (isTranslatorMode) {
    return `You are a literal translation machine. Translate the user's text from ${langNameFor(sourceLang)} to ${langNameFor(targetLang)}. Output ONLY the translated text. DO NOT add any conversational words, greetings, or explanations. DO NOT use markdown like ** or __. DO NOT reply in the source language.`;
  }
  return `You are Chat-Core, a wise human friend. Reply in ${langNameFor(targetLang)}. DO NOT use markdown or bold text like **.`;
}

async function ask(text, sourceLang, targetLang, speaker) {
  if (isSending || isLocked) return;
  setBusy(true); setStatus('Processing...');
  const messages = [{ role: 'system', content: buildSystemPrompt(targetLang, sourceLang) }];
  let finalText = text || '';
  if (attachedFileText) finalText += "\n\nFile Content:\n" + attachedFileText;
  let userContent = attachedImageBase64 ? [{ type: "text", text: finalText || "Analyze this image." }, { type: "image_url", image_url: { url: attachedImageBase64 } }] : finalText;
  messages.push({ role: 'user', content: userContent });

  try {
    const res = await fetchWithTimeout(SERVER_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, is_vision: attachedImageBase64 != null, is_translation: isTranslatorMode, session_id: SESSION_ID })
    }, REQUEST_TIMEOUT_MS);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    addMsg(data.reply.trim(), isTranslatorMode ? (speaker === 'A' ? 'user-b' : 'user-a') : 'user-b', targetLang);
    resetStatus(); speak(data.reply.trim(), targetLang);
    attachedImageBase64 = null; attachedFileText = null; imagePreviewContainer.style.display = 'none';
  } catch (e) { addMsg('Error: ' + e.message, 'bot'); } finally { setBusy(false); }
}

    addMsg(data.translated, 'bot', targetLang);
    speak(data.translated, targetLang);
    setStatus('✅ تمت الترجمة بنجاح!');
  } catch (err) {
    addMsg(`⚠️ فشل استخراج الفيديو: ${err.message}`, 'bot');
    setStatus('Error');
  } finally {
    setBusy(false);
    e.target.value = '';
  }
});

async function handleImage(e) {
  const file = e.target.files[0]; if (!file) return;
  isCompressing = true; sendBtn.disabled = true; setStatus('Compressing...');
  const reader = new FileReader();
  reader.onload = async ev => {
    const compressed = await compressImage(ev.target.result);
    
    if (appMode === 'remote' || appMode === 'meeting') {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ 
                type: 'chat_media', 
                media_type: 'image', 
                data: compressed 
            }));
            addMsg('', 'user-a', myLang, compressed); 
        }
        isCompressing = false; sendBtn.disabled = isSending; setStatus('');
    } else {
        attachedFileText = null;
        attachedImageBase64 = compressed;
        imagePreview.src = attachedImageBase64; imagePreviewContainer.style.display = 'flex';
        isCompressing = false; sendBtn.disabled = isSending; setStatus('Image attached.');
    }
  };
  reader.readAsDataURL(file);
}
galleryUpload.addEventListener('change', handleImage);
cameraUpload.addEventListener('change', handleImage);
cancelImageBtn.addEventListener('click', (e) => {
  e.stopPropagation(); attachedImageBase64 = null; attachedFileText = null;
  imagePreviewContainer.style.display = 'none'; setStatus('Attachment removed.');
});

audioUpload.addEventListener('change', (e) => {
  const files = e.target.files;
  for (let i = 0; i < files.length; i++) playlist.push({ name: files[i].name, url: URL.createObjectURL(files[i]) });
  renderPlaylist(); e.target.value = '';
});
function renderPlaylist() {
  musicList.innerHTML = '';
  const stopBtn = document.createElement('div'); stopBtn.className = 'music-item stop-btn'; stopBtn.textContent = '🛑 Stop'; stopBtn.onclick = stopMusic; musicList.appendChild(stopBtn);
  const pauseBtn = document.createElement('div'); pauseBtn.className = 'music-item pause-btn'; pauseBtn.textContent = bgAudio.paused ? '▶️ Play' : '⏸️ Pause';
  pauseBtn.onclick = (e) => { e.stopPropagation(); if (bgAudio.src) { if (bgAudio.paused) bgAudio.play(); else bgAudio.pause(); renderPlaylist(); } }; musicList.appendChild(pauseBtn);
  const addBtn = document.createElement('div'); addBtn.className = 'music-item add-more'; addBtn.textContent = '➕ Add'; addBtn.onclick = () => { audioUpload.value = ''; audioUpload.click(); }; musicList.appendChild(addBtn);
  playlist.forEach((song, index) => {
    const div = document.createElement('div'); div.className = 'music-item';
    const name = document.createElement('span'); name.className = 'song-name'; name.textContent = song.name;
    const del = document.createElement('span'); del.className = 'delete-song'; del.textContent = '✕';
    del.onclick = (e) => { e.stopPropagation(); if (currentSongIndex === index) stopMusic(); playlist.splice(index, 1); if(currentSongIndex > index) currentSongIndex--; renderPlaylist(); };
    div.appendChild(name); div.appendChild(del);
    if (index === currentSongIndex && !bgAudio.paused) div.classList.add('active');
    div.onclick = () => { if (currentSongIndex === index && !bgAudio.paused) { bgAudio.pause(); renderPlaylist(); } else { currentSongIndex = index; bgAudio.src = playlist[index].url; bgAudio.play(); renderPlaylist(); } };
    musicList.appendChild(div);
  });
}
function stopMusic() { bgAudio.pause(); bgAudio.currentTime = 0; currentSongIndex = -1; renderPlaylist(); }
bgAudio.addEventListener('ended', () => { if(playlist.length > 0) { currentSongIndex = (currentSongIndex + 1) % playlist.length; bgAudio.src = playlist[currentSongIndex].url; bgAudio.play(); renderPlaylist(); } });
bgAudio.addEventListener('play', renderPlaylist); bgAudio.addEventListener('pause', renderPlaylist);
renderPlaylist(); 
</script>
